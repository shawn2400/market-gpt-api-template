# =========================================
# Nginx top config — Reverse Proxy ל-AlgoGPT
# =========================================

user  nginx;
worker_processes  auto;

# לוגים (ניתן לשנות נתיב/פורמט)
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;
}

http {
  # בסיס
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;
  server_tokens off;

  # gzip
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;

  # לוג בפורמט JSON-י (ידידותי ל-ELK)
  log_format json_combined escape=json
    '{ "time_local":"$time_local", '
    '"remote_addr":"$proxy_protocol_addr", '
    '"request":"$request", '
    '"status":$status, '
    '"body_bytes_sent":$body_bytes_sent, '
    '"request_time":$request_time, '
    '"upstream_response_time":"$upstream_response_time", '
    '"http_referer":"$http_referer", '
    '"http_user_agent":"$http_user_agent" }';

  access_log /var/log/nginx/access.log json_combined;

  # ---- Rate Limits פר-נתיב ----
  # /alerts/* יותר שמרני
  limit_req_zone $binary_remote_addr zone=rl_alerts:10m rate=10r/s;
  # /telegram/* בינוני
  limit_req_zone $binary_remote_addr zone=rl_tg:10m rate=15r/s;
  # כלל המערכת
  limit_req_zone $binary_remote_addr zone=rl_global:10m rate=30r/s;

  # שמות ה-Upstream (Docker DNS: שם שירות=hostname)
  upstream algogpt_upstream {
    server algogpt:10000;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ========= שרת HTTP (פורט 80) =========
  server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # אם תפעיל TLS בבלוק הבא, הפעל redirect ל-HTTPS:
    # return 301 https://$host$request_uri;

    # Static (אופציונלי)
    location /static/ {
      alias /app/static/;
      access_log off;
      expires 1h;
    }

    # --- ברירת מחדל: פרוקסי לאפליקציה ---
    location / {
      # כללית
      limit_req zone=rl_global burst=60 nodelay;

      proxy_set_header  Host              $host;
      proxy_set_header  X-Real-IP         $remote_addr;
      proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header  X-Forwarded-Proto $scheme;

      # העברת כותרות אבטחה/חתימה/אדמוטנסי
      proxy_set_header  X-Idempotency-Key    $http_x_idempotency_key;
      proxy_set_header  X-Algogpt-Signature  $http_x_algogpt_signature;
      proxy_set_header  X-Hub-Signature-256  $http_x_hub_signature_256;
      proxy_set_header  X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;

      proxy_pass http://algogpt_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout  120s;
      proxy_connect_timeout 30s;
      proxy_send_timeout  30s;
    }

    # --- WebSocket ---
    location /ws/ {
      limit_req zone=rl_global burst=60 nodelay;

      proxy_set_header  Host              $host;
      proxy_set_header  X-Real-IP         $remote_addr;
      proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header  X-Forwarded-Proto $scheme;

      proxy_set_header  Upgrade           $http_upgrade;
      proxy_set_header  Connection        $connection_upgrade;

      proxy_pass http://algogpt_upstream;
      proxy_http_version 1.1;
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }

    # --- /alerts/* — שמרני יותר ---
    location ^~ /alerts/ {
      limit_req zone=rl_alerts burst=20 nodelay;

      proxy_set_header  Host              $host;
      proxy_set_header  X-Real-IP         $remote_addr;
      proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header  X-Forwarded-Proto $scheme;

      proxy_set_header  X-Idempotency-Key    $http_x_idempotency_key;
      proxy_set_header  X-Algogpt-Signature  $http_x_algogpt_signature;
      proxy_set_header  X-Hub-Signature-256  $http_x_hub_signature_256;

      proxy_pass http://algogpt_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout  120s;
    }

    # --- /telegram/callbacks — בינוני ---
    location ^~ /telegram/callbacks {
      limit_req zone=rl_tg burst=30 nodelay;

      proxy_set_header  Host              $host;
      proxy_set_header  X-Real-IP         $remote_addr;
      proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header  X-Forwarded-Proto $scheme;

      proxy_set_header  X-Idempotency-Key    $http_x_idempotency_key;
      proxy_set_header  X-Algogpt-Signature  $http_x_algogpt_signature;
      proxy_set_header  X-Hub-Signature-256  $http_x_hub_signature_256;
      proxy_set_header  X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;

      proxy_pass http://algogpt_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout  120s;
    }

    # בריאות/מוכנות – ללא rate limit
    location = /health { proxy_pass http://algogpt_upstream; }
    location = /readyz { proxy_pass http://algogpt_upstream; }

    # כותרות אבטחה (ללא HSTS כי אין TLS בבלוק הזה)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # ========= שרת TLS (443) — אופציונלי =========
  # הפעלה: בטל הערות + ספק תעודות ל-/etc/letsencrypt בתוך ה-Container/Host
  # server {
  #   listen 443 ssl http2;
  #   listen [::]:443 ssl http2;
  #   server_name your.domain.com;
  #
  #   ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
  #   ssl_session_timeout 1d;
  #   ssl_session_cache   shared:MozSSL:10m;  # about 40000 sessions
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_prefer_server_ciphers off;
  #
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  #
  #   # את כל ה-location blocks מהשרת של פורט 80 ניתן להעתיק לכאן 1:1
  #   location / {
  #     limit_req zone=rl_global burst=60 nodelay;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_set_header X-Idempotency-Key $http_x_idempotency_key;
  #     proxy_set_header X-Algogpt-Signature $http_x_algogpt_signature;
  #     proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
  #     proxy_pass http://algogpt_upstream;
  #     proxy_http_version 1.1;
  #     proxy_buffering off;
  #     proxy_read_timeout 120s;
  #   }
  #
  #   # וכן /ws/, /alerts/, /telegram/callbacks, /health, /readyz בדומה לפורט 80
  # }
}

