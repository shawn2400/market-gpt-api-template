# ================================
# Nginx config for AlgoGPT
# - Proxy ל-Gunicorn/uvicorn על 127.0.0.1:10000
# - rate-limit עדין לכלל, וקצת מחמיר ל-/alerts/* ו-/risk/*
# - העברת כל ה-Headers הקריטיים (Idempotency, HMAC, Telegram secret)
# ================================

user  nginx;
worker_processes auto;

events {
    worker_connections  1024;
}

http {
    # לוגים קצרים וברורים
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Buffers/Timeouts סבירים לשירות API
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    include       mime.types;
    default_type  application/octet-stream;

    # --- Rate limit zones ---
    # כללית (רכה יחסית)
    limit_req_zone $binary_remote_addr zone=rl_general:10m rate=20r/s;
    # למסלולי webhook – מחמיר קלות
    limit_req_zone $binary_remote_addr zone=rl_webhook:10m rate=5r/s;

    # גודל גוף בקשה (אם שולחים payloads גדולים)
    client_max_body_size 2m;

    # =========================
    # OPTION A: HTTP בלבד (פשוט ומהיר)
    # =========================
    upstream algogpt_app {
        server 127.0.0.1:10000;
        keepalive 32;
    }

    server {
        listen 80 reuseport;
        server_name _;

        # כללי: limit_req עדין
        limit_req zone=rl_general burst=40 nodelay;

        # Proxy headers סטנדרטיים
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # נעביר תמיד את ה-Headers הקריטיים (גם אם לא קיימים — Nginx ישלח ריק)
        proxy_set_header X-Idempotency-Key      $http_x_idempotency_key;
        proxy_set_header X-Algogpt-Signature    $http_x_algogpt_signature;
        proxy_set_header X-Hub-Signature-256    $http_x_hub_signature_256;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;

        # timeouts סבירים
        proxy_connect_timeout   5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     60s;

        # Static (אם משרתים ישירות דרך Nginx)
        location /static/ {
            alias /app/static/;
            access_log off;
            expires 1h;
        }

        # Webhooky – מחמיר יותר
        location ~ ^/(alerts|risk|telegram/callbacks) {
            limit_req zone=rl_webhook burst=20 nodelay;
            proxy_pass http://algogpt_app;
        }

        # שאר ה-API
        location / {
            proxy_pass http://algogpt_app;
        }
    }

    # =========================
    # OPTION B: TLS מלא (אם יש תעודות) – בטל את השרת למעלה ופתח את זה
    # =========================
    # server {
    #     listen 80 reuseport;
    #     server_name your.domain.tld;
    #     return 301 https://$host$request_uri;
    # }
    #
    # server {
    #     listen 443 ssl http2 reuseport;
    #     server_name your.domain.tld;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your.domain.tld/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your.domain.tld/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     limit_req zone=rl_general burst=40 nodelay;
    #
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Idempotency-Key      $http_x_idempotency_key;
    #     proxy_set_header X-Algogpt-Signature    $http_x_algogpt_signature;
    #     proxy_set_header X-Hub-Signature-256    $http_x_hub_signature_256;
    #     proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    #
    #     proxy_connect_timeout   5s;
    #     proxy_send_timeout     30s;
    #     proxy_read_timeout     60s;
    #
    #     location /static/ {
    #         alias /app/static/;
    #         access_log off;
    #         expires 1h;
    #     }
    #
    #     location ~ ^/(alerts|risk|telegram/callbacks) {
    #         limit_req zone=rl_webhook burst=20 nodelay;
    #         proxy_pass http://algogpt_app;
    #     }
