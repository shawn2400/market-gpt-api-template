services:
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # ===== Runtime (as-is) =====
      - key: PORT                  ; value: "10000"
      - key: WEB_CONCURRENCY       ; value: "1"
      - key: GUNICORN_TIMEOUT      ; value: "120"
      - key: LOG_LEVEL             ; value: "INFO"
      - key: APP_MODULE            ; value: "main:app"
      - key: PYTHONPATH            ; value: "/app"
      - key: UVICORN_ACCESS_LOG    ; value: "false"
      - key: UVICORN_LOG_LEVEL     ; value: "info"
      - key: HTTP_MAX_CONNECTIONS  ; value: "50"
      - key: HTTP_MAX_KEEPALIVE    ; value: "200"

      # ===== Base URLs / CORS / OpenAPI / Security / Redis / Exchange... (ללא שינוי מהותי) =====
      - key: PUBLIC_HOST           ; value: "https://algogpt-docker.onrender.com"
      - key: CONTEXT_URL           ; value: "https://algogpt-docker.onrender.com"
      - key: WEBHOOK_HOST          ; value: "https://algogpt-docker.onrender.com"
      - key: CORS_ALLOW_ORIGINS    ; value: "https://algogpt-docker.onrender.com"
      - key: CORS_ALLOW_HEADERS    ; value: "*"
      - key: CORS_ALLOW_METHODS    ; value: "*"
      - key: CORS_ALLOW_CREDENTIALS; value: "0"
      - key: ENABLE_READONLY_HTTP  ; value: "1"
      - key: READONLY_ENDPOINTS    ; value: "summary,prices_top,news_cache,health"
      - key: OPENAPI_INCLUDE_TAGS  ; value: ""
      - key: OPENAPI_HIDE_PATTERNS ; value: "/_debug/*,/debug/*,/internal/*,/provider/*,/grid/*,/trade/*,/risk/*/internal*"
      - key: OPENAPI_PUBLIC_MAX_OPS; value: "30"
      - key: PROTECT_APPROVE_ROUTES; value: "0"
      - key: PROTECT_DIGEST_ROUTES ; value: "1"
      - key: ENABLE_HSTS           ; value: "1"
      - key: SECURITY_PUBLIC_PATHS ; value: "/ops/approve-link,/ops/approve,/ops/reject,/ops/approve/signed,/readyz,/telegram/webhook,/telegram/hook,/telegram/ping,/ops/manager/health,/ops/ui,/ops/ui/ticket,/ops/ui/orders,/ui/dashboard,/health,/health/tp1,/topk,/scan/public-now,/alerts/ingest,/alerts/trades/update,/alerts/trades/active,/scan/now,/scan/top-volume"
      - key: SECURITY_PUBLIC_PREFIXES; value: "/public,/price,/static,/risk"
      - key: ANTI_REPLAY_ENABLE    ; value: "1"
      - key: ANTI_REPLAY_WINDOW_SEC; value: "60"
      - key: ANTI_REPLAY_REQUIRE_SIGNATURE; value: "1"
      - key: SIGNED_TS_MAX_SKEW_SEC; value: "60"
      - key: SIGNED_NONCE_TTL_SEC  ; value: "120"
      - key: RATE_LIMIT_ENABLE     ; value: "1"
      - key: RL_FAIL_OPEN          ; value: "0"
      - key: RATE_LIMIT_BACKEND    ; value: "redis"
      - key: ORDERS_BUCKET_WINDOW_SEC ; value: "10"
      - key: ORDERS_QPS_BUCKET     ; value: "8"
      - key: REQUIRE_REDIS         ; value: "1"
      - key: CONFIRMSTORE_ENABLE   ; value: "0"
      - key: USE_REDIS_IDEM        ; value: "1"
      - key: SETEX_STRICT          ; value: "1"
      - key: REDIS_CONNECT_TIMEOUT ; value: "5.0"
      - key: REDIS_SOCKET_TIMEOUT  ; value: "5.0"
      - key: REDIS_POOL_MAX_CONNECTIONS; value: "30"
      - key: REDIS_PING_RETRIES    ; value: "2"
      - key: REDIS_PING_RETRY_BACKOFF_SEC; value: "0.3"
      - key: REDIS_CLIENT_NAME     ; value: "algogpt"
      - key: REDIS_SSL_NO_VERIFY   ; value: "0"
      - key: REDIS_NAMESPACE       ; value: "ops-supervisor-web"
      - key: DEFAULT_MARKET        ; value: "futures"
      - key: POSITION_MODE_OVERRIDE; value: "oneway"
      - key: BINANCE_MARGIN_TYPE_DEFAULT; value: "ISOLATED"
      - key: BINANCE_FUTURES_HTTP_BASE  ; value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE    ; value: "wss://fstream.binance.com"
      - key: BINANCE_SPOT_HTTP_BASE     ; value: "https://api.binance.com"
      - key: BINANCE_TESTNET       ; value: "false"
      - key: BINANCE_WORKING_TYPE  ; value: "MARK_PRICE"
      - key: BINANCE_HTTP_TIMEOUT  ; value: "10.0"
      - key: BINANCE_MAX_RETRIES   ; value: "2"
      - key: BINANCE_RECV_WINDOW   ; value: "45000"
      - key: LISTENKEY_KEEPALIVE_SEC; value: "1800"
      - key: WS_KEEPALIVE_SEC      ; value: "25"
      - key: USE_WS                ; value: "1"
      - key: EXCHANGE_INFO_TTL_SEC ; value: "900"
      - key: USER_STREAM_ENABLE    ; value: "1"
      - key: ENABLE_AI_ROUTES      ; value: "1"
      - key: PRICE_MONITOR_DISABLE ; value: "0"

      # ===== Scanner / Gates (עגול) =====
      - key: SCAN_SOURCE           ; value: "binance-futures"
      - key: UNIVERSE_MODE         ; value: "exchange"
      - key: SCAN_INTERVALS        ; value: "5m,15m,1h,4h"
      - key: SCAN_MAX_SYMBOLS      ; value: "150"
      - key: SCAN_MAX_LIMIT        ; value: "0"
      - key: SCAN_CONCURRENCY      ; value: "4"
      - key: TOP_SYMBOLS           ; value: "150"
      - key: SUGGEST_FUTURES       ; value: "1"
      - key: SUGGEST_INTERVAL_SEC  ; value: "45"
      - key: SUGGEST_CAP_PER_CYCLE ; value: "30"

      - key: INDICATOR_INTERVALS   ; value: "15m,1h,4h,1d"
      - key: ENABLE_INDICATOR_EXIT ; value: "1"
      - key: ADX_MIN               ; value: "20"
      - key: MAX_ATR_PCT           ; value: "3"

      # ===== Watchlist =====
      - key: WATCHLIST             ; value: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,NEARUSDT"

      # ===== Scan CRON / Telegram =====
      - key: SCAN_CRON_ENABLE      ; value: "1"
      - key: SCAN_CRON_EVERY_SEC   ; value: "45"
      - key: SCAN_CRON_TIMEFRAME   ; value: "15m"
      - key: SCAN_CRON_KLINES      ; value: "200"
      - key: SCAN_CRON_LIMIT       ; value: "12"
      - key: SCAN_CRON_MIN_SCORE   ; value: "7"
      - key: SCAN_REARM_SCORE      ; value: "6"
      - key: SCAN_DEDUPE_WINDOW_SEC; value: "300"
      - key: SCAN_TTL_SEC          ; value: "900"
      - key: SCAN_RICH             ; value: "1"
      - key: DEFAULT_LEVERAGE      ; value: "10"
      - key: DEFAULT_STAKE_USDT    ; value: "50"

      # ===== Approvals / Telegram (as-is) =====
      - key: APPROVAL_ENABLED      ; value: "1"
      - key: REQUIRE_TELEGRAM_APPROVAL; value: "1"
      - key: APPROVAL_REQUIRE_WATCHLIST; value: "0"
      - key: AUTO_OPEN_ON_APPROVE  ; value: "1"
      - key: ADMIN_CHAT_ID         ; value: "449087907"
      - key: TELEGRAM_CHAT_ID      ; value: "449087907"
      - key: TELEGRAM_ADMIN_IDS    ; value: "449087907"
      - key: TELEGRAM_AUTO_WEBHOOK ; value: "1"
      - key: TELEGRAM_PARSE_MODE   ; value: "HTML"
      - key: APPROVAL_PUBSUB_CHANNEL; value: "ops:ticket:events"
      - key: APPROVAL_RR_MIN       ; value: "1.25"
      - key: APPROVAL_SUCCESS_MIN  ; value: "55"
      - key: APPROVAL_MAX_SL_PCT   ; value: "3.0"
      - key: APPROVAL_REQUIRE_FRESH_PRICE; value: "1"
      - key: APPROVE_BEFORE_GATE   ; value: "1"

      # ===== SL/TP/Trail/Ladder (as-is) =====
      - key: NATIVE_TPSL_ENABLE    ; value: "0"
      - key: SL_MONOTONIC          ; value: "1"
      - key: PERCENT_GUARD_ENABLE  ; value: "1"
      - key: PERCENT_PRICE_GUARD_BPS; value: "100"
      - key: ENTRY_BAND_BPS        ; value: "10"
      - key: ENTRY_GAP_MAX_PCT     ; value: "0.80"
      - key: ENTRY_GAP_WARN_PCT    ; value: "0.50"
      - key: STOP_BAND_BPS         ; value: "12"
      - key: TP_BE_ONLY_AFTER_TP1  ; value: "1"
      - key: STREAM_TP_BE          ; value: "1"
      - key: LADDER_TP_ENABLE      ; value: "1"
      - key: LADDER_TP_DEFAULT_PCTS; value: "1.8,3.2,5.5"
      - key: LADDER_TP_DEFAULT_SPLITS; value: "0.4,0.35,0.25"
      - key: LADDER_SL_ENABLE      ; value: "1"
      - key: LADDER_SL_DEFAULT_PCTS; value: "1.2"
      - key: TP_LADDER_ON_APPROVE  ; value: "1"
      - key: TP_MAX_LADDERS        ; value: "3"
      - key: TRAIL_ENABLE          ; value: "1"
      - key: TRAIL_ATR_MULT        ; value: "1.5"
      - key: ATR_UPDATE_COOLDOWN_SEC; value: "20"
      - key: ATR_MIN_DELTA         ; value: "0.02"
      - key: BE_ARM_PCT            ; value: "1.6"
      - key: BE_GUARD_ENABLE       ; value: "1"
      - key: BE_GUARD_EVERY_SEC    ; value: "30"
      - key: TP_BE_OFFSET_BPS      ; value: "8"

      # ===== Heartbeat =====
      - key: OPS_HEARTBEAT_ENABLE  ; value: "1"
      - key: OPS_HEARTBEAT_EVERY_MIN; value: "5"
      - key: HEARTBEAT_HOURS       ; value: "2"
      - key: HEARTBEAT_MIN_SCORE   ; value: "6"

      # ===== Regime Auto (as-is מהגרסה הדינמית) =====
      - key: REGIME_AUTO_ENABLE            ; value: "1"
      - key: REGIME_LOOKBACK_MIN           ; value: "240"
      - key: REGIME_MIN_DWELL_MIN          ; value: "30"
      - key: REGIME_CONSERVATIVE_ADX_MIN   ; value: "27"
      - key: REGIME_CONSERVATIVE_MAX_ATR_PCT; value: "2.8"
      - key: REGIME_CONSERVATIVE_MIN_SCORE ; value: "7.2"
      - key: REGIME_BALANCED_ADX_MIN       ; value: "20"
      - key: REGIME_BALANCED_MAX_ATR_PCT   ; value: "3.0"
      - key: REGIME_BALANCED_MIN_SCORE     ; value: "7.0"
      - key: REGIME_AGGRESSIVE_ADX_MIN     ; value: "18"
      - key: REGIME_AGGRESSIVE_MAX_ATR_PCT ; value: "3.4"
      - key: REGIME_AGGRESSIVE_MIN_SCORE   ; value: "6.6"
      - key: REGIME_AGGRESSIVE_STAKE_MULT  ; value: "1.20"

      # ===== Auto-Risk: Equity חי מארנק + טבלת % לפי ציון =====
      - key: AUTO_RISK_ENABLE              ; value: "1"
      - key: EQUITY_SOURCE                 ; value: "auto"   # auto=Binance futures USDT → אם אין, נופל ל-ACCOUNT_EQUITY_USDT → ואז ל-DEFAULT_STAKE_USDT
      - key: ACCOUNT_EQUITY_USDT           ; value: ""       # ריק → חי מהארנק; אפשר לשים ידני אם תרצה "תת-הון"
      - key: EQUITY_REFRESH_SEC            ; value: "30"     # קאש עדין
      - key: EQUITY_SAFE_FRACTION          ; value: "0.85"   # משתמשים רק ב~85% מההון לצורך חישוב סטייק (כרית ביטחון)
      - key: RISK_STAKE_MIN_USDT           ; value: "25"
      - key: RISK_STAKE_MAX_USDT           ; value: "500"
      - key: RISK_STAKE_EQUITY_MIN_PCT     ; value: "0.3"
      - key: RISK_STAKE_EQUITY_MAX_PCT     ; value: "2.5"
      - key: RISK_SCORE_TO_EQUITY_PCT      ; value: "6.5:0.6,7:0.9,7.5:1.1,8:1.3,8.5:1.7,9:2.0,9.5:2.5"
      - key: RISK_ADX_STRONG               ; value: "35"
      - key: RISK_ADX_WEAK                 ; value: "20"
      - key: RISK_ATR_HIGH_PCT             ; value: "4.0"
      - key: RISK_ATR_LOW_PCT              ; value: "0.7"
      - key: RISK_STAKE_BOOST_STRONG_PCT   ; value: "15"
      - key: RISK_STAKE_CUT_HIGH_ATR_PCT   ; value: "20"
      - key: RISK_LEV_BASE                 ; value: "10"
      - key: RISK_LEV_MIN                  ; value: "5"
      - key: RISK_LEV_MAX                  ; value: "15"
      - key: RISK_LEV_BOOST_STRONG_PCT     ; value: "10"
      - key: RISK_LEV_CUT_HIGH_ATR_PCT     ; value: "20"
      - key: RISK_EXTRA_ADD_MODE           ; value: "pct"
      - key: RISK_EXTRA_ADD_THRESH         ; value: "9.0"
      - key: RISK_EXTRA_ADD_VALUE          ; value: "25"

      # ===== Ops / Misc =====
      - key: ALGOGPT_VERSION ; value: "2.18.0"
      - key: INSTANCE_ID     ; value: "algogpt-docker"
      - key: ROUTES_ONLY     ; value: ""
      - key: METRICS_ENABLE  ; value: "true"
      - key: PNL_TRACKING    ; value: "true"
      - key: PARAMS_DIR      ; value: "params/optimized"
      - key: DATABASE_URL    ; value: "sqlite:////app/data/algogpt.db"
      - key: PRICE_CACHE_TTL_MS; value: "250"
      - key: PRICE_MAX_AGE_SEC; value: "15"
      - key: PRICE_WS_FRESH_TTL; value: "60"
      - key: PRICE_SCAN_INTERVAL; value: "30"
      - key: PRICE_MONITOR_DISABLE; value: "0"
      - key: SINK_ENFORCE_APPROVALS; value: "1"
      - key: RISK_QUICK_URL ; value: "https://algogpt-docker.onrender.com/risk/quick"

      # ===== Secrets (as-is) =====
      - key: API_BEARER_TOKEN        ; fromSecret: API_BEARER_TOKEN
      - key: API_TOKEN               ; fromSecret: API_TOKEN
      - key: PRIMARY_API_TOKEN       ; fromSecret: PRIMARY_API_TOKEN
      - key: API_SIGNING_SECRET      ; fromSecret: API_SIGNING_SECRET
      - key: OPS_SIGN_SECRET         ; fromSecret: OPS_SIGN_SECRET
      - key: WEBHOOK_HMAC_SECRET     ; fromSecret: WEBHOOK_HMAC_SECRET
      - key: REDIS_URL               ; fromSecret: REDIS_URL
      - key: BINANCE_API_KEY         ; fromSecret: BINANCE_API_KEY
      - key: BINANCE_API_SECRET      ; fromSecret: BINANCE_API_SECRET
      - key: OPENAI_API_KEY          ; fromSecret: OPENAI_API_KEY
      - key: TELEGRAM_BOT_TOKEN      ; fromSecret: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_WEBHOOK_SECRET ; fromSecret: TELEGRAM_WEBHOOK_SECRET
      - key: ALERTS_INGEST_HMAC_SECRET; fromSecret: ALERTS_INGEST_HMAC_SECRET
      - key: INTERNAL_JWT_PUBLIC_KEY ; fromSecret: INTERNAL_JWT_PUBLIC_KEY










































