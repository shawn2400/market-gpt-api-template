envVars:
  - key: WEB_CONCURRENCY
    value: "1"
  - key: GUNICORN_TIMEOUT
    value: "120"
  - key: LOG_LEVEL
    value: INFO

  # ... (שאר הסודות/מפתחות)

  - key: PUBLIC_HOST
    value: https://algogpt-docker.onrender.com

  # Scanner caps & RL
  - key: SCAN_MAX_SYMBOLS
    value: "120"
  - key: SCAN_MAX_LIMIT
    value: "0"

  # מחליפים את SLACK_WEBHOOK_URL ב-SCAN_RL_LIMIT
  - key: SCAN_RL_LIMIT
    value: "120"

  # מחליפים את LIGHT_MODE ב-SCAN_RL_WINDOW
  - key: SCAN_RL_WINDOW
    value: "60"

  - key: SCAN_CONCURRENCY
    value: "4"
  - key: TOP_SYMBOLS
    value: "100"

  # Approvals
  - key: APPROVAL_REQUIRE_WATCHLIST
    value: "0"


































































