services:
  - type: web
    name: algogpt-docker
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    healthCheckTimeoutSeconds: 15

    envVars:
      # === אבטחה / API ===
      - key: API_BEARER_TOKEN
        value: "GrwpXpkRWunC7SPZGFrhaizBwcaZzpWLYJ9kv4W7u6aTx_EXu0VGfpBKaBhThLD2"

      # === מצב ריצה: מסחר ידני (ללא אוטומציה) ===
      - key: AUTO_RUN
        value: "false"
      - key: SCAN_INTERVAL
        value: "60"
      - key: DEFAULT_INTERVAL
        value: "15m"
      - key: MIN_QUALITY_SCORE
        value: "6"
      - key: MIN_VOLUME
        value: "1000000"
      - key: TOP_SYMBOLS
        value: "30"
      - key: TRENDING_ONLY
        value: "false"

      # === שמירת טריות מחירים / הגנות ===
      - key: PRICE_PROTECT_PCT
        value: "0.25"
      - key: PRICE_MAX_AGE_SEC
        value: "10"

      # === מגבלות טרייד ===
      - key: MAX_TRADE_BUDGET
        value: "100"
      - key: MAX_LEVERAGE
        value: "35"

      # === לוגים ו-CORS ===
      - key: LOG_LEVEL
        value: "INFO"
      - key: CORS_ALLOW_ORIGINS
        value: "*"

      # === OpenAI (מודל/הגדרות; המפתח כסוד למטה) ===
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30.0"
      - key: OPENAI_MAX_CONCURRENCY
        value: "4"

      # === Binance endpoints (ברירות מחדל יציבות) ===
      - key: BINANCE_SPOT_HTTP_BASE
        value: "https://api.binance.com"
      - key: BINANCE_FUTURES_HTTP_BASE
        value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE
        value: "wss://fstream.binance.com"
      - key: BINANCE_WS_STREAM_SUFFIX
        value: "/stream?streams="
      - key: BINANCE_BACKOFF_BASE
        value: "0.7"
      - key: BINANCE_MAX_RETRIES
        value: "5"
      - key: BINANCE_RECV_WINDOW
        value: "10000"
      - key: BINANCE_TIME_SYNC_INTERVAL_SEC
        value: "900"
      - key: BINANCE_EXCHANGE_INFO_ON_START
        value: "false"
      - key: BINANCE_FORCE_HEDGE_MODE
        value: "false"
      - key: BINANCE_SKIP_ACCOUNT_MUTATIONS
        value: "false"

      # === עזרה ל-Egress IP (לרישום ב-Trusted IPs) ===
      - key: EGRESS_IP_ENDPOINT
        value: "https://algogpt-docker.onrender.com/net/ip"

      # === Gunicorn טיונינג למניעת TIMEOUT-ים ===
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_CMD_ARGS
        value: "--timeout 65 --graceful-timeout 30 --keep-alive 5"

      # Render מחייב PORT; האפליקציה קוראת אותו אוטומטית
      - key: PORT
        value: "10000"

      # === סודות להזנה ב-Dashboard (לא בקובץ) ===
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false































