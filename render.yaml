# FILE: render.yaml
services:
  # ── Web (Docker) ───────────────────────────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      # כל הקונפיג והסודות מגיעים מקבוצה אחת מרכזית:
      - fromGroup: algogpt-prod

      # קבועים “טכניים” של השרת (אפשר להשאיר בקובץ):
      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: main:app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

  # ── Worker (Python) ────────────────────────────────────────
  - type: worker
    name: ops-supervisor
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u utils/ops_supervisor.py"

    envVars:
      - fromGroup: algogpt-prod
      # קובץ מדיניות ברירת מחדל (לא רגיש):
      - key: OPS_POLICY_PATH
        value: policies/ops_policy.yaml














































