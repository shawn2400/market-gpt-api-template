# FILE: render.yaml
services:
  # ── Web (Docker) ───────────────────────────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: main:app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

  # ── Worker (Python) ────────────────────────────────────────
  - type: worker
    name: ops-supervisor-eu     # שם זמני כדי לא להתנגש בקיים ב-Oregon
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u utils/ops_supervisor.py"

    envVars:
      - key: OPS_POLICY_PATH
        value: policies/ops_policy.yaml















































