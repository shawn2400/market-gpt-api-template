# FILE: render.yaml
services:
  # ── Web (Docker) ───────────────────────────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    # רק ערכים לא-רגישים כאן. הסודות נכנסים ב-Render UI.
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: main:app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: PUBLIC_HOST
        value: https://algogpt-docker.onrender.com
      - key: WEBHOOK_HOST
        value: https://algogpt-docker.onrender.com
      # DB מקומי על דיסק מתמשך (לא סוד)
      - key: DATABASE_URL
        value: sqlite:////app/data/algogpt.db

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

  # ── Worker (Python) ────────────────────────────────────────
  - type: worker
    name: ops-supervisor-eu
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u utils/ops_supervisor.py"

    # גם כאן רק לא-רגיש. סודות ב-UI.
    envVars:
      - key: OPS_POLICY_PATH
        value: policies/ops_policy.yaml
      - key: PUBLIC_HOST
        value: https://algogpt-docker.onrender.com
      # אם אתה רוצה שה-worker יעשה דיווח/בדיקות תקופתיות:
      - key: AI_SCHED_ENABLE
        value: "1"
      - key: AI_SCHED_INTERVAL_SEC
        value: "300"
















































