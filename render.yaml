# AlgoGPT - Render.com Reserved VM Configuration
# Full Auto-Trading Mode (No Telegram Approval)

services:
  - type: pserv
    name: algogpt-trading-vm
    env: docker
    region: frankfurt
    plan: standard       # 2GB RAM
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:

      # Core
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: TZ
        value: Asia/Jerusalem

      # ===== API Keys (Set only in Render dashboard) =====
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false

      # ===== Database / Redis =====
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # ===== Webhooks =====
      - key: N8N_WEBHOOK_SECRET
        sync: false

      # ======================================================
      # Trading System – Full Auto Mode
      # ======================================================

      # Auto-trading ON
      - key: ENABLE_AUTO_TRADING
        value: 1
      - key: AUTO_RUN
        value: 1

      # Full automation (NO TELEGRAM APPROVAL)
      - key: REQUIRE_APPROVAL
        value: 0
      - key: TELEGRAM_SEND_ENABLE
        value: 1

      # Auto-management
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: 1
      - key: ENABLE_POSITION_MONITOR
        value: 1
      - key: ENABLE_AUTO_PROTECT
        value: 1
      - key: ENABLE_INSURANCE_MONITOR
        value: 1

      # Dynamic Quality Score
      - key: MIN_QUALITY_SCORE
        value: 5.5
      - key: QUALITY_SCORE_DYNAMIC_ENABLE
        value: 1

      # Budget
      - key: MIN_BUDGET_USD
        value: 25
      - key: MAX_BUDGET_USD
        value: 150
      - key: BUDGET_PCT_OF_EQUITY
        value: 20.0

      # WebSocket
      - key: USER_STREAM_ENABLE
        value: 1
      - key: STREAM_TP_BE
        value: true

      # Intervals
      - key: HEALTH_CHECK_INTERVAL
        value: 60
      - key: POSITION_REPORT_INTERVAL_SEC
        value: 600
      - key: AUTO_PROTECT_INTERVAL_SEC
        value: 15
      - key: FILLS_WATCH_INTERVAL_SEC
        value: 20
      - key: INSURANCE_CHECK_INTERVAL_SEC
        value: 120
      - key: FILLS_WATCH_ENABLE
        value: 1

      # SL/TP & Management
      - key: TP_MODE
        value: hybrid
      - key: SL_MODE
        value: atr
      - key: ATR_MULTIPLIER
        value: 1.4

      # Emergency (OFF)
      - key: EMERGENCY_KILL_SWITCH
        value: 0
      - key: SAFE_BOOT_MODE
        value: 0

      # BAN shield – keep ON (safe)
      - key: BAN_SHIELD_ENABLE
        value: 1
      - key: BAN_SHIELD_MAX_RPM
        value: 24
      - key: BAN_SHIELD_GREEN_ZONE
        value: 18
      - key: BAN_SHIELD_YELLOW_ZONE
        value: 22
      - key: BAN_SHIELD_RED_ZONE
        value: 24
      - key: BAN_SHIELD_MONITOR_ENABLE
        value: 1
      - key: SHIELD_MONITOR_INTERVAL
        value: 10
      - key: SHIELD_ALERT_COOLDOWN
        value: 300


