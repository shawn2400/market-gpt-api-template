# services (prod) — תוספות כדי שיהיה ניהול אוטומטי באמת

הנה **גרסה מלאה 1:1** לקטע `services: … envVars:` של `algogpt-prod` עם התוספות הבאות:

* `SMART_MANAGE_ON_APPROVE=1` — מפעיל ניהול מיד אחרי approve.
* פרמטרי smart-manage ברירת מחדל (ניתן לכוון): `SMART_MANAGE_BE_OFFSET_BPS`, `SMART_MANAGE_PCTS`, `SMART_MANAGE_SPLITS`, `SMART_MANAGE_TRAIL_ATR_MULT`.
* (אופציונלי) `TRADE_MANAGER_ENABLE=1` — אם יש לך מודול שמצריך דגל זה בנוסף ל־`MANAGER_ENABLE=1`.
* לא נגעתי ב־`APPROVE_BEFORE_GATE` (נשאר 1). לבדיקות LIVE עקפת gate עם MARKET; כשתרצה, תחזיר ל־HYBRID.

