services:
  - type: web
    name: algogpt-prod
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz/strict

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # ========================= Runtime & Logging =========================
      - key: APP_NAME
        value: "algogpt"
      - key: APP_TITLE
        value: "AlgoGPT Service"
      - key: ALGOGPT_VERSION
        value: "2.18.0"
      - key: INSTANCE_ID
        value: "algogpt-prod"
      - key: INSTANCE
        value: "algogpt-prod"
      - key: APP_INSTANCE
        value: "algogpt-prod"
      - key: SERVICE_INSTANCE
        value: "algogpt-prod"

      - key: MODE
        value: "run"
      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: "main:app"
      - key: ULTRATOP_MODE
        value: "noop"
      - key: ULTRATOP_PREFIX
        value: "/ultra"
      - key: PYTHONPATH
        value: "/app"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "180"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "45"
      - key: GUNICORN_KEEPALIVE
        value: "30"
      - key: GUNICORN_MAX_REQUESTS
        value: "500"
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "50"
      - key: LOG_LEVEL
        value: "INFO"
      - key: UVICORN_ACCESS_LOG
        value: "false"
      - key: UVICORN_LOG_LEVEL
        value: "info"
      - key: HTTP_MAX_CONNECTIONS
        value: "30"
      - key: HTTP_MAX_KEEPALIVE
        value: "200"

      # ========================= Base URLs =========================
      - key: PUBLIC_HOST
        value: "https://algogpt-docker.onrender.com"
      - key: CONTEXT_URL
        value: "https://algogpt-docker.onrender.com"
      - key: WEBHOOK_HOST
        value: "https://algogpt-docker.onrender.com"

      # ========================= OpenAPI / Docs =========================
      - key: DOCS_URL
        value: "/docs"
      - key: REDOC_URL
        value: "/redoc"
      - key: OPENAPI_URL
        value: "/openapi.json"
      - key: ENABLE_READONLY_HTTP
        value: "1"
      - key: READONLY_ENDPOINTS
        value: "summary,prices_top,news_cache,health,meta_telegram"
      - key: OPENAPI_INCLUDE_TAGS
        value: "meta,Status,Public Feed,price,scan,manager,ops-ui,ops-approval,ops-flags,position-ops,ops-digest,debug,topk,alerts,aliases,metrics"
      - key: OPENAPI_HIDE_PATTERNS
        value: "/_debug/*,/debug/*,/internal/*,/provider/*,/grid/*,/trade/*,/risk/*/internal*"
      - key: OPENAPI_PUBLIC_MAX_OPS
        value: "30"

      # ========================= CORS =========================
      - key: CORS_ALLOW_ORIGINS
        value: "https://algogpt-docker.onrender.com"
      - key: CORS_ALLOW_ORIGINS_STRICT
        value: "https://algogpt-docker.onrender.com"
      - key: CORS_ALLOW_HEADERS
        value: "*"
      - key: CORS_ALLOW_METHODS
        value: "*"
      - key: CORS_ALLOW_CREDENTIALS
        value: "0"

      # ========================= Security / Hardening =========================
      - key: PROTECT_APPROVE_ROUTES
        value: "1"
      - key: PROTECT_DIGEST_ROUTES
        value: "1"
      - key: ENABLE_HSTS
        value: "1"
      - key: SECURITY_PUBLIC_PATHS
        value: "/ops/approve/signed,/ops/reject/signed,/ops/ui/ticket/signed,/readyz,/readyz/strict,/telegram/webhook,/telegram/hook,/telegram/ping,/health,/topk,/topk.csv,/scan/public-now,/scan/public-topk,/scan/public-topk/web,/scan/public-now/web,/scan/public-stream,/public/sse-ticket,/public/ticket/inspect,/alerts/ingest,/alerts/trades/update,/alerts/trades/active/scan-top-volume,/scan/now,/meta/version"
      - key: SECURITY_PUBLIC_PREFIXES
        value: "/public,/price,/static,/risk"
      - key: SECURITY_PROTECTED_PATHS
        value: "/ops/approve,/ops/reject,/webhook/whatever,/guard/smoke/run"

      # ========================= Anti-Replay =========================
      - key: ANTI_REPLAY_ENABLE
        value: "1"
      - key: ANTI_REPLAY_WINDOW_SEC
        value: "60"
      - key: ANTI_REPLAY_REQUIRE_SIGNATURE
        value: "1"
      - key: REQUIRE_SIGNATURE
        value: "1"
      - key: SIGNED_TS_MAX_SKEW_SEC
        value: "60"
      - key: ANTI_REPLAY_MAX_SKEW_SEC
        value: "120"
      - key: SIGNED_NONCE_TTL_SEC
        value: "120"
      - key: ANTI_REPLAY_SKEW_SEC
        value: "30"
      - key: ANTI_REPLAY_NONCE_TTL
        value: "45"

      # ========================= Rate Limit (coarse) =========================
      - key: RATE_LIMIT_ENABLE
        value: "1"
      - key: RL_FAIL_OPEN
        value: "0"
      - key: RATE_LIMIT_BACKEND
        value: "redis"
      - key: PUBLIC_TOPK_RPS
        value: "2"
      - key: PUBLIC_TOPK_WINDOW
        value: "3"
      - key: PUBLIC_NOW_RPS
        value: "2"
      - key: PUBLIC_NOW_WINDOW
        value: "3"
      - key: PUBLIC_CACHE_MAX_AGE
        value: "20"
      - key: PUBLIC_CACHE_PATHS
        value: "/scan/public-topk,/scan/public-now,/topk"

      # ===== Extra RL knobs =====
      - key: PUBLIC_WEB_RPS
        value: "2"
      - key: PUBLIC_WEB_BURST
        value: "6"
      - key: PUBLIC_REST_RPS
        value: "5"
      - key: PUBLIC_REST_BURST
        value: "15"
      - key: PUBLIC_SSE_MAX_CONNS
        value: "80"
      - key: PUBLIC_SSE_MAX_CONNS_PER_IP
        value: "4"
      - key: PUBLIC_RL_NS
        value: "ops-supervisor-web:rl"

      # ========================= Redis (incl. TLS) =========================
      - key: REQUIRE_REDIS
        value: "1"
      - key: CONFIRMSTORE_ENABLE
        value: "0"
      - key: USE_REDIS_IDEM
        value: "1"
      - key: IDEM_TTL_SEC
        value: "120"
      - key: SETEX_STRICT
        value: "1"
      - key: REDIS_CONNECT_TIMEOUT
        value: "8.0"
      - key: REDIS_SOCKET_TIMEOUT
        value: "8.0"
      - key: REDIS_POOL_MAX_CONNECTIONS
        value: "30"
      - key: REDIS_PING_RETRIES
        value: "3"
      - key: REDIS_PING_RETRY_BACKOFF_SEC
        value: "0.6"
      - key: REDIS_CLIENT_NAME
        value: "algogpt"
      - key: REDIS_RETRY_ON_TIMEOUT
        value: "1"
      - key: REDIS_SSL_NO_VERIFY
        value: "0"
      - key: REDIS_SSL_CERT_REQS
        value: "required"
      - key: REDIS_SSL_CA_CERTS
        value: "/etc/ssl/certs/ca-certificates.crt"
      - key: REDIS_NAMESPACE
        value: "ops-supervisor-web"
      - key: REDIS_URL
        fromSecret: REDIS_URL
      - key: ALGOGPT_REDIS_URL
        fromSecret: REDIS_URL

      # ========================= Exchange Defaults =========================
      - key: DEFAULT_MARKET
        value: "futures"
      - key: POSITION_MODE_OVERRIDE
        value: "hedge"
      - key: BINANCE_MARGIN_TYPE_DEFAULT
        value: "ISOLATED"
      - key: BINANCE_FUTURES_HTTP_BASE
        value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE
        value: "wss://fstream.binance.com"
      - key: BINANCE_SPOT_HTTP_BASE
        value: "https://api.binance.com"
      - key: BINANCE_TESTNET
        value: "false"
      - key: BINANCE_WORKING_TYPE
        value: "MARK_PRICE"
      - key: BINANCE_HTTP_TIMEOUT
        value: "10.0"
      - key: BINANCE_MAX_RETRIES
        value: "0"
      - key: BINANCE_RECV_WINDOW
        value: "45000"
      - key: LISTENKEY_KEEPALIVE_SEC
        value: "1800"
      - key: WS_KEEPALIVE_SEC
        value: "25"
      - key: USE_WS
        value: "1"
      - key: EXCHANGE_INFO_TTL_SEC
        value: "900"
      - key: USER_STREAM_ENABLE
        value: "1"

      # ========================= Router Enablement =========================
      - key: ENABLE_AI_ROUTES
        value: "1"
      - key: PRICE_MONITOR_DISABLE
        value: "0"

      # ========================= Scanner / Universe =========================
      - key: SCAN_SOURCE
        value: "binance-futures"
      - key: UNIVERSE_MODE
        value: "exchange"
      - key: SCAN_INTERVALS
        value: "5m,15m,1h,4h"
      - key: SCAN_MAX_SYMBOLS
        value: "150"
      - key: SCAN_MAX_LIMIT
        value: "0"
      - key: SCAN_CONCURRENCY
        value: "2"
      - key: TOP_SYMBOLS
        value: "80"
      - key: SUGGEST_FUTURES
        value: "1"
      - key: SUGGEST_INTERVAL_SEC
        value: "45"
      - key: SUGGEST_CAP_PER_CYCLE
        value: "30"

      # ========================= Indicators / Gates =========================
      - key: INDICATOR_INTERVALS
        value: "15m,1h,4h,1d"
      - key: ENABLE_INDICATOR_EXIT
        value: "1"
      - key: ADX_MIN
        value: "20"
      - key: FEAT_DAILY_CAPS
        value: "0"
      - key: FEAT_DEBOUNCE_LIMIT
        value: "1"
      - key: FEAT_QUALITY_ENFORCE
        value: "1"
      - key: FEAT_SPREAD_DEPTH
        value: "1"
      - key: FEAT_TF_ALIGN
        value: "1"
      - key: FEAT_VOLUME_GATE
        value: "1"
      - key: FEAT_COOLDOWN
        value: "0"
      - key: MAX_ATR_PCT
        value: "3"
      - key: ALLOW_HTTP_IN_INDICATORS
        value: "0"
      - key: INDICATORS_SUBSET
        value: ""

      # ===== Checklist / Gate =====
      - key: ENTRY_SCORE_MODE
        value: "log"
      - key: ENTRY_SCORE_MIN
        value: "6.5"
      - key: ENTRY_SCORE_INTERVAL
        value: "15m"
      - key: ENTRY_SCORE_ENFORCE_ON_APPROVE
        value: "0"
      - key: CHECKLIST_LOG_FEATURES
        value: "1"
      - key: REGIME_ADX_TREND
        value: "22"
      - key: REGIME_CHOP_ATR
        value: "0.6"
      - key: REGIME_COMPRESSION_BW
        value: "1.2"
      - key: EMA_GAP_MAX_PCT
        value: "6"
      - key: IMPACT_SLIP_BPS_MAX
        value: "25"

      # ----- Sensitivity: spread & volatility -----
      - key: SPREAD_ASSUME_PCT
        value: "0.02"
      - key: SPREAD_SOFT_PCT
        value: "0.05"
      - key: VOLATILITY_GATE_ATRPCT
        value: "1.2"
      - key: PREFER_HYBRID_DEFAULT
        value: "1"

      # ===== Weights (optional tuning) =====
      - key: W_REGIME
        value: "2.0"
      - key: W_COMPRESSION
        value: "2.0"
      - key: W_TRENDCONF
        value: "3.0"
      - key: W_RSI_COMP
        value: "1.5"
      - key: W_EMA_GAP
        value: "1.5"

      # ========================= Watchlist =========================
      - key: ALLOWLIST_MODE
        value: "off"
      - key: SYMBOLS_ALLOWLIST_PATH
        value: "config/symbols_allowlist.json"
      - key: WATCHLIST
        value: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,NEARUSDT"

      # ========================= Scan CRON =========================
      - key: SCAN_CRON_ENABLE
        value: "1"
      - key: SCAN_CRON_EVERY_SEC
        value: "45"
      - key: SCAN_CRON_TIMEFRAME
        value: "15m"
      - key: SCAN_CRON_KLINES
        value: "200"
      - key: SCAN_CRON_LIMIT
        value: "12"
      - key: SCAN_CRON_MIN_SCORE
        value: "6.8"
      - key: SCAN_REARM_SCORE
        value: "6"
      - key: SCAN_DEDUPE_WINDOW_SEC
        value: "300"
      - key: SCAN_TTL_SEC
        value: "900"
      - key: SCAN_RICH
        value: "1"
      - key: DEFAULT_LEVERAGE
        value: "10"
      - key: DEFAULT_STAKE_USDT
        value: "50"

      # ========================= Approvals (Gate = Telegram) =========================
      - key: APPROVAL_ENABLED
        value: "1"
      - key: REQUIRE_TELEGRAM_APPROVAL
        value: "1"
      - key: AUTO_OPEN_ON_APPROVE
        value: "1"
      - key: SINK_ENFORCE_APPROVALS
        value: "1"
      - key: APPROVAL_REQUIRE_WATCHLIST
        value: "0"
      - key: APPROVAL_RR_MIN
        value: "1.30"
      - key: APPROVAL_SUCCESS_MIN
        value: "50"
      - key: APPROVAL_MAX_SL_PCT
        value: "3.0"
      - key: APPROVAL_REQUIRE_FRESH_PRICE
        value: "1"
      - key: APPROVAL_DUP_COOLDOWN_SEC
        value: "0"
      - key: APPROVE_BEFORE_GATE
        value: "1"
      - key: CONFIRM_TTL_SEC
        value: "120"
      - key: OPS_TICKET_TTL_SEC
        value: "1800"
      - key: ONLY_TRADE_NOTIFICATIONS
        value: "1"
      - key: STARTUP_NOTIFY_ENABLE
        value: "0"
      - key: ADMIN_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_ADMIN_IDS
        value: "449087907"
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "1"
      - key: TELEGRAM_PARSE_MODE
        value: "HTML"
      - key: TELEGRAM_RICH_MSG
        value: "0"
      - key: ALLOW_PUBLIC_META_TELEGRAM_SEND
        value: "0"

      # ========================= Trade & Orders =========================
      - key: EXECUTE_TRADES
        value: "1"
      - key: ALLOW_MARKET_ENTRY
        value: "0"
      - key: MANAGER_WRITES_ORDERS
        value: "1"
      - key: ORDERS_USE_OCO
        value: "1"
      - key: ORDER_ID_PREFIX
        value: "ALG"
      - key: ORDER_ID_INCLUDE_TS
        value: "1"
      - key: ORDER_BACKOFF_BASE_MS
        value: "120"
      - key: ORDER_BACKOFF_MAX_MS
        value: "1600"
      - key: ORDER_ROUND_TO_TICK
        value: "1"
      - key: USE_EXCHANGE_FILTERS
        value: "1"
      - key: ORD_VERIFY_TIMEOUT_MS
        value: "800"
      - key: ORD_CANCEL_STRATEGY
        value: "MINIMAL"
      - key: MAX_TRADES_PER_TICK
        value: "1"
      - key: MIN_NOTIONAL_USDT
        value: "25"
      - key: MAX_TRADE_BUDGET
        value: "600"
      - key: ORDER_TRIGGER
        value: "mark"
      - key: POST_ONLY
        value: "1"

      # ======== Binance precision overrides (BTCUSDT) =========
      - key: PRICE_DP_OVERRIDE__BTCUSDT
        value: "1"
      - key: QTY_STEP_OVERRIDE__BTCUSDT
        value: "0.001"

      # ========================= Auto QTY =========================
      - key: AUTO_QTY_ENABLE
        value: "1"
      - key: AUTO_QTY_MODE
        value: "notional"
      - key: AUTO_QTY_MARGIN_BUFFER_PCT
        value: "0.20"
      - key: AUTO_LEV_MIN
        value: "15"
      - key: AUTO_LEV_MAX
        value: "25"
      - key: AUTO_BUDGET_MIN
        value: "100"
      - key: AUTO_BUDGET_MAX
        value: "200"

      # ========================= SL/TP / BE / Trail / Ladder =========================
      - key: NATIVE_TPSL_ENABLE
        value: "0"
      - key: SL_MONOTONIC
        value: "1"
      - key: PERCENT_GUARD_ENABLE
        value: "1"
      - key: PERCENT_PRICE_GUARD_BPS
        value: "180"
      - key: ENTRY_BAND_BPS
        value: "25"
      - key: ENTRY_GAP_MAX_PCT
        value: "0.80"
      - key: ENTRY_GAP_WARN_PCT
        value: "0.50"
      - key: STOP_BAND_BPS
        value: "20"
      - key: TP_BE_ONLY_AFTER_TP1
        value: "0"
      - key: STREAM_TP_BE
        value: "1"
      - key: TP_LADDER_ON_APPROVE
        value: "1"
      - key: SMART_MANAGE_ON_APPROVE
        value: "1"
      - key: SMART_MANAGE_BE_OFFSET_BPS
        value: "5"
      - key: SMART_MANAGE_PCTS
        value: "4,8,16"
      - key: SMART_MANAGE_SPLITS
        value: "0.30,0.30,0.40"
      - key: SMART_MANAGE_TRAIL_ATR_MULT
        value: "1.6"
      - key: LADDER_TP_ENABLE
        value: "1"
      - key: LADDER_SL_ENABLE
        value: "1"
      - key: TP_MAX_LADDERS
        value: "3"
      # ----- Merge & Rearm -----
      - key: TP_MERGE_TICK_BAND
        value: "1"
      - key: TP_REARM_TICK
        value: "1"
      # ----- Profit-Lock bands -----
      - key: PROFIT_LOCK_STEPS
        value: "1.0,1.5,2.0"
      # ----- Structural SL -----
      - key: STRUCT_SL_ENABLE
        value: "1"
      - key: STRUCT_SL_LOOKBACK
        value: "50"
      - key: STRUCT_SL_LEFT
        value: "3"
      - key: STRUCT_SL_RIGHT
        value: "3"
      - key: STRUCT_SL_BUFFER_BPS
        value: "5"
      - key: STRUCT_SL_MERGE_MODE
        value: "tight"
      # ----- Time Stop -----
      - key: TIME_STOP_MIN
        value: "20"
      - key: TIME_STOP_KEEP_PROFIT_MIN_PCT
        value: "0.5"
      - key: PROFILE_BASE_BE_BPS
        value: "5"
      # ----- Trailing & BE -----
      - key: TRAIL_ENABLE
        value: "1"
      - key: TRAIL_ATR_MULT
        value: "1.6"
      - key: ATR_UPDATE_COOLDOWN_SEC
        value: "20"
      - key: ATR_MIN_DELTA
        value: "0.02"
      - key: BE_ARM_PCT
        value: "0.6"
      - key: BE_GUARD_ENABLE
        value: "1"
      - key: BE_GUARD_EVERY_SEC
        value: "20"
      - key: TP_BE_OFFSET_BPS
        value: "12"
      - key: TRAIL_IN_CHOP
        value: "1"
      - key: TP_SL_REFRESH_SEC
        value: "420"
      - key: MANAGER_REISSUE_ENABLE
        value: "1"
      - key: MANAGER_REISSUE_POLICY
        value: "cancel_replace"
      - key: TRAIL_PAUSE_WINDOWS
        value: "22:00-02:00Z,11:30-12:00Z"
      - key: AUTO_TRAIL_ADX_MIN
        value: "14"
      - key: AUTO_TRAIL_ATRPCT_MAX
        value: "0.015"
      - key: BE_BASE_BPS
        value: "5"
      - key: BE_ADX_FACTOR
        value: "0.2"
      - key: BE_MIN_BPS
        value: "2"
      - key: BE_MAX_BPS
        value: "25"
      - key: BE_STAIR_STEPS
        value: "1"
      - key: BE_STAIR_FACTOR
        value: "0.5"
      - key: TRAIL_DEFAULT_ATR_MULT
        value: "1.6"

      # ========================= Real-time Trailing (RT loop) =========================
      - key: TRAIL_RT_ENABLE
        value: "1"
      - key: TRAIL_RT_INTERVAL_SEC
        value: "20"
      - key: TRAIL_RT_ATR_MULT
        value: "1.6"
      - key: TRAIL_RT_MIN_CALLBACK
        value: "0.1"
      - key: TRAIL_RT_MAX_CALLBACK
        value: "5.0"
      - key: TRAIL_RT_PRICE_SRC
