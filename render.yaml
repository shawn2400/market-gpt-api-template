          envVarKey: TELEGRAM_BOT_TOKEN
      - fromService:
          type: web
          name: algogpt-api
          envVarKey: TELEGRAM_CHAT_ID
  
  # Worker 10: Telegram Digest Reporter
  - type: worker
    name: worker-telegram-digest
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python workers/telegram_digest_reporter.py
    envVars:
      - fromService:
          type: web
          name: algogpt-api
