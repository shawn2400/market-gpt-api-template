services:
  - type: web
    name: algogpt-docker
    runtime: docker
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    # בריאות
    healthCheckPath: /health

    # Docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      # מריץ את האפליקציה המלאה (כול הראוטים)
      - key: APP_MODULE
        value: main:app

      # קונקרנסי נמוך כדי לא להעמיס
      - key: WEB_CONCURRENCY
        value: "1"

      - key: LOG_LEVEL
        value: info

      # CORS (בפרוד עדיף להחליף ל־Whitelist)
      - key: CORS_ALLOW_ORIGINS
        value: "*"

      # גרסה/תצוגה
      - key: ALGOGPT_VERSION
        value: "2.17.0"

      # מחיר/WS
      - key: WATCHLIST
        value: "BTCUSDT,ETHUSDT,SOLUSDT"
      - key: INDICATOR_INTERVALS
        value: "15m,1h"

      # Binance endpoints (פרוד)
      - key: BINANCE_FUTURES_HTTP_BASE
        value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE
        value: "wss://fstream.binance.com"
      - key: BINANCE_WORKING_TYPE
        value: "MARK_PRICE"
      - key: BINANCE_TESTNET
        value: "false"

      # מסחר חי
      - key: EXECUTE_TRADES
        value: "true"
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: "true"
      - key: ENABLE_AI_ROUTES
        value: "1"

      # דומיין ציבורי (ל־Telegram webhook)
      - key: WEBHOOK_HOST
        value: "https://algogpt-docker.onrender.com"

      # DB ע"ג דיסק מתמשך
      - key: DATABASE_URL
        value: "sqlite:////app/data/algogpt.db"

      # ===== סודות (להזין בדשבורד, לא ב־git) =====
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # ===========================================

    # דיסק מתמשך עבור ה־SQLite (ותוצרים נוספים אם צריך)
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1












































