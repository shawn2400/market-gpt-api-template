# AlgoGPT - Render.com Reserved VM Configuration
# Single VM running all services - $25/month (2GB RAM)

services:
  - type: pserv
    name: algogpt-trading-vm
    env: docker
    region: frankfurt
    plan: standard  # 2GB RAM, $25/month
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # Core
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: TZ
        value: Asia/Jerusalem
      
      # API Keys (set these in Render Dashboard)
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      
      # Optional AI Keys
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      
      # Database (set Neon URL in dashboard)
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEON_API_KEY
        sync: false
      - key: NEON_PROJECT_ID
        sync: false
      - key: NEON_ENDPOINT_ID
        sync: false
      
      # Redis (set Redis Cloud URL in dashboard)
      - key: REDIS_URL
        sync: false
      
      # Webhooks
      - key: N8N_WEBHOOK_SECRET
        sync: false
      
      # Trading Configuration
      - key: ENABLE_AUTO_TRADING
        value: 1
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: 1
      - key: ENABLE_POSITION_MONITOR
        value: 1
      - key: ENABLE_INSURANCE_MONITOR
        value: 1
      - key: ENABLE_AUTO_PROTECT
        value: 1
      - key: AUTO_RUN
        value: 1
      - key: DYNAMIC_BUDGET_ENABLE
        value: 1
      
      # Budget & Risk
      - key: MIN_BUDGET_USD
        value: 25
      - key: MAX_BUDGET_USD
        value: 150
      - key: MIN_QUALITY_SCORE
        value: 6.0
      - key: BUDGET_PCT_OF_EQUITY
        value: 20.0
      
      # WebSocket Configuration (API Optimization - 72% reduction)
      - key: USER_STREAM_ENABLE
        value: 1
      - key: STREAM_TP_BE
        value: true
      
      # Intervals & Configuration (Optimized for WebSocket)
      - key: HEALTH_CHECK_INTERVAL
        value: 90
      - key: OPTIMIZATION_INTERVAL_HOURS
        value: 4
      - key: POSITION_REPORT_INTERVAL_SEC
        value: 1800
      - key: AUTO_PROTECT_INTERVAL_SEC
        value: 120
      - key: FILLS_WATCH_INTERVAL_SEC
        value: 60
      - key: INSURANCE_CHECK_INTERVAL_SEC
        value: 180
      - key: POOL_PER_CYCLE
        value: 50
      - key: SUGGEST_GRID
        value: 1
      - key: AUTO_FIX_ENABLE
        value: 1
      - key: TELEGRAM_SEND_ENABLE
        value: 1
      - key: OPTIMIZATION_LOOKBACK_DAYS
        value: 7
      - key: FILLS_WATCH_ENABLE
        value: 1
      - key: POSITION_ALERT_LEVEL
        value: all
      - key: SENTINEL_ENABLED
        value: 1
      - key: SENTINEL_ALERT_LEVEL
        value: critical
      
      # 🚨 EMERGENCY KILL-SWITCH (BAN RECOVERY)
      # Phase 1: EMERGENCY_KILL_SWITCH=1 → All workers OFF, WebSocket only
      # Phase 3: EMERGENCY_KILL_SWITCH=0, SAFE_BOOT_MODE=1 → Staggered startup
      - key: EMERGENCY_KILL_SWITCH
        value: 1
      - key: SAFE_BOOT_MODE
        value: 0
