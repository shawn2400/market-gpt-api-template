# FILE: render.yaml
services:
  # ── Web (Docker) ───────────────────────────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: main:app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      # Scheduler (כדי שלא תלוי ב-worker)
      - key: AI_SCHED_ENABLE
        value: "1"
      - key: AI_SCHED_INTERVAL_SEC
        value: "300"
      # DB (SQLite על דיסק מתמשך)
      - key: USE_DB
        value: "1"
      - key: DATABASE_URL
        value: "sqlite:////app/data/algogpt.db"

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

  # ── Worker (Python) ────────────────────────────────────────
  - type: worker
    name: ops-supervisor-eu
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u utils/ops_supervisor.py"

    # שים לב: אין מפתחות כאן, רק קונפיג כללי
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPS_POLICY_PATH
        value: "policies/ops_policy.yaml"
      # לא צריך DB ב-worker, אלא אם אתה רוצה. כדי למנוע כשלים:
      - key: USE_DB
        value: "0"
      # אם תרצה גם heartbeat אוטומטי מה-worker:
      - key: TELEGRAM_ADMIN_ONLY
        value: "1"
      - key: AI_SCHED_ENABLE
        value: "0"  # הסשדולר רץ ב-Web; תשאיר 0 ב-worker כדי לא לכפל

















































