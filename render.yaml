services:
  - type: web
    name: algo-gpt-fastapi
    env: docker
    plan: starter
    autoDeploy: true

    envVars:
      # 🌐 פורט להרצת השרת
      - key: PORT
        value: "5000"

      # 🔐 Binance API Keys
      - key: BINANCE_API_KEY
        value: your_api_key_here
      - key: BINANCE_API_SECRET
        value: your_api_secret_here

      # 🤖 OpenAI
      - key: OPENAI_API_KEY
        value: your_openai_key_here

      # ⚙️ Auto Executor Settings
      - key: AUTO_RUN
        value: "true"
      - key: MIN_QUALITY_SCORE
        value: "6"
      - key: MAX_TRADE_BUDGET
        value: "100"
      - key: SCAN_INTERVAL
        value: "10"

      # 📊 Volume & Trending Filters
      - key: MIN_VOLUME
        value: "1000000"
      - key: TRENDING_ONLY
        value: "true"

    # 🩺 בדיקת בריאות לשרת
    healthCheckPath: /






























