services:
  - type: web
    name: algo-gpt-fastapi
    env: docker
    plan: starter
    autoDeploy: true

    # Render מספק PORT אוטומטית → לא להגדיר PORT ידנית כאן
    healthCheckPath: /healthz

    envVars:
      # את המפתחות לא לשים כאן; הזן ב-Dashboard כסוד (Secret)
      - key: AUTO_RUN
        value: "true"
      - key: MIN_QUALITY_SCORE
        value: "6"
      - key: MAX_TRADE_BUDGET
        value: "100"
      - key: SCAN_INTERVAL
        value: "10"
      - key: MIN_VOLUME
        value: "1000000"
      - key: TRENDING_ONLY
        value: "true"






























