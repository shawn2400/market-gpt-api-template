# FILE: render.yaml
services:
  # ───────── Web ראשי ─────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false       # פריסה ידנית בלבד
    autoscale: false        # ביטול Autoscaling
    numInstances: 1         # רפליקה אחת
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health   # יש לנו /health; לא להשתמש ב-/healthz אם אין ראוט
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"             # וורקר יחיד (מונע תקלות race סביב middleware)
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: INFO

      # ───── HMAC (להזין בלשונית Secrets ב-Render) ─────
      - key: ALERTS_INGEST_HMAC_SECRET
        sync: false
      - key: ALERTS_INGEST_HMAC_KEY_IS_HEX
        value: "1"

      # ───── Binance/Telegram/OpenAI/Redis וכו' (אופציונלי) ─────
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_HOST
        value: https://algogpt-docker.onrender.com
      - key: REDIS_URL
        sync: false

    # שימו לב: לא עושים dockerCommand כדי לא לעקוף את ה-CMD שב-Dockerfile (Gunicorn+UvicornWorker)
    # אם ממש רוצים Uvicorn ישיר: בטלו את השורה מעל והוסיפו כאן dockerCommand:
    # dockerCommand: >
    #   uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1































































