      - key: SECURITY_PROTECTED_PATHS
        value: "/webhook/whatever,/guard/smoke/run,/ops/pending.json,/admin,/manage-once,/manage-once/multi"

      - key: ENABLE_CSP
        value: "1"
      - key: CSP_POLICY
        value: "default-src 'none'; img-src 'self' data: https:; style-src 'unsafe-inline' 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; connect-src 'self' https: wss:; base-uri 'none'; frame-ancestors 'none'"

