# FILE: render.yaml
services:
  # ─────────────────────────────────────────────
  # Web ראשי — לא נוגעים בו כדי לא לשנות דיפלוי קיים
  # ─────────────────────────────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    # בכוונה אין dockerfilePath/envVars כאן כדי למנוע דריסה של ההגדרות הקיימות

  # ─────────────────────────────────────────────
  # Web משני — ops-supervisor (Docker, אותו Dockerfile)
  # ─────────────────────────────────────────────
  - type: web
    name: ops-supervisor
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: Dockerfile
    autoDeploy: false
    envVars:
      # Core / Runtime
      - key: PORT
        value: "10001"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PUBLIC_HOST
        value: "https://ops-supervisor.onrender.com"
      - key: OPS_POLICY_PATH
        value: "policies/ops_policy.yaml"
      - key: INSTANCE_ID
        value: "ops-supervisor"

      # Safety (בדיקות – כבוי כברירת מחדל)
      - key: AUTO_RUN
        value: "0"
      - key: EXECUTE_TRADES
        value: "0"
      - key: AI_SCHED_ENABLE
        value: "0"
      - key: AI_SCHED_INTERVAL_SEC
        value: "300"

      # Redis (את ה-URL מגדירים בדשבורד), Namespace מבודד מהראשי
      - key: REDIS_URL
        value: "SET_IN_DASHBOARD"
      - key: REDIS_NAMESPACE
        value: "ops-supervisor-web"

      # Auth/Tokens — שונים מהראשי! (להגדיר בדשבורד בלבד)
      - key: ALGOGPT_TOKENS
        value: "SET_IN_DASHBOARD_SECONDARY"
      - key: API_BEARER_TOKEN
        value: "SET_IN_DASHBOARD_SECONDARY"
      - key: WEBHOOK_HMAC_SECRET
        value: "SET_IN_DASHBOARD_SECONDARY"

      # OpenAI — להגדיר בדשבורד בלבד
      - key: OPENAI_API_KEY
        value: "SET_IN_DASHBOARD"

      # Telegram — כבוי כדי לא להתנגש בראשי; מלא רק אם צריך שליחה
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "0"
      - key: TELEGRAM_ADMIN_ONLY
        value: "1"
      - key: TELEGRAM_ADMIN_IDS
        value: "449087907"
      - key: TELEGRAM_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_WEBHOOK_SECRET
        value: ""

























































