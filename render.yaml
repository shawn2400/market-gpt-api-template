# render.yaml
services:
  - type: web
    name: algogpt-docker
    runtime: docker
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: main:app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: info

      # AlgoGPT
      - key: ALGOGPT_VERSION
        value: "2.18.0"
      - key: ENABLE_AI_ROUTES
        value: "1"
      - key: EXECUTE_TRADES
        value: "true"
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: "true"

      # WS / Watchlist
      - key: WATCHLIST
        value: "BTCUSDT,ETHUSDT,SOLUSDT"
      - key: INDICATOR_INTERVALS
        value: "15m,1h"

      # Binance
      - key: BINANCE_WORKING_TYPE
        value: "MARK_PRICE"
      - key: BINANCE_TESTNET
        value: "false"
      - key: BINANCE_FUTURES_HTTP_BASE
        value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE
        value: "wss://fstream.binance.com"

      # Telegram/Webhook
      - key: PUBLIC_HOST            # ← main.py משתמש בזה
        value: "https://algogpt-docker.onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_TEST_CHAT_ID  # אופציונלי לבדיקות /telegram/test-ping
        sync: false

      # CORS
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: CORS_ALLOW_CREDENTIALS
        value: "0"

      # DB / Redis / Keys (מוזנים רק בדשבורד)
      - key: DATABASE_URL
        value: "sqlite:////app/data/algogpt.db"
      - key: API_BEARER_TOKEN
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1












































