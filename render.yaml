      - key: USE_EXCHANGE_FILTERS
        value: "1"
      - key: MAX_TRADES_PER_TICK
        value: "1"
      - key: MIN_NOTIONAL_USDT
        value: "5"
      - key: MAX_TRADE_BUDGET
        value: "150"

      # ============== Auto QTY ==============
      - key: AUTO_QTY_ENABLE
        value: "1"
      - key: AUTO_QTY_MODE
        value: "notional"
      - key: AUTO_QTY_MARGIN_BUFFER_PCT
        value: "0.20"

      # ============== SL/TP / BE / Trail / Ladder ==============
