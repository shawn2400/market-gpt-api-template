# FILE: render.yaml
services:
  # ───────── Web ראשי ─────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false          # נשאר כבוי (אתה שולט ידנית)
    autoscale: false           # <<< מבטל AutoScaling
    numInstances: 1            # <<< רפליקה אחת בלבד
    envVars:
      - key: WEB_CONCURRENCY   # <<< וורקר יחיד בתוך הרפליקה
        value: "1"
      - key: HEALTHCHECK_PATH
        value: "/healthz"
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile

  # ───────── Worker: ops-supervisor ─────────
  - type: worker
    name: ops-supervisor
    env: python
    region: frankfurt
    plan: starter
    pythonVersion: 3.11
    buildCommand: pip install -r requirements-worker.txt
    preDeployCommand: chmod +x ./ops/launch_with_env.sh || true
    startCommand: bash -lc './ops/watchdog.sh & exec ./ops/launch_with_env.sh python -u -m utils.ops_supervisor'

    envVars:
      # ---- Policy / runtime ----
      - key: OPS_POLICY_PATH
        value: policies/ops_policy.yaml
      - key: OPS_REQUIRE_ACTION_PARAM
        value: "0"
      - key: APPROVAL_AUTO_APPROVE_MAX_CRS
        value: "6"
      - key: APPROVAL_AUTO_APPROVE_SENSITIVE
        value: "0"

      # ---- כללי ----
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_NAMESPACE
        value: ops-supervisor-web
      - key: APPROVAL_PUBSUB_CHANNEL
        value: ops:ticket:events
      - key: PUBLIC_HOST
        value: https://ops-approval-web.onrender.com

      # ---- Watchdog / HA ----
      - key: PRIMARY_PUBLIC_HOST
        value: https://algogpt-docker.onrender.com
      - key: WATCHDOG_INTERVAL_SEC
        value: "60"
      - key: WATCHDOG_DEBOUNCE
        value: "2"
      - key: WATCHDOG_LOGS
        value: /opt/render/project/src/logs/app.log
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false

      # ---- סודות (מוזנים בדשבורד) ----
      - key: REDIS_URL
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_BEARER_TOKEN
        sync: false

      # ---- טלגרם ----
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "1"
      - key: TELEGRAM_ADMIN_ONLY
        value: "1"
      - key: TELEGRAM_ADMIN_IDS
        value: "449087907,123456789"
      - key: TELEGRAM_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false




























































