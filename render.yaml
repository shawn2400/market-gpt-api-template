# AlgoGPT - Render.com Reserved VM Configuration
# Clean Production Build - BAN-Safe Version

services:
  - type: pserv
    name: algogpt-trading-vm
    env: docker
    region: frankfurt
    plan: standard        # 2GB RAM - $25/month
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # Core
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: TZ
        value: Asia/Jerusalem

      # ====== API Keys (set only in Render Dashboard) ======
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false

      # ====== Database (Neon) ======
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEON_API_KEY
        sync: false
      - key: NEON_PROJECT_ID
        sync: false
      - key: NEON_ENDPOINT_ID
        sync: false

      # ====== Redis (Redis Cloud) ======
      - key: REDIS_URL
        sync: false

      # ====== Webhooks ======
      - key: N8N_WEBHOOK_SECRET
        sync: false

      # ======================================================
      # Trading System Configuration
      # ======================================================

      # Disable everything during BAN
      - key: ENABLE_AUTO_TRADING
        value: 0
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: 0
      - key: ENABLE_POSITION_MONITOR
        value: 0
      - key: ENABLE_INSURANCE_MONITOR
        value: 0
      - key: ENABLE_AUTO_PROTECT
        value: 0
      - key: AUTO_RUN
        value: 0
      - key: DYNAMIC_BUDGET_ENABLE
        value: 0

      # Budget & Risk
      - key: MIN_BUDGET_USD
        value: 25
      - key: MAX_BUDGET_USD
        value: 150
      - key: MIN_QUALITY_SCORE
        value: 6.0
      - key: BUDGET_PCT_OF_EQUITY
        value: 20.0

      # WebSocket – Allowed even in BAN
      - key: USER_STREAM_ENABLE
        value: 1
      - key: STREAM_TP_BE
        value: true

      # ===== Intervals (SAFE MODE) =====
      - key: HEALTH_CHECK_INTERVAL
        value: 120
      - key: OPTIMIZATION_INTERVAL_HOURS
        value: 12
      - key: POSITION_REPORT_INTERVAL_SEC
        value: 3600
      - key: AUTO_PROTECT_INTERVAL_SEC
        value: 9999
      - key: FILLS_WATCH_INTERVAL_SEC
        value: 9999
      - key: INSURANCE_CHECK_INTERVAL_SEC
        value: 9999
      - key: FILLS_WATCH_ENABLE
        value: 0
      - key: SUGGEST_GRID
        value: 0

      # Alerts / Logging
      - key: TELEGRAM_SEND_ENABLE
        value: 1
      - key: POSITION_ALERT_LEVEL
        value: critical
      - key: SENTINEL_ENABLED
        value: 1
      - key: SENTINEL_ALERT_LEVEL
        value: critical

      # ======================================================
      # 🚨 Emergency Kill Switch (This is EXTREMELY important)
      # ======================================================

      - key: EMERGENCY_KILL_SWITCH
        value: 1           # 🔥 ALL WORKERS OFF, API ONLY

      - key: SAFE_BOOT_MODE
        value: 1           # Start only API + WebSocket

      # ======================================================
      # Auto-Ban Shield v2.0
      # ======================================================
      - key: BAN_SHIELD_ENABLE
        value: 1
      - key: BAN_SHIELD_MAX_RPM
        value: 25
      - key: BAN_SHIELD_GREEN_ZONE
        value: 18
      - key: BAN_SHIELD_YELLOW_ZONE
        value: 22
      - key: BAN_SHIELD_RED_ZONE
        value: 25
      - key: BAN_SHIELD_MONITOR_ENABLE
        value: 1
      - key: SHIELD_MONITOR_INTERVAL
        value: 10
      - key: SHIELD_ALERT_COOLDOWN
        value: 300

