services:
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # ============== Runtime & Logging ==============
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: "INFO"
      - key: APP_MODULE
        value: "main:app"
      - key: PYTHONPATH
        value: "/app"
      - key: UVICORN_ACCESS_LOG
        value: "false"
      - key: UVICORN_LOG_LEVEL
        value: "info"
      - key: HTTP_MAX_CONNECTIONS
        value: "50"
      - key: HTTP_MAX_KEEPALIVE
        value: "200"

      # ============== Base URLs ==============
      - key: PUBLIC_HOST
        value: "https://algogpt-docker.onrender.com"
      - key: CONTEXT_URL
        value: "https://algogpt-docker.onrender.com"
      - key: WEBHOOK_HOST
        value: "https://algogpt-docker.onrender.com"

      # ============== CORS ==============
      - key: CORS_ALLOW_ORIGINS
        value: "https://algogpt-docker.onrender.com"
      - key: CORS_ALLOW_HEADERS
        value: "*"
      - key: CORS_ALLOW_METHODS
        value: "*"
      - key: CORS_ALLOW_CREDENTIALS
        value: "0"

      # ============== Public/Readonly/OpenAPI ==============
      - key: ENABLE_READONLY_HTTP
        value: "1"
      - key: READONLY_ENDPOINTS
        value: "summary,prices_top,news_cache,health"
      - key: OPENAPI_INCLUDE_TAGS
        value: ""
      - key: OPENAPI_HIDE_PATTERNS
        value: "/_debug/*,/debug/*,/internal/*,/provider/*,/grid/*,/trade/*,/risk/*/internal*"
      - key: OPENAPI_PUBLIC_MAX_OPS
        value: "30"

      # ============== Security (hardening) ==============
      - key: PROTECT_APPROVE_ROUTES
        value: "0"
      - key: PROTECT_DIGEST_ROUTES
        value: "1"
      - key: ENABLE_HSTS
        value: "1"
      - key: SECURITY_PUBLIC_PATHS
        value: "/ops/approve-link,/ops/approve,/ops/reject,/ops/approve/signed,/readyz,/telegram/webhook,/telegram/hook,/telegram/ping,/ops/manager/health,/ops/ui,/ops/ui/ticket,/ops/ui/orders,/ui/dashboard,/health,/health/tp1,/topk,/scan/public-now,/alerts/ingest,/alerts/trades/update,/alerts/trades/active,/scan/now,/scan/top-volume"
      - key: SECURITY_PUBLIC_PREFIXES
        value: "/public,/price,/static,/risk"

      # ============== Anti-Replay ==============
      - key: ANTI_REPLAY_ENABLE
        value: "1"
      - key: ANTI_REPLAY_WINDOW_SEC
        value: "60"
      - key: ANTI_REPLAY_REQUIRE_SIGNATURE
        value: "1"
      - key: SIGNED_TS_MAX_SKEW_SEC
        value: "60"
      - key: SIGNED_NONCE_TTL_SEC
        value: "120"

      # ============== Rate Limit backend ==============
      - key: RATE_LIMIT_ENABLE
        value: "1"
      - key: RL_FAIL_OPEN
        value: "0"
      - key: RATE_LIMIT_BACKEND
        value: "redis"
      - key: ORDERS_BUCKET_WINDOW_SEC
        value: "10"
      - key: ORDERS_QPS_BUCKET
        value: "8"

      # ============== Redis client (non-secret) ==============
      - key: REQUIRE_REDIS
        value: "1"
      - key: CONFIRMSTORE_ENABLE
        value: "0"
      - key: USE_REDIS_IDEM
        value: "1"
      - key: SETEX_STRICT
        value: "1"
      - key: REDIS_CONNECT_TIMEOUT
        value: "5.0"
      - key: REDIS_SOCKET_TIMEOUT
        value: "5.0"
      - key: REDIS_POOL_MAX_CONNECTIONS
        value: "30"
      - key: REDIS_PING_RETRIES
        value: "2"
      - key: REDIS_PING_RETRY_BACKOFF_SEC
        value: "0.3"
      - key: REDIS_CLIENT_NAME
        value: "algogpt"
      - key: REDIS_SSL_NO_VERIFY
        value: "0"
      - key: REDIS_NAMESPACE
        value: "ops-supervisor-web"

      # ============== Exchange Defaults ==============
      - key: DEFAULT_MARKET
        value: "futures"
      - key: POSITION_MODE_OVERRIDE
        value: "oneway"
      - key: BINANCE_MARGIN_TYPE_DEFAULT
        value: "ISOLATED"
      - key: BINANCE_FUTURES_HTTP_BASE
        value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE
        value: "wss://fstream.binance.com"
      - key: BINANCE_SPOT_HTTP_BASE
        value: "https://api.binance.com"
      - key: BINANCE_TESTNET
        value: "false"
      - key: BINANCE_WORKING_TYPE
        value: "MARK_PRICE"
      - key: BINANCE_HTTP_TIMEOUT
        value: "10.0"
      - key: BINANCE_MAX_RETRIES
        value: "2"
      - key: BINANCE_RECV_WINDOW
        value: "45000"
      - key: LISTENKEY_KEEPALIVE_SEC
        value: "1800"
      - key: WS_KEEPALIVE_SEC
        value: "25"
      - key: USE_WS
        value: "1"
      - key: EXCHANGE_INFO_TTL_SEC
        value: "900"
      - key: USER_STREAM_ENABLE
        value: "1"

      # ============== Router Enablement (חשוב) ==============
      - key: ENABLE_AI_ROUTES
        value: "1"
      - key: PRICE_MONITOR_DISABLE
        value: "0"

      # ============== Scanner / Universe ==============
      - key: SCAN_SOURCE
        value: "binance-futures"
      - key: UNIVERSE_MODE
        value: "exchange"
      - key: SCAN_INTERVALS
        value: "5m,15m,1h,4h"
      - key: SCAN_MAX_SYMBOLS
        value: "150"
      - key: SCAN_MAX_LIMIT
        value: "0"
      - key: SCAN_CONCURRENCY
        value: "4"
      - key: TOP_SYMBOLS
        value: "150"
      - key: SUGGEST_FUTURES
        value: "1"
      - key: SUGGEST_INTERVAL_SEC
        value: "45"
      - key: SUGGEST_CAP_PER_CYCLE
        value: "30"

      # ============== Indicators / Gates ==============
      - key: INDICATOR_INTERVALS
        value: "15m,1h,4h,1d"
      - key: ENABLE_INDICATOR_EXIT
        value: "1"
      - key: ADX_MIN
        value: "20"
      - key: FEAT_DAILY_CAPS
        value: "0"
      - key: FEAT_DEBOUNCE_LIMIT
        value: "1"
      - key: FEAT_QUALITY_ENFORCE
        value: "0"
      - key: FEAT_SPREAD_DEPTH
        value: "1"
      - key: FEAT_TF_ALIGN
        value: "0"
      - key: FEAT_VOLUME_GATE
        value: "0"
      - key: FEAT_COOLDOWN
        value: "0"
      - key: MAX_ATR_PCT
        value: "3"

      # ============== Watchlist / Allowlist ==============
      - key: ALLOWLIST_MODE
        value: "off"
      - key: SYMBOLS_ALLOWLIST_PATH
        value: "config/symbols_allowlist.json"
      - key: WATCHLIST
        value: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,NEARUSDT"

      # ============== Scan CRON (Telegram) ==============
      - key: SCAN_CRON_ENABLE
        value: "1"
      - key: SCAN_CRON_EVERY_SEC
        value: "45"
      - key: SCAN_CRON_TIMEFRAME
        value: "15m"
      - key: SCAN_CRON_KLINES
        value: "200"
      - key: SCAN_CRON_LIMIT
        value: "12"
      - key: SCAN_CRON_MIN_SCORE
        value: "7"
      - key: SCAN_REARM_SCORE
        value: "6"
      - key: SCAN_DEDUPE_WINDOW_SEC
        value: "300"
      - key: SCAN_TTL_SEC
        value: "900"
      - key: SCAN_RICH
        value: "1"
      - key: DEFAULT_LEVERAGE
        value: "10"
      - key: DEFAULT_STAKE_USDT
        value: "50"

      # ============== Approvals / Telegram ==============
      - key: APPROVAL_ENABLED
        value: "1"
      - key: REQUIRE_TELEGRAM_APPROVAL
        value: "1"
      - key: APPROVAL_REQUIRE_WATCHLIST
        value: "0"
      - key: AUTO_OPEN_ON_APPROVE
        value: "1"
      - key: ADMIN_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_ADMIN_IDS
        value: "449087907"
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "1"
      - key: TELEGRAM_PARSE_MODE
        value: "HTML"
      - key: APPROVAL_PUBSUB_CHANNEL
        value: "ops:ticket:events"
      - key: APPROVAL_RR_MIN
        value: "1.25"
      - key: APPROVAL_SUCCESS_MIN
        value: "55"
      - key: APPROVAL_MAX_SL_PCT
        value: "3.0"
      - key: APPROVAL_REQUIRE_FRESH_PRICE
        value: "1"
      - key: APPROVAL_DUP_COOLDOWN_SEC
        value: "0"
      - key: APPROVE_BEFORE_GATE
        value: "1"
      - key: CONFIRM_TTL_SEC
        value: "120"
      - key: OPS_TICKET_TTL_SEC
        value: "1800"

      # ============== Trade & Orders ==============
      - key: EXECUTE_TRADES
        value: "1"
      - key: ALLOW_MARKET_ENTRY
        value: "1"
      - key: MANAGER_WRITES_ORDERS
        value: "1"
      - key: ORDERS_USE_OCO
        value: "1"
      - key: ORDER_ID_PREFIX
        value: "ALG"
      - key: ORDER_ID_INCLUDE_TS
        value: "1"
      - key: ORDER_BACKOFF_BASE_MS
        value: "120"
      - key: ORDER_BACKOFF_MAX_MS
        value: "1600"
      - key: ORDER_ROUND_TO_TICK
        value: "1"
      - key: ORD_VERIFY_TIMEOUT_MS
        value: "800"
      - key: ORD_CANCEL_STRATEGY
