services:
  - type: web
    name: algo-gpt-fastapi
    env: docker
    plan: starter
    autoDeploy: true

    # ✅ משתני סביבה מוזנים דרך Render UI בלבד – לא דרך קובץ .env
    envVars:
      - key: PORT
        value: "5000"
      # מומלץ להוסיף את כל הערכים כאן או ידנית דרך Render UI

    # ✅ בדיקת חיים של השרת
    healthCheckPath: /
    healthCheckIntervalSeconds: 60
    healthCheckTimeoutSeconds: 10
    healthCheckSuccessThreshold: 1
    healthCheckFailureThreshold: 3


























