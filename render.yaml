# FILE: render.yaml
services:
  # ── Web (Docker) ───────────────────────────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      # Server
      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: main:app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: UVICORN_LOG_LEVEL
        value: "info"
      - key: UVICORN_ACCESS_LOG
        value: "false"
      - key: PUBLIC_HOST
        value: "https://algogpt-docker.onrender.com"

      # DB on persistent disk
      - key: USE_DB
        value: "1"
      - key: DATABASE_URL
        value: "sqlite:////app/data/algogpt.db"

      # Scheduler on Web (כדי שלא תלוי ב-worker)
      - key: AI_SCHED_ENABLE
        value: "1"
      - key: AI_SCHED_INTERVAL_SEC
        value: "300"

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

  # ── Worker (Python) ────────────────────────────────────────
  - type: worker
    name: ops-supervisor-eu
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u utils/ops_supervisor.py"

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPS_POLICY_PATH
        value: "policies/ops_policy.yaml"
      # לא לשמור DB לוקאלי ב-Worker
      - key: USE_DB
        value: "0"
      # Scheduler רץ ב-Web
      - key: AI_SCHED_ENABLE
        value: "0"


















































