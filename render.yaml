        value: "algogpt"
      - key: APP_TITLE
        value: "AlgoGPT Service (production)"
      - key: ALGOGPT_VERSION
        value: "2.18.0"
      - key: INSTANCE_ID
        value: "algogpt-prod"
      - key: INSTANCE
        value: "algogpt-prod"
      - key: APP_INSTANCE
        value: "algogpt-prod"
      - key: SERVICE_INSTANCE
        value: "algogpt-prod"

      - key: MODE
        value: "hybrid"

      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: "main:app"
      - key: PYTHONPATH
        value: "/app"

      - key: ULTRATOP_MODE
        value: "mount"
      - key: ULTRATOP_PREFIX
        value: "/ultra"
      - key: ULTRATOP_STATIC_DIR
        value: "/app/static/ultra"

      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "180"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "45"
      - key: GUNICORN_KEEPALIVE
        value: "30"
      - key: GUNICORN_MAX_REQUESTS
