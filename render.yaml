services:
  - type: web
    name: algogpt-docker
    runtime: docker
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    healthCheckPath: /health

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: APP_MODULE
        value: main:app

      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: info

      - key: CORS_ALLOW_ORIGINS
        value: "*"

      - key: ALGOGPT_VERSION
        value: "2.17.0"

      - key: WATCHLIST
        value: "BTCUSDT,ETHUSDT,SOLUSDT"
      - key: INDICATOR_INTERVALS
        value: "15m,1h"

      - key: BINANCE_FUTURES_HTTP_BASE
        value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE
        value: "wss://fstream.binance.com"
      - key: BINANCE_WORKING_TYPE
        value: "MARK_PRICE"
      - key: BINANCE_TESTNET
        value: "false"

      - key: EXECUTE_TRADES
        value: "true"
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: "true"
      - key: ENABLE_AI_ROUTES
        value: "1"

      - key: WEBHOOK_HOST
        value: "https://algogpt-docker.onrender.com"

      - key: DATABASE_URL
        value: "sqlite:////app/data/algogpt.db"

      # סודות לקנפג רק בדשבורד של Render
      - key: API_BEARER_TOKEN
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1












































