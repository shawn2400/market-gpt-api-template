קיבלתי. יש כאן שני דברים עיקריים שתקעו אותך:

1. הפקודות שלך נשברו בבאש (ה-copy/paste הכניס שורות/סימנים שגרמו ל־`URL rejected: No host part`).
2. האישור כן עבד לפעמים, אבל “ניהול דינמי” לא הופעל אוטומטית כי חסרים דגלים — במיוחד `SMART_MANAGE_ON_APPROVE=1` ו(אופציונלית) `TRADE_MANAGER_ENABLE=1`.

להלן סט פקודות נקיות (ללא jq, ללא שמירת קבצים) + עדכון `services` שמבטיח שאחרי Approve תהיה פתיחה + ניהול דינמי אוטומטי.
פשוט הדבק כמו שזה (1:1).

---

# פקודות LIVE — נקי ולעניין

```bash
# ==== 0) משתנים בסיס (LIVE) ====
export HOST="https://algogpt-docker.onrender.com"
export TOKEN="rnd_XVyANQbo1mk8Q8nny3kTNDEzKoF7"
export TG_BOT="7197767713:AAFxnox7IyaIU35VuGNyt_TFLPKEdKs47jE"
export TG_SECRET="tghsec_87add65f9963a43d7879ac4e1f06a2846a5a260e9aa74c53a6893ce773dc0725"

# וידוא שאין בעיות quoting/ריקים:
printf 'HOST=%s\nTOKEN_len=%s\n' "$HOST" "${#TOKEN}"

# ==== 1) בדיקות בסיס ====
curl -sS "$HOST/readyz"
curl -sS "$HOST/meta/version"
curl -sS -I  "$HOST/openapi.json"

# ==== 2) חיבור טלגרם (Webhook) ====
curl -sS -X POST "https://api.telegram.org/bot$TG_BOT/setWebhook" \
  -d "url=$HOST/telegram/webhook" \
  -d "secret_token=$TG_SECRET" \
  -d "drop_pending_updates=true" \
  -d "max_connections=40"

# ==== 3) פתיחת כרטיס MARKET קטן (לעקוף gate ולמנוע מרג'ין נמוך) ====
TID="$(
  curl -sS -X POST "$HOST/ops/ticket" \
    -H "Authorization: Bearer $TOKEN" \
    -H "Content-Type: application/json" \
    --data-binary '{"symbol":"BTCUSDT","side":"BUY","qty":0.001,"leverage":10,"note":"[mode: MARKET] live auto-managed"}' \
  | sed -n 's/.*"ticket_id":"\([^"]*\)".*/\1/p'
)"; echo "TID=$TID"

# ==== 4) אישור הכרטיס ====
curl -sS "$HOST/ops/approve?ticket_id=$TID" -H "Authorization: Bearer $TOKEN"

# ==== 5) (אופציונלי) ניהול מיידי ידני לסמל ====
curl -sS -X POST "$HOST/manage-once" \
  -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  --data-binary '{"symbol":"BTCUSDT"}'

# ==== 6) (אופציונלי) Smoke-Guard לסמל — בלי jq/קבצים ====
curl -sS -X POST "$HOST/guard/smoke/run" \
  -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  --data-binary '"BTCUSDT"'

# ==== 7) (אופציונלי) Top-K + ETag (הדגמת Cache/304) ====
ETAG="$(curl -sSI "$HOST/scan/public-topk?k=3" | tr -d '\r' | sed -n 's/^ETag: *//p')"; echo "ETag=$ETAG"
curl -sS -i -H "If-None-Match: $ETAG" "$HOST/scan/public-topk?k=3"
```

> טיפים:
>
> * תמיד השתמש ב־`--data-binary` או `-d 'JSONחד-שורה'` כדי שלא ייכנסו שברי שורות.
> * אם תחזור שגיאת margin (-2019) — נסה `qty: 0.001` או `leverage` נמוך יותר.
> * אם תרצה לעבור ל־HYBRID (עם TP/SL/סולמות מהמודול) — תן `note: "[mode: HYBRID]"` ואפשר `TP_LADDER_ON_APPROVE=1` (כבר אצלך) + `SMART_MANAGE_ON_APPROVE=1` (מופיע בעדכון למטה).

