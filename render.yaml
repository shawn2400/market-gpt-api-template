services:
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    autoscale: false
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Runtime basics
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_HOST
        value: https://algogpt-docker.onrender.com

      # ===== Secrets להזין בדשבורד (לא ב-git) =====
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: ALERTS_INGEST_HMAC_SECRET
        sync: false

      # קבוע: מפתח HMAC הוא HEX
      - key: ALERTS_INGEST_HMAC_KEY_IS_HEX
        value: "1"

      # ===== Scanner caps & rate-limit =====
      - key: SCAN_MAX_SYMBOLS
        value: "120"
      - key: SCAN_MAX_LIMIT
        value: "0"
      - key: SCAN_RL_LIMIT
        value: "120"
      - key: SCAN_RL_WINDOW
        value: "60"
      - key: SCAN_CONCURRENCY
        value: "4"
      - key: TOP_SYMBOLS
        value: "100"

      # ===== Approvals policy =====
      - key: APPROVAL_REQUIRE_WATCHLIST
        value: "0"
































































