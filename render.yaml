### ✅ render.yaml (מתוקן ומוכן לפרודקשן) ###
services:
  - type: web
    name: algogpt-docker
    runtime: docker
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    # פקודת הפעלה אמיתית (מריץ את main:app)
    startCommand: >
      bash -lc 'bash /app/prestart.sh 2>/dev/null || true;
      gunicorn main:app \
      --workers ${WEB_CONCURRENCY:-1} \
      --bind 0.0.0.0:${PORT:-10000} \
      --timeout ${GUNICORN_TIMEOUT:-120} \
      --worker-class uvicorn.workers.UvicornWorker'

    envVars:
      - key: PORT
        value: "10000"
      - key: APP_MODULE
        value: main:app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: info

      # AlgoGPT Settings
      - key: ALGOGPT_VERSION
        value: "2.17.0"
      - key: ENABLE_AI_ROUTES
        value: "1"
      - key: EXECUTE_TRADES
        value: "true"
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: "true"

      # WebSocket / Watchlist
      - key: WATCHLIST
        value: "BTCUSDT,ETHUSDT,SOLUSDT"
      - key: INDICATOR_INTERVALS
        value: "15m,1h"

      # Binance
      - key: BINANCE_WORKING_TYPE
        value: "MARK_PRICE"
      - key: BINANCE_TESTNET
        value: "false"
      - key: BINANCE_FUTURES_HTTP_BASE
        value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE
        value: "wss://fstream.binance.com"

      # Telegram
      - key: WEBHOOK_HOST
        value: "https://algogpt-docker.onrender.com"

      # CORS
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: CORS_ALLOW_CREDENTIALS
        value: "0"

      # DB / Redis / Keys (מוזנים רק בדשבורד)
      - key: DATABASE_URL
        value: "sqlite:////app/data/algogpt.db"
      - key: API_BEARER_TOKEN
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1












































