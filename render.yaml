      - key: SL_MONOTONIC
        value: "1"
      - key: PERCENT_GUARD_ENABLE
        value: "1"
      - key: PERCENT_PRICE_GUARD_BPS
        value: "100"
      - key: ENTRY_BAND_BPS
        value: "10"
      - key: ENTRY_GAP_MAX_PCT
