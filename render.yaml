# FILE: render.yaml
services:
  - type: worker
    name: ops-supervisor
    env: python
    region: oregon         # אם תרצה להעביר לפרנקפורט: frankfurt (יצירת שירות חדש)
    plan: free             # אם Render לא מאפשר Free ל-worker -> שנה ל-starter
    buildCommand: pip install -r requirements-worker.txt
    startCommand: python -u utils/ops_supervisor.py
    envVars:
      - key: OPS_POLICY_PATH
        value: policies/ops_policy.yaml
      - key: USE_DB
        value: "0"         # ל-worker אין דיסק DB
      - key: AI_SCHED_ENABLE
        value: "0"         # הסקד׳ולר רץ אצלך ב-Web
      # שים לב: לא שמים סודות כאן. הוסף אותם ידנית ב-Dashboard אחרי יצירה:
      # PUBLIC_HOST, API_BEARER_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, (REDIS_URL אם צריך)






















































