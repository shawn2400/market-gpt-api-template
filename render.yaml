services:
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    autoscale: false
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    envVars:
      # --- Runtime ---
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: "INFO"

      # --- Base URL ---
      - key: PUBLIC_HOST
        value: https://algogpt-docker.onrender.com

      # --- Secrets (נשארים בדשבורד בלבד) ---
      - key: API_BEARER_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ALERTS_INGEST_HMAC_SECRET
        sync: false
      - key: ALERTS_INGEST_HMAC_KEY_IS_HEX
        value: "1"

      # --- Public/Readonly ---
      - key: ENABLE_READONLY_HTTP
        value: "1"
      - key: READONLY_ENDPOINTS
        value: summary,prices_top,news_cache,health

      # --- Market / Exchange defaults ---
      - key: DEFAULT_MARKET
        value: futures
      - key: POSITION_MODE_OVERRIDE
        value: oneway
      - key: BINANCE_MARGIN_TYPE_DEFAULT
        value: ISOLATED
      - key: BINANCE_WORKING_TYPE
        value: MARK_PRICE
      - key: BINANCE_FUTURES_HTTP_BASE
        value: https://fapi.binance.com
      - key: BINANCE_FUTURES_WS_BASE
        value: wss://fstream.binance.com
      - key: BINANCE_SPOT_HTTP_BASE
        value: https://api.binance.com
      - key: BINANCE_TESTNET
        value: "false"

      # --- Scanner / Universe ---
      - key: SCAN_SOURCE
        value: binance-futures
      - key: UNIVERSE_MODE
        value: exchange
      - key: SCAN_INTERVALS
        value: 5m,15m,1h,4h

      # --- Indicator context (לא סריקה תכופה) ---
      - key: INDICATOR_INTERVALS
        value: 15m,1h,4h,1d

      # --- Allowlist / Watchlist ---
      - key: ALLOWLIST_MODE
        value: off
      - key: SYMBOLS_ALLOWLIST_PATH
        value: config/symbols_allowlist.json
      - key: WATCHLIST
        value: BTCUSDT,ETHUSDT,SOLUSDT

      # --- Scanner caps & RL (Render) ---
      - key: SCAN_MAX_SYMBOLS
        value: "120"
      - key: SCAN_MAX_LIMIT
        value: "0"
      - key: SCAN_CONCURRENCY
        value: "4"
      - key: TOP_SYMBOLS
        value: "100"
      - key: SCAN_RL_LIMIT
        value: "120"
      - key: SCAN_RL_WINDOW
        value: "60"

      # --- Rate Limit backend ---
      - key: RATE_LIMIT_ENABLE
        value: "1"
      - key: RL_FAIL_OPEN
        value: "0"
      - key: RATE_LIMIT_BACKEND
        value: redis

      # --- Approvals / Telegram routing ---
      - key: APPROVAL_ENABLED
        value: "1"
      - key: REQUIRE_TELEGRAM_APPROVAL
        value: "1"
      - key: APPROVAL_REQUIRE_WATCHLIST
        value: "0"
      - key: AUTO_OPEN_ON_APPROVE
        value: "1"
      - key: ADMIN_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_ADMIN_IDS
        value: "449087907"
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "1"
      - key: TELEGRAM_PARSE_MODE
        value: HTML

      # --- Trade & Orders (TPSL/Trailing/Manager) ---
      - key: EXECUTE_TRADES
        value: "1"
      - key: ALLOW_MARKET_ENTRY
        value: "1"
      - key: AUTO_QTY_ENABLE
        value: "1"
      - key: AUTO_QTY_BUDGET_USDT
        value: "30"
      - key: NATIVE_TPSL_ENABLE
        value: "1"
      - key: ORDERS_USE_OCO
        value: "1"
      - key: MANAGER_WRITES_ORDERS
        value: "1"
      - key: TRAIL_ENABLE
        value: "1"
      - key: TRAIL_ATR_MULT
        value: "1.5"
      - key: TP_LADDER_ON_APPROVE
        value: "1"
      - key: LADDER_TP_ENABLE
        value: "1"
      - key: LADDER_TP_DEFAULT_PCTS
        value: 1.8,3.2,5.5
      - key: LADDER_TP_DEFAULT_SPLITS
        value: 0.4,0.35,0.25
      - key: LADDER_SL_ENABLE
        value: "1"
      - key: LADDER_SL_DEFAULT_PCTS
        value: "1.2"
      - key: TP_BE_ONLY_AFTER_TP1
        value: "1"
      - key: STREAM_TP_BE
        value: "1"

      # --- Notifications / Reports ---
      - key: NOTIFY_OPEN
        value: "true"
      - key: NOTIFY_APPROVED
        value: "true"
      - key: NOTIFY_FILLED
        value: "true"
      - key: NOTIFY_TP_HIT
        value: "true"
      - key: NOTIFY_SL_HIT
        value: "true"
      - key: NOTIFY_TRAIL_MOVE
        value: "true"
      - key: NOTIFY_BREAKEVEN
        value: "true"
      - key: NOTIFY_PARTIAL_CLOSE
        value: "true"
      - key: NOTIFY_FINAL_REPORT
        value: "true"
      - key: FINAL_REPORT_TELEGRAM
        value: "true"
      - key: PNL_TRACKING
        value: "true"
      - key: METRICS_ENABLE
        value: "true"

      # --- Manager / Scheduler ---
      - key: MANAGER_ENABLE
        value: "1"
      - key: MANAGER_INTERVAL_SEC
        value: "10"
      - key: TRADE_MANAGER_ENABLE
        value: "1"
      - key: TRADE_MANAGER_INTERVAL_SEC
        value: "20"
      - key: AI_SCHED_ENABLE
        value: "1"
      - key: AI_SCHED_INTERVAL_SEC
        value: "300"

      # --- Gates & Quality ---
      - key: FEAT_QUALITY_ENFORCE
        value: "1"
      - key: MIN_QUALITY_SCORE
        value: "5"
      - key: APPROVAL_RR_MIN
        value: "1.25"
      - key: MIN_TP_SL_DIFF_PCT
        value: "3.0"
      - key: SUCCESS_WARN_PCT
        value: "60"

      # --- Alerts (public URLs, לא סודות) ---
      - key: ALERTS_ACTIVE_URL
        value: https://algogpt-docker.onrender.com/alerts/trades/active
      - key: ALERTS_ANALYSIS_URL
        value: https://algogpt-docker.onrender.com/alerts/analysis
      - key: ALERTS_INGEST_URL
        value: https://algogpt-docker.onrender.com/alerts/ingest
      - key: ALERTS_UPDATE_URL
        value: https://algogpt-docker.onrender.com/alerts/trades/update

      # --- Digest Job (חדשים) ---
      - key: OPS_DIGEST_ENABLE
        value: "1"
      - key: OPS_DIGEST_INTERVAL_HOURS
        value: "3"
      - key: OPS_DIGEST_BACKOFF_ON_ERROR_SEC
        value: "15"
      - key: OPS_DIGEST_RUN_IMMEDIATE
        value: "0"
      - key: OPS_DIGEST_LOOKBACK_HOURS
        value: "3"

      # --- OpenAPI (כדי לראות ops-digest ב-/docs אם רוצים) ---
      - key: OPENAPI_INCLUDE_TAGS
        value: "Status,Public Feed,Price,manager,ops-ui,ops-approval,ops-flags,position-ops,ops-digest"





































































