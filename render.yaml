services:
  - type: web
    name: algogpt-docker
    env: docker
    plan: starter
    autoDeploy: false
    pullRequestPreviewsEnabled: false
    healthCheckPath: /

    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:10000 main:app

    envVars:
      - key: PORT
        value: "10000"
      - key: WORKERS
        value: "1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: ALGOGPT_VERSION
        value: "2.14.3"
      # ... (שאר המשתנים שלך כמו שהיו) ...

    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1





































