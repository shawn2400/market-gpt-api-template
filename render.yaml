services:
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    envVars:
      # --- Runtime ---
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: "INFO"

      # --- Base URL ---
      - key: PUBLIC_HOST
        value: https://algogpt-docker.onrender.com

      # --- Auth / Secrets (להזין בדשבורד) ---
      - key: API_KEY
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ALERTS_INGEST_HMAC_SECRET
        sync: false

      # === SAFETY MUST-HAVE (נוסף/מעודכן) ===
      - key: GUARD_ENSURE_SL
        value: "1"
      - key: GUARD_SL_GRACE_SEC
        value: "2"
      - key: STRICT_MODE_SINGLE
        value: "1"
      # מוד יחיד: Quantities (אל תערבב Native)
      - key: USE_NATIVE_TP_SL
        value: "0"
      - key: ALLOW_REVERSE_TRADES
        value: "0"
      - key: REVERSE_COOLDOWN_SEC
        value: "120"
      - key: ORD_ATOMIC_UPDATE
        value: "1"
      - key: ORD_VERIFY_TIMEOUT_MS
        value: "800"
      - key: ORD_CANCEL_STRATEGY
        value: MINIMAL
      - key: ENFORCE_QTY_BOUNDS
        value: "1"
      - key: STOP_WORKING_TYPE
        value: MARK_PRICE
      - key: HEALTH_TP_GRACE_SEC
        value: "8"

      # אופציונלי אבל מומלץ לייצוב:
      - key: TP_BE_ONLY_AFTER_TP1
        value: "1"
      - key: SMART_MANAGE_AFTER_TP1
        value: "1"
      - key: TRAIL_MIN_PROFIT_PCT
        value: "0.7"
      - key: BINANCE_WORKING_TYPE
        value: MARK_PRICE
      - key: USE_EXCHANGE_FILTERS
        value: "1"
      - key: ORDER_ROUND_TO_TICK
        value: "1"

      # --- SL/Trail tuning שנוספו ---
      - key: SL_MONOTONIC
        value: "1"
      - key: LADDER_SL_DEFAULT_PCTS
        value: "1.2"
      - key: BE_BUFFER_USDT
        value: "0.03"
      - key: ATR_UPDATE_COOLDOWN_SEC
        value: "20"
      - key: ATR_MIN_DELTA
        value: "0.02"

      # --- יציבות/רטריי שנוספו ---
      - key: COALESCE_WINDOW_MS
        value: "1500"
      - key: RETRY_MAX
        value: "3"
      - key: RETRY_BASE_MS
        value: "500"
      - key: RETRY_JITTER
        value: "1"
      - key: REST_COOLDOWN_SEC
        value: "6"

      # --- Redis client ---
      - key: REDIS_CONNECT_TIMEOUT
        value: "5.0"
      - key: REDIS_SOCKET_TIMEOUT
        value: "5.0"
      - key: REDIS_POOL_MAX_CONNECTIONS
        value: "30"
      - key: REDIS_PING_RETRIES
        value: "2"
      - key: REDIS_PING_RETRY_BACKOFF_SEC
        value: "0.3"
      - key: REDIS_CLIENT_NAME
        value: algogpt
      - key: REDIS_SSL_NO_VERIFY
        value: "0"

      # --- Public/Readonly ---
      - key: ENABLE_READONLY_HTTP
        value: "1"
      - key: READONLY_ENDPOINTS
        value: summary,prices_top,news_cache,health

      # --- Rate Limit backend ---
      - key: RATE_LIMIT_ENABLE
        value: "1"
      - key: RL_FAIL_OPEN
        value: "0"
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: USE_REDIS_IDEM
        value: "1"

      # --- Market / Exchange defaults ---
      - key: DEFAULT_MARKET
        value: futures
      - key: POSITION_MODE_OVERRIDE
        value: oneway
      - key: BINANCE_MARGIN_TYPE_DEFAULT
        value: ISOLATED
      - key: BINANCE_FUTURES_HTTP_BASE
        value: https://fapi.binance.com
      - key: BINANCE_FUTURES_WS_BASE
        value: wss://fstream.binance.com
      - key: BINANCE_SPOT_HTTP_BASE
        value: https://api.binance.com
      - key: BINANCE_TESTNET
        value: "false"

      # --- Scanner / Universe ---
      - key: SCAN_SOURCE
        value: binance-futures
      - key: UNIVERSE_MODE
        value: exchange
      - key: SCAN_INTERVALS
        value: 5m,15m,1h,4h

      # --- Indicator context ---
      - key: INDICATOR_INTERVALS
        value: 15m,1h,4h,1d

      # --- Allowlist / Watchlist ---
      - key: ALLOWLIST_MODE
        value: off
      - key: SYMBOLS_ALLOWLIST_PATH
        value: config/symbols_allowlist.json
      - key: WATCHLIST
        value: BTCUSDT,ETHUSDT,SOLUSDT

      # --- Scanner caps & RL ---
      - key: SCAN_MAX_SYMBOLS
        value: "150"
      - key: SCAN_MAX_LIMIT
        value: "0"
      - key: SCAN_CONCURRENCY
        value: "4"
      - key: TOP_SYMBOLS
        value: "150"
      - key: SCAN_RL_LIMIT
        value: "120"
      - key: SCAN_RL_WINDOW
        value: "60"

      # --- Approvals / Telegram routing ---
      - key: APPROVAL_ENABLED
        value: "1"
      - key: REQUIRE_TELEGRAM_APPROVAL
        value: "1"
      - key: APPROVAL_REQUIRE_WATCHLIST
        value: "0"
      - key: AUTO_OPEN_ON_APPROVE
        value: "1"
      - key: ADMIN_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_ADMIN_IDS
        value: "449087907"
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "1"
      - key: TELEGRAM_PARSE_MODE
        value: HTML

      # --- Trade & Orders ---
      - key: EXECUTE_TRADES
        value: "1"
      - key: ALLOW_MARKET_ENTRY
        value: "1"

      # >>> Auto-Qty (חדש/מתוקנן)
      - key: AUTO_QTY_ENABLE
        value: "1"
      - key: AUTO_QTY_BUDGET_USDT
        value: "30"
      - key: AUTO_QTY_LEVERAGE_DEFAULT
        value: "7"
      - key: AUTO_QTY_MARGIN_BUFFER_PCT
        value: "0.35"

      # ⚠ חשוב: Quantities בלבד – לא להשתמש ב-Native TP/SL
      - key: NATIVE_TPSL_ENABLE
        value: "0"

      - key: ORDERS_USE_OCO
        value: "1"
      - key: MANAGER_WRITES_ORDERS
        value: "1"
      - key: TRAIL_ENABLE
        value: "1"
      - key: TRAIL_ATR_MULT
        value: "1.5"
      - key: TP_LADDER_ON_APPROVE
        value: "1"
      - key: LADDER_TP_ENABLE
        value: "1"
      - key: LADDER_TP_DEFAULT_PCTS
        value: 1.8,3.2,5.5
      - key: LADDER_TP_DEFAULT_SPLITS
        value: 0.4,0.35,0.25
      - key: LADDER_SL_ENABLE
        value: "1"
      - key: LADDER_SL_DEFAULT_PCTS
        value: "1.2"
      - key: STREAM_TP_BE
        value: "1"

      # --- Smart-Manage ---
      - key: SMART_MANAGE_ON_APPROVE
        value: "1"
      - key: SMART_MANAGE_PCTS
        value: 1.8,3.2,5.5
      - key: SMART_MANAGE_SPLITS
        value: 0.4,0.35,0.25
      - key: SMART_MANAGE_BE_OFFSET_BPS
        value: "8"
      - key: SMART_MANAGE_TRAIL_ATR_MULT
        value: "1.5"

      # --- Hardening ---
      - key: HYBRID_HARD_CANCEL_ENABLE
        value: "1"
      - key: HYBRID_CANCEL_CONFIRM_TRIES
        value: "4"
      - key: HYBRID_CANCEL_CONFIRM_SLEEP_MS
        value: "200"
      - key: ARM_VERIFY_DISABLE
        value: "0"

      # --- Health TP1 ---
      - key: HEALTH_TP1_ENABLE
        value: "1"
      - key: HEALTH_TP1_INTERVAL_SEC
        value: "1200"
      - key: TP1_TAGS
        value: TP1,tp1,tp_1,TAKE_PROFIT_1
      - key: HEALTH_TP1_ONLY_WITH_POSITION
        value: "1"

      # --- Notifications / Reports ---
      - key: NOTIFY_OPEN
        value: "true"
      - key: NOTIFY_APPROVED
        value: "true"
      - key: NOTIFY_FILLED
        value: "true"
      - key: NOTIFY_TP_HIT
        value: "true"
      - key: NOTIFY_SL_HIT
        value: "true"
      - key: NOTIFY_TRAIL_MOVE
        value: "true"
      - key: NOTIFY_BREAKEVEN
        value: "true"
      - key: NOTIFY_PARTIAL_CLOSE
        value: "true"
      - key: NOTIFY_FINAL_REPORT
        value: "true"
      - key: FINAL_REPORT_TELEGRAM
        value: "true"
      - key: PNL_TRACKING
        value: "true"
      - key: METRICS_ENABLE
        value: "true"

      # --- Manager / Scheduler ---
      - key: MANAGER_ENABLE
        value: "1"
      - key: MANAGER_INTERVAL_SEC
        value: "10"
      - key: TRADE_MANAGER_ENABLE
        value: "1"
      - key: TRADE_MANAGER_INTERVAL_SEC
        value: "20"
      - key: AI_SCHED_ENABLE
        value: "1"
      - key: AI_SCHED_INTERVAL_SEC
        value: "300"

      # --- Digest Job ---
      - key: OPS_DIGEST_ENABLE
        value: "1"
      - key: OPS_DIGEST_INTERVAL_HOURS
        value: "3"
      - key: OPS_DIGEST_BACKOFF_ON_ERROR_SEC
        value: "15"
      - key: OPS_DIGEST_RUN_IMMEDIATE
        value: "0"
      - key: OPS_DIGEST_LOOKBACK_HOURS
        value: "3"

      # --- OpenAPI include (רשות) ---
      - key: OPENAPI_INCLUDE_TAGS
        value: "Status,Public Feed,Price,manager,ops-ui,ops-approval,ops-flags,position-ops,ops-digest"

      # --- Alerts endpoints ---
      - key: ALERTS_INGEST_URL
        value: https://algogpt-docker.onrender.com/alerts/ingest
      - key: ALERTS_ANALYSIS_URL
        value: https://algogpt-docker.onrender.com/alerts/ingest

      # --- Security public paths (כולל החדשים) ---
      - key: SECURITY_PUBLIC_PATHS
        value: /ops/approve-link,/ops/approve,/ops/reject,/ops/approve/signed,/telegram/ping,/trade/approve,/trade/reject,/ops/manager/health,/ops/ui,/ops/ui/ticket,/ops/ui/orders,/ui/dashboard,/health,/health/tp1,/scan/top-volume,/topk

      # --- Misc חדשים שביקשת ---
      - key: TP_MAX_LADDERS
        value: "3"
      - key: ENABLE_INDICATOR_EXIT
        value: "1"
      - key: ADX_MIN
        value: "18"
      - key: NO_PROGRESS_TIMEOUT_MIN
        value: "30"
      - key: DAILY_LOSS_CAP_USDT
        value: "150"
      - key: KILL_ON_CAP
        value: "1"
      - key: PRICE_PROTECT
        value: "1"
      - key: USE_WS
        value: "1"





























































