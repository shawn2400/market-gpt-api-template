services:
  - type: web
    name: algogpt-docker
    runtime: docker
    # כאן תשנה ל־pro/pro plus/pro max בהתאם למנוי
    plan: pro  
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    healthCheckPath: /health

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      # Render מזריק PORT אוטומטית; Dockerfile שלנו מקבע ל־10000
      - key: PORT
        value: "10000"

      # Workers דינמיים — 0 = auto לפי CPU (2*CPU+1)
      # Starter (1 CPU) → 3 workers
      # Pro Plus (4 CPU) → 9 workers
      # Pro Max (4 CPU / 16GB) → עדיין 9 workers
      # Pro Ultra (8 CPU / 32GB) → 17 workers
      - key: WORKERS
        value: "0"

      # לוגים
      - key: LOG_LEVEL
        value: "INFO"

      # CORS — בפרודקשן כדאי לשים whitelist של דומיינים מורשים
      - key: CORS_ALLOW_ORIGINS
        value: "*"

      # גרסת האפליקציה
      - key: ALGOGPT_VERSION
        value: "2.14.6"

      # WS / Price Monitor flags
      - key: WS_UPDATE_INTERVAL
        value: "15"
      - key: PRICE_MONITOR_INTERVAL
        value: "30"
      - key: PRICE_WS_FRESH_TTL
        value: "20"
      - key: PRICE_MONITOR_DISABLE
        value: "0"

      # 🔑 מפתחות רגישים — להגדיר ב־Dashboard כ "Synced"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_BEARER_TOKEN
        sync: false

      # Redis (בפרודקשן אמיתי רצוי לשים Redis חיצוני, לא dummy)
      - key: REDIS_URL
        value: "redis://localhost:6379"

    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1










































