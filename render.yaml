        value: "1"
      - key: PROTECT_DIGEST_ROUTES
        value: "1"
      - key: PROTECT_DEBUG_ROUTES
        value: "1"
      - key: ENABLE_HSTS
        value: "1"
      - key: TRUST_PROXY
        value: "1"

      - key: SECURITY_PUBLIC_PATHS
