# FILE: render.yaml
services:
  # ── Web (קיים) ─ ניהול בלי שינוי ─────────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # אין כאן envVars ואין disk כדי לא לייצר "Update" ל־web

  # ── Worker (Python, Free, Oregon) ─────────────────────────
  - type: worker
    name: ops-supervisor
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-worker.txt
    startCommand: python -u utils/ops_supervisor.py
    # גם כאן לא שמים סודות בקובץ. נוסיף אותם בדשבורד אחרי היצירה.






















































