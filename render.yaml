services:
  - type: web
    name: algogpt-api
    env: python
    region: frankfurt
    plan: free
    runtime: python
    pythonVersion: 3.10.13
    buildCommand: |
      apt-get update && \
      apt-get install -y build-essential g++ python3-dev libatlas-base-dev && \
      pip install --upgrade pip && \
      pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:10000
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRYPTO_PANIC_API_KEY
        sync: false
    autoDeploy: true











