services:
  - type: web
    name: algogpt-docker
    runtime: docker
    plan: starter
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    healthCheckPath: /health

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      # Render מזריק PORT אוטומטית; השארתי להדגשה/עקביות
      - key: PORT
        value: "10000"

      - key: WORKERS
        value: "2"

      - key: LOG_LEVEL
        value: "INFO"

      - key: CORS_ALLOW_ORIGINS
        value: "*"

      - key: ALGOGPT_VERSION
        value: "2.14.6"

      # דגלים של Price Monitor / WS
      - key: WS_UPDATE_INTERVAL
        value: "15"
      - key: PRICE_MONITOR_INTERVAL
        value: "30"
      - key: PRICE_WS_FRESH_TTL
        value: "20"
      - key: PRICE_MONITOR_DISABLE
        value: "0"

      # 🔑 מפתחות רגישים — להגדיר ב־Dashboard כ "Synced"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_BEARER_TOKEN
        sync: false

    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1







































