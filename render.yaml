services:
  - type: web
    name: market-gpt-api-template
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --timeout 90
    envVars:
      - key: PYTHON_VERSION
        value: 3.10         # חובה! Prophet לא תומכת ב־3.13
    autoDeploy: true
