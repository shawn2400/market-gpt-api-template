# AlgoGPT - Full Auto-Trading (No Approval, Production Mode)
services:
  - type: pserv
    name: algogpt-trading-vm
    env: docker
    region: frankfurt
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:

      # -----------------------------
      # Core
      # -----------------------------
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: TZ
        value: Asia/Jerusalem

      # -----------------------------
      # API Keys
      # -----------------------------
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

      # -----------------------------
      # Redis / Database
      # -----------------------------
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # ======================================================
      # 🔥 Trading Engine – Full Automatic Mode
      # ======================================================

      # Autopilot ON
      - key: ENABLE_AUTO_TRADING
        value: 1
      - key: AUTO_RUN
        value: 1

      # No Telegram Approval
      - key: ENABLE_TELEGRAM_APPROVAL
        value: 0
      - key: APPROVAL_MODE
        value: none
      - key: CONFIRM_STORE_ENABLE
        value: 0

      # Auto-Management
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: 1
      - key: ENABLE_POSITION_MONITOR
        value: 1
      - key: ENABLE_AUTO_PROTECT
        value: 1
      - key: ENABLE_INSURANCE_MONITOR
        value: 1

      # Quality Score (Dynamic)
      - key: MIN_QUALITY_SCORE
        value: 5.5
      - key: QUALITY_DYN_ENABLED
        value: 1

      # Budget Settings
      - key: MIN_BUDGET_USD
        value: 25
      - key: MAX_BUDGET_USD
        value: 150
      - key: BUDGET_PCT_OF_EQUITY
        value: 20.0

      # Websocket
      - key: USER_STREAM_ENABLE
        value: 1
      - key: STREAM_TP_BE
        value: true
      - key: USER_STREAM_RECONNECT
        value: 1
      - key: WEBSOCKET_BUFFER
        value: 200

      # Smart SL/TP
      - key: TP_MODE
        value: hybrid
      - key: SL_MODE
        value: atr
      - key: ATR_MULTIPLIER
        value: 1.4
      - key: TRAILING_SL_ENABLE
        value: 1
      - key: BREAKEVEN_ENABLE
        value: 1
      - key: DYNAMIC_TP_ENABLE
        value: 1

      # Safety
      - key: CIRCUIT_BREAKER_ENABLE
        value: 1

      # Fallback symbols
      - key: FALLBACK_SYMBOLS
        value: "BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT"

      # Intervals
      - key: HEALTH_CHECK_INTERVAL
        value: 60
      - key: POSITION_REPORT_INTERVAL_SEC
        value: 600
      - key: AUTO_PROTECT_INTERVAL_SEC
        value: 15
      - key: FILLS_WATCH_INTERVAL_SEC
        value: 20
      - key: INSURANCE_CHECK_INTERVAL_SEC
        value: 120
      - key: FILLS_WATCH_ENABLE
        value: 1

      # -----------------------------
      # 🔒 Emergency Control
      # -----------------------------
      - key: EMERGENCY_KILL_SWITCH
        value: 0

      # -----------------------------
      # 🟦 Safe-Boot Mode (Enabled)
      # -----------------------------
      - key: SAFE_BOOT_MODE
        value: 1
      - key: SAFE_BOOT_STAGGER_DELAY
        value: 5

      # ======================================================
      # 🛡 Auto-Health Monitor (Enabled)
      # ======================================================
      - key: AUTO_HEALTH_MONITOR
        value: 1
      - key: AUTO_HEALTH_INTERVAL
        value: 60
      - key: AUTO_HEALTH_ALERTS
        value: 1
      - key: AUTO_HEALTH_VERBOSE
        value: 0

      # ======================================================
      # 🛠 Auto-Repair / Self-Healing (Disabled – has bugs)
      # ======================================================
      - key: AUTO_REPAIR_ENABLE
        value: 0
      - key: SELF_HEALING_ENABLE
        value: 0

      # ======================================================
      # BAN Shield
      # ======================================================
      - key: BAN_SHIELD_ENABLE
        value: 1
      - key: BAN_SHIELD_MAX_RPM
        value: 24
      - key: BAN_SHIELD_GREEN_ZONE
        value: 18
      - key: BAN_SHIELD_YELLOW_ZONE
        value: 22
      - key: BAN_SHIELD_RED_ZONE
        value: 24
      - key: BAN_SHIELD_MONITOR_ENABLE
        value: 1
      - key: SHIELD_MONITOR_INTERVAL
        value: 10
      - key: SHIELD_ALERT_COOLDOWN
        value: 300



