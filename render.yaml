# FILE: render.yaml
services:
  # ─────────────────────────────────────────────
  # Web ראשי (קיים) — לא נוגעים בו
  # ─────────────────────────────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false

  # ─────────────────────────────────────────────
  # Worker: ops-supervisor (Python)
  # ─────────────────────────────────────────────
  - type: worker
    name: ops-supervisor
    env: python
    region: oregon
    plan: starter
    pythonVersion: 3.11
    buildCommand: pip install -r requirements-worker.txt
    preDeployCommand: chmod +x ./ops/launch_with_env.sh || true
    # מריץ watchdog ברקע ואז את ה-supervisor עם env טעון
    startCommand: bash -lc './ops/watchdog.sh & exec ./ops/launch_with_env.sh python -u -m utils.ops_supervisor'

    envVars:
      # ---- Auto-approve (Runtime) ----
      - key: OPS_POLICY_PATH
        value: policies/ops_policy.yaml
      - key: OPS_REQUIRE_ACTION_PARAM
        value: "0"
      - key: APPROVAL_AUTO_APPROVE_MAX_CRS
        value: "6"          # הועלה ל-6 כדי לאפשר auto-heal רחב יותר
      - key: APPROVAL_AUTO_APPROVE_SENSITIVE
        value: "0"

      # ---- כללי/נוחות ----
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_NAMESPACE
        value: ops-supervisor-web
      - key: PUBLIC_HOST
        value: https://ops-approval-web.onrender.com

      # ---- Watchdog / HA ----
      - key: PRIMARY_PUBLIC_HOST         # חייב להצביע לשירות הראשי עם /healthz תקין
        value: https://algogpt-docker.onrender.com
      - key: WATCHDOG_INTERVAL_SEC
        value: "60"
      - key: WATCHDOG_DEBOUNCE
        value: "2"
      - key: WATCHDOG_LOGS
        value: /opt/render/project/src/logs/app.log
      - key: RENDER_DEPLOY_HOOK_URL      # להגדיר בדשבורד (סוד) כדי לאפשר redeploy אוטומטי
        sync: false

      # ---- סיקרטים/אינטגרציות (להגדיר בדשבורד; לא בקובץ) ----
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        sync: false

      # ---- טלגרם (אופציונלי; לשמור תאימות להגדרות שלך) ----
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "1"
      - key: TELEGRAM_ADMIN_ONLY
        value: "1"
      - key: TELEGRAM_ADMIN_IDS
        value: "449087907,123456789"
      - key: TELEGRAM_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false


























































