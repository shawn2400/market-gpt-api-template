      - key: STOP_BAND_BPS
        value: "12"
      - key: TP_BE_ONLY_AFTER_TP1
        value: "1"
      - key: STREAM_TP_BE
        value: "1"
      - key: LADDER_TP_ENABLE
        value: "1"
      - key: LADDER_TP_DEFAULT_PCTS
        value: "1.8,3.2,5.5"
      - key: LADDER_TP_DEFAULT_SPLITS
        value: "0.4,0.35,0.25"
      - key: LADDER_SL_ENABLE
        value: "1"
      - key: LADDER_SL_DEFAULT_PCTS
        value: "1.2"
      - key: TP_LADDER_ON_APPROVE
        value: "1"
      - key: TP_MAX_LADDERS
        value: "3"
      - key: TRAIL_ENABLE
        value: "1"
      - key: TRAIL_ATR_MULT
        value: "1.5"
      - key: ATR_UPDATE_COOLDOWN_SEC
        value: "20"
      - key: ATR_MIN_DELTA
        value: "0.02"
      - key: BE_ARM_PCT
        value: "1.6"
      - key: BE_GUARD_ENABLE
        value: "1"
      - key: BE_GUARD_EVERY_SEC
        value: "30"
      - key: TP_BE_OFFSET_BPS
        value: "8"

      # ============== Auto-Tune (דינמי: סף ציון / ADX) ==============
      - key: AUTO_TUNE_ENABLE
        value: "1"
      - key: AUTO_MIN_SCORE_BASE
        value: "7.0"
      - key: AUTO_MIN_SCORE_RANGE
        value: "6.0,7.5"
      - key: AUTO_ADX_MIN_BASE
        value: "20"
      - key: AUTO_ADX_RANGE
        value: "18,25"
      - key: TARGET_TRADES_PER_DAY_MIN
        value: "4"
      - key: TARGET_TRADES_PER_DAY_MAX
        value: "10"
      - key: AUTO_TUNE_LOOKBACK_MIN
        value: "180"
      - key: AUTO_BACKOFF_SEC
        value: "900"

      # ============== Auto-Tune TP/SL (ATR + ADX) ==============
      - key: AUTO_TP_ENABLE
        value: "1"
      - key: SL_ATR_MULT_BASE
        value: "1.10"
      - key: TP1_ATR_MULT_BASE
        value: "1.20"
      - key: TP2_ATR_MULT_BASE
        value: "2.20"
      - key: TP3_ATR_MULT_BASE
        value: "3.50"
      - key: ADX_TP_BOOST_THRESH
