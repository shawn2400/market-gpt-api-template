      - key: TRAIL_RT_MAX_SYMBOLS
        value: "30"
      - key: TRAIL_RT_ADJUST_THRESHOLD
        value: "0.2"
      - key: TRAIL_RT_WATCHLIST
        value: ""

      # ========================= Health / Digest =========================
      - key: HEALTH_PRICE_MAX_AGE
        value: "30"
      - key: HEALTH_TP_GRACE_SEC
        value: "8"
      - key: HEALTH_TP1_ENABLE
        value: "0"
      - key: HEALTH_TP1_INTERVAL_SEC
        value: "1200"
      - key: HEALTH_TP1_ONLY_WITH_POSITION
        value: "1"
      - key: TP1_TAGS
        value: "TP1,tp1,tp_1,TAKE_PROFIT_1"
      - key: OPS_DIGEST_INTERVAL_HOURS
        value: "3"
      - key: OPS_HEARTBEAT_ENABLE
        value: "1"
      - key: OPS_HEARTBEAT_EVERY_MIN
        value: "5"
      - key: HEARTBEAT_HOURS
        value: "2"
      - key: HEARTBEAT_MIN_SCORE
        value: "6"
      # ----- Anti-stale (no TP1 window) -----
      - key: ANTI_STALE_MIN
        value: "15"
      - key: ANTI_STALE_NUDGE_BPS
        value: "2"

      # ========================= ETA / Defaults =========================
      - key: ETA_SMART_ENABLE
        value: "1"
      - key: ETA_VELOCITY_WINDOW
        value: "30"
      - key: DEFAULT_INTERVAL
        value: "15m"

      # ========================= Guarder =========================
      - key: GUARDER_ENABLE
        value: "1"
      - key: GUARDER_INTERVAL_SEC
        value: "45"

      # ========================= Readiness / Liveness =========================
      - key: READINESS_CHECK_BINANCE
        value: "1"
      - key: READINESS_CHECK_REDIS
        value: "1"
      - key: READINESS_CHECK_SQLITE
        value: "0"
      - key: SQLITE_PATH
        value: "/app/data/state.db"

      # ========================= Metrics / Buckets =========================
      - key: PROM_METRICS_ENABLE
        value: "1"
      - key: PROM_METRICS_PATH
        value: "/metrics"
      - key: METRICS_PROTECT
        value: "1"
      - key: PUBLIC_METRICS_REQUIRE_BEARER
        value: "1"
      - key: HTTP_LATENCY_BUCKETS
        value: "0.05,0.1,0.25,0.5,1,2,5"
      - key: TP1_TIME_BUCKETS
        value: "30,60,120,300,600,1200,3600"
      - key: SLIP_BPS_BUCKETS
        value: "1,2,5,10,20,50,100"

      # ========================= Risk rails =========================
      - key: DAILY_LOSS_CAP_USDT
        value: "300"
      - key: KILL_ON_CAP
        value: "1"
      - key: PRICE_PROTECT
        value: "1"
