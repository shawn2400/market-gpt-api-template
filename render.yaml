services:
  - type: web
    name: algogpt-docker
    env: docker
    plan: starter           # או standard
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: API_BEARER_TOKEN
        value: "change-me"
      - key: AUTO_RUN
        value: "true"
      - key: SCAN_INTERVAL
        value: "60"
      - key: MIN_QUALITY_SCORE
        value: "6"
      - key: MAX_TRADE_BUDGET
        value: "100"
      - key: PRICE_MAX_AGE_SEC
        value: "10"
      - key: TRENDING_ONLY
        value: "false"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false






























