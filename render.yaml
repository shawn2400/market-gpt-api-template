services:
  - type: web
    name: algo-gpt-fastapi
    env: docker
    plan: starter
    autoDeploy: true

    envVars:
      - fromDotEnv: true        # ✅ טוען את כל המפתחות מקובץ .env (אם מצורף בפרויקט או מוגדר דרך Render UI)

      # חובה להגדיר פורט ל־Gunicorn/Uvicorn
      - key: PORT
        value: "5000"

      # שאר המשתנים מנוהלים מתוך .env (לא חשופים בקובץ הזה)

    healthCheckPath: /
    healthCheckIntervalSeconds: 60
    healthCheckTimeoutSeconds: 10
    healthCheckSuccessThreshold: 1
    healthCheckFailureThreshold: 3


























