# FILE: render.yaml
services:
  # ── Web (קיים) — רק מציגים, לא משנים ─────────────────────
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    # בכוונה אין dockerfilePath / envVars / disk כדי למנוע "Update" לשירות הקיים

  # ── Worker חדש (Python, Free, Oregon) ─────────────────────
  - type: worker
    name: ops-supervisor
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-worker.txt
    startCommand: python -u utils/ops_supervisor.py
    # סודות/משתני סביבה מוסיפים בדשבורד אחרי היצירה (לא בקובץ)























































