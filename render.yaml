services:
  - type: web
    name: algogpt-docker
    env: docker
    plan: starter                # אפשר גם standard לפי צורך
    autoDeploy: true
    healthCheckPath: /health

    # IMPORTANT:
    # אל תגדיר כאן PORT. Render מזריק PORT בעצמו והאפליקציה מאזינה על ${PORT:-10000} מתוך ה-Dockerfile.

    envVars:
      # --- Security / API Gateway ---
      - key: API_BEARER_TOKEN
        value: "GrwpXpkRWunC7SPZGFrhaizBwcaZzpWLYJ9kv4W7u6aTx_EXu0VGfpBKaBhThLD2"

      # --- Runtime (מסחר ידני/סריקה ידנית) ---
      - key: AUTO_RUN
        value: "false"          # הפעלה ידנית; שנה ל-"true" רק אם רוצים סורק/אוטו-טרייד אוטומטי
      - key: SCAN_INTERVAL
        value: "60"
      - key: DEFAULT_INTERVAL
        value: "15m"

      # --- Scanner / Filters ---
      - key: MIN_QUALITY_SCORE
        value: "6"
      - key: MIN_VOLUME
        value: "1000000"
      - key: TOP_SYMBOLS
        value: "30"
      - key: TRENDING_ONLY
        value: "false"

      # --- Guards ---
      - key: PRICE_PROTECT_PCT
        value: "0.25"
      - key: PRICE_MAX_AGE_SEC
        value: "10"

      # --- Trading limits ---
      - key: MAX_TRADE_BUDGET
        value: "100"
      - key: MAX_LEVERAGE
        value: "35"

      # --- Logging / CORS ---
      - key: LOG_LEVEL
        value: "INFO"
      - key: CORS_ALLOW_ORIGINS
        value: "*"

      # --- Binance keys (להגדיר בדשבורד כ-Encrypted; לא בקוד) ---
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false

      # --- OpenAI (ל־SL/TP/סריקות חכמות) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30.0"
      - key: OPENAI_MAX_CONCURRENCY
        value: "4"

      # --- Binance endpoints (ברירת מחדל; אל תשנה אם אין צורך) ---
      - key: BINANCE_SPOT_HTTP_BASE
        value: "https://api.binance.com"
      - key: BINANCE_FUTURES_HTTP_BASE
        value: "https://fapi.binance.com"
      - key: BINANCE_FUTURES_WS_BASE
        value: "wss://fstream.binance.com"
      - key: BINANCE_WS_STREAM_SUFFIX
        value: "/stream?streams="

      # --- Binance timing / retries ---
      - key: BINANCE_BACKOFF_BASE
        value: "0.7"
      - key: BINANCE_MAX_RETRIES
        value: "5"
      - key: BINANCE_RECV_WINDOW
        value: "10000"
      - key: BINANCE_TIME_SYNC_INTERVAL_SEC
        value: "900"
      - key: BINANCE_EXCHANGE_INFO_ON_START
        value: "false"

      # --- Account modes ---
      - key: BINANCE_FORCE_HEDGE_MODE
        value: "false"
      - key: BINANCE_SKIP_ACCOUNT_MUTATIONS
        value: "false"

      # --- Egress IP (ל־Trusted IPs בבינאנס) ---
      - key: EGRESS_IP_ENDPOINT
        value: "https://algogpt-docker.onrender.com/net/ip"
      - key: BINANCE_ALLOWED_EGRESS_IPS
        value: ""

    # אפשרויות מתקדמות (אופציונלי):
    # numInstances: 1
    # autoDeploy: true
    # region: frankfurt    # דוגמה (אם זמין בחשבון שלך)
































