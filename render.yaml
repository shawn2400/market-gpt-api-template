services:
  - type: web
    name: algo-gpt-fastapi
    env: docker
    plan: starter
    autoDeploy: true
    envVars:
      # first import everything from .env
      - fromDotEnv: true

      # then explicitly override or add:
      - key: PORT
        value: "5000"
      - key: AUTO_RUN
        value: "true"
      - key: MIN_QUALITY_SCORE
        value: "6"
      - key: MAX_TRADE_BUDGET
        value: "100"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

    # health check belongs under the service:
    healthCheckPath: /






















