services:
  - type: web
    name: algogpt-docker
    runtime: docker
    plan: pro
    autoDeploy: false
    pullRequestPreviewsEnabled: false

    healthCheckPath: /health

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      # Render מזריק PORT אוטומטית; אנחנו עוגנים ל-10000
      - key: PORT
        value: "10000"

      # כדי למנוע כפילויות של משימות רקע — שמור וורקר יחיד
      - key: WORKERS
        value: "1"

      - key: LOG_LEVEL
        value: "INFO"

      # CORS — בפרודקשן רצוי whitelist
      - key: CORS_ALLOW_ORIGINS
        value: "*"

      # גרסת האפליקציה
      - key: ALGOGPT_VERSION
        value: "2.16.0"

      # WS / Price Monitor flags
      - key: WS_UPDATE_INTERVAL
        value: "15"
      - key: PRICE_MONITOR_INTERVAL
        value: "60"   # ניהול חי כל 60ש'
      - key: PRICE_WS_FRESH_TTL
        value: "20"
      - key: PRICE_MONITOR_DISABLE
        value: "0"

      # ספים חשובים למסחר
      - key: MIN_QUALITY_SCORE
        value: "8.5"
      - key: MAX_TRADES_PER_TICK
        value: "1"
      - key: SYMBOL_COOLDOWN_SEC
        value: "600"
      - key: DEFAULT_INTERVAL
        value: "15m"
      - key: WATCHLIST
        value: "BTCUSDT,ETHUSDT,SOLUSDT"
      - key: INDICATOR_INTERVALS
        value: "15m,1h"
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: "true"
      - key: EXECUTE_TRADES
        value: "true"
      - key: BINANCE_MARGIN_TYPE_DEFAULT
        value: "ISOLATED"

      # 🔑 סודות — להגדיר ידנית ב-Render כ Synced=false ולהזין בדאשבורד
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1











































