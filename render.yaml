# FILE: render.yaml
services:
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    autoscale: false
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: "INFO"

      # HMAC/Secrets (נשארים ב-Secrets של Render)
      - key: ALERTS_INGEST_HMAC_SECRET
        sync: false
      - key: ALERTS_INGEST_HMAC_KEY_IS_HEX
        value: "1"

      # Binance/Telegram/OpenAI/Redis/Host
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_HOST
        value: https://algogpt-docker.onrender.com
      - key: REDIS_URL
        sync: false

      # ─── הוספות חשובות לסריקות ───
      - key: SCAN_MAX_SYMBOLS
        value: "120"
      - key: SCAN_MAX_LIMIT
        value: "0"
      - key: SCAN_CONCURRENCY
        value: "4"
      - key: SCAN_RL_LIMIT
        value: "120"
      - key: SCAN_RL_WINDOW
        value: "60"

      # השארת מצב Approval לכל הסימבולים
      - key: APPROVAL_REQUIRE_WATCHLIST
        value: "0"
































































