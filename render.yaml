services:
  - type: web
    name: algo-gpt-fastapi
    env: docker
    plan: starter
    autoDeploy: true

    # ✅ טוען משתני סביבה מקובץ .env (אם מצורף ב־repo)
    envVars:
      - fromDotEnv: true

      # ✅ פורט חשוף של Gunicorn
      - key: PORT
        value: "5000"

    # ✅ ברירת מחדל לבדיקה ששרת מגיב
    healthCheckPath: /
    healthCheckIntervalSeconds: 60
    healthCheckTimeoutSeconds: 10
    healthCheckSuccessThreshold: 1
    healthCheckFailureThreshold: 3


























