# services (Render)
services:
  - type: web
    name: algogpt-docker
    env: docker
    region: frankfurt
    plan: pro
    autoDeploy: false
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz   # ✅ עובר כעת דרך Redis ping

    envVars:
      # ================== Runtime & Logging ==================
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: LOG_LEVEL
        value: "INFO"
      - key: APP_MODULE
        value: main:app
      - key: PYTHONPATH
        value: /app
      - key: UVICORN_ACCESS_LOG
        value: "false"
      - key: UVICORN_LOG_LEVEL
        value: "info"

      # ================== Base URLs ==================
      - key: PUBLIC_HOST
        value: https://algogpt-docker.onrender.com
      - key: CONTEXT_URL
        value: https://algogpt-docker.onrender.com
      - key: WEBHOOK_HOST
        value: https://algogpt-docker.onrender.com

      # ================== Public/Readonly ==================
      - key: ENABLE_READONLY_HTTP
        value: "1"
      - key: READONLY_ENDPOINTS
        value: summary,prices_top,news_cache,health
      - key: OPENAPI_INCLUDE_TAGS
        value: "Status,Public Feed,Price,scan,manager,ops-ui,ops-approval,ops-flags,position-ops,ops-digest,debug"
      - key: OPENAPI_HIDE_PATTERNS
        value: /telegram/*,/executor/*,/manage-once,/_debug/*,/debug/*,/internal/*,/provider/*,/grid/*,/trade/*,/risk/*/internal*

      # ================== Security (לא סודי) ==================
      - key: PROTECT_APPROVE_ROUTES
        value: "1"          # ✅ להגן על approve/reject בפרודקשן
      - key: PROTECT_DIGEST_ROUTES
        value: "1"          # ✅ להגן גם על /ops/digest/expired
      - key: ENABLE_HSTS
        value: "1"          # ✅ מאחורי HTTPS
      - key: SECURITY_PUBLIC_PATHS
        value: /readyz,/telegram/ping,/ops/manager/health,/ops/ui,/ops/ui/ticket,/ops/ui/orders,/ui/dashboard,/health,/health/tp1,/topk,/scan/public-now
      - key: SECURITY_PUBLIC_PREFIXES
        value: /public,/price,/static,/risk

      # ================== Rate Limit backend ==================
      - key: RATE_LIMIT_ENABLE
        value: "1"
      - key: RL_FAIL_OPEN
        value: "0"
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: ORDERS_BUCKET_WINDOW_SEC
        value: "10"
      - key: ORDERS_QPS_BUCKET
        value: "8"

      # ================== Redis client (פרמטרים לא-סודיים) ==================
      - key: REQUIRE_REDIS
        value: "1"          # ✅ fail-closed אם Redis לא זמין
      - key: CONFIRMSTORE_ENABLE
        value: "0"          # ✅ אין fallback בזיכרון בפרודקשן
      - key: USE_REDIS_IDEM
        value: "1"
      - key: SETEX_STRICT
        value: "1"          # ✅ השתמש ב-SET NX EX לאטומיות ticket_id
      - key: REDIS_CONNECT_TIMEOUT
        value: "5.0"
      - key: REDIS_SOCKET_TIMEOUT
        value: "5.0"
      - key: REDIS_POOL_MAX_CONNECTIONS
        value: "30"
      - key: REDIS_PING_RETRIES
        value: "2"
      - key: REDIS_PING_RETRY_BACKOFF_SEC
        value: "0.3"
      - key: REDIS_CLIENT_NAME
        value: algogpt
      - key: REDIS_SSL_NO_VERIFY
        value: "0"

      # ================== Exchange Defaults ==================
      - key: DEFAULT_MARKET
        value: futures
      - key: POSITION_MODE_OVERRIDE
        value: oneway
      - key: BINANCE_MARGIN_TYPE_DEFAULT
        value: ISOLATED
      - key: BINANCE_FUTURES_HTTP_BASE
        value: https://fapi.binance.com
      - key: BINANCE_FUTURES_WS_BASE
        value: wss://fstream.binance.com
      - key: BINANCE_SPOT_HTTP_BASE
        value: https://api.binance.com
      - key: BINANCE_TESTNET
        value: "false"
      - key: BINANCE_WORKING_TYPE
        value: MARK_PRICE
      - key: BINANCE_HTTP_TIMEOUT
        value: "10.0"
      - key: BINANCE_MAX_RETRIES
        value: "2"
      - key: BINANCE_RECV_WINDOW
        value: "45000"
      - key: LISTENKEY_KEEPALIVE_SEC
        value: "1800"
      - key: WS_KEEPALIVE_SEC
        value: "25"
      - key: USE_WS
        value: "1"
      - key: EXCHANGE_INFO_TTL_SEC
        value: "900"

      # ================== Scanner / Universe ==================
      - key: SCAN_SOURCE
        value: binance-futures
      - key: UNIVERSE_MODE
        value: exchange
      - key: SCAN_INTERVALS
        value: 5m,15m,1h,4h
      - key: SCAN_MAX_SYMBOLS
        value: "150"
      - key: SCAN_MAX_LIMIT
        value: "0"
      - key: SCAN_CONCURRENCY
        value: "4"
      - key: TOP_SYMBOLS
        value: "150"
      - key: SUGGEST_FUTURES
        value: "1"
      - key: SUGGEST_INTERVAL_SEC
        value: "45"
      - key: SUGGEST_CAP_PER_CYCLE
        value: "30"

      # ================== Indicators / Gates ==================
      - key: INDICATOR_INTERVALS
        value: 15m,1h,4h,1d
      - key: ENABLE_INDICATOR_EXIT
        value: "1"
      - key: ADX_MIN
        value: "18"
      - key: FEAT_DAILY_CAPS
        value: "0"
      - key: FEAT_DEBOUNCE_LIMIT
        value: "1"
      - key: FEAT_QUALITY_ENFORCE
        value: "0"
      - key: FEAT_SPREAD_DEPTH
        value: "1"
      - key: FEAT_TF_ALIGN
        value: "0"
      - key: FEAT_VOLUME_GATE
        value: "0"
      - key: FEAT_COOLDOWN
        value: "0"
      - key: MAX_ATR_PCT
        value: "3.0"

      # ================== Watchlist / Allowlist ==================
      - key: ALLOWLIST_MODE
        value: off
      - key: SYMBOLS_ALLOWLIST_PATH
        value: config/symbols_allowlist.json
      - key: WATCHLIST
        value: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,NEARUSDT

      # ================== Scan/Notify quick tuning ==================
      - key: HEARTBEAT_HOURS
        value: "2"
      - key: HEARTBEAT_MIN_SCORE
        value: "4.0"
      - key: DEFAULT_LEVERAGE
        value: "5"
      - key: DEFAULT_STAKE_USDT
        value: "50"

      # ================== SCAN CRON (auto approvals to Telegram) ==================
      - key: SCAN_CRON_ENABLE
        value: "1"
      - key: SCAN_CRON_EVERY_SEC
        value: "45"
      - key: SCAN_CRON_TIMEFRAME
        value: "15m"
      - key: SCAN_CRON_KLINES
        value: "200"
      - key: SCAN_CRON_LIMIT
        value: "12"
      - key: SCAN_CRON_MIN_SCORE
        value: "7"
      - key: SCAN_REARM_SCORE
        value: "6"
      - key: SCAN_DEDUPE_WINDOW_SEC
        value: "300"
      - key: SCAN_TTL_SEC
        value: "900"
      - key: SCAN_RICH
        value: "1"

      # ================== Approvals / Telegram routing ==================
      - key: APPROVAL_ENABLED
        value: "1"
      - key: REQUIRE_TELEGRAM_APPROVAL
        value: "1"
      - key: APPROVAL_REQUIRE_WATCHLIST
        value: "0"
      - key: AUTO_OPEN_ON_APPROVE
        value: "1"
      - key: ADMIN_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_CHAT_ID
        value: "449087907"
      - key: TELEGRAM_ADMIN_IDS
        value: "449087907"
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "1"
      - key: TELEGRAM_PARSE_MODE
        value: "HTML"
      - key: APPROVAL_PUBSUB_CHANNEL
        value: ops:ticket:events
      - key: APPROVAL_RR_MIN
        value: "1.25"
      - key: APPROVAL_SUCCESS_MIN
        value: "55"
      - key: APPROVAL_MAX_SL_PCT
        value: "3.0"
      - key: APPROVAL_REQUIRE_FRESH_PRICE
        value: "1"
      - key: APPROVAL_DUP_COOLDOWN_SEC
        value: "0"
      - key: APPROVE_BEFORE_GATE
        value: "1"
      - key: CONFIRM_TTL_SEC
        value: "120"
      - key: OPS_TICKET_TTL_SEC
        value: "1800"

      # --- Signed approve anti-replay (headers) ---
      - key: SIGNED_TS_MAX_SKEW_SEC
        value: "60"
      - key: SIGNED_NONCE_TTL_SEC
        value: "120"

      # ================== Smart-Manage right after approve ==================
      - key: SMART_MANAGE_ON_APPROVE
        value: "1"
      - key: SMART_MANAGE_BE_OFFSET_BPS
        value: "8"
      - key: SMART_MANAGE_PCTS
        value: 1.8,3.2,5.5
      - key: SMART_MANAGE_SPLITS
        value: 0.4,0.35,0.25
      - key: SMART_MANAGE_TRAIL_ATR_MULT
        value: "1.5"

      # ================== Trade & Orders ==================
      - key: EXECUTE_TRADES
        value: "1"
      - key: ALLOW_MARKET_ENTRY
        value: "1"
      - key: MANAGER_WRITES_ORDERS
        value: "1"
      - key: ORDERS_USE_OCO
        value: "1"
      - key: ORDER_ID_PREFIX
        value: ALG
      - key: ORDER_ID_INCLUDE_TS
        value: "1"
      - key: ORDER_BACKOFF_BASE_MS
        value: "120"
      - key: ORDER_BACKOFF_MAX_MS
        value: "1600"
      - key: ORDER_ROUND_TO_TICK
        value: "1"
      - key: ORD_VERIFY_TIMEOUT_MS
        value: "800"
      - key: ORD_CANCEL_STRATEGY
        value: MINIMAL
      - key: USE_EXCHANGE_FILTERS
        value: "1"
      - key: MAX_TRADES_PER_TICK
        value: "1"
      - key: MIN_NOTIONAL_USDT
        value: "5"
      - key: MAX_TRADE_BUDGET
        value: "50"
      - key: AUTO_QTY_ENABLE
        value: "1"
      - key: AUTO_QTY_MODE
        value: notional
      - key: AUTO_QTY_USDT_PER_TRADE
        value: "50"
      - key: AUTO_QTY_MARGIN_BUFFER_PCT
        value: "0.35"

      # ================== SL/TP / BE / Trail / Ladder ==================
      - key: NATIVE_TPSL_ENABLE
        value: "0"
      - key: SL_MONOTONIC
        value: "1"
      - key: PERCENT_GUARD_ENABLE
        value: "1"
      - key: PERCENT_PRICE_GUARD_BPS
        value: "100"
      - key: ENTRY_BAND_BPS
        value: "10"
      - key: ENTRY_GAP_MAX_PCT
        value: "0.80"
      - key: ENTRY_GAP_WARN_PCT
        value: "0.50"
      - key: STOP_BAND_BPS
        value: "12"
      - key: TP_BE_ONLY_AFTER_TP1
        value: "1"
      - key: STREAM_TP_BE
        value: "1"
      - key: TP_LADDER_ON_APPROVE
        value: "1"
      - key: LADDER_TP_ENABLE
        value: "1"
      - key: LADDER_TP_DEFAULT_PCTS
        value: 1.8,3.2,5.5
      - key: LADDER_TP_DEFAULT_SPLITS
        value: 0.4,0.35,0.25
      - key: LADDER_SL_ENABLE
        value: "1"
      - key: LADDER_SL_DEFAULT_PCTS
        value: "1.2"
      - key: TP_MAX_LADDERS
        value: "3"
      - key: TRAIL_ENABLE
        value: "1"
      - key: TRAIL_ATR_MULT
        value: "1.5"
      - key: ATR_UPDATE_COOLDOWN_SEC
        value: "20"
      - key: ATR_MIN_DELTA
        value: "0.02"
      - key: BE_ARM_PCT
        value: "1.6"
      - key: BE_GUARD_ENABLE
        value: "1"
      - key: BE_GUARD_EVERY_SEC
        value: "30"
      - key: TP_BE_OFFSET_BPS
        value: "8"

      # ================== Manager / Intervals ==================
      - key: MANAGER_ENABLE
        value: "1"
      - key: MANAGER_INTERVAL_SEC
        value: "10"
      - key: TRADE_MANAGER_ENABLE
        value: "1"
      - key: TRADE_MANAGER_INTERVAL_SEC
        value: "60"
      - key: TM_UPDATE_COOLDOWN_SEC
        value: "30"

      # ================== Health / Ops Digest ==================
      - key: HEALTH_PRICE_MAX_AGE
        value: "30"
      - key: HEALTH_TP_GRACE_SEC
        value: "8"
      - key: HEALTH_TP1_ENABLE
        value: "1"
      - key: HEALTH_TP1_INTERVAL_SEC
        value: "1200"
      - key: HEALTH_TP1_ONLY_WITH_POSITION
        value: "1"
      - key: TP1_TAGS
        value: TP1,tp1,tp_1,TAKE_PROFIT_1
      - key: OPS_DIGEST_INTERVAL_HOURS
        value: "3"
      - key: OPS_HEARTBEAT_ENABLE
        value: "1"
      - key: OPS_HEARTBEAT_EVERY_MIN
        value: "5"

      # ================== Risk / Caps ==================
      - key: DAILY_LOSS_CAP_USDT
        value: "150"
      - key: KILL_ON_CAP
        value: "1"
      - key: NO_PROGRESS_TIMEOUT_MIN
        value: "30"
      - key: MAX_LEVERAGE
        value: "35"
      - key: MIN_LEVERAGE
        value: "5"
      - key: LEV_HARD_CAP
        value: "50"
      - key: LEVERAGE_SYMBOL_CAPS
        value: '{"BTCUSDT":15,"1000PEPEUSDT":8}'
      - key: LEV_ADX_MAP_JSON
        value: '{"30":15,"25":12,"20":9,"0":7}'
      - key: LIQ_MAX_NOTIONAL_TOP10
        value: "200000"
      - key: LIQ_MAX_NOTIONAL_OTHERS
        value: "50000"
      - key: LIQ_USE_SLIPPAGE
        value: "0"
      - key: SLIPPAGE_GUARD_BPS
        value: "80"
      - key: SLIPPAGE_MAX_PCT_TOP10
        value: "0.40"
      - key: SLIPPAGE_MAX_PCT_OTHERS
        value: "0.80"
      - key: MIN_TP_SL_DIFF_PCT
        value: "3.0"

      # ================== Dyna-Policy / Auto-Tune ==================
      - key: DYNAMIC_POLICY_ENABLE
        value: "1"
      - key: DYN_TRADE_ENABLE
        value: "1"
      - key: DYN_ATR_LOW_PCT
        value: "0.5"
      - key: DYN_ATR_HIGH_PCT
        value: "3.5"
      - key: DYN_CANCEL_BASE_SEC
        value: "15"
      - key: DYN_CANCEL_MIN_SEC
        value: "5"
      - key: DYN_CANCEL_MAX_SEC
        value: "60"
      - key: DYN_STOP_MIN_BPS
        value: "6"
      - key: DYN_STOP_MAX_BPS
        value: "25"
      - key: DYN_SLIP_GUARD_MIN_BPS
        value: "20"
      - key: DYN_SLIP_GUARD_MAX_BPS
        value: "80"
      - key: DYN_ESCALATE_AFTER_MIN
        value: "5"
      - key: DYN_ESCALATE_AFTER_MAX
        value: "25"
      - key: DYN_ESCALATE_SLIP_MIN_BPS
        value: "5"
      - key: DYN_ESCALATE_SLIP_MAX_BPS
        value: "60"

      # ================== AI / Schedulers (לא סודי) ==================
      - key: AI_SCHED_ENABLE
        value: "1"
      - key: AI_SCHED_INTERVAL_SEC
        value: "60"
      - key: AI_QUEUE_TO_TELEGRAM
        value: "1"
      - key: AI_QUEUE_AUTO_EXECUTE
        value: "0"
      - key: AI_REVIEW_IDEMP_TTL_SEC
        value: "0"
      - key: AI_REVIEW_RATE_PER_MIN
        value: "0"
      - key: OPENAI_MAX_CONCURRENCY
        value: "4"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30.0"
      - key: OPENAI_MODEL
        value: gpt-4o

      # ================== ETA / Velocity / Defaults ==================
      - key: ETA_SMART_ENABLE
        value: "1"
      - key: ETA_VELOCITY_WINDOW
        value: "30"
      - key: DEFAULT_INTERVAL
        value: "15m"

      # ================== Guarder (optional) ==================
      - key: GUARDER_ENABLE
        value: "1"
      - key: GUARDER_INTERVAL_SEC
        value: "45"

      # ================== Ops / Misc ==================
      - key: ALGOGPT_VERSION
        value: "2.18.0"
      - key: INSTANCE_ID
        value: algogpt-docker
      - key: ROUTES_ONLY
        value: routes.manager,routes.metrics,routes.ops_approve,routes.ops_ui,routes.position_ops,routes.market,routes.price,routes.dashboard,routes.scan,routes.scan_top_volume,routes.scan_public,routes.topk,routes.ops_flags,routes.guard_smoke,routes.status,routes.debug
      - key: METRICS_ENABLE
        value: "true"
      - key: PNL_TRACKING
        value: "true"
      - key: PARAMS_DIR
        value: params/optimized
      - key: DATABASE_URL
        value: sqlite:////app/data/algogpt.db
      - key: PRICE_CACHE_TTL_MS
        value: "250"
      - key: PRICE_MAX_AGE_SEC
        value: "15"
      - key: PRICE_WS_FRESH_TTL
        value: "60"
      - key: PRICE_SCAN_INTERVAL
        value: "30"

      # ================== (SECRETS) להגדרה בדשבורד בלבד ==================
      - key: API_BEARER_TOKEN
        sync: false
      - key: API_TOKEN
        sync: false
      - key: PRIMARY_API_TOKEN
        sync: false
      - key: OPS_SIGN_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ALERTS_INGEST_HMAC_SECRET
        sync: false
      - key: INTERNAL_JWT_PUBLIC_KEY
        sync: false

      # ================== Alerts / Public (לא-סודי) ==================
      - key: ALERTS_ACTIVE_URL
        value: https://algogpt-docker.onrender.com/alerts/trades/active
      - key: ALERTS_INGEST_URL
        value: https://algogpt-docker.onrender.com/alerts/ingest
      - key: ALERTS_ANALYSIS_URL
        value: https://algogpt-docker.onrender.com/alerts/ingest
      - key: ALERTS_EMAIL_TO
        value: shaharabecassis8@gmail.com
      - key: DEBUG_ALERTS_HMAC_CHECK
        value: "1"



























































