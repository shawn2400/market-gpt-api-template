services:
  - type: web
    name: algo-gpt-fastapi
    env: docker
    plan: starter
    autoDeploy: true

    envVars:
      - fromDotEnv: true
      - key: PORT
        value: "5000"

      # 📊 פרמטרים למסחר אוטומטי
      - key: AUTO_RUN
        value: "true"
      - key: MIN_QUALITY_SCORE
        value: "6"
      - key: MAX_TRADE_BUDGET
        value: "100"
      - key: SCAN_INTERVAL
        value: "10"
      - key: TRENDING_ONLY
        value: "true"
      - key: MIN_VOLUME
        value: "1500000"

    healthCheckPath: /
    healthCheckIntervalSeconds: 60
    healthCheckTimeoutSeconds: 10
    healthCheckSuccessThreshold: 1
    healthCheckFailureThreshold: 3
























