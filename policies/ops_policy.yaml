# FILE: policies/ops_policy.yaml
---
MASTER:
  power: "on"                 # on | off
  mode: "full"                # off|frozen|safe|lite|full
  profile: "balanced"         # eco|balanced|performance
  emergency_actions_in_frozen: ["reconnect","restart","rollback_config"]

# ===== Notifications cadence / throttling =====
NOTIFY:
  cadence_hours: 3            # דיג'סט כל 3 שעות
  daily_cap: 5                # עד 5 הודעות לא דחופות ביום
  immediate_kinds: ["approval","emergency"]  # תמיד מיידי
  always_send_kinds: ["eod"]  # תמיד נשלח (דוח סוף יום)
  coalesce: true              # איסוף אירועים לדיג'סט
  coalesce_max_items: 50

PROFILES:
  eco:         { experiments_per_day: 6,  advisor_mode: "off" }
  balanced:    { experiments_per_day: 12, advisor_mode: "risk-gated" }
  performance: { experiments_per_day: 16, advisor_mode: "risk-gated" }

TIME:
  tz: "Asia/Jerusalem"
  formats:
    ts_il: "%d/%m/%Y %H:%M:%S %Z"
    ts_utc: "%Y-%m-%d %H:%M:%S UTC"
  include_utc: true
  include_local: true
  prepend_in_messages: true

SCHEDULE:
  tick_seconds: 60
  maintenance_minutes: 45
  nightly_sweep_local_time: "02:30"
  eod_report_local_time: "23:57"

GATES:
  cpu_pct_max: 60
  mem_pct_max: 70
  api_error_pct_max: 3
  ws_pressure_max: "policy_defined"

QUALITY_GATES:
  crs_bands:
    auto: [0,3]
    needs_advisor_or_approval: [4,6]
    approval_only: [7,10]

# ===== Change Approval (אישור ידני עם הסבר) =====
CHANGE_APPROVAL:
  required: true                # דורש אישור לשינויים משמעותיים
  ttl_minutes: 20               # זמן תפוגה לטיקט
  min_crs_for_manual: 2         # כל שינוי עם CRS>=2 מצריך אישור
  explain: true                 # לצרף הסבר/תוכנית פעולה בהודעות
  channels: ["telegram"]        # כרגע טלגרם

APPROVAL_ENDPOINTS:
  approve_url_base: "${PRIMARY_PUBLIC_HOST}/ops/approve"  # *** חשוב: זה ה-ops-approval-web ***
  hmac_env: "WEBHOOK_HMAC_SECRET"                         # שם משתנה env למפתח חתימה
  two_man_rule: true
  timeout_seconds: 600
  on_mismatch: "hold_and_alert"
  on_timeout: "cancel_change"
  break_glass:
    enabled: true
    command: "/override"
    otp_required: true
    require_reason: true
    strict_audit: true

# Pub/Sub – ערוץ התראות אישור מיידי
APPROVAL_PUBSUB:
  channel: "ops:ticket:events"

APPROVAL_FLOW:
  stages: [preflight, canary, promote, postverify]
  cancel_on: [gates_violation, tests_failed, budget_exceeded, slo_drift, security_flag]
  on_cancel: rollback_and_notify
  retries: 1
  notify_telegram: true

FLAGS: { ops_scan: on, refactor: on, security_hardening: on, advisor_voice: auto }

FREEZE_WINDOWS:
  enabled: true
  cron: ["Fri 17:00-22:00", "Sun 01:30-02:30"]
  override_one_tap: true

EMERGENCY:
  kill_switch_enabled: true
  safe_mode_preapproved: true
  telegram_commands: ["/safe", "/freeze_on", "/freeze_off"]

CANARY:
  size_by_crs: { "0-3": 0.05, "4-6": 0.15, "7-10": 0.30 }  # יחסים (0..1)

SLO_GUARD:
  burn_alert_pct_per_hour: 10
  action_on_burn: ["throttle","pause_experiments"]

PREDICTOR:
  features: ["delta_loc","files_touched","area","time_of_day","crs","past_win_rate"]
  threshold_block: 0.75

PROMPT_OPT: { dedup_hash: true, max_context_chars: 8000, cache_ttl_min: 60 }

MARKET_AWARE:
  vol_kpi: "1h_realized_vol"
  liquidity_kpi: "depth10"
  boost_when_trending: true
  binance_maintenance_hold: true

OPTIMIZER: { require_pareto_front: true, max_cost_delta_usd: 0.05 }

EVAL: { causal: "cuped", min_effect_size: 0.02 }

DISTILLATION: { repeat_threshold: 3, auto_promote_to_rule: true, add_golden_test: true }

SAFETY_RUNS: { shadow: true, drysim_on_sensitive: true, drysim_duration_s: 30 }

BUDGETS:
  xai:    { monthly_usd_cap: 30 }
  openai: { monthly_usd_cap: 20, daily_usd_cap: 5 }
  action_on_cap: degrade

BUDGET_GOVERNOR:
  soft_alert_pct: 70
  shift_heavy_tasks_to: "nightly"
  hard_cap_action: "heuristics_only"

RELEASE_NOTES: { include_forecast: true, revert_if_forecast_miss_min: 30 }

EXCHANGES_DEFAULTS:
  enabled: false
  require_credentials: true
  activate_only_if: ["handshake_ok","quotas_set","allowlisted"]

EXCHANGES:
  binance: { enabled: true, ws_max: 8, rest_rps: 40, token_bucket: { capacity: 120, refill_per_s: 20 } }
  bybit:   { enabled: false, ws_max: 0, rest_rps: 0 }
  okx:     { enabled: false, ws_max: 0, rest_rps: 0 }

# ===== Auto-Onboard מדורג עם אישור =====
AUTO_ONBOARD:
  enabled: true
  staged: true
  triggers: ["on_power_on","on_mode_change_full","nightly_02_30"]
  preapproved_exchanges: ["binance","bybit"]
  preapproved_features: ["advisor_voice","vision_rca","embeddings_kb","web_search"]
  steps:
    - name: "validate_creds"
      crs: 1
    - name: "enable_scheduler"
      crs: 3
    - name: "telegram_webhook"
      crs: 4
  require: ["credentials","allowlist","handshake_ok","quotas_set","budget_ok","gates_green"]
  require_approval: true
  rollout: { shadow_ratio: 0.01, canary_pct: 15, promote_if_green_minutes: 15 }
  concurrency: 1
  spacing_seconds: 120
  backoff_ms: [1000, 4000, 12000]
  abort_on: ["gates_violation","tests_failed","budget_exceeded","security_flag","policy_pin_mismatch"]
  notify_telegram: true

INNOVATION_WATCH:
  enabled: true
  sources:
    pypi: ["ta", "scipy", "pandas", "numpy"]
    github_topics: ["technical-indicators", "quant", "crypto-trading"]
    docs_watch: ["binance_api_changes", "exchange_status"]
  x_feed: { enabled: false }
  cadence_hours: 6
  curation:
    must_have: ["license_ok", "maintained", "stars_gt:50"]
    denylist: ["abandoned", "unsafe", "heavy_gpu"]
  scoring: { formula: "(impact*compatibility*maintainability) - cost", promote_threshold: 0.7 }
  rollout: { mode: "propose_then_auto", canary_pct: 10, auto_revert_on_slo: true }

EXCHANGE_GUARD:
  on_429: ["backoff_jitter","reduce_ws_pool","pause_experiments"]
  min_backoff_ms: 500
  max_backoff_ms: 8000

HEALTH_ENDPOINTS: { healthz: true, readyz: true, livez: true }

DISK_GUARD:
  min_free_gb: 3
  min_free_inodes_pct: 10
  auto_clean_logs: true

POLICY_PIN: { require_hash: false, current_sha256: "" }

OBSERVABILITY: { correlation_id: "ulid", inject_into_logs_and_msgs: true }

ADVISOR_CB:
  p95_ms_trip: 8000
  error_rate_trip_pct: 2
  cooloff_seconds: 600
  fallback: "heuristics_only"

ROADMAP: { score_formula: "(impact*prob)/effort", pick_top_k_per_day: 3, auto_refresh_hours: 6 }

CHAOS_LITE:
  enabled: true
  schedule: "Sun 03:40"
  scope: ["ws_reconnect","api_slowdown"]
  max_duration_seconds: 60
  abort_on_error: true

POSTMORTEM: { auto_generate: true, attach_rca_to_kb: true }

DR:
  weekly_restore_check: "Sun 03:10"
  immutable_backup_days: 90
  retention_days: 14

STATUS_WATCH: { binance: { enabled: true, maintenance_hold: true } }

AUDIT: { hash_chain: true, sign_release: true }

DATA_GUARD: { mask_secrets_pii: true }






