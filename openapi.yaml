openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר Algo בזמן אמת המתחבר ל-Binance, מבצע ניתוחים טכניים, חיזוי AI, טריידים בפועל, גרפים, דוחות, וסטטיסטיקות.
  version: 1.0.0

servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /:
    get:
      summary: בדיקת סטטוס השרת
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: AlgoGPT API is running

  /scan:
    get:
      summary: סריקה חיה של שוק Binance Futures לפי קריטריונים טכניים
      responses:
        '200':
          description: רשימת תוצאות מסוננות
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        last_price:
                          type: number
                        volume:
                          type: number
                        rsi:
                          type: number
                        adx:
                          type: number
                        direction:
                          type: string

  /backtest:
    post:
      summary: ביצוע Backtest על סדרת מחירים
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        '200':
          description: תוצאות הסימולציה
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                  total_return:
                    type: number
                  win_rate:
                    type: number
                  chart:
                    type: string

































