openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: AlgoGPT API
  version: 2.14.0
  description: |
    AlgoGPT – Real-time algorithmic trader for Binance (Futures),
    Multi-TF Scan with AI, dry-run/live trades, smart SL/TP, and Backtest.

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

tags:
  - name: Config
  - name: AI
  - name: Trades
  - name: Backtest
  - name: Scan
  - name: Health
  - name: Dashboard

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type:
            - string
            - "null"

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 2.14.0

    MetricsResponse:
      type: object
      properties:
        boot_ts:
          type: integer
        uptime_sec:
          type: integer
        requests:
          type: object
          additionalProperties: true
        latency_ms:
          type: object
          additionalProperties: true

    # ---------- AI ----------
    AiHealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        model:
          type:
            - string
            - "null"
        latency_ms:
          type:
            - number
            - "null"
        error:
          type:
            - string
            - "null"

    AiQualityRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol:
          type: string
          example: BTCUSDT
        side:
          type: string
          enum: [LONG, SHORT]
        entry:
          type:
            - number
            - "null"
        sl:
          type:
            - number
            - "null"
        tp:
          type:
            - number
            - "null"
        leverage:
          type: integer
          default: 10
        budget:
          type: number
          default: 100
        atr:
          type:
            - number
            - "null"

    AiAnalyzeResponse:
      type: object
      properties:
        quality_score:
          type: number
        success_pct:
          type: number
        anchor:
          type: object
          additionalProperties: true
        components:
          type: object
          additionalProperties: true

    ManualScanItem:
      type: object
      properties:
        symbol:
          type: string
          example: BTCUSDT
        market:
          type: string
          example: futures
        interval:
          type: string
          example: 15m
        frames:
          type: array
          items:
            type: string
        trend:
          type: string
          enum: [UP, DOWN]
        direction:
          type: string
          enum: [LONG, SHORT]
        rsi:
          type: number
        adx:
          type: number
        volume:
          type: number
        quality_score:
          type: number
          minimum: 0
          maximum: 10
        signal:
          type: string
          enum: [BUY, SELL, HOLD]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        reason:
          type: string
        close:
          type: number
        atr:
          type:
            - number
            - "null"

    AiManualScanResponse:
      type: object
      properties:
        symbol:
          type: string
        results:
          $ref: "#/components/schemas/ManualScanItem"

    # ---------- Trades ----------
    SLTP3Response:
      type: object
      properties:
        symbol:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT]
        sl:
          type: number
        tp1:
          type: number
        tp2:
          type: number

    TradeExecuteRequest:
      type: object
      required: [symbol, side, budget, leverage]
      properties:
        symbol:
          type: string
          example: BTCUSDT
        side:
          type: string
          enum: [LONG, SHORT]
        budget:
          type: number
          example: 100
        leverage:
          type: integer
          example: 10
        entry:
          type:
            - number
            - "null"
        sl:
          type:
            - number
            - "null"
        tp:
          type:
            - number
            - "null"
        atr:
          type:
            - number
            - "null"
          description: Optional ATR for SL/TP calculation
        dry_run:
          type: boolean
          default: true

    TradeExecuteResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        result:
          type: object
          additionalProperties: true

    # ---------- Backtest ----------
    BacktestTrade:
      type: object
      properties:
        timestamp:
          type: integer
          description: epoch seconds
        price:
          type: number
        side:
          type: string
          enum: [LONG, SHORT]
        pnl:
          type: number

    BacktestResult:
      type: object
      properties:
        symbol:
          type: string
        timeframe:
          type: string
        trades:
          type: array
          items:
            $ref: "#/components/schemas/BacktestTrade"
        win_rate:
          type: number
        total_pnl:
          type: number
        count:
          type: integer

    # ---------- Scan ----------
    ScanSignal:
      type: object
      required: [symbol, timeframe, score]
      properties:
        symbol:
          type: string
          example: BTCUSDT
        timeframe:
          type: string
          example: 15m
        side:
          type:
            - string
            - "null"
          enum: [LONG, SHORT]
        score:
          type: number
          minimum: 0
          maximum: 10
        note:
          type:
            - string
            - "null"
        details:
          type:
            - object
            - "null"
            - array

    ScanResponse:
      type: object
      properties:
        ok:
          type: boolean
        count:
          type: integer
        signals:
          type: array
          items:
            $ref: "#/components/schemas/ScanSignal"

    # ---------- Health ----------
    BasicHealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 2.14.0

    LiveResponse:
      type: object
      properties:
        status:
          type: string
          example: live
        uptime_sec:
          type: integer
        now_utc:
          type: string

    StrategyVersionEnvFlags:
      type: object
      properties:
        execute_trades:
          type: boolean
        skip_mutations:
          type: boolean

    StrategyVersionResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        app_version:
          type: string
          example: 2.14.0
        strategy_version:
          type: string
          example: 2.14.0
        git_commit:
          type:
            - string
            - "null"
        req_hash:
          type:
            - string
            - "null"
        python_version:
          type: string
        libs:
          type: object
          additionalProperties:
            type:
              - string
              - "null"
        env_flags:
          $ref: "#/components/schemas/StrategyVersionEnvFlags"
        boot_ts:
          type: integer
        uptime_sec:
          type: integer
        now_utc:
          type: string

paths:
  /:
    get:
      tags: [Config]
      summary: Server status
      operationId: getRootStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /metrics:
    get:
      tags: [Config]
      summary: Basic metrics
      operationId: getBasicMetrics
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Minimal HTML dashboard
      operationId: getDashboardHtml
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string

  /ai/health:
    get:
      tags: [AI]
      summary: AI health (OpenAI)
      operationId: getAiHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiHealthResponse"

  /ai/quality:
    post:
      tags: [AI]
      security:
        - HTTPBearer: []
      summary: Compute trade quality score
      operationId: postAiQuality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiQualityRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalyzeResponse"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ai-analyze:
    post:
      tags: [AI]
      security:
        - HTTPBearer: []
      summary: Analyze trade idea (AI, same engine as /ai/quality)
      operationId: postAiAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiQualityRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalyzeResponse"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ai/manual-scan:
    get:
      tags: [AI]
      security:
        - HTTPBearer: []
      summary: Manual scan (per symbol)
      operationId: getAiManualScan
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiManualScanResponse"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /trade/sltp:
    post:
      tags: [Trades]
      security:
        - HTTPBearer: []
      summary: Suggest SL/TP (ATR-aware)
      operationId: postTradeSltp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, direction, entry]
              properties:
                symbol:
                  type: string
                direction:
                  type: string
                  enum: [LONG, SHORT]
                entry:
                  type: number
                atr:
                  type:
                    - number
                    - "null"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SLTP3Response"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /trade/execute:
    post:
      tags: [Trades]
      security:
        - HTTPBearer: []
      summary: Execute trade (dry-run by default)
      operationId: postTradeExecute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeExecuteRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeExecuteResponse"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /backtest:
    post:
      tags: [Backtest]
      security:
        - HTTPBearer: []
      summary: Run strategy backtest for a symbol
      operationId: postBacktestRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: BTCUSDT
                timeframe:
                  type: string
                  enum: [5m, 15m, 1h, 4h]
                  default: 15m
                limit:
                  type: integer
                  default: 200
                slippage_pct:
                  type: number
                  default: 0.1
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scan:
    get:
      tags: [Scan]
      security:
        - HTTPBearer: []
      summary: Scanner heartbeat / info
      operationId: getScanInfo
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [Scan]
      security:
        - HTTPBearer: []
      summary: Run single-symbol scan
      operationId: postScanSingle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol:
                  type: string
                  example: BTCUSDT
                timeframe:
                  type: string
                  default: 15m
                limit:
                  type: integer
                  default: 200
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scan/multi:
    post:
      tags: [Scan]
      security:
        - HTTPBearer: []
      summary: Run multi-symbol scan
      operationId: postScanMulti
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                symbols:
                  type: array
                  items:
                    type: string
                timeframe:
                  type: string
                  default: 15m
                limit:
                  type: integer
                  default: 200
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health:
    get:
      tags: [Config]
      summary: Basic health
      operationId: getBasicHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicHealthResponse"

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getLiveness
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"

  /health/strategy-version:
    get:
      tags: [Health]
      summary: Strategy metadata & dependency versions
      operationId: getStrategyVersion
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionResponse"




















