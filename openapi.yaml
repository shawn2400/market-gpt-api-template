openapi: 3.1.0
info:
  title: AlgoGPT API
  version: 2.12.4
  description: >
    AlgoGPT – Real-time algorithmic trader for Binance. Supports Futures/Spot/Grid,
    Multi-TF Scan with AI, live trades, smart SL/TP, Auto Executor, and daily PnL PDF.

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:  { type: string }
      example: { error: Unauthorized, code: UNAUTHORIZED }

    TradeRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol:   { type: string, example: BTCUSDT }
        side:     { type: string, enum: [LONG, SHORT], example: LONG }
        entry:
          type: [number, 'null']
          description: If null, live price is used
          example: null
        sl:       { type: [number, 'null'] }
        tp:       { type: [number, 'null'] }
        budget:   { type: number, minimum: 0.01, default: 100 }
        leverage: { type: integer, minimum: 1, maximum: 125, default: 10 }

    TradeResponse:
      type: object
      properties:
        status: { type: string, enum: [success, error] }
        result:
          type: [object, 'null']
          additionalProperties: true
        error:  { type: [string, 'null'] }

    AiAnalyzeRequest:
      type: object
      required: [symbol, rsi, adx, trend, pattern, volume]
      properties:
        symbol:  { type: string, example: BTCUSDT }
        rsi:     { type: number, example: 54.2 }
        adx:     { type: number, example: 23.1 }
        trend:   { type: string, example: UP }
        pattern: { type: string, example: breakout }
        volume:  { type: number, example: 1520000 }

    AiAnalyzeResponse:
      type: object
      required: [symbol, direction, signal, confidence, reason, frames]
      properties:
        symbol:     { type: string }
        direction:  { type: string }
        signal:     { type: string, enum: [BUY, SELL, HOLD] }
        confidence: { type: number, minimum: 0, maximum: 100 }
        reason:     { type: string }
        frames:
          type: array
          items: { type: string }

    SLTPRequest:
      type: object
      required: [symbol, direction, entry]
      properties:
        symbol:    { type: string, example: BTCUSDT }
        direction: { type: string, enum: [LONG, SHORT] }
        entry:     { type: number, example: 65000 }
        atr:       { type: [number, 'null'], description: Optional ATR }

    SLTPResponse:
      type: object
      properties:
        symbol:    { type: string }
        direction: { type: string, enum: [LONG, SHORT] }
        sl:        { type: number }
        tp:        { type: number }

    ScanResultItem:
      type: object
      properties:
        symbol:        { type: string }
        quality_score: { type: number }
        direction:     { type: string, enum: [LONG, SHORT] }
        trend:         { type: string }
        rsi:           { type: number }
        adx:           { type: number }
        volume:        { type: number }
        market:        { type: string, enum: [futures, spot] }
        frames:
          type: array
          items: { type: string }
        signal:     { type: string, enum: [BUY, SELL, HOLD] }
        confidence: { type: number, minimum: 0, maximum: 100 }
        reason:     { type: string }
        entry:      { type: [number, 'null'] }
        atr:        { type: [number, 'null'] }

    ScanResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ScanResultItem" }

    PriceResponse:
      type: object
      properties:
        symbol: { type: string }
        price:  { type: number }
      example: { symbol: BTCUSDT, price: 65042.8 }

    PnlPdfResponse:
      type: object
      properties:
        path: { type: string, description: Server path to the PDF }
      example: { path: static/reports/pnl_report.pdf }

    GridTradeRequest:
      type: object
      required: [symbol, budget]
      properties:
        symbol:     { type: string, example: BTCUSDT }
        budget:     { type: number, minimum: 0.01, example: 300 }
        grid_count: { type: integer, minimum: 2, maximum: 50, default: 6 }
        grid_pct:   { type: number, minimum: 0.01, maximum: 5, default: 0.4, description: Percent gap between levels }
        leverage:   { type: integer, minimum: 1, maximum: 125, default: 20 }
        futures:    { type: boolean, default: true }
        tp_pct:     { type: number, minimum: 0.01, maximum: 10, default: 1.5 }
        sl_pct:     { type: number, minimum: 0.01, maximum: 10, default: 1.0 }

    GridTradeResponse:
      type: object
      properties:
        status: { type: string, enum: [success, dry_run, error] }
        reason: { type: [string, 'null'] }
        plan:
          type: [object, 'null']
          additionalProperties: true
        result:
          type: [object, 'null']
          additionalProperties: true
        error: { type: [string, 'null'] }

paths:
  /:
    get:
      security: []
      tags: [Config]
      summary: Server status
      operationId: checkServerStatus
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:  { type: string, example: ok }
                  version: { type: string, example: 2.12.4 }

  /scan/multi:
    get:
      security: []
      tags: [Trades]
      summary: Market scan (Multi-TF + AI) — public
      operationId: scanMulti
      parameters:
        - name: interval
          in: query
          schema: { type: string, default: "15m,1h" }
        - name: min_quality
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
        - name: top
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
        - name: market_type
          in: query
          schema: { type: string, enum: [futures, spot], default: futures }
        - name: trending_only
          in: query
          description: If null, taken from config
          schema:
            type: ['boolean', 'null']
            default: null
        - name: trending_source
          in: query
          schema: { type: string, default: coingecko }
      responses:
        "200":
          description: Filtered trades
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }

  /trade:
    post:
      security: [{ bearerAuth: [] }]
      tags: [Trades]
      summary: Execute a live trade
      operationId: placeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeRequest" }
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai-analyze:
    post:
      security: [{ bearerAuth: [] }]
      tags: [AI]
      summary: Manual AI analysis
      operationId: aiAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAnalyzeRequest" }
      responses:
        "200":
          description: Analysis created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalyzeResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sltp:
    post:
      security: [{ bearerAuth: [] }]
      tags: [Trades]
      summary: Suggest optimal SL/TP
      operationId: suggestSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SLTPRequest" }
      responses:
        "200":
          description: Suggested levels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLTPResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /price:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Trades]
      summary: Get live Binance price
      operationId: getPrice
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        "200":
          description: Price fetched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /grid/trade:
    post:
      security: [{ bearerAuth: [] }]
      tags: [Grid]
      summary: Open grid orders (Spot/Futures)
      operationId: executeGrid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GridTradeRequest" }
      responses:
        "200":
          description: Plan and execution/DRY-RUN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridTradeResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/start:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Executor]
      summary: Start Auto Executor
      operationId: startExecutor
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                  running: { type: boolean }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/stop:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Executor]
      summary: Stop Auto Executor
      operationId: stopExecutor
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: { type: boolean }
                  running: { type: boolean }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/status:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Executor]
      summary: Auto Executor status
      operationId: executorStatus
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /report/pnl/pdf:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Reports]
      summary: Generate daily PnL PDF
      operationId: generatePnlPdf
      responses:
        "200":
          description: PDF path created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PnlPdfResponse" }
        "404":
          description: No data to export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /debug/binance-futures:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Debug]
      summary: Binance Futures connectivity/permissions test (includes TEST order)
      operationId: debugBinanceFutures
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: BTCUSDT }
        - name: place_test
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Binance debug results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ping_ok: { type: boolean }
                  mark_price:
                    type: [object, 'null']
                    additionalProperties: true
                  symbols_count: { type: [integer, 'null'] }
                  test_order_ok: { type: boolean }
                  test_order_error: { type: [string, 'null'] }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

security:
  - bearerAuth: []







