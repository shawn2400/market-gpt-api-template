openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: AlgoGPT API
  version: 2.14.3
  description: >
    AlgoGPT — מסחר אלגוריתמי בזמן אמת ב-Binance (Futures/Spot).
    כולל: Scan / AI / Trades / Backtest / News / Grid / Risk / Indicators / Analytics.

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

tags:
  - name: Config
  - name: Debug
  - name: Grid
  - name: Scan
  - name: AI
  - name: Trades
  - name: Backtest
  - name: Indicators
  - name: Analytics
  - name: News
  - name: Health
  - name: Dashboard
  - name: Risk
  - name: Snapshots

security:
  - HTTPBearer: []

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        detail: { type: string, example: Unauthorized }

    BasicStatus:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 2.14.3 }

    MetricsResponse:
      type: object
      properties:
        boot_ts: { type: integer }
        uptime_sec: { type: integer }

    RoutesList:
      type: object
      properties:
        count: { type: integer, example: 25 }
        routes:
          type: array
          items:
            type: object
            properties:
              path: { type: string, example: /grid/status }
              methods: { type: array, items: { type: string } }

    GridStatus:
      type: object
      properties:
        ok: { type: boolean }
        running: { type: boolean }
        workers: { type: integer }
        queue_size: { type: integer }

    ScanInfo:
      type: object
      properties:
        ok: { type: boolean }
        now_utc: { type: string }
        executor_running: { type: boolean }
        config: { type: object }

    ScanSignal:
      type: object
      properties:
        symbol: { type: string }
        market: { type: string }
        interval: { type: string }
        trend: { type: string }
        direction: { type: string }
        rsi: { type: number }
        adx: { type: number }
        volume: { type: number }
        quality_score: { type: number }
        signal: { type: string }
        confidence: { type: integer }
        reason: { type: string }
        close: { type: number }
        atr: { type: number }

    ScanResponse:
      type: object
      properties:
        ok: { type: boolean }
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ScanSignal" }

    AiHealthResponse:
      type: object
      properties:
        ok: { type: boolean }
        model: { type: string }
        latency_ms: { type: number }
        error: { type: string }

    AiQualityRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol: { type: string }
        side: { type: string, enum: [LONG, SHORT] }
        entry: { type: number }
        sl: { type: number }
        tp: { type: number }
        leverage: { type: integer }
        budget: { type: number }

    AiAnalyzeResponse:
      type: object
      properties:
        quality_score: { type: number }
        success_pct: { type: number }
        anchor: { type: object }
        components: { type: object }

paths:
  /:
    get:
      tags: [Config]
      summary: Server status
      operationId: getRootStatus
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicStatus" }

  /metrics:
    get:
      tags: [Config]
      summary: Basic metrics
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResponse" }

  /__routes:
    get:
      tags: [Debug]
      summary: Registered routes
      operationId: getRoutesList
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutesList" }

  /grid/status:
    get:
      tags: [Grid]
      summary: Grid status
      operationId: getGridStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridStatus" }
        "401":
          description: unauthorized

  /scan/info:
    get:
      tags: [Scan]
      summary: Scanner status
      operationId: getScanInfo
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanInfo" }

  /scan:
    get:
      tags: [Scan]
      summary: Multi-symbol or auto scan
      operationId: getScan
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }

  /ai/health:
    get:
      tags: [AI]
      summary: AI health check
      operationId: getAiHealth
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiHealthResponse" }

  /ai/quality:
    post:
      tags: [AI]
      summary: Compute trade quality
      operationId: postAiQuality
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiQualityRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalyzeResponse" }
        "401":
          description: unauthorized



































