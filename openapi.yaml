openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים,
    טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.
  version: 1.3.0

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: Reports
  - name: AI
  - name: Config
  - name: News

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    get:
      tags: [Trades]
      summary: סריקה חיה של שוק Binance Futures לפי אינדיקטורים
      operationId: scanFutures
      responses:
        '200':
          description: רשימת סמלים עם ניתוחים טכניים
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד בפועל
      operationId: executeLiveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                direction:
                  type: string
                leverage:
                  type: integer
                budget:
                  type: number
                use_grid:
                  type: boolean
                use_trailing:
                  type: boolean
                user_id:
                  type: string
      responses:
        '200':
          description: תוצאה מלאה מהשרת
        '500':
          description: שגיאת שרת

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות לפי תקציב, מינוף ומחיר
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                price:
                  type: number
                leverage:
                  type: number
                budget:
                  type: number
      responses:
        '200':
          description: כמות מחושבת
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL ו־TP על בסיס ניתוח גרפי
      operationId: calculateSlTp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                df:
                  type: array
                  items:
                    type: object
                direction:
                  type: string
      responses:
        '200':
          description: תוצאה עם SL ו־TP
        '500':
          description: שגיאה פנימית

  /backtest:
    post:
      tags: [Trades]
      summary: הרצת סימולציית Backtest
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                symbol:
                  type: string
                interval:
                  type: string
      responses:
        '200':
          description: תוצאות הסימולציה
        '400':
          description: חוסר נתונים
        '500':
          description: שגיאה כללית

  /ai-analyze:
    post:
      tags: [AI]
      summary: ניתוח שוק בעזרת GPT
      operationId: analyzeWithAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: number
      responses:
        '200':
          description: פלט GPT
          content:
            application/json:
              schema:
                type: object
                properties:
                  trend:
                    type: string
                  confidence:
                    type: number

  /news:
    get:
      tags: [News]
      summary: שליפת חדשות קריפטו
      operationId: getNews
      responses:
        '200':
          description: רשימת חדשות

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח סנטימנט של החדשות
      operationId: analyzeNews
      responses:
        '200':
          description: תוצאה ניתוח סנטימנט

  /daily-report:
    get:
      tags: [Reports]
      summary: יצירת דוח יומי כולל base64 PDF (אפשרות סינון לפי תאריך)
      operationId: generateDailyReport
      parameters:
        - name: date
          in: query
          description: תאריך סינון להצגת דוחות עד לתאריך זה (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: דוח בפורמט base64 עם סיכום לפי ימים
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  base64_pdf:
                    type: string
                    description: קובץ PDF מקודד כ־base64
                  summary:
                    type: array
                    description: טבלת סיכום PNL לפי ימים
                    items:
                      type: object
                      properties:
                        Date:
                          type: string
                        Total PNL:
                          type: number
                        Trades:
                          type: integer
                        Success Rate:
                          type: number
        '500':
          description: שגיאת שרת כללית

components:
  schemas: {}














































