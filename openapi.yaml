openapi: 3.1.0
info:
  title: Market GPT API
  version: 1.0.0
  description: API for calculating SL/TP, saving trades, and analyzing trade setups.
servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /auto-sl-tp:
    post:
      summary: Calculate automatic Stop Loss and Take Profit
      operationId: autoSlTp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                atr_sl:
                  type: number
                atr_tp:
                  type: number
              required:
                - symbol
                - entry
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  stop:
                    type: number
                  tp:
                    type: number
                  rrr:
                    type: number

  /analyze-trade:
    post:
      summary: Analyze risk/reward of a trade
      operationId: analyzeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
              required:
                - entry
                - stop
                - tp
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  rrr:
                    type: number

  /save-trade:
    post:
      summary: Save trade data
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                rrr:
                  type: number
              required:
                - symbol
                - entry
      responses:
        '200':
          description: Trade saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /get-trades:
    get:
      summary: Get all saved trades
      operationId: getTrades
      responses:
        '200':
          description: List of saved trades
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /clear-trades:
    post:
      summary: Clear all saved trades
      operationId: clearTrades
      responses:
        '200':
          description: Trades cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string


