openapi: 3.1.0
info:
  title: AlgoGPT API
  description: >
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים,
    טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.
  version: 2.0.1
servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: Reports
  - name: AI
  - name: Executor
  - name: Config
  - name: News

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל

  /scan:
    post:
      tags: [Trades]
      summary: סריקה טכנית חיה
      operationId: scanLiveMarket
      requestBody:
        required: false
      responses:
        '200':
          description: הצלחה

  /scan/multi:
    get:
      tags: [Trades]
      summary: סריקת Multi-TF עם AI
      operationId: multiTfScan
      parameters:
        - name: market
          in: query
          required: false
          schema:
            type: string
        - name: trending_only
          in: query
          required: false
          schema:
            type: boolean
        - name: trending_source
          in: query
          required: false
          schema:
            type: string
        - name: top
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: הצלחה

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד חי בפועל
      operationId: executeTrade
      requestBody:
        required: true
      responses:
        '200':
          description: טרייד בוצע

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות לפי תקציב ומינוף
      operationId: calculateQuantity
      requestBody:
        required: true
      responses:
        '200':
          description: הכמות חושבה

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL ו־TP חכם
      operationId: calculateSLTP
      requestBody:
        required: true
      responses:
        '200':
          description: סטופ וטייק חושבו

  /backtest:
    post:
      tags: [Trades]
      summary: הרצת Backtest
      operationId: runBacktest
      requestBody:
        required: true
      responses:
        '200':
          description: backtest הושלם

  /ai-analyze:
    post:
      tags: [AI]
      summary: חיזוי AI גרפי
      operationId: aiPricePrediction
      requestBody:
        required: true
      responses:
        '200':
          description: AI ניתח טווח

  /predict-sl-tp:
    post:
      tags: [AI]
      summary: חיזוי SL ו־TP עם GPT
      operationId: aiPredictSLTP
      requestBody:
        required: true
      responses:
        '200':
          description: SL/TP נוצרו

  /news:
    get:
      tags: [News]
      summary: קבלת חדשות קריפטו
      operationId: getCryptoNews
      responses:
        '200':
          description: חדשות נשלפו

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח סנטימנט חדשות
      operationId: analyzeNews
      responses:
        '200':
          description: סנטימנט נוצר

  /daily-report:
    get:
      tags: [Reports]
      summary: הפקת דוח יומי PDF
      operationId: getDailyReport
      responses:
        '200':
          description: דוח PDF נוצר

  /executor/start:
    get:
      tags: [Executor]
      summary: התחלת Auto Executor
      operationId: startAutoExecutor
      responses:
        '200':
          description: לולאה התחילה

  /executor/stop:
    get:
      tags: [Executor]
      summary: עצירת Auto Executor
      operationId: stopAutoExecutor
      responses:
        '200':
          description: לולאה נעצרה

  /executor/status:
    get:
      tags: [Executor]
      summary: בדיקת סטטוס Auto Executor
      operationId: getExecutorStatus
      responses:
        '200':
          description: סטטוס נשלף

























































