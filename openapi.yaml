openapi: 3.1.0
info:
  title: AlgoGPT API
  description: >
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת עבור Binance.
    כולל תמיכה ב־Futures, Spot, Grid, ניתוחים טכניים, AI, דוחות ו־Auto Executor.
  version: 2.0.5

servers:
  - url: https://algogpt-docker.onrender.com

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ScanRequest:
      type: object
      properties:
        market:
          type: string
          example: futures
        min_quality:
          type: integer
          example: 6
        top:
          type: integer
          example: 1
        trending_only:
          type: boolean
        trending_source:
          type: string
          example: coingecko

    TradeRequest:
      type: object
      properties:
        symbol:
          type: string
        entry:
          type: number
        stop:
          type: number
        target:
          type: number
        direction:
          type: string
          enum: [LONG, SHORT]
        leverage:
          type: number
        budget:
          type: number
        market:
          type: string
          enum: [futures, spot]
        trailing:
          type: boolean

    QuantityRequest:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        leverage:
          type: number
        budget:
          type: number

    SLTPRequest:
      type: object
      properties:
        df:
          type: array
          items:
            type: object
        direction:
          type: string

    PredictSLTPRequest:
      type: object
      properties:
        symbol:
          type: string
        direction:
          type: string
        entry:
          type: number

    AiAnalyzeRequest:
      type: object
      properties:
        rsi:
          type: number
        adx:
          type: number
        trend:
          type: string
        volume:
          type: string
        pattern:
          type: string

    BacktestRequest:
      type: object
      properties:
        prices:
          type: array
          items:
            type: object
        symbol:
          type: string
        interval:
          type: string

    GridTradeRequest:
      type: object
      properties:
        symbol:
          type: string
        budget:
          type: number
        grid_count:
          type: integer
        grid_pct:
          type: number
        leverage_min:
          type: integer
        leverage_max:
          type: integer
        direction:
          type: string
          enum: [BUY, SELL, BOTH]
        tp_pct:
          type: number
        sl_pct:
          type: number
        futures:
          type: boolean

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל

  /scan:
    post:
      tags: [Trades]
      summary: סריקה טכנית חיה
      operationId: scanMarket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: הצלחה

  /scan/multi:
    get:
      tags: [Trades]
      summary: סריקת Multi-TF עם AI
      operationId: multiTfScan
      parameters:
        - name: market
          in: query
          schema:
            type: string
            enum: [futures, spot, grid]
        - name: trending_only
          in: query
          schema:
            type: boolean
        - name: trending_source
          in: query
          schema:
            type: string
            enum: [binance, coingecko, lunarcrush]
        - name: top
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: הצלחה

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד חי בפועל
      operationId: executeTrade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '200':
          description: בוצע

  /grid/trade:
    post:
      tags: [Grid]
      summary: פתיחת גריד מול Binance
      operationId: executeGrid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridTradeRequest'
      responses:
        '200':
          description: פקודות הגריד נשלחו

  /grid/status:
    get:
      tags: [Grid]
      summary: סטטוס גרידים פעילים
      operationId: gridStatus
      responses:
        '200':
          description: סטטוס נשלף
        '404':
          description: אין גריד פעיל

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות לפי תקציב ומינוף
      operationId: calculateQuantity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantityRequest'
      responses:
        '200':
          description: הצלחה

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL ו־TP
      operationId: calcSLTP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLTPRequest'
      responses:
        '200':
          description: חושב

  /predict-sl-tp:
    post:
      tags: [AI]
      summary: חיזוי SL/TP עם GPT
      operationId: predictSLTP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictSLTPRequest'
      responses:
        '200':
          description: חוזה

  /ai-analyze:
    post:
      tags: [AI]
      summary: ניתוח שוק עם GPT
      operationId: analyzeAI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalyzeRequest'
      responses:
        '200':
          description: ניתוח נוצר

  /backtest:
    post:
      tags: [Trades]
      summary: הרצת Backtest
      operationId: runBacktest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: הסתיים

  /news:
    get:
      tags: [News]
      summary: חדשות קריפטו
      operationId: getNews
      responses:
        '200':
          description: נשלפו

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח חדשות GPT
      operationId: analyzeNews
      responses:
        '200':
          description: ניתוח נשלח

  /daily-report:
    get:
      tags: [Reports]
      summary: הפקת דוח יומי PDF
      operationId: dailyReport
      responses:
        '200':
          description: נוצר
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /executor/start:
    get:
      tags: [Executor]
      summary: התחלת Auto Executor
      operationId: startExecutor
      responses:
        '200':
          description: התחיל

  /executor/stop:
    get:
      tags: [Executor]
      summary: עצירת Auto Executor
      operationId: stopExecutor
      responses:
        '200':
          description: נעצר

  /executor/status:
    get:
      tags: [Executor]
      summary: סטטוס Auto Executor
      operationId: executorStatus
      responses:
        '200':
          description: פועל/לא

  /price:
    get:
      tags: [Trades]
      summary: שליפת מחיר נוכחי מ־Binance
      operationId: getPrice
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: TWTUSDT
      responses:
        '200':
          description: מחיר נשלף
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  price:
                    type: number

security:
  - bearerAuth: []































































