openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים,
    טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.
  version: 1.3.0

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: Reports
  - name: AI
  - name: Config
  - name: News

paths:
  /:
    get:
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    get:
      summary: סריקה חיה של שוק Binance Futures לפי אינדיקטורים
      operationId: scanFuturesMarket
      responses:
        '200':
          description: רשימת סמלים עם נתונים טכניים
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                          example: ETHUSDT
                        last_price:
                          type: number
                          example: 2920.15
                        volume:
                          type: number
                          example: 35000000
                        rsi:
                          type: number
                          example: 28.7
                        adx:
                          type: number
                          example: 21.2
                        direction:
                          type: string
                          example: LONG

  /backtest:
    post:
      summary: ביצוע סימולציית Backtest על סדרת מחירים
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume:
                        type: number
      responses:
        '200':
          description: תוצאות backtest
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  interval:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                        signal:
                          type: string
                          example: LONG
                        entry:
                          type: number
                        stop:
                          type: number
                        tp:
                          type: number
                        exit:
                          type: number
                        rrr:
                          type: number
                        pnl:
                          type: number
                        success:
                          type: boolean
                        quality_score:
                          type: number
                  success_count:
                    type: number
                  total_trades:
                    type: number
                  avg_quality:
                    type: number
        '400':
          description: חסרה היסטוריית מחירים
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Insufficient data – at least 30 candles are required
                  code:
                    type: string
                    example: ERR_TOO_SHORT

  /execute-trade:
    post:
      summary: ביצוע טרייד בפועל על Binance Futures
      operationId: executeLiveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                direction:
                  type: string
                  enum: [LONG, SHORT]
                leverage:
                  type: number
                budget_usd:
                  type: number
                use_grid:
                  type: boolean
                use_trailing:
                  type: boolean
      responses:
        '200':
          description: תוצאה של ביצוע הטרייד
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  confidence:
                    type: number
                    example: 88.4
                  quality_score:
                    type: number
                    example: 7
                  quantity:
                    type: number
                  snapshot:
                    type: string
                  news_score:
                    type: number
        '400':
          description: שגיאה בביצוע
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string

  /calculate-quantity:
    post:
      summary: חישוב כמות נכונה למסחר לפי מחיר, מינוף ותקציב
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                price:
                  type: number
                leverage:
                  type: number
                budget:
                  type: number
      responses:
        '200':
          description: תוצאה של החישוב
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number

  /daily-report:
    get:
      summary: הפקת דוח יומי כולל סטטיסטיקות
      operationId: getDailyReport
      responses:
        '200':
          description: דוח PDF מוצלח (ב־base64 או קובץ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  base64_pdf:
                    type: string

  /news:
    get:
      summary: שליפת חדשות קריפטו וניתוח סנטימנט
      operationId: getNewsSentiment
      responses:
        '200':
          description: רשימת חדשות עם ניקוד סנטימנט
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    published_at:
                      type: string
                    url:
                      type: string
                    impact_score:
                      type: number

  /ai-analyze:
    post:
      summary: ניתוח גרפי וסטטיסטי באמצעות AI
      operationId: aiAnalyzeChart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: number
      responses:
        '200':
          description: פלט ניתוח AI
          content:
            application/json:
              schema:
                type: object
                properties:
                  trend:
                    type: string
                    example: UP
                  confidence:
                    type: number
                    example: 92.3

components:
  schemas: {}











































