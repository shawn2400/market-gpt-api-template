openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים, 
    טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.
  version: 1.1.0

servers:
  - url: https://algogpt-docker.onrender.com

paths:

  /:
    get:
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    get:
      summary: סריקה חיה של שוק Binance Futures לפי אינדיקטורים
      operationId: scanFuturesMarket
      responses:
        '200':
          description: רשימת סמלים עם נתונים טכניים
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                          example: ETHUSDT
                        last_price:
                          type: number
                          example: 2920.15
                        volume:
                          type: number
                          example: 35000000
                        rsi:
                          type: number
                          example: 28.7
                        adx:
                          type: number
                          example: 21.2
                        direction:
                          type: string
                          example: LONG

  /scan-and-execute:
    post:
      summary: סריקה חיה + ביצוע טרייד מיידי לפי חוקים מוגדרים
      operationId: scanAndExecute
      responses:
        '200':
          description: תוצאה של טרייד שבוצע
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  symbol:
                    type: string
                    example: ETHUSDT
                  entry_price:
                    type: number
                    example: 2915.4
                  stop:
                    type: number
                    example: 2868.1
                  tp:
                    type: number
                    example: 3032.7
                  quantity:
                    type: number
                    example: 0.036
                  leverage:
                    type: number
                    example: 10
                  confidence:
                    type: number
                    example: 91.2
                  quality_score:
                    type: number
                    example: 7
                  news_score:
                    type: number
                    example: 1
                  snapshot:
                    type: string
                    example: snapshots/ETHUSDT_LONG_2025-07-28.png

  /backtest:
    post:
      summary: ביצוע סימולציית Backtest על סדרת מחירים
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume:
                        type: number
      responses:
        '200':
          description: תוצאות backtest
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                    signal:
                      type: string
                      example: LONG
                    entry:
                      type: number
                    stop:
                      type: number
                    tp:
                      type: number
                    exit:
                      type: number
                    rrr:
                      type: number
                    pnl:
                      type: number
                    success:
                      type: boolean
                    quality_score:
                      type: number
        '400':
          description: חסרה היסטוריית מחירים
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Insufficient data – at least 30 candles are required
                  code:
                    type: string
                    example: ERR_TOO_SHORT

  /execute-trade:
    post:
      summary: ביצוע טרייד בפועל על Binance Futures
      operationId: executeLiveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: ETHUSDT
                entry:
                  type: number
                  example: 2910.1
                stop:
                  type: number
                  example: 2875.5
                tp:
                  type: number
                  example: 3012.3
                direction:
                  type: string
                  enum: [LONG, SHORT]
                leverage:
                  type: number
                  example: 10
                budget_usd:
                  type: number
                  example: 100
                use_grid:
                  type: boolean
                  example: false
                use_trailing:
                  type: boolean
                  example: false
      responses:
        '200':
          description: תוצאה של ביצוע הטרייד
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  confidence:
                    type: number
                    example: 88.4
                  quality_score:
                    type: number
                    example: 7
                  quantity:
                    type: number
                  snapshot:
                    type: string
                  news_score:
                    type: number
        '400':
          description: שגיאה בביצוע
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string

  /calculate-quantity:
    post:
      summary: חישוב כמות נכונה למסחר לפי מחיר, מינוף ותקציב
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: ETHUSDT
                price:
                  type: number
                  example: 2912.1
                leverage:
                  type: number
                  example: 10
                budget:
                  type: number
                  example: 100
      responses:
        '200':
          description: תוצאה של החישוב
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number
                    example: 0.0345

  /sl_tp:
    post:
      summary: חישוב SL/TP לפי ATR ו־RRR
      operationId: calculateStopTake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                df:
                  type: array
                  description: רשימת נרות
                  items:
                    type: object
                    properties:
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                direction:
                  type: string
                  enum: [LONG, SHORT]
      responses:
        '200':
          description: תוצאה עם סטופ וטייק מחושבים
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    type: number
                  stop:
                    type: number
                  tp:
                    type: number

  /save:
    post:
      summary: שמירת טרייד לסטטיסטיקות וביצועים עתידיים
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                direction:
                  type: string
                leverage:
                  type: number
                confidence:
                  type: number
                quality_score:
                  type: number
                type:
                  type: string
                  example: REGULAR
      responses:
        '200':
          description: שמירה הושלמה
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success









































