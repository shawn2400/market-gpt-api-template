openapi: 3.1.0
info:
  title: AlgoGPT API
  version: "1.3.1"
  description: |
    AlgoGPT – סוחר אלגוריתמי בזמן אמת (Binance Futures/Spot/Grid/AI)
    כולל טריידים חיים, גרידים, דוחות, ניתוחים חכמים, ניהול סיכונים, TP/SL חכם ועוד.

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: Reports
  - name: AI
  - name: Config
  - name: News

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /scan:
    get:
      tags: [Trades]
      summary: סריקת שוק Binance (Futures/Spot) לפי אינדיקטורים
      operationId: scanMarket
      parameters:
        - name: min_quality
          in: query
          schema:
            type: integer
          description: ציון איכות מינימלי (0–7)
        - name: interval
          in: query
          schema:
            type: string
          description: טיימפריים לניתוח (כגון 1m, 5m, 15m)
        - name: limit
          in: query
          schema:
            type: integer
          description: מספר מטבעות לבדיקה
      responses:
        '200':
          description: רשימת סמלים עם ניתוחים טכניים
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScanSymbol'
        '500':
          description: שגיאת שרת

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד בפועל (Futures/Spot/Grid)
      operationId: executeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '200':
          description: פרטי טרייד מלאים
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          description: שגיאה בבקשה
        '500':
          description: שגיאת שרת

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות לפי תקציב, מינוף ומחיר
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantityRequest'
      responses:
        '200':
          description: כמות מחושבת
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number
        '400':
          description: שגיאת חישוב כמות

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL ו־TP לפי DataFrame וכיוון
      operationId: calculateSlTp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLTPRequest'
      responses:
        '200':
          description: SL ו־TP מחושבים
          content:
            application/json:
              schema:
                type: object
                properties:
                  sl:
                    type: number
                  tp:
                    type: number
        '500':
          description: שגיאה פנימית

  /backtest:
    post:
      tags: [Trades]
      summary: הרצת Backtest לפי סדרת מחירים
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: תוצאות הסימולציה
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  interval:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BacktestResult'
                  success_count:
                    type: integer
                  total_trades:
                    type: integer
                  avg_quality:
                    type: number
        '400':
          description: חוסר נתונים
        '500':
          description: שגיאה כללית

  /ai-analyze:
    post:
      tags: [AI]
      summary: ניתוח שוק בעזרת GPT
      operationId: aiAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAnalysisRequest'
      responses:
        '200':
          description: תוצאה מ־AI
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  score:
                    type: number

  /news:
    get:
      tags: [News]
      summary: שליפת חדשות קריפטו
      operationId: fetchCryptoNews
      responses:
        '200':
          description: רשימת חדשות
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח סנטימנט חדשות
      operationId: analyzeNewsImpact
      responses:
        '200':
          description: תוצאת ניתוח סנטימנט
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /daily-report:
    get:
      tags: [Reports]
      summary: דוח יומי כולל base64 PDF
      operationId: generateDailyReport
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          required: false
          description: תאריך סינון (YYYY-MM-DD)
      responses:
        '200':
          description: דוח PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  base64_pdf:
                    type: string
                  summary:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailySummary'
        '500':
          description: שגיאת שרת

components:
  schemas:
    ScanSymbol:
      type: object
      properties:
        symbol:
          type: string
        close:
          type: number
        volume:
          type: number
        rsi:
          type: number
        adx:
          type: number
        macd:
          type: number
        macd_hist:
          type: number
        ema_21:
          type: number
        ema_50:
          type: number
        vwap:
          type: number
        bb_upper:
          type: number
        bb_lower:
          type: number
        stoch_k:
          type: number
        stoch_d:
          type: number
        obv:
          type: number
        cci:
          type: number
        mfi:
          type: number
        atr:
          type: number
        direction:
          type: string
        quality_score:
          type: integer

    TradeRequest:
      type: object
      required:
        - symbol
        - entry
        - stop
        - tp
        - direction
        - leverage
      properties:
        symbol:
          type: string
        entry:
          type: number
        stop:
          type: number
        tp:
          type: number
        direction:
          type: string
          enum: [LONG, SHORT]
        leverage:
          type: integer
        budget:
          type: number
        use_grid:
          type: boolean
        use_trailing:
          type: boolean
        user_id:
          type: string
        take_snapshot:
          type: boolean

    TradeResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        symbol:
          type: string
        entry:
          type: number
        price_now:
          type: number
        quantity:
          type: number
        stop:
          type: number
        tp:
          type: number
        leverage:
          type: integer
        side:
          type: string
        confidence:
          type: number
        quality_score:
          type: number
        news_score:
          type: number
        snapshot:
          type: string
        trailing:
          type: boolean
        grid:
          type: boolean
        message:
          type: string

    QuantityRequest:
      type: object
      required: [symbol, price, leverage, budget]
      properties:
        symbol:
          type: string
        price:
          type: number
        leverage:
          type: number
        budget:
          type: number

    SLTPRequest:
      type: object
      required: [df, direction]
      properties:
        df:
          type: array
          items:
            type: object
        direction:
          type: string

    BacktestRequest:
      type: object
      required: [prices, symbol, interval]
      properties:
        prices:
          type: array
          items:
            type: object
        symbol:
          type: string
        interval:
          type: string

    BacktestResult:
      type: object
      properties:
        timestamp:
          type: string
        close:
          type: number
        signal:
          type: string
        quality_score:
          type: number
        success:
          type: boolean

    AIAnalysisRequest:
      type: object
      required: [rsi, adx, trend, volume, pattern]
      properties:
        rsi:
          type: number
        adx:
          type: number
        trend:
          type: string
        volume:
          type: number
        pattern:
          type: string

    DailySummary:
      type: object
      properties:
        Date:
          type: string
        Total_PNL:
          type: number
        Trades:
          type: integer
        Success_Rate:
          type: number
















































