openapi: 3.1.0
info:
  title: Crypto Trade Assistant API
  description: API לניתוח טכני, חישוב SL/TP, שמירת טריידים ועוד
  version: 1.0.0
servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /analyze:
    post:
      summary: ניתוח טכני
      operationId: analyzeSymbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: ETHUSDT
      responses:
        '200':
          description: ניתוח טכני בסיסי
          content:
            application/json:
              schema:
                type: object
                properties:
                  signal:
                    type: string
                  details:
                    type: string

  /calculate-sl-tp:
    post:
      summary: חישוב SL ו־TP
      operationId: calculateSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                  example: 3.5
                stop:
                  type: number
                  example: 3.3
                target:
                  type: number
                  example: 3.8
      responses:
        '200':
          description: תוצאת חישוב RRR
          content:
            application/json:
              schema:
                type: object
                properties:
                  rrr:
                    type: number
                  profit_percent:
                    type: number
                  loss_percent:
                    type: number

  /calculate-quantity:
    post:
      summary: חישוב כמות מטבעות
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                leverage:
                  type: number
                budget:
                  type: number
      responses:
        '200':
          description: תוצאת חישוב כמות
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number
                  formula:
                    type: string

  /save-trade:
    post:
      summary: שמירת טרייד בזיכרון
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trade'
      responses:
        '200':
          description: טרייד נשמר

  /get-trades:
    get:
      summary: הצגת כל הטריידים
      operationId: getTrades
      responses:
        '200':
          description: רשימת טריידים
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'

  /clear-trades:
    post:
      summary: ניקוי כל הטריידים
      operationId: clearTrades
      responses:
        '200':
          description: הטריידים נוקו

components:
  schemas:
    Trade:
      type: object
      properties:
        symbol:
          type: string
        entry:
          type: number
        stop:
          type: number
        target:
          type: number
        quantity:
          type: number
        leverage:
          type: number
        budget:
          type: number
        confidence:
          type: number






