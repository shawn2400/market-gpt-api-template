openapi: 3.1.0
info:
  title: AlgoGPT API
  description: API לחישוב SL/TP, ניתוחים טכניים, שמירת טריידים, גרפים וחישובים בזמן אמת לפי כל חוקי Algo Pro Elite
  version: 1.0.0
servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /price:
    get:
      summary: שלוף מחיר חי למטבע
      operationId: get_price
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: מחיר חי

  /analyze:
    post:
      summary: ניתוח טכני וגרף
      operationId: analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prices
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    required: [open, high, low, close]
                    properties:
                      open: { type: number }
                      high: { type: number }
                      low: { type: number }
                      close: { type: number }
      responses:
        '200':
          description: אות קנייה/מכירה + RSI, MACD וגרף
        '400':
          description: שגיאה בקלט
        '500':
          description: שגיאת שרת

  /calculate-sl-tp:
    post:
      summary: חשב SL/TP ו־RRR לפי חוקי RRR ≥ 2.0 ו־ATR
      operationId: calculate_sl_tp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry, stop, target]
              properties:
                entry: { type: number }
                stop: { type: number }
                target: { type: number }
      responses:
        '200':
          description: תוצאה של SL/TP ו־RRR

  /calculate-quantity:
    post:
      summary: חשב כמות לפי תקציב ומינוף (5×–35× בלבד)
      operationId: calculate_quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget, entry, leverage]
              properties:
                budget: { type: number }
                entry: { type: number }
                leverage: { type: number }
      responses:
        '200':
          description: כמות לחישוב

  /save-trade:
    post:
      summary: שמור את הטרייד לפי כל הכללים (Confidence מ־88%, SL, RRR וכו')
      operationId: save_trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, entry, stop, tp, leverage, direction, confidence, type, order_type]
              properties:
                symbol:
                  type: string
                  description: סימבול (למשל BTCUSDT)
                entry:
                  type: number
                  description: מחיר כניסה
                stop:
                  type: number
                  description: SL
                tp:
                  type: number
                  description: TP
                leverage:
                  type: number
                  description: מינוף (5×–35×)
                direction:
                  type: string
                  enum: [LONG, SHORT]
                  description: לונג או שורט
                confidence:
                  type: number
                  description: רמת ביטחון %
                type:
                  type: string
                  enum: [REGULAR, GRID]
                  description: סוג הטרייד
                order_type:
                  type: string
                  enum: [LIMIT, STOP_LIMIT]
                  description: סוג ההזמנה
      responses:
        '200':
          description: הטרייד נשמר
        '400':
          description: שגיאה - תנאים לא מולאו

  /get-trades:
    get:
      summary: הצג את כל הטריידים
      operationId: get_trades
      responses:
        '200':
          description: רשימת טריידים שמורים

  /clear-trades:
    post:
      summary: מחק את כל הטריידים
      operationId: clear_trades
      responses:
        '200':
          description: נמחקו כל הטריידים

  /active-trade:
    get:
      summary: בדוק אם יש טרייד פתוח כרגע (status = OPEN)
      operationId: active_trade
      responses:
        '200':
          description: טרייד פתוח (אם קיים)

  /update-trade:
    post:
      summary: עדכן סטטוס טרייד ל־CLOSED לפי סימבול
      operationId: update_trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol:
                  type: string
                  description: סימבול של הטרייד לעדכון
      responses:
        '200':
          description: הסטטוס עודכן ל־CLOSED
        '404':
          description: לא נמצא טרייד פתוח

  /backtest:
    post:
      summary: הרץ בדיקת רטרוספקטיבה (Backtest) על מחירים היסטוריים
      operationId: backtest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    required: [open, high, low, close]
                    properties:
                      open: { type: number }
                      high: { type: number }
                      low: { type: number }
                      close: { type: number }
      responses:
        '200':
          description: רשימת טריידים תקפים לפי הכללים
















