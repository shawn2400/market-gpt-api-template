openapi: 3.1.0
info:
  title: Market GPT API בעברית
  version: 1.0.0
description: |
  API אישי ל־GPT שמבצע חישובי SL/TP, גרידים חכמים, ניתוחים בזמן אמת, יציאות לפי RRR, תמיכה ב־Limit ו־Trailing, שמירה ל־CSV וניתוח 24h/7d.
  כולל פקודות מוכנות (Presets) בעברית.
servers:
  - url: https://market-gpt-api-template.onrender.com
paths:
  /auto-sl-tp:
    post:
      operationId: autoSlTp
      summary: חשב SL/TP אוטומטי
      description: מחשב סטופ לוס וטייק פרופיט לפי ATR ויחס סיכון/רווח.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                atr_sl:
                  type: number
                atr_tp:
                  type: number
              required: [symbol, entry]
      responses:
        '200':
          description: תוצאה עם SL, TP ו־RRR

  /analyze-trade:
    post:
      operationId: analyzeTrade
      summary: חשב RRR
      description: מחשב יחס סיכון/רווח לפי כניסה, סטופ וטייק.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
              required: [entry, stop, tp]
      responses:
        '200':
          description: מחזיר רק RRR

  /save-trade:
    post:
      operationId: saveTrade
      summary: שמור טרייד
      description: שומר טרייד כולל פרטי Limit, Trailing, SL/TP ו־RRR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                rrr:
                  type: number
                direction:
                  type: string
                limit:
                  type: boolean
                trailing:
                  type: boolean
              required: [symbol, entry, stop, tp]
      responses:
        '200':
          description: טרייד נשמר בהצלחה

  /get-trades:
    get:
      operationId: getTrades
      summary: הצג את כל הטריידים
      description: מחזיר את כל הטריידים השמורים.
      responses:
        '200':
          description: רשימת טריידים

  /clear-trades:
    post:
      operationId: clearTrades
      summary: נקה את כל הטריידים
      description: מוחק את כל הטריידים מהזיכרון.
      responses:
        '200':
          description: כל הטריידים נמחקו

  /smart-grid:
    post:
      operationId: smartGrid
      summary: חשב גריד חכם
      description: מחשב טווחי גרידים אוטומטיים לפי תקציב, ביטחון, ATR ו־RRR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                budget:
                  type: number
              required: [symbol, entry, budget]
      responses:
        '200':
          description: פרטי גריד חכם

  /exit-on-broken-rrr:
    post:
      operationId: exitOnBrokenRRR
      summary: צא רק אם RRR נשבר
      description: בודק אם יחס הסיכון/רווח נשבר וממליץ אם לצאת מהטרייד.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_price:
                  type: number
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
              required: [current_price, entry, stop, tp]
      responses:
        '200':
          description: המלצה חכמה ליציאה או המשך

  /market-analysis:
    get:
      operationId: marketAnalysis
      summary: נתח מטבע חכם (24h/7d)
      description: מחזיר ניתוח טכני כולל שינויי מחיר, תנודתיות וגרף.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d]
      responses:
        '200':
          description: ניתוח מלא של המטבע

  /log-csv:
    post:
      operationId: logToCSV
      summary: שמור לקובץ CSV
      description: שומר את הטריידים לקובץ CSV לצורך ניתוח חודשי או דוחות.
      responses:
        '200':
          description: נשמר לקובץ CSV בהצלחה

  /time-to-tp:
    post:
      operationId: timeToTP
      summary: חשב זמן הגעה ל־TP
      description: מעריך תוך כמה זמן המטבע עשוי להגיע ל־TP לפי מהירות תנודתית ממוצעת.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                tp:
                  type: number
                atr:
                  type: number
              required: [entry, tp, atr]
      responses:
        '200':
          description: זמן משוער להגעה ל־TP

  /daily-volatility:
    get:
      operationId: dailyVolatility
      summary: חשב תנודתיות יומית
      description: מחזיר את התנודתיות היומית של המטבע באחוזים לפי ATR וחישוב סטיית תקן.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: אחוז תנודתיות יומית





