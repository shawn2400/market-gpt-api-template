openapi: 3.1.0
info:
  title: AlgoGPT API
  version: 2.14.3
  description: AlgoGPT — מערכת מסחר בזמן אמת ב־Binance

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

paths:
  /:
    get:
      summary: בדיקת תקינות
      operationId: getRootStatus
      tags: [Config]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string

  /metrics:
    get:
      summary: מדדי ביצועים
      operationId: getMetrics
      tags: [Config]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime_sec:
                    type: integer
                  rps_5s:
                    type: number

  /__routes:
    get:
      summary: כל הנתיבים
      operationId: getRegisteredRoutes
      tags: [Debug]
      responses:
        "200":
          description: רשימת נתיבים
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: array
                    items:
                      type: string

  /trade/execute:
    post:
      summary: ביצוע עסקה
      operationId: postTradeExecute
      tags: [Trades]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, side, budget, leverage, entry, sl, tp]
              properties:
                symbol: { type: string }
                side: { type: string, enum: [LONG, SHORT] }
                budget: { type: number }
                leverage: { type: integer }
                entry: { type: number }
                sl: { type: number }
                tp: { type: number }
                dry_run: { type: boolean }
      responses:
        "200":
          description: עסקה נשלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string }
                  quantity: { type: number }

  /ai/ai-analyze:
    post:
      summary: ניתוח איכות עסקה עם AI
      operationId: postAiAnalyze
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: { type: string }
                side: { type: string, enum: [LONG, SHORT] }
                entry: { type: number }
                sl: { type: number }
                tp: { type: number }
                leverage: { type: integer }
                budget: { type: number }
                atr: { type: number }
      responses:
        "200":
          description: תוצאה
          content:
            application/json:
              schema:
                type: object
                properties:
                  quality_score: { type: number }
                  success_pct: { type: number }

  /backtest:
    post:
      summary: Backtest אסטרטגיה
      operationId: postBacktestRun
      tags: [Backtest]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: { type: string }
                timeframe: { type: string }
                limit: { type: integer }
      responses:
        "200":
          description: הצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  win_rate: { type: number }
                  total_pnl: { type: number }

  /scan/top-volume:
    get:
      summary: סריקה לפי טרנד ונפח
      operationId: getScanTopVolume
      tags: [Scan]
      parameters:
        - name: market
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: תוצאה
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  signals:
                    type: array
                    items: { type: object }

  /scan/info:
    get:
      summary: סטטוס הסורק וה־Executor
      operationId: getScanInfo
      tags: [Scan]
      responses:
        "200":
          description: מידע
          content:
            application/json:
              schema:
                type: object
                properties:
                  executor_running: { type: boolean }
                  config: { type: object }

  /news:
    get:
      summary: חדשות מעודכנות
      operationId: getNews
      tags: [News]
      responses:
        "200":
          description: חדשות
          content:
            application/json:
              schema:
                type: object
                properties:
                  news:
                    type: array
                    items: { type: object }

  /grid/status:
    get:
      summary: סטטוס גריד חי (דורש הרשאות)
      operationId: getGridStatus
      tags: [Grid]
      responses:
        "200":
          description: סטטוס גריד
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
  schemas: {}

security:
  - HTTPBearer: []
































