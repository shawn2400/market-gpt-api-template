openapi: 3.1.0
info:
  title: AlgoGPT API
  version: 2.17.0
  description: >
    AlgoGPT — מסחר אלגוריתמי בזמן אמת על Binance (Futures + Spot). כולל Circuit-Breaker, Grid, ניהול SL/TP חי, Dashboard
    UI, ניתוח AI, ו־PnL Summary.
servers:
  - url: https://algogpt-docker.onrender.com
    description: Production
tags:
  - name: Config
  - name: Health
  - name: AI
  - name: Market
  - name: Price
  - name: Trades
  - name: Executor
  - name: Manager
  - name: Grid
  - name: UI
  - name: PnL
  - name: Orderbook
  - name: WS
  - name: Metrics
  - name: Telegram
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          example: Invalid API key

    BasicStatus:
      type: object
      properties:
        ok: { type: boolean, example: true }
        status: { type: string, example: ok }
        version: { type: string, example: 2.17.0 }

    ReadyzResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        error: { type: string, nullable: true }
        details:
          type: object
          additionalProperties: true

    PriceResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        symbol: { type: string, example: BTCUSDT }
        price: { type: number, example: 108500 }
        source: { type: string, example: binance_fapi }
        ts: { type: number, example: 1693430000.12 }
        error: { type: string, example: "" }

    GenericOk:
      type: object
      properties:
        ok: { type: boolean, example: true }
        error: { type: string, nullable: true }

    ExecutorStatusSimple:
      type: object
      properties:
        ok: { type: boolean, example: true }
        status: { type: string, example: running }

    PnLSummary:
      type: object
      properties:
        total_trades: { type: integer, example: 12 }
        realized_pnl_usd: { type: number, example: 123.45 }
        win_rate: { type: number, example: 58.3 }
        days:
          type: array
          items:
            type: object
            properties:
              day: { type: string, example: "2025-09-03" }
              count: { type: integer, example: 3 }
              pnl: { type: number, example: 25.7 }
        symbols:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string, example: "BTCUSDT" }
              count: { type: integer, example: 5 }
              pnl: { type: number, example: 80.1 }
        sampled_days: { type: integer, example: 30 }
        source_files_checked:
          type: array
          items: { type: string }
        note: { type: string }

    PnLSummaryResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        summary: { $ref: '#/components/schemas/PnLSummary' }
        source: { type: string, example: pnl_summary }

    UIGridResponse:
      type: object
      required: [ ok, total, items ]
      properties:
        ok: { type: boolean, example: true }
        total: { type: integer, example: 2 }
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    GridActiveResponse:
      type: object
      required: [ ok, active ]
      properties:
        ok: { type: boolean, example: true }
        active:
          type: array
          items:
            type: object
            additionalProperties: true

    OrderbookDepthResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        symbol: { type: string, example: BTCUSDT }
        lastUpdateId: { type: integer, example: 123456789 }
        bids:
          type: array
          items:
            type: array
            items:
              oneOf: [ { type: number }, { type: string } ]
          description: '[price, qty]'
        asks:
          type: array
          items:
            type: array
            items:
              oneOf: [ { type: number }, { type: string } ]

    WSHealthResponse:
      type: object
      properties:
        ok: { type: boolean }
        symbol: { type: string, example: BTCUSDT }
        price: { type: number, example: 108500 }
        fresh: { type: boolean }
        snapshot:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              price: { type: number }
              ts: { type: number }
              age_sec: { type: number }
              fresh: { type: boolean }

    WSLastPricesResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        items:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              price: { type: number }
              ts: { type: number }
              age_sec: { type: number }
              fresh: { type: boolean }

    ExecutorSymbolsResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        items:
          type: array
          items: { type: string }
          example: [ BTCUSDT, ETHUSDT, SOLUSDT ]

    ExchangeInfoResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        info:
          type: object
          additionalProperties: true

    BalanceResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        balances:
          type: array
          items:
            type: object
            additionalProperties: true

    OpenPositionsResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    MarkPriceResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        symbol: { type: string, example: BTCUSDT }
        markPrice: { type: number, example: 108500.12 }

    MetricsSnapshot:
      type: object
      properties:
        ok: { type: boolean, example: true }
        ts: { type: number, example: 1693430000.12 }
        client: { type: string, nullable: true, example: "10.1.2.3" }
        metrics:
          type: object
          additionalProperties: true

    FundingHeatmapResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        limit: { type: integer, example: 24 }
        items:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string, example: BTCUSDT }
              last_rate: { type: number, example: 0.0001 }
              trend: { type: string, example: "↑" }
              series:
                type: array
                items: { type: object, additionalProperties: true }

    LongShortRatioResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        symbol: { type: string, example: BTCUSDT }
        period: { type: string, example: 5m }
        limit: { type: integer, example: 30 }
        last_ratio: { type: number, example: 1.12 }
        series:
          type: array
          items: { type: object, additionalProperties: true }

    AIAnalyzeResponse:
      type: object
      properties:
        symbol: { type: string, example: BTCUSDT }
        interval: { type: string, example: 15m }
        analysis: { type: string, example: "[Quick] BTCUSDT 15m: ..." }
        fallback: { type: boolean, example: false }

    # ====== NEW: concrete response schemas to satisfy validator ======

    GridTradeResponse:
      type: object
      required: [ ok, mode, symbol, side, market, account_id, budget ]
      properties:
        ok: { type: boolean, example: true }
        mode: { type: string, example: futures_dry, description: "futures_dry | futures_live | spot_dry | spot_live" }
        symbol: { type: string, example: BTCUSDT }
        side: { type: string, example: LONG }
        market: { type: string, example: futures }
        account_id: { type: string, example: main }
        base_price: { type: number, nullable: true, example: 108500 }
        budget: { type: number, example: 100 }
        leverage: { type: integer, nullable: true, example: 10 }
        levels:
          type: array
          nullable: true
          items: { type: number }
        allocations:
          type: array
          nullable: true
          items: { type: number }
        orders:
          type: array
          nullable: true
          items: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }

    ExecutorTradeResponse:
      type: object
      required: [ ok ]
      properties:
        ok: { type: boolean, example: true }
        symbol: { type: string, example: BTCUSDT }
        side: { type: string, example: BUY }
        qty: { type: number, example: 0.5 }
        entry_price: { type: number, example: 108000 }
        sl_price: { type: number, example: 106000 }
        tp_price: { type: number, example: 110000 }
        leverage: { type: integer, example: 10 }
        position_side: { type: string, example: BOTH }
        order_ids:
          type: array
          items:
            oneOf:
              - { type: string }
              - { type: number }
        meta:
          type: object
          additionalProperties: true
        error: { type: string, nullable: true }

    ExecutorBulkResponse:
      type: object
      required: [ ok, results ]
      properties:
        ok: { type: boolean, example: true }
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExecutorTradeResponse'

    TelegramSetWebhookResponse:
      type: object
      required: [ ok ]
      properties:
        ok: { type: boolean, example: true }
        telegram:
          type: object
          nullable: true
          additionalProperties: true
          description: Present when using routes.telegram_bot.set_telegram_webhook
        telegram_response:
          type: object
          nullable: true
          additionalProperties: true
          description: Present when using routes.telegram_routes.set_webhook

paths:

  # ── 1
  /:
    get:
      operationId: getRootStatus
      summary: Root server status
      tags: [ Config ]
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/BasicStatus" } } }

  # ── 2
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [ Health ]
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/BasicStatus" } } }

  # ── 3
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness with Binance & price freshness
      tags: [ Health ]
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ReadyzResponse" } } }

  # ── 4
  /price/{symbol}:
    get:
      operationId: getPrice
      summary: Get latest price
      tags: [ Price ]
      security: []
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/PriceResponse" } } }
        "502":
          description: Upstream error

  # ── 5
  /trade/execute:
    post:
      operationId: executeTrade
      summary: Execute a trade
      tags: [ Trades ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: { type: string, example: BTCUSDT }
                side: { type: string, example: BUY }
                budget: { type: number, example: 50 }
                leverage: { type: integer, example: 10 }
                dry_run: { type: boolean, example: false }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericOk" } } } }
        "401": { description: Invalid API key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ── 6
  /manage-once:
    post:
      operationId: manageOnce
      summary: Manage open trades once
      tags: [ Manager ]
      responses:
        "200": { description: Managed, content: { application/json: { schema: { $ref: "#/components/schemas/GenericOk" } } } }
        "401": { description: Invalid API key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ── 7
  /pnl/summary:
    get:
      operationId: getPnLSummary
      summary: Get PnL summary (last N days)
      tags: [ PnL ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PnLSummaryResponse" } } } }
        "401": { description: Invalid API key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ── 8
  /ui/grid/data:
    get:
      operationId: getGridDashboardData
      summary: Grid Dashboard (JSON API)
      tags: [ UI, Grid ]
      parameters:
        - in: query
          name: account_id
          required: false
          schema: { type: string, example: main }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UIGridResponse" } } } }
        "401": { description: Invalid API key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ── 9
  /grid/active:
    get:
      operationId: getActiveGrids
      summary: Active grids
      tags: [ Grid ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GridActiveResponse" } } } }
        "401": { description: Invalid API key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ── 10
  /grid/dashboard/data:
    get:
      operationId: getGridDashboardDataRaw
      summary: Load dashboard JSON data file
      tags: [ Grid ]
      parameters:
        - in: query
          name: path
          required: false
          schema: { type: string, example: trades_log.json }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                  note: { type: string }
        "400": { description: Invalid path }
        "500": { description: Load failed }

  # ── 11
  /grid/trade:
    post:
      operationId: tradeGrid
      summary: Plan/execute grid trade
      tags: [ Grid ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: { type: string, example: BTCUSDT }
                side: { type: string, example: LONG }
                budget: { type: number, example: 100 }
                leverage: { type: integer, example: 10 }
                grids: { type: integer, example: 3 }
                dry_run: { type: boolean, example: true }
                market: { type: string, example: futures }
                account_id: { type: string, example: main }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridTradeResponse' }
        "400": { description: Bad request }
        "500": { description: Server error }

  # ── 12
  /executor/status:
    get:
      operationId: getExecutorStatus
      summary: Executor status
      tags: [ Executor ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutorStatusSimple" } } } }
        "401": { description: Invalid API key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ── 13
  /executor/trade:
    post:
      operationId: openExecutorTrade
      summary: Open trade with SL/TP (executor)
      tags: [ Executor ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ symbol, side, qty, entry_price, sl_price, tp_price ]
              properties:
                symbol: { type: string, example: BTCUSDT }
                side: { type: string, example: BUY }
                qty: { type: number, example: 0.5 }
                entry_price: { type: number, example: 108000 }
                sl_price: { type: number, example: 106000 }
                tp_price: { type: number, example: 110000 }
                leverage: { type: integer, example: 10 }
                position_side: { type: string, example: BOTH }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutorTradeResponse' }
        "400": { description: Bad request }
        "500": { description: Server error }

  # ── 14
  /executor/bulk:
    post:
      operationId: openExecutorBulk
      summary: Open multiple trades (executor)
      tags: [ Executor ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trades:
                  type: array
                  items: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutorBulkResponse' }
        "500": { description: Server error }

  # ── 15
  /executor/open-positions:
    get:
      operationId: getOpenPositions
      summary: Open futures positions
      tags: [ Executor ]
      x-aliases:
        - /executor/positions
        - /executor/positions/open
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OpenPositionsResponse" } } } }

  # ── 16
  /executor/balance:
    get:
      operationId: getExecutorBalance
      summary: Futures account balances
      tags: [ Executor ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BalanceResponse" } } } }

  # ── 17
  /executor/mark-price:
    get:
      operationId: getExecutorMarkPrice
      summary: Futures mark price for a symbol
      tags: [ Executor ]
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MarkPriceResponse" } } } }
        "400": { description: Missing symbol }
        "500": { description: Server error }

  # ── 18
  /executor/exchange-info:
    get:
      operationId: getExecutorExchangeInfo
      summary: Exchange info (with cache fallback)
      tags: [ Executor ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeInfoResponse" } } } }
        "500": { description: Server error }

  # ── 19
  /executor/symbols:
    get:
      operationId: getExecutorSymbols
      summary: Tradable symbols (derived)
      tags: [ Executor ]
      x-aliases:
        - /executor/symbols/allowed
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutorSymbolsResponse" } } } }

  # ── 20
  /orderbook/depth/{symbol}:
    get:
      operationId: getOrderbookDepth
      summary: Orderbook depth
      tags: [ Orderbook ]
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: BTCUSDT }
        - in: query
          name: limit
          required: false
          schema: { type: integer, example: 100 }
        - in: query
          name: market
          required: false
          schema: { type: string, example: futures }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrderbookDepthResponse" } } } }

  # ── 21
  /ws/health:
    get:
      operationId: getWSHealth
      summary: WebSocket price health
      tags: [ WS ]
      parameters:
        - in: query
          name: symbol
          schema: { type: string, example: BTCUSDT }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WSHealthResponse" } } } }

  # ── 22
  /ws/last-prices:
    get:
      operationId: getWSLastPrices
      summary: Snapshot of all last prices (cache)
      tags: [ WS ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WSLastPricesResponse" } } } }

  # ── 23
  /ai/analyze:
    get:
      operationId: analyzeAIGet
      summary: Technical analysis (AI)
      tags: [ AI ]
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string, example: BTCUSDT }
        - in: query
          name: interval
          required: false
          schema: { type: string, example: 15m }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AIAnalyzeResponse" } } } }
      x-aliases:
        - POST /ai/analyze

  # ── 24
  /metrics:
    get:
      operationId: getMetricsSnapshot
      summary: System metrics snapshot
      tags: [ Metrics ]
      x-aliases:
        - /metrics/
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MetricsSnapshot" } } } }

  # ── 25
  /metrics/funding/heatmap:
    get:
      operationId: getFundingHeatmap
      summary: Futures funding heatmap
      tags: [ Metrics ]
      parameters:
        - in: query
          name: symbols
          required: true
          schema: { type: string, example: BTCUSDT,ETHUSDT,SOLUSDT }
        - in: query
          name: limit
          required: false
          schema: { type: integer, example: 24 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FundingHeatmapResponse" } } } }

  # ── 26
  /metrics/longshort/{symbol}:
    get:
      operationId: getLongShortRatio
      summary: Long/Short ratio
      tags: [ Metrics ]
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: BTCUSDT }
        - in: query
          name: period
          schema: { type: string, example: 5m }
        - in: query
          name: limit
          schema: { type: integer, example: 30 }
        - in: query
          name: source
          schema: { type: string, example: global }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LongShortRatioResponse" } } } }

  # ── 27
  /telegram/mute:
    post:
      operationId: setTelegramMute
      summary: Set mute state
      tags: [ Telegram ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: boolean, example: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mute: { type: boolean }

  # ── 28
  /telegram/set-webhook:
    post:
      operationId: setTelegramWebhook
      summary: Set Telegram webhook
      tags: [ Telegram ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, example: https://algogpt-docker.onrender.com/telegram/webhook }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramSetWebhookResponse' }
        "500":
          description: Error setting webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── 29
  /telegram/webhook:
    post:
      operationId: telegramWebhook
      summary: Telegram webhook endpoint (public)
      tags: [ Telegram ]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          description: Bad payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── 30
  /market/tickers:
    get:
      operationId: getMarketTickers
      summary: Mark prices for multiple symbols
      tags: [ Market ]
      parameters:
        - in: query
          name: symbols
          required: true
          schema: { type: string, example: BTCUSDT,ETHUSDT }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    symbol: { type: string }
                    markPrice: { type: number }















































