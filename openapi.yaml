openapi: 3.1.0
info:
  title: AlgoGPT API
  description: ניתוחים טכניים בזמן אמת, חישובי SL/TP, שמירת טריידים, ועוד
  version: 1.0.0

servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /price:
    get:
      summary: קבלת מחיר עדכני
      operationId: getPrice
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          required: true
          description: סימול המטבע (כמו BTCUSDT)
      responses:
        '200':
          description: המחיר התקבל

  /calculate-sl-tp:
    post:
      summary: חישוב SL ו־TP כולל RRR
      operationId: calculateSlTp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry, stop, tp]
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
      responses:
        '200':
          description: חישוב הצליח

  /calculate-quantity:
    post:
      summary: חישוב כמות לפי תקציב ומינוף
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget, entry, leverage]
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: number
      responses:
        '200':
          description: כמות חושבה

  /save-trade:
    post:
      summary: שמירת טרייד חדש
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [symbol, entry, stop, tp, leverage, direction, confidence, type, order_type]
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: number
                direction:
                  type: string
                confidence:
                  type: number
                type:
                  type: string
                order_type:
                  type: string
      responses:
        '200':
          description: טרייד נשמר

  /get-trades:
    get:
      summary: הצגת כל הטריידים
      operationId: getTrades
      responses:
        '200':
          description: רשימת טריידים

  /clear-trades:
    post:
      summary: ניקוי כל הטריידים
      operationId: clearTrades
      responses:
        '200':
          description: כל הטריידים נמחקו

  /active-trade:
    get:
      summary: בדיקת סטטוס טרייד פתוח
      operationId: getActiveTrade
      responses:
        '200':
          description: סטטוס הטרייד

  /update-trade:
    post:
      summary: עדכון טרייד פתוח ל־CLOSED
      operationId: updateTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol:
                  type: string
      responses:
        '200':
          description: טרייד עודכן

  /backtest:
    post:
      summary: ביצוע Backtest לנתוני עבר
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        '200':
          description: Backtest בוצע

  /analyze:
    post:
      summary: ניתוח טכני חי
      operationId: analyzeLive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        '200':
          description: ניתוח בוצע

components:
  schemas: {}


















