openapi: 3.1.0
info:
  title: AlgoGPT API
  version: 2.14.3
  description: |
    AlgoGPT — מערכת מסחר בזמן אמת ב-Binance (Futures, Spot, Grid), כולל Backtest, ניתוח AI, חדשות, אינדיקטורים.

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

paths:
  /:
    get:
      summary: בדיקת תקינות
      operationId: getRootStatus
      tags: [Config]
      responses:
        "200":
          description: תקין
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 2.14.3

  /metrics:
    get:
      summary: מדדי ביצועים
      operationId: getBasicMetrics
      tags: [Config]
      responses:
        "200":
          description: JSON עם מדדים
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime_sec:
                    type: integer
                  requests:
                    type: object
                    properties:
                      total:
                        type: integer
                      errors_total:
                        type: integer
                      by_status:
                        type: object
                      rps_5s:
                        type: number
                      rps_60s:
                        type: number
                  latency_ms:
                    type: object
                    properties:
                      count:
                        type: integer
                      avg:
                        type: number
                      min:
                        type: number
                      max:
                        type: number
                      p50:
                        type: number
                      p95:
                        type: number

  /__routes:
    get:
      summary: כל המסלולים הפעילים
      operationId: getRegisteredRoutes
      tags: [Config]
      responses:
        "200":
          description: רשימת נתיבי API
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: array
                    items:
                      type: string

  /ai/ai-analyze:
    post:
      summary: ניתוח איכות עסקה עם עוגן
      operationId: postAiAnalyze
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                side:
                  type: string
                  enum: [LONG, SHORT]
                entry:
                  type: number
                sl:
                  type: number
                tp:
                  type: number
                leverage:
                  type: integer
                budget:
                  type: number
                atr:
                  type: number
      responses:
        "200":
          description: תוצאה מוצלחת
          content:
            application/json:
              schema:
                type: object
                properties:
                  quality_score:
                    type: number
                  success_pct:
                    type: number
                  anchor:
                    type: object
                  components:
                    type: object
        "401":
          description: לא מורשה
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          oneOf:
            - type: string
            - type: 'null'

security:
  - HTTPBearer: []






























