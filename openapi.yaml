openapi: 3.1.0
info:
  title: AlgoGPT API
  version: 1.0.0
  description: >
    AlgoGPT – Real-time algorithmic trader for Binance. Supports Futures/Spot/Grid,
    Multi-TF Scan with AI (rich), live trades, smart SL/TP, Auto Executor, and PnL PDF.
servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        code:  { type: string }

    PriceResponse:
      type: object
      properties:
        symbol: { type: string }
        price:  { type: number }

    AnchorSnapshot:
      type: object
      properties:
        direction: { type: string, enum: [UP, DOWN, SIDEWAYS] }
        strength:  { type: number, minimum: 0, maximum: 100 }
        frames:    { type: array, items: { type: string } }

    ScanResultItem:
      type: object
      properties:
        symbol:        { type: string }
        quality_score: { type: number }
        direction:     { type: string, enum: [LONG, SHORT, SIDEWAYS] }
        trend:         { type: string }
        rsi:           { type: number }
        adx:           { type: number }
        volume:        { type: number }
        market:        { type: string, enum: [futures, spot] }
        frames:        { type: array, items: { type: string } }
        signal:        { type: string, enum: [BUY, SELL, HOLD] }
        confidence:    { type: number, minimum: 0, maximum: 100 }
        reason:        { type: string }
        entry:         { oneOf: [ {type: number}, {type: 'null'} ] }
        atr:           { oneOf: [ {type: number}, {type: 'null'} ] }

    ScanResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ScanResultItem" }

    SLTPRequest:
      type: object
      required: [symbol, direction, entry]
      properties:
        symbol:    { type: string, example: BTCUSDT }
        direction: { type: string, enum: [LONG, SHORT] }
        entry:     { type: number, example: 65000 }
        atr:
          oneOf: [ {type: number}, {type: 'null'} ]
          description: Optional ATR

    SLTPResponse:
      type: object
      properties:
        symbol:    { type: string }
        direction: { type: string, enum: [LONG, SHORT] }
        sl:        { type: number }
        tp:        { type: number }

    TradeRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol:   { type: string, example: BTCUSDT }
        side:     { type: string, enum: [LONG, SHORT], example: LONG }
        entry:
          oneOf: [ {type: number}, {type: 'null'} ]
          description: If null, live price is used
          example: null
        sl:      { oneOf: [ {type: number}, {type: 'null'} ] }
        tp:      { oneOf: [ {type: number}, {type: 'null'} ] }
        budget:  { type: number, minimum: 0.01, default: 100 }
        leverage:{ type: integer, minimum: 1, maximum: 125, default: 10 }

    TradeResponse:
      type: object
      properties:
        status: { type: string, enum: [success, error] }
        result:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        error:
          oneOf:
            - { type: string }
            - { type: 'null' }

    AiAnalyzeRequest:
      type: object
      required: [symbol, rsi, adx, trend, pattern, volume]
      properties:
        symbol:  { type: string, example: BTCUSDT }
        rsi:     { type: number, example: 54.2 }
        adx:     { type: number, example: 23.1 }
        trend:   { type: string, example: UP }
        pattern: { type: string, example: breakout }
        volume:  { type: number, example: 1520000 }

    AiAnalyzeResponse:
      type: object
      required: [symbol, direction, signal, confidence, reason, frames]
      properties:
        symbol:     { type: string, example: BTCUSDT }
        direction:  { type: string, enum: [LONG, SHORT, SIDEWAYS], example: LONG }
        signal:     { type: string, enum: [BUY, SELL, HOLD], example: BUY }
        confidence: { type: number, minimum: 0, maximum: 100, example: 74 }
        reason:     { type: string, example: "RSI>50, EMA21>EMA50, breakout with volume" }
        frames:     { type: array, items: { type: string }, example: ["15m","1h"] }
        metrics:    { type: object, additionalProperties: true }
        anchor:
          oneOf: [ { $ref: "#/components/schemas/AnchorSnapshot" }, { type: 'null' } ]

    PnlPdfResponse:
      type: object
      properties:
        path: { type: string, description: Server path to the PDF }

    GridTradeRequest:
      type: object
      required: [symbol, budget]
      properties:
        symbol:     { type: string, example: BTCUSDT }
        budget:     { type: number, minimum: 0.01, example: 300 }
        grid_count: { type: integer, minimum: 2, maximum: 50, default: 6 }
        grid_pct:   { type: number, minimum: 0.01, maximum: 5, default: 0.4, description: Percent gap between levels }
        leverage:   { type: integer, minimum: 1, maximum: 125, default: 20 }
        futures:    { type: boolean, default: true }
        tp_pct:     { type: number, minimum: 0.01, maximum: 10, default: 1.5 }
        sl_pct:     { type: number, minimum: 0.01, maximum: 10, default: 1.0 }

    GridTradeResponse:
      type: object
      properties:
        status: { type: string, enum: [success, dry_run, error] }
        reason: { oneOf: [ {type: string}, {type: 'null'} ] }
        plan:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        result:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        error: { oneOf: [ {type: string}, {type: 'null'} ] }

paths:
  /:
    get:
      security: []
      tags: [Config]
      summary: Server status
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:  { type: string, example: ok }
                  version: { type: string, example: 2.13.4 }

  /health:
    get:
      security: []
      tags: [Config]
      summary: Basic health
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }

  /health/strategy-version:
    get:
      security: []
      tags: [Health]
      summary: Strategy metadata & dependency versions
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /health/live:
    get:
      security: []
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: ok

  /net/ip:
    get:
      security: []
      tags: [Config]
      summary: Public egress IP (best-effort)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  egress_ip:
                    oneOf: [ { type: string }, { type: 'null' } ]
                  client_ip:
                    oneOf: [ { type: string }, { type: 'null' } ]

  /anchor/btc:
    get:
      security: []
      tags: [Debug]
      summary: Current BTC anchor (cached)
      parameters:
        - name: frames
          in: query
          schema: { type: string, default: "15m,1h" }
        - name: market
          in: query
          schema: { type: string, enum: [futures, spot], default: futures }
      responses:
        "200":
          description: BTC anchor snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnchorSnapshot" }

  /scan/multi:
    get:
      security: []
      tags: [Trades]
      summary: Market scan (Multi-TF + AI) — RICH plan with order_template
      parameters:
        - name: interval
          in: query
          schema: { type: string, default: "5m,15m,1h" }
        - name: min_quality
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
        - name: top
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
        - name: market_type
          in: query
          schema: { type: string, enum: [futures, spot], default: futures }
        - name: trending_only
          in: query
          schema: { type: boolean, default: false }
        - name: trending_source
          in: query
          schema: { type: string, default: coingecko }
        - name: budget_usd
          in: query
          schema: { type: number, minimum: 50 }
        - name: include_results
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /price:
    get:
      security: [ { HTTPBearer: [] } ]
      tags: [Trades]
      summary: Get futures price (mark/ticker fallback)
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceResponse" }

  /sltp:
    post:
      security: [ { HTTPBearer: [] } ]
      tags: [Trades]
      summary: Suggest SL/TP (with BTC anchor adjust)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SLTPRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLTPResponse" }

  /ai-analyze:
    post:
      security: [ { HTTPBearer: [] } ]
      tags: [AI]
      summary: Manual AI analysis (signal/confidence/reason)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAnalyzeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalyzeResponse" }

  /trade:
    post:
      security: [ { HTTPBearer: [] } ]
      tags: [Trades]
      summary: Place trade (dry-run via external core if present)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeResponse" }

  /grid/trade:
    post:
      security: [ { HTTPBearer: [] } ]
      tags: [Grid]
      summary: Grid trade plan (dry-run unless executor present)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GridTradeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridTradeResponse" }

  /trade/live:
    post:
      security: [ { HTTPBearer: [] } ]
      tags: [Trades]
      summary: Place LIVE Futures trade (LIMIT+SL/TP OCO style)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, side, entry, sl, tp, leverage, budget]
              properties:
                symbol:   { type: string }
                side:     { type: string, enum: [LONG, SHORT] }
                entry:    { type: number }
                sl:       { type: number }
                tp:       { type: number }
                leverage: { type: integer, minimum: 1, maximum: 125, default: 10 }
                budget:   { type: number, minimum: 0.01 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeResponse" }

  /report/pnl/pdf:
    get:
      security: [ { HTTPBearer: [] } ]
      tags: [Reports]
      summary: Generate PnL PDF
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PnlPdfResponse" }











