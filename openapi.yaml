openapi: "3.1.0"
info:
  title: "AlgoGPT API PRO Ultra"
  version: "2.0.1"
  description: |
    AlgoGPT – סוחר אלגוריתמי בזמן אמת (Binance Futures/Spot/Grid/AI)
    כולל טריידים חיים, גרידים, דוחות, ניתוחים חכמים, ניהול סיכונים,
    TP/SL חכם, Watchlist, Multi-TF Scan ועוד.
servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Config
  - name: Trades
  - name: Reports
  - name: AI
  - name: News
  - name: Watchlist
  - name: AutoExecutor

paths:
  /:
    get:
      tags: [Config]
      summary: "בדיקת תקינות השרת"
      operationId: checkServerStatus
      responses:
        "200":
          description: "השרת פועל"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /scan:
    post:
      tags: [Trades]
      summary: "סריקה טכנית חיה לפי Binance Futures/Spot"
      operationId: scanMarket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: "רשימת סמלים עם ניתוחים טכניים"
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanSymbol"
        "500":
          description: "שגיאת שרת"

  /scan/multi:
    get:
      tags: [Trades]
      summary: "סריקת שווקים ב-Multi-TF עם AI"
      operationId: multiTFscan
      parameters:
        - name: min_quality
          in: query
          schema:
            type: integer
        - name: top
          in: query
          schema:
            type: integer
        - name: frames
          in: query
          schema:
            type: string
        - name: markets
          in: query
          schema:
            type: string
        - name: trending_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: "תוצאות סריקה Multi-TF"
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanSymbol"
        "500":
          description: "שגיאת שרת"

  /execute-trade:
    post:
      tags: [Trades]
      summary: "ביצוע טרייד בפועל (Futures/Spot/Grid)"
      operationId: executeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: "פרטי הטרייד"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResponse"
        "400":
          description: "שגיאה בבקשה"
        "500":
          description: "שגיאת שרת"

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: "חישוב כמות לפי תקציב ומינוף"
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuantityRequest"
      responses:
        "200":
          description: "כמות מחושבת"
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number
        "400":
          description: "שגיאת חישוב כמות"

  /sl_tp:
    post:
      tags: [Trades]
      summary: "חישוב SL ו-TP חכם"
      operationId: calculateSlTp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SLTPRequest"
      responses:
        "200":
          description: "תוצאת SL/TP"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sl:
                    type: number
                  tp:
                    type: number
        "500":
          description: "שגיאה פנימית"

  /backtest:
    post:
      tags: [Trades]
      summary: "הרצת סימולציית Backtest"
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRequest"
      responses:
        "200":
          description: "תוצאות הסימולציה"
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  interval:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/BacktestResult"
                  success_count:
                    type: integer
                  total_trades:
                    type: integer
                  avg_quality:
                    type: number

  /ai-analyze:
    post:
      tags: [AI]
      summary: "ניתוח שוק בעזרת GPT"
      operationId: aiAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIAnalysisRequest"
      responses:
        "200":
          description: "תוצאה מ-AI"
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  score:
                    type: number

  /news:
    get:
      tags: [News]
      summary: "שליפת חדשות קריפטו"
      operationId: fetchCryptoNews
      responses:
        "200":
          description: "רשימת חדשות"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /analyze-news:
    get:
      tags: [News]
      summary: "ניתוח סנטימנט חדשות"
      operationId: analyzeNewsImpact
      responses:
        "200":
          description: "תוצאת ניתוח סנטימנט"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /daily-report:
    get:
      tags: [Reports]
      summary: "דוח יומי כולל base64 PDF"
      operationId: generateDailyReport
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "דוח יומי"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  base64_pdf:
                    type: string
                  summary:
                    type: array
                    items:
                      $ref: "#/components/schemas/DailySummary"

components:
  schemas:
    ScanRequest:
      type: object
      properties:
        market:
          type: string
          enum: [futures, spot, grid]
        min_quality:
          type: integer
        top:
          type: integer
        trending_only:
          type: boolean
        trending_source:
          type: string

    ScanSymbol:
      type: object
      properties:
        symbol:
          type: string
        close:
          type: number
        volume:
          type: number
        rsi:
          type: number
        adx:
          type: number
        macd:
          type: number
        macd_hist:
          type: number
        ema_21:
          type: number
        ema_50:
          type: number
        vwap:
          type: number
        bb_upper:
          type: number
        bb_lower:
          type: number
        stoch_k:
          type: number
        stoch_d:
          type: number
        obv:
          type: number
        cci:
          type: number
        mfi:
          type: number
        atr:
          type: number
        direction:
          type: string
        quality_score:
          type: integer

    TradeRequest:
      type: object
      required:
        - symbol
        - entry
        - stop
        - tp
        - direction
        - leverage
      properties:
        symbol:
          type: string
        entry:
          type: number
        stop:
          type: number
        tp:
          type: number
        direction:
          type: string
          enum: [LONG, SHORT]
        leverage:
          type: integer
        budget:
          type: number
        use_grid:
          type: boolean
        use_trailing:
          type: boolean
        user_id:
          type: string
        take_snapshot:
          type: boolean

    TradeResponse:
      type: object
      properties:
        status:
          type: string
        symbol:
          type: string
        entry:
          type: number
        price_now:
          type: number
        quantity:
          type: number
        stop:
          type: number
        tp:
          type: number
        leverage:
          type: number
        side:
          type: string
        confidence:
          type: number
        quality_score:
          type: number
        news_score:
          type: number
        snapshot:
          type: string
        trailing:
          type: boolean
        grid:
          type: boolean
        message:
          type: string

    QuantityRequest:
      type: object
      required:
        - symbol
        - price
        - leverage
        - budget
      properties:
        symbol:
          type: string
        price:
          type: number
        leverage:
          type: number
        budget:
          type: number

    SLTPRequest:
      type: object
      required:
        - df
        - direction
      properties:
        df:
          type: array
          items:
            type: object
        direction:
          type: string

    BacktestRequest:
      type: object
      required:
        - prices
        - symbol
        - interval
      properties:
        prices:
          type: array
          items:
            type: object
        symbol:
          type: string
        interval:
          type: string

    BacktestResult:
      type: object
      properties:
        timestamp:
          type: string
        close:
          type: number
        signal:
          type: string
        quality_score:
          type: number
        success:
          type: boolean

    AIAnalysisRequest:
      type: object
      required:
        - rsi
        - adx
        - trend
        - volume
        - pattern
      properties:
        rsi:
          type: number
        adx:
          type: number
        trend:
          type: string
        volume:
          type: number
        pattern:
          type: string

    DailySummary:
      type: object
      properties:
        Date:
          type: string
        Total_PNL:
          type: number
        Trades:
          type: integer
        Success_Rate:
          type: number























































