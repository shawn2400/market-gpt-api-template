openapi: 3.1.0
info:
  title: AlgoGPT API
  description: API לחישוב SL/TP, ניתוחים טכניים, שמירת טריידים, גרפים וחישובים בזמן אמת
  version: 1.0.0
servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /price:
    get:
      summary: שלוף מחיר חי למטבע
      operationId: get_price
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: מחיר חי

  /analyze:
    post:
      summary: ניתוח טכני ויצירת גרף
      operationId: analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prices
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    required: [open, high, low, close]
                    properties:
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        '200':
          description: אות קנייה/מכירה + RSI, MACD וגרף
        '400':
          description: שגיאה במבנה הקלט
        '500':
          description: שגיאת שרת פנימית

  /calculate-sl-tp:
    post:
      summary: חשב SL/TP ו־RRR
      operationId: calculate_sl_tp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entry
                - stop
                - target
              properties:
                entry:
                  type: number
                stop:
                  type: number
                target:
                  type: number
      responses:
        '200':
          description: תוצאה של SL/TP ו־RRR
        '400':
          description: קלט חסר או לא תקין

  /calculate-quantity:
    post:
      summary: חשב כמות לפי תקציב
      operationId: calculate_quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - budget
                - entry
                - leverage
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: number
      responses:
        '200':
          description: כמות לחישוב
        '400':
          description: קלט חסר

  /save-trade:
    post:
      summary: שמור את הטרייד
      operationId: save_trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - entry
                - stop
                - tp
                - leverage
                - direction
                - confidence
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: number
                direction:
                  type: string
                  enum: [LONG, SHORT]
                confidence:
                  type: number
      responses:
        '200':
          description: טרייד נשמר

  /get-trades:
    get:
      summary: הצג את כל הטריידים
      operationId: get_trades
      responses:
        '200':
          description: רשימת טריידים

  /clear-trades:
    post:
      summary: נקה את כל הטריידים
      operationId: clear_trades
      responses:
        '200':
          description: נמחקו כל הטריידים












