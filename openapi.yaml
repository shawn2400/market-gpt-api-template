openapi: "3.1.0"
info:
  title: "AlgoGPT API PRO Ultra"
  version: "2.0.1"
  description: |
    AlgoGPT – סוחר אלגוריתמי בזמן אמת (Binance Futures/Spot/Grid/AI)
    כולל טריידים חיים, גרידים, דוחות, ניתוחים חכמים, ניהול סיכונים,
    TP/SL חכם, Watchlist, Multi-TF Scan ועוד.
servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Config
  - name: Trades
  - name: Reports
  - name: AI
  - name: News
  - name: Watchlist
  - name: AutoExecutor

paths:
  /:
    get:
      tags: [Config]
      summary: "בדיקת תקינות השרת"
      operationId: checkServerStatus
      responses:
        "200":
          description: "השרת פועל"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /scan/multi:
    get:
      tags: [Trades]
      summary: "סריקת Multi-TF עם GPT"
      operationId: multiTFscan
      parameters:
        - name: min_quality
          in: query
          schema:
            type: integer
        - name: top
          in: query
          schema:
            type: integer
        - name: frames
          in: query
          schema:
            type: string
        - name: markets
          in: query
          schema:
            type: string
        - name: trending_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: "תוצאות סריקה Multi-TF"
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MultiTFResult"
        "500":
          description: "שגיאת שרת"

  /execute-trade:
    post:
      tags: [Trades]
      summary: "ביצוע טרייד בפועל"
      operationId: executeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: "פרטי טרייד שבוצע"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResponse"
        "400":
          description: "בקשה לא תקינה"
        "500":
          description: "שגיאת שרת"

components:
  schemas:
    ScanSymbol:
      type: object
      properties:
        symbol:
          type: string
        close:
          type: number
        volume:
          type: number
        rsi:
          type: number
        adx:
          type: number
        macd:
          type: number
        macd_hist:
          type: number
        ema_21:
          type: number
        ema_50:
          type: number
        vwap:
          type: number
        bb_upper:
          type: number
        bb_lower:
          type: number
        stoch_k:
          type: number
        stoch_d:
          type: number
        obv:
          type: number
        cci:
          type: number
        mfi:
          type: number
        atr:
          type: number
        direction:
          type: string
        quality_score:
          type: integer

    MultiTFResult:
      type: object
      properties:
        symbol:
          type: string
        confluence:
          type: integer
        main_direction:
          type: string
        avg_quality:
          type: number
        frames:
          type: array
          items:
            type: string
        ai_opinion:
          type: string
        ai_score:
          type: number
        details:
          type: array
          items:
            $ref: "#/components/schemas/ScanSymbol"

    TradeRequest:
      type: object
      required:
        - symbol
        - entry
        - stop
        - tp
        - direction
        - leverage
        - budget
      properties:
        symbol:
          type: string
        entry:
          type: number
        stop:
          type: number
        tp:
          type: number
        direction:
          type: string
          enum: [LONG, SHORT]
        leverage:
          type: integer
        budget:
          type: number

    TradeResponse:
      type: object
      properties:
        order_id:
          type: string
        status:
          type: string
        filled_price:
          type: number
        executed_qty:
          type: number
        sl_order_id:
          type: string
        tp_order_id:
          type: string
        pnl:
          type: number
        snapshot_url:
          type: string
        saved:
          type: boolean





















































