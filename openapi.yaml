openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: AlgoGPT API
  version: 2.14.7
  description: |
    AlgoGPT — מערכת מסחר אלגוריתמי בזמן אמת על Binance (Futures + Spot).
    כולל: Scan / AI / Trades / Backtest / News / Grid / Risk / Indicators / Analytics / PnL / Anchor / Executor / WS.
    ⚠️ רוב ה־endpoints דורשים Bearer Token (חוץ מ־/health ו־/debug).

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

tags:
  - name: Config
  - name: Health
  - name: Debug
  - name: Grid
  - name: Scan
  - name: AI
  - name: Trades
  - name: Backtest
  - name: Indicators
  - name: Analytics
  - name: News
  - name: Dashboard
  - name: Risk
  - name: Snapshots
  - name: PnL
  - name: Strategy
  - name: Orders
  - name: Anchor
  - name: Price
  - name: Market
  - name: Executor
  - name: Websocket
  - name: Utils

security:
  - HTTPBearer: []

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          example: Unauthorized

    BasicStatus:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 2.14.7 }

    GenericResponse:
      type: object
      description: "Generic flexible response schema"
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
      additionalProperties: true

    GridStatus:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        levels: { type: integer }
        allocated: { type: number }
        profit_pct: { type: number }
        active: { type: boolean }

    GridListResponse:
      type: object
      properties:
        ok: { type: boolean }
        count_total: { type: integer }
        returned: { type: integer }
        grids:
          type: array
          items: { $ref: "#/components/schemas/GridStatus" }

    TradeRequest:
      type: object
      required: [symbol, side, entry]
      properties:
        symbol: { type: string }
        side: { type: string, enum: [LONG, SHORT] }
        entry: { type: number }
        sl: { type: number }
        tp: { type: number }
        leverage: { type: integer }
        budget: { type: number }

    TradeResponse:
      type: object
      properties:
        ok: { type: boolean }
        trade_id: { type: string }
        symbol: { type: string }
        side: { type: string }
        entry: { type: number }
        sl: { type: number }
        tp: { type: number }
        leverage: { type: integer }
        budget: { type: number }
        status: { type: string }

    PnlUpdate:
      type: object
      required: [symbol, direction, entry, exit_price, leverage, qty]
      properties:
        symbol: { type: string }
        direction: { type: string }
        entry: { type: number }
        exit_price: { type: number }
        leverage: { type: number }
        qty: { type: number }

paths:
  /:
    get:
      tags: [Config]
      summary: Server status
      operationId: getRootStatus
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicStatus" }

  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicStatus" }

  /health/live:
    get:
      tags: [Health]
      summary: Live health check
      operationId: getHealthLive
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: live }

  /debug/headers:
    post:
      tags: [Debug]
      summary: Echo request headers/body
      operationId: postDebugHeaders
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /debug/health:
    get:
      tags: [Debug]
      summary: Get recent logs
      operationId: getDebugHealth
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: level
          schema: { type: string }
        - in: query
          name: logger_name
          schema: { type: string }
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /grid/status:
    get:
      tags: [Grid]
      summary: Grid status list
      operationId: getGridStatus
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 10, maximum: 200 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridListResponse" }

  /grid/active:
    get:
      tags: [Grid]
      summary: Active grids only
      operationId: getGridActive
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 10, maximum: 200 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridListResponse" }

  /grid/start:
    post:
      tags: [Grid]
      summary: Start grid trading
      operationId: postGridStart
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /grid/stop:
    post:
      tags: [Grid]
      summary: Stop grid trading
      operationId: postGridStop
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /trade:
    post:
      tags: [Trades]
      summary: Open new trade
      operationId: postTrade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeResponse" }

  /pnl/update:
    post:
      tags: [PnL]
      summary: Update PnL from a trade
      operationId: postPnlUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PnlUpdate" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /pnl/daily:
    get:
      tags: [PnL]
      summary: Get daily PnL summary
      operationId: getPnlDaily
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /pnl/report:
    get:
      tags: [PnL]
      summary: Generate PnL PDF report (base64)
      operationId: getPnlReport
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /strategy/version:
    get:
      tags: [Strategy]
      summary: Get strategy version
      operationId: getStrategyVersion
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /orders:
    get:
      tags: [Orders]
      summary: List open orders
      operationId: getOrders
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /orders/active:
    get:
      tags: [Orders]
      summary: List active orders
      operationId: getOrdersActive
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /anchor/history:
    get:
      tags: [Anchor]
      summary: Anchor snapshot history
      operationId: getAnchorHistory
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /anchor/live:
    get:
      tags: [Anchor]
      summary: Live anchor evaluation
      operationId: getAnchorLive
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /price/{symbol}:
    get:
      tags: [Price]
      summary: Get latest price for symbol
      operationId: getPrice
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /market/tickers:
    get:
      tags: [Market]
      summary: Get top tickers snapshot
      operationId: getMarketTickers
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /executor/status:
    get:
      tags: [Executor]
      summary: Executor status
      operationId: getExecutorStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /ws/stream:
    get:
      tags: [Websocket]
      summary: WS stream endpoint
      operationId: getWsStream
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /utils/ping:
    get:
      tags: [Utils]
      summary: Ping server
      operationId: getUtilsPing
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }






































