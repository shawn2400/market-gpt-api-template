openapi: 3.1.0
info:
  title: AlgoGPT API
  description: API עבור ניתוחים טכניים, חישובי SL/TP, שמירת טריידים, ביצוע מסחר ו־Backtest.
  version: 1.0.0

servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /price:
    get:
      summary: קבלת מחיר עדכני למטבע
      operationId: getPrice
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          required: true
          description: סימול המטבע (כמו BTCUSDT)
      responses:
        '200':
          description: מחיר התקבל בהצלחה

  /calculate-sl-tp:
    post:
      summary: חישוב SL ו־TP כולל יחס סיכון-רווח (RRR)
      operationId: calculateSlTp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry, stop, tp]
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
      responses:
        '200':
          description: חישוב בוצע בהצלחה

  /calculate-quantity:
    post:
      summary: חישוב כמות לפי תקציב, מינוף ומחיר כניסה
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget, entry, leverage]
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: number
      responses:
        '200':
          description: הכמות חושבה בהצלחה

  /save-trade:
    post:
      summary: שמירת טרייד חדש למעקב
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [symbol, entry, stop, tp, leverage, direction, confidence, type, order_type]
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: number
                direction:
                  type: string
                confidence:
                  type: number
                type:
                  type: string
                order_type:
                  type: string
      responses:
        '200':
          description: הטרייד נשמר בהצלחה

  /get-trades:
    get:
      summary: הצגת כל הטריידים השמורים
      operationId: getTrades
      responses:
        '200':
          description: רשימת הטריידים התקבלה

  /clear-trades:
    post:
      summary: ניקוי מוחלט של כל הטריידים
      operationId: clearTrades
      responses:
        '200':
          description: הטריידים נמחקו בהצלחה

  /active-trade:
    get:
      summary: בדיקת טרייד פתוח קיים
      operationId: getActiveTrade
      responses:
        '200':
          description: מידע על טרייד פעיל

  /update-trade:
    post:
      summary: סגירת טרייד פתוח על פי סימול
      operationId: updateTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol:
                  type: string
      responses:
        '200':
          description: טרייד עודכן ל־CLOSED

  /backtest:
    post:
      summary: ביצוע בדיקת אסטרטגיה (Backtest)
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        '200':
          description: Backtest בוצע בהצלחה

  /analyze:
    post:
      summary: ניתוח טכני בזמן אמת כולל RSI, MACD, ATR ו־SL/TP דינמי
      operationId: analyzeLive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        '200':
          description: ניתוח טכני בוצע בהצלחה

  /execute-trade:
    post:
      summary: ביצוע פקודת מסחר אוטומטית ב־Binance (LIVE)
      operationId: executeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, side, quantity, price, order_type]
              properties:
                symbol:
                  type: string
                  example: BTCUSDT
                side:
                  type: string
                  enum: [BUY, SELL]
                quantity:
                  type: number
                  example: 0.002
                price:
                  type: number
                  example: 29500
                order_type:
                  type: string
                  enum: [LIMIT, STOP_LIMIT]
      responses:
        '200':
          description: הפקודה בוצעה בהצלחה
        '400':
          description: שגיאה בביצוע הפקודה

  /current-time-il:
    get:
      summary: בדיקת השעה הנוכחית בישראל וזיהוי אם זו שעה חמה למסחר
      operationId: getCurrentTimeIL
      responses:
        '200':
          description: שעה נוכחית בישראל וסטטוס "שעה חמה" או לא

components:
  schemas: {}





















