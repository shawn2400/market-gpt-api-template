openapi: 3.1.0
info:
  title: AlgoGPT API
  version: 2.12.1
  description: >
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת עבור Binance. כולל Futures/Spot/Grid,
    Multi-TF Scan עם AI, ביצוע טריידים, SL/TP חכם, Auto Executor ודוחות PnL.

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
      example: { error: Unauthorized, code: UNAUTHORIZED }

    TradeRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol: { type: string, example: BTCUSDT }
        side:   { type: string, enum: [LONG, SHORT], example: LONG }
        entry:
          type: [number, 'null']
          example: null
          description: "אם null, יילקח מחיר חי"
        sl: { type: [number, 'null'] }
        tp: { type: [number, 'null'] }
        budget: { type: number, default: 100, minimum: 0.01 }
        leverage: { type: integer, default: 10, minimum: 1, maximum: 125 }

    TradeResponse:
      type: object
      properties:
        status: { type: string, enum: [success, error] }
        result:
          type: [object, 'null']
          additionalProperties: true
        error: { type: [string, 'null'] }

    AiAnalyzeRequest:
      type: object
      required: [symbol, rsi, adx, trend, pattern, volume]
      properties:
        symbol: { type: string, example: BTCUSDT }
        rsi: { type: number, example: 54.2 }
        adx: { type: number, example: 23.1 }
        trend: { type: string, example: UP }
        pattern: { type: string, example: breakout }
        volume: { type: number, example: 1520000 }

    AiAnalyzeResponse:
      type: object
      required: [symbol, direction, signal, confidence, reason, frames]
      properties:
        symbol: { type: string }
        direction: { type: string }
        signal: { type: string, enum: [BUY, SELL, HOLD] }
        confidence: { type: number, minimum: 0, maximum: 100 }
        reason: { type: string }
        frames:
          type: array
          items: { type: string }

    SLTPRequest:
      type: object
      required: [symbol, direction, entry]
      properties:
        symbol: { type: string, example: BTCUSDT }
        direction: { type: string, enum: [LONG, SHORT] }
        entry: { type: number, example: 65000 }
        atr:
          type: [number, 'null']
          description: ערך ATR אופציונלי

    SLTPResponse:
      type: object
      properties:
        symbol: { type: string }
        direction: { type: string, enum: [LONG, SHORT] }
        sl: { type: number }
        tp: { type: number }

    ScanResultItem:
      type: object
      properties:
        symbol: { type: string }
        quality_score: { type: number }
        direction: { type: string, enum: [LONG, SHORT] }
        trend: { type: string }
        rsi: { type: number }
        adx: { type: number }
        volume: { type: number }
        market: { type: string, enum: [futures, spot] }
        frames:
          type: array
          items: { type: string }
        signal: { type: string, enum: [BUY, SELL, HOLD] }
        confidence: { type: number, minimum: 0, maximum: 100 }
        reason: { type: string }
        entry: { type: [number, 'null'] }
        atr: { type: [number, 'null'] }

    ScanResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ScanResultItem" }

    PriceResponse:
      type: object
      properties:
        symbol: { type: string }
        price: { type: number }
      example:
        symbol: BTCUSDT
        price: 65042.8

    PnlPdfResponse:
      type: object
      properties:
        path: { type: string, description: נתיב PDF על השרת }
      example: { path: static/reports/pnl_report.pdf }

paths:
  /:
    get:
      security: []   # פתוח — לא יורש את ה-bearer הגלובלי
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        "200":
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: 2.12.1 }

  /scan/multi:
    get:
      security: []   # פתוח — לא יורש את ה-bearer הגלובלי
      tags: [Trades]
      summary: סריקת שוק חכמה (Multi-TF + AI) — פתוח
      operationId: scanMulti
      parameters:
        - name: interval
          in: query
          schema: { type: string, default: "15m,1h" }
        - name: min_quality
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
        - name: top
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
        - name: market_type
          in: query
          schema: { type: string, enum: [futures, spot], default: futures }
        - name: trending_only
          in: query
          schema:
            type: [boolean, 'null']
            default: null
          description: אם null – יילקח מהקונפיג
        - name: trending_source
          in: query
          schema: { type: string, default: coingecko }
      responses:
        "200":
          description: רשימת טריידים מסוננים
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"

  /trade:
    post:
      security: [{ bearerAuth: [] }]
      tags: [Trades]
      summary: ביצוע טרייד חי בפועל
      operationId: placeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeRequest" }
      responses:
        "200":
          description: תוצאת ניסיון ביצוע
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeResponse" }
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai-analyze:
    post:
      security: [{ bearerAuth: [] }]
      tags: [AI]
      summary: ניתוח שוק עם GPT (ידני)
      operationId: aiAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAnalyzeRequest" }
      responses:
        "200":
          description: ניתוח נוצר
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalyzeResponse"
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sltp:
    post:
      security: [{ bearerAuth: [] }]
      tags: [Trades]
      summary: חישוב SL/TP מיטבי (AI עם פולבק)
      operationId: suggestSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SLTPRequest" }
      responses:
        "200":
          description: רמות SL/TP מוצעות
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLTPResponse" }
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /price:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Trades]
      summary: שליפת מחיר נוכחי מ־Binance
      operationId: getPrice
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        "200":
          description: מחיר נשלף
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceResponse" }
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/start:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Executor]
      summary: התחלת Auto Executor
      operationId: startExecutor
      responses:
        "200":
          description: התחיל
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                  running: { type: boolean }
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/stop:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Executor]
      summary: עצירת Auto Executor
      operationId: stopExecutor
      responses:
        "200":
          description: נעצר
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: { type: boolean }
                  running: { type: boolean }
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/status:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Executor]
      summary: סטטוס Auto Executor
      operationId: executorStatus
      responses:
        "200":
          description: סטטוס נוכחי
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /report/pnl/pdf:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Reports]
      summary: יצירת דו״ח PDF מרווח/הפסד יומי
      operationId: generatePnlPdf
      responses:
        "200":
          description: נוצר נתיב ל־PDF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PnlPdfResponse" }
        "404":
          description: אין נתונים לייצוא
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /debug/binance-futures:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Debug]
      summary: בדיקות חיבור/הרשאות ל-Binance Futures (כולל TEST order)
      operationId: debugBinanceFutures
      parameters:
        - name: symbol
          in: query
          required: false
          schema: { type: string, default: BTCUSDT }
        - name: place_test
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: תוצאת בדיקות Binance
          content:
            application/json:
              schema:
                type: object
                properties:
                  ping_ok: { type: boolean }
                  mark_price:
                    type: [object, 'null']
                    additionalProperties: true
                  symbols_count: { type: [integer, 'null'] }
                  test_order_ok: { type: boolean }
                  test_order_error: { type: [string, 'null'] }
        "401":
          description: אין הרשאה
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

security:
  - bearerAuth: []





