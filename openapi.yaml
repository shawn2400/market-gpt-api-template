openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים,
    טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.
  version: 1.3.0

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: Reports
  - name: AI
  - name: Config
  - name: News

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    get:
      tags: [Trades]
      summary: סריקה חיה של שוק Binance Futures לפי אינדיקטורים
      operationId: scanFutures
      responses:
        '200':
          description: רשימת סמלים עם ניתוחים טכניים
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        '500':
          description: שגיאת שרת כללית

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד בפועל
      operationId: executeLiveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: "BTCUSDT"
                entry:
                  type: number
                  example: 30000
                stop:
                  type: number
                  example: 29000
                tp:
                  type: number
                  example: 33000
                direction:
                  type: string
                  example: "LONG"
                leverage:
                  type: integer
                  example: 10
                budget:
                  type: number
                  example: 100
                use_grid:
                  type: boolean
                  example: false
                use_trailing:
                  type: boolean
                  example: true
                user_id:
                  type: string
                  example: "user123"
      responses:
        '200':
          description: תוצאה מלאה מהשרת
        '400':
          description: בקשה שגויה – נתונים חסרים או לא תקפים
        '500':
          description: שגיאת שרת כללית

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות לפי תקציב, מינוף ומחיר
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: "ETHUSDT"
                price:
                  type: number
                  example: 1800
                leverage:
                  type: number
                  example: 10
                budget:
                  type: number
                  example: 100
      responses:
        '200':
          description: כמות מחושבת
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number
                    example: 0.55
        '400':
          description: שגיאת חישוב כמות

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL ו־TP על בסיס ניתוח גרפי
      operationId: calculateSlTp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                df:
                  type: array
                  items:
                    type: object
                  example:
                    - open: 30000
                      high: 30200
                      low: 29800
                      close: 30100
                      volume: 1500
                    - open: 30100
                      high: 30300
                      low: 30000
                      close: 30250
                      volume: 1800
                direction:
                  type: string
                  example: "LONG"
      responses:
        '200':
          description: תוצאה עם SL ו־TP
        '500':
          description: שגיאה פנימית

  /backtest:
    post:
      tags: [Trades]
      summary: הרצת סימולציית Backtest
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                  example:
                    - open: 100
                      high: 105
                      low: 95
                      close: 102
                      volume: 1000
                symbol:
                  type: string
                  example: "ADAUSDT"
                interval:
                  type: string
                  example: "15m"
      responses:
        '200':
          description: תוצאות הסימולציה
        '400':
          description: חוסר נתונים
        '500':
          description: שגיאה כללית

  /ai-analyze:
    post:
      tags: [AI]
      summary: ניתוח שוק בעזרת GPT
      operationId: analyzeWithAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: number
                  example: [30000, 30200, 30500, 30100]
      responses:
        '200':
          description: פלט GPT
          content:
            application/json:
              schema:
                type: object
                properties:
                  trend:
                    type: string
                    example: "UP"
                  confidence:
                    type: number
                    example: 0.87

  /news:
    get:
      tags: [News]
      summary: שליפת חדשות קריפטו
      operationId: getNews
      responses:
        '200':
          description: רשימת חדשות

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח סנטימנט של החדשות
      operationId: analyzeNews
      responses:
        '200':
          description: תוצאה ניתוח סנטימנט

  /daily-report:
    get:
      tags: [Reports]
      summary: יצירת דוח יומי כולל base64 PDF (אפשרות סינון לפי תאריך)
      operationId: generateDailyReport
      parameters:
        - name: date
          in: query
          description: תאריך סינון להצגת דוחות עד לתאריך זה (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: דוח בפורמט base64 עם סיכום לפי ימים
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  base64_pdf:
                    type: string
                    description: קובץ PDF מקודד כ־base64
                  summary:
                    type: array
                    description: טבלת סיכום PNL לפי ימים
                    items:
                      type: object
                      properties:
                        Date:
                          type: string
                          example: "2025-07-28"
                        Total PNL:
                          type: number
                          example: 42.50
                        Trades:
                          type: integer
                          example: 6
                        Success Rate:
                          type: number
                          example: 83.3
        '500':
          description: שגיאת שרת כללית

components:
  schemas: {}















































