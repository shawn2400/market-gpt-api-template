openapi: 3.1.0
info:
  title: AlgoGPT Trader API
  version: "1.0.0"
  description: >
    ממשק API לסוחר Algo מקצועי בזמן אמת (GPT) כולל ניתוח טכני, חישוב SL/TP, פיקוח טריידים,
    הזמנות limit/stop, ניתוח אינדיקטורים, סריקה לפי חוקים קשיחים, נעילות חכמות, Grid אוטומטי, Trailing SL, איכות טריידים ועוד.
servers:
  - url: https://market-gpt-api-template.onrender.com
paths:
  /price:
    get:
      summary: קבל מחיר חי למטבע
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: מחיר חי

  /calculate-sl-tp:
    post:
      summary: חשב SL ו־TP עם יחס RRR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
      responses:
        "200":
          description: תוצאה עם SL/TP, יחס RRR ו־Trailing TP

  /calculate-quantity:
    post:
      summary: חשב כמות לפי תקציב, מינוף ומחיר כניסה
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: integer
      responses:
        "200":
          description: כמות מחושבת

  /save-trade:
    post:
      summary: שמור טרייד חדש לפי כללים נוקשים
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - entry
                - stop
                - tp
                - leverage
                - direction
                - confidence
                - type
                - order_type
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: integer
                direction:
                  type: string
                  enum: [LONG, SHORT]
                confidence:
                  type: integer
                type:
                  type: string
                  enum: [REGULAR, GRID]
                order_type:
                  type: string
                  enum: [LIMIT, STOP_LIMIT]
                quality_score:
                  type: number
      responses:
        "200":
          description: טרייד נשמר בהצלחה

  /get-trades:
    get:
      summary: הצג את כל הטריידים הפתוחים

  /clear-trades:
    post:
      summary: מחק את כל הטריידים

  /active-trade:
    get:
      summary: בדוק אם יש טרייד פתוח פעיל

  /update-trade:
    post:
      summary: סגור טרייד לפי סימול
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string

  /backtest:
    post:
      summary: בצע בדיקת עבר (Backtest) על נתוני מחיר
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prices
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open: { type: number }
                      high: { type: number }
                      low: { type: number }
                      close: { type: number }

  /analyze:
    post:
      summary: נתח טכני לפי מחירי עבר (RSI, MACD, ATR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open: { type: number }
                      high: { type: number }
                      low: { type: number }
                      close: { type: number }
      responses:
        "200":
          description: ניתוח עם RSI, MACD, ATR, SL/TP, תמונה בסיסית

components:
  schemas: {}

















