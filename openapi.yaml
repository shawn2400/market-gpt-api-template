openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: AlgoGPT API
  version: 2.14.0
  description: |
    AlgoGPT – Real-time algorithmic trader for Binance (Futures).
    Scanner חד/רב-סימבולים, איכות טרייד (AI), Backtest, Dashboard ו-Health.
    כולל הרחבות: Top-Volume, קורלציה ALT/BTC, מאקרו/חדשות/סנטימנט, ETA, Decision Engine.

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

tags:
  - name: Config
  - name: AI
  - name: Trades
  - name: Backtest
  - name: Scan
  - name: Indicators
  - name: Analytics
  - name: News
  - name: Health
  - name: Dashboard

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        detail: { type: string }
        code: { type: [string, "null"] }

    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 2.14.0 }

    MetricsResponse:
      type: object
      properties:
        boot_ts: { type: integer }
        uptime_sec: { type: integer }
        requests: { type: object, additionalProperties: true }
        latency_ms: { type: object, additionalProperties: true }

    AiHealthResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        model: { type: [string, "null"] }
        latency_ms: { type: [number, "null"] }
        error: { type: [string, "null"] }

    AiQualityRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol: { type: string, example: BTCUSDT }
        side:   { type: string, enum: [LONG, SHORT] }
        entry:  { type: [number, "null"] }
        sl:     { type: [number, "null"] }
        tp:     { type: [number, "null"] }
        leverage: { type: integer, default: 10 }
        budget:   { type: number, default: 100 }
        atr:      { type: [number, "null"] }

    AiAnalyzeResponse:
      type: object
      properties:
        quality_score: { type: number }
        success_pct:   { type: number }
        anchor: { type: object, additionalProperties: true }
        components: { type: object, additionalProperties: true }

    ManualScanItem:
      type: object
      properties:
        symbol: { type: string, example: BTCUSDT }
        market: { type: string, example: futures }
        interval: { type: string, example: 15m }
        frames: { type: array, items: { type: string } }
        trend: { type: [string, "null"], enum: [UP, DOWN, null] }
        direction: { type: [string, "null"], enum: [LONG, SHORT, null] }
        rsi: { type: [number, "null"] }
        adx: { type: [number, "null"] }
        volume: { type: [number, "null"] }
        quality_score: { type: [number, "null"], minimum: 0, maximum: 10 }
        signal: { type: [string, "null"], enum: [BUY, SELL, HOLD, null] }
        confidence: { type: [integer, "null"], minimum: 0, maximum: 100 }
        reason: { type: [string, "null"] }
        close: { type: [number, "null"] }
        atr: { type: [number, "null"] }

    AiManualScanResponse:
      type: object
      properties:
        symbol: { type: string }
        results: { $ref: "#/components/schemas/ManualScanItem" }

    SLTP3Response:
      type: object
      properties:
        symbol: { type: string }
        direction: { type: string, enum: [LONG, SHORT] }
        sl: { type: number }
        tp1: { type: number }
        tp2: { type: number }

    TradeExecuteRequest:
      type: object
      required: [symbol, side, budget, leverage]
      properties:
        symbol: { type: string, example: BTCUSDT }
        side: { type: string, enum: [LONG, SHORT] }
        budget: { type: number, example: 100 }
        leverage: { type: integer, example: 10 }
        entry: { type: [number, "null"] }
        sl: { type: [number, "null"] }
        tp: { type: [number, "null"] }
        atr: { type: [number, "null"], description: Optional ATR for SL/TP calculation }
        dry_run: { type: boolean, default: true }

    TradeExecuteResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        result: { type: object, additionalProperties: true }

    BacktestTrade:
      type: object
      properties:
        timestamp: { type: integer, description: epoch seconds }
        price: { type: number }
        side: { type: string, enum: [LONG, SHORT] }
        pnl: { type: number }

    BacktestResult:
      type: object
      properties:
        symbol: { type: string }
        timeframe: { type: string }
        trades: { type: array, items: { $ref: "#/components/schemas/BacktestTrade" } }
        win_rate: { type: number }
        total_pnl: { type: number }
        count: { type: integer }

    ScanSignal:
      type: object
      required: [symbol, timeframe, score]
      properties:
        symbol: { type: string, example: BTCUSDT }
        timeframe: { type: string, example: 15m }
        side: { type: [string, "null"], enum: [LONG, SHORT, null] }
        score: { type: number, minimum: 0, maximum: 10 }
        note: { type: [string, "null"] }
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: "null"

    ScanResponse:
      type: object
      properties:
        ok: { type: boolean }
        count: { type: integer }
        signals: { type: array, items: { $ref: "#/components/schemas/ScanSignal" } }

    IndicatorsRecord:
      type: object
      properties: {}
      additionalProperties: true

    TopVolumeResponse:
      type: object
      properties:
        ok: { type: boolean }
        market: { type: string, example: futures }
        quote: { type: string, example: USDT }
        limit: { type: integer, example: 50 }
        symbols: { type: array, items: { type: string, example: BTCUSDT } }

    CorrelationItem:
      type: object
      properties:
        symbol: { type: string, example: ETHUSDT }
        ref_symbol: { type: string, example: BTCUSDT }
        window: { type: integer, example: 200 }
        corr_close: { type: number }
        beta: { type: [number, "null"] }
        lead_lag_bars: { type: [integer, "null"] }
        note: { type: [string, "null"] }

    CorrelationResponse:
      type: object
      properties:
        ok: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/CorrelationItem" } }

    MacroSnapshot:
      type: object
      properties:
        ok: { type: boolean }
        dxy: { type: [number, "null"] }
        ndx: { type: [number, "null"] }
        spx: { type: [number, "null"] }
        btc_dominance: { type: [number, "null"] }
        fear_greed: { type: [integer, "null"] }
        updated_at: { type: [string, "null"] }
        note: { type: [string, "null"] }

    NewsItem:
      type: object
      properties:
        title: { type: string }
        url: { type: string }
        published_at: { type: [string, "null"] }
        impact_score: { type: integer }
        source:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        currencies:
            oneOf:
              - type: array
                items: { type: object }
              - type: "null"

    NewsResponse:
      type: object
      properties:
        ok: { type: boolean }
        count: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/NewsItem" } }

    SentimentSummary:
      type: object
      properties:
        ok: { type: boolean }
        score: { type: number }
        buckets: { type: object, additionalProperties: { type: integer } }
        samples: { type: integer }

    EtaRequest:
      type: object
      required: [entry, tp, sl, atr, timeframe]
      properties:
        entry: { type: number }
        tp: { type: number }
        sl: { type: number }
        atr: { type: number }
        timeframe: { type: string, example: 15m }

    EtaResponse:
      type: object
      properties:
        ok: { type: boolean }
        eta_tp_minutes: { type: [number, "null"] }
        eta_sl_minutes: { type: [number, "null"] }
        speed_note: { type: [string, "null"] }

    DecisionCandidate:
      type: object
      properties:
        symbol: { type: string }
        side: { type: string, enum: [LONG, SHORT] }
        quality_score: { type: number }
        success_pct: { type: [number, "null"] }
        volatility: { type: [number, "null"] }
        eta_minutes: { type: [number, "null"] }
        corr_to_btc: { type: [number, "null"] }

    DecisionRequest:
      type: object
      properties:
        candidates: { type: array, items: { $ref: "#/components/schemas/DecisionCandidate" } }
        top_n: { type: integer, default: 5 }
        diversify_by_symbol: { type: boolean, default: true }

    DecisionResponse:
      type: object
      properties:
        ok: { type: boolean }
        selected: { type: array, items: { $ref: "#/components/schemas/DecisionCandidate" } }
        note: { type: [string, "null"] }

paths:
  /:
    get:
      tags: [Config]
      summary: Server status
      operationId: getRootStatus
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/StatusResponse" } } }

  /metrics:
    get:
      tags: [Config]
      summary: Basic metrics
      operationId: getBasicMetrics
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/MetricsResponse" } } }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Minimal HTML dashboard
      operationId: getDashboardHtml
      responses:
        "200":
          description: HTML
          content: { text/html: { schema: { type: string } } }

  /ai/health:
    get:
      tags: [AI]
      summary: AI health (OpenAI)
      operationId: getAiHealth
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AiHealthResponse" } } } }

  /ai/quality:
    post:
      tags: [AI]
      security: [ { HTTPBearer: [] } ]
      summary: Compute trade quality score
      operationId: postAiQuality
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AiQualityRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AiAnalyzeResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /ai-analyze:
    post:
      tags: [AI]
      security: [ { HTTPBearer: [] } ]
      summary: Analyze trade idea (AI, same engine as /ai/quality)
      operationId: postAiAnalyze
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AiQualityRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AiAnalyzeResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /ai/manual-scan:
    get:
      tags: [AI]
      security: [ { HTTPBearer: [] } ]
      summary: Manual scan (per symbol)
      operationId: getAiManualScan
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AiManualScanResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /trade/sltp:
    post:
      tags: [Trades]
      security: [ { HTTPBearer: [] } ]
      summary: Suggest SL/TP (ATR-aware)
      operationId: postTradeSltp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, direction, entry]
              properties:
                symbol: { type: string }
                direction: { type: string, enum: [LONG, SHORT] }
                entry: { type: number }
                atr: { type: [number, "null"] }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/SLTP3Response" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /trade/execute:
    post:
      tags: [Trades]
      security: [ { HTTPBearer: [] } ]
      summary: Execute trade (dry-run by default)
      operationId: postTradeExecute
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TradeExecuteRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/TradeExecuteResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /backtest:
    post:
      tags: [Backtest]
      security: [ { HTTPBearer: [] } ]
      summary: Run strategy backtest for a symbol
      operationId: postBacktestRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: { type: string, example: BTCUSDT }
                timeframe: { type: string, enum: [5m, 15m, 1h, 4h], default: 15m }
                limit: { type: integer, default: 200 }
                slippage_pct: { type: number, default: 0.1 }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/BacktestResult" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /scan:
    get:
      tags: [Scan]
      security: [ { HTTPBearer: [] } ]
      summary: Scanner heartbeat / info
      operationId: getScanInfo
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ScanResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [Scan]
      security: [ { HTTPBearer: [] } ]
      summary: Run single-symbol scan
      operationId: postScanSingle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol: { type: string, example: BTCUSDT }
                timeframe: { type: string, default: 15m }
                limit: { type: integer, default: 200 }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ScanResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /scan/multi:
    post:
      tags: [Scan]
      security: [ { HTTPBearer: [] } ]
      summary: Run multi-symbol scan
      operationId: postScanMulti
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                symbols: { type: array, items: { type: string } }
                timeframe: { type: string, default: 15m }
                limit: { type: integer, default: 200 }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ScanResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /indicators:
    get:
      tags: [Indicators]
      summary: Indicators sample (sanity)
      operationId: getIndicatorsSample
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/IndicatorsRecord" } } } }

  /indicators/{symbol}:
    get:
      tags: [Indicators]
      summary: Indicators from Binance/ccxt with fallback
      operationId: getIndicatorsSymbol
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          schema: { type: string, default: 1h }
        - in: query
          name: limit
          schema: { type: integer, default: 180 }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/IndicatorsRecord" } } } }

  /symbols/top-volume:
    get:
      tags: [Analytics]
      security: [ { HTTPBearer: [] } ]
      summary: Top symbols by volume (Binance)
      operationId: getTopVolumeSymbols
      parameters:
        - in: query
          name: market
          schema: { type: string, enum: [futures, spot], default: futures }
        - in: query
          name: quote
          schema: { type: string, default: USDT }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/TopVolumeResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /analytics/correlation:
    get:
      tags: [Analytics]
      security: [ { HTTPBearer: [] } ]
      summary: Correlation ALT to BTC
      operationId: getCorrelation
      parameters:
        - in: query
          name: symbols
          required: true
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - in: query
          name: ref_symbol
          schema: { type: string, default: BTCUSDT }
        - in: query
          name: timeframe
          schema: { type: string, default: 15m }
        - in: query
          name: window
          schema: { type: integer, default: 200 }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/CorrelationResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /analytics/macro:
    get:
      tags: [Analytics]
      security: [ { HTTPBearer: [] } ]
      summary: Macro snapshot (DXY/NDX/SPX/FG/BTC.D)
      operationId: getMacro
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/MacroSnapshot" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /news/crypto:
    get:
      tags: [News]
      security: [ { HTTPBearer: [] } ]
      summary: Crypto news (CryptoPanic) with impact score
      operationId: getCryptoNews
      parameters:
        - in: query
          name: filter
          schema: { type: [string, "null"] }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/NewsResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /sentiment/summary:
    get:
      tags: [Analytics]
      security: [ { HTTPBearer: [] } ]
      summary: Sentiment summary (-100..100)
      operationId: getSentiment
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/SentimentSummary" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /eta/time-to-target:
    post:
      tags: [Analytics]
      security: [ { HTTPBearer: [] } ]
      summary: ETA to TP/SL by ATR speed
      operationId: postEtaToTarget
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EtaRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/EtaResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /decision/best-trades:
    post:
      tags: [Analytics]
      security: [ { HTTPBearer: [] } ]
      summary: Select best trades (quality/speed/diversify)
      operationId: postDecisionBestTrades
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DecisionRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/DecisionResponse" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }






















