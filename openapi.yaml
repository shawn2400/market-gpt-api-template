openapi: 3.1.0
info:
  title: AlgoGPT API
  version: 2.13.2
  description: >
    AlgoGPT – Real-time algorithmic trader for Binance. Supports Futures/Spot/Grid,
    Multi-TF Scan with AI, live trades, smart SL/TP, Auto Executor, and daily PnL PDF.
servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:  { type: string }
      example: { error: Unauthorized, code: UNAUTHORIZED }

    TradeRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol:   { type: string, example: BTCUSDT }
        side:     { type: string, enum: [LONG, SHORT], example: LONG }
        entry:
          oneOf: [ {type: number}, {type: 'null'} ]
          description: If null, live price is used
          example: null
        sl: { oneOf: [ {type: number}, {type: 'null'} ] }
        tp: { oneOf: [ {type: number}, {type: 'null'} ] }
        budget:   { type: number, minimum: 0.01, default: 100 }
        leverage: { type: integer, minimum: 1, maximum: 125, default: 10 }

    TradeResponse:
      type: object
      properties:
        status: { type: string, enum: [success, error] }
        result:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        error:
          oneOf:
            - { type: string }
            - { type: 'null' }

    AiAnalyzeRequest:
      type: object
      required: [symbol, rsi, adx, trend, pattern, volume]
      properties:
        symbol:  { type: string, example: BTCUSDT }
        rsi:     { type: number, example: 54.2 }
        adx:     { type: number, example: 23.1 }
        trend:   { type: string, example: UP }
        pattern: { type: string, example: breakout }
        volume:  { type: number, example: 1520000 }

    AnchorSnapshot:
      type: object
      properties:
        direction:
          type: string
          enum: [UP, DOWN, SIDEWAYS]
          example: UP
        strength:
          type: number
          minimum: 0
          maximum: 100
          example: 72
        frames:
          type: array
          items: { type: string }
          example: ["15m", "1h"]

    AiAnalyzeResponse:
      type: object
      required: [symbol, direction, signal, confidence, reason, frames]
      properties:
        symbol:     { type: string, example: BTCUSDT }
        direction:  { type: string, enum: [LONG, SHORT, SIDEWAYS], example: LONG }
        signal:     { type: string, enum: [BUY, SELL, HOLD], example: BUY }
        confidence: { type: number, minimum: 0, maximum: 100, example: 74 }
        reason:     { type: string, example: "RSI>50, EMA21>EMA50, breakout with volume" }
        frames:
          type: array
          items: { type: string }
          example: ["15m", "1h"]
        metrics:
          type: object
          additionalProperties: true
          description: Optional numeric metrics (e.g., rsi, adx, atr, macd...)
          example:
            rsi: 56.8
            adx: 22.1
            atr: 312.5
        anchor:
          oneOf:
            - { $ref: "#/components/schemas/AnchorSnapshot" }
            - { type: 'null' }
          description: BTC anchor context (optional)

    SLTPRequest:
      type: object
      required: [symbol, direction, entry]
      properties:
        symbol:    { type: string, example: BTCUSDT }
        direction: { type: string, enum: [LONG, SHORT] }
        entry:     { type: number, example: 65000 }
        atr:
          oneOf: [ {type: number}, {type: 'null'} ]
          description: Optional ATR

    SLTPResponse:
      type: object
      properties:
        symbol:    { type: string }
        direction: { type: string, enum: [LONG, SHORT] }
        sl:        { type: number }
        tp:        { type: number }

    ScanResultItem:
      type: object
      properties:
        symbol:        { type: string }
        quality_score: { type: number }
        direction:     { type: string, enum: [LONG, SHORT, SIDEWAYS] }
        trend:         { type: string }
        rsi:           { type: number }
        adx:           { type: number }
        volume:        { type: number }
        market:        { type: string, enum: [futures, spot] }
        frames:        { type: array, items: { type: string } }
        signal:        { type: string, enum: [BUY, SELL, HOLD] }
        confidence:    { type: number, minimum: 0, maximum: 100 }
        reason:        { type: string }
        entry:         { oneOf: [ {type: number}, {type: 'null'} ] }
        atr:           { oneOf: [ {type: number}, {type: 'null'} ] }

    ScanResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ScanResultItem" }

    PriceResponse:
      type: object
      properties:
        symbol: { type: string }
        price:  { type: number }
      example: { symbol: BTCUSDT, price: 118369.86 }

    PnlPdfResponse:
      type: object
      properties:
        path: { type: string, description: Server path to the PDF }
      example: { path: static/reports/pnl_report.pdf }

    GridTradeRequest:
      type: object
      required: [symbol, budget]
      properties:
        symbol:     { type: string, example: BTCUSDT }
        budget:     { type: number, minimum: 0.01, example: 300 }
        grid_count: { type: integer, minimum: 2, maximum: 50, default: 6 }
        grid_pct:   { type: number, minimum: 0.01, maximum: 5, default: 0.4, description: Percent gap between levels }
        leverage:   { type: integer, minimum: 1, maximum: 125, default: 20 }
        futures:    { type: boolean, default: true }
        tp_pct:     { type: number, minimum: 0.01, maximum: 10, default: 1.5 }
        sl_pct:     { type: number, minimum: 0.01, maximum: 10, default: 1.0 }

    GridTradeResponse:
      type: object
      properties:
        status: { type: string, enum: [success, dry_run, error] }
        reason: { oneOf: [ {type: string}, {type: 'null'} ] }
        plan:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        result:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        error: { oneOf: [ {type: string}, {type: 'null'} ] }

paths:
  /:
    get:
      security: []
      tags: [Config]
      summary: Server status
      operationId: checkServerStatus
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:  { type: string, example: ok }
                  version: { type: string, example: 2.13.2 }

  /health:
    get:
      security: []
      tags: [Config]
      summary: Basic health
      operationId: health
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }

  /net/ip:
    get:
      security: []
      tags: [Config]
      summary: Public egress IP (best-effort)
      operationId: getEgressIp
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  egress_ip:
                    oneOf: [ { type: string }, { type: 'null' } ]
                  client_ip:
                    oneOf: [ { type: string }, { type: 'null' } ]

  /anchor/btc:
    get:
      security: []
      tags: [Debug]
      summary: Current BTC anchor (cached)
      operationId: getBtcAnchor
      parameters:
        - name: frames
          in: query
          schema: { type: string, default: "15m,1h" }
        - name: market
          in: query
          schema: { type: string, enum: [futures, spot], default: futures }
      responses:
        "200":
          description: BTC anchor snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnchorSnapshot" }

  /scan/multi:
    get:
      security: []
      tags: [Trades]
      summary: Market scan (Multi-TF + AI) — public
      operationId: scanMulti
      parameters:
        - name: interval
          in: query
          schema: { type: string, default: "15m,1h" }
        - name: min_quality
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
        - name: top
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
        - name: market_type
          in: query
          schema: { type: string, enum: [futures, spot], default: futures }
        - name: trending_only
          in: query
          description: If null, taken from config
          schema:
            oneOf: [ {type: boolean}, {type: 'null'} ]
            default: null
        - name: trending_source
          in: query
          schema: { type: string, default: coingecko }
      responses:
        "200":
          description: Filtered trades
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }

  /price:
    get:
      security: [{ HTTPBearer: [] }]
      tags: [Trades]
      summary: Get live Binance price
      operationId: getPrice
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        "200":
          description: Price fetched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sltp:
    post:
      security: [{ HTTPBearer: [] }]
      tags: [Trades]
      summary: Suggest optimal SL/TP
      operationId: suggestSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SLTPRequest" }
      responses:
        "200":
          description: Suggested levels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLTPResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai-analyze:
    post:
      security: [{ HTTPBearer: [] }]
      tags: [AI]
      summary: Manual AI analysis (with BTC anchor)
      operationId: aiAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAnalyzeRequest" }
      responses:
        "200":
          description: Analysis created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalyzeResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trade:
    post:
      security: [{ HTTPBearer: [] }]
      tags: [Trades]
      summary: Execute a trade (dry-run unless a trade core is installed)
      operationId: placeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeRequest" }
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: Trade core not installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /grid/trade:
    post:
      security: [{ HTTPBearer: [] }]
      tags: [Grid]
      summary: Open grid orders (Spot/Futures)
      operationId: executeGrid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GridTradeRequest" }
      responses:
        "200":
          description: Plan and execution/DRY-RUN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridTradeResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/start:
    get:
      security: [{ HTTPBearer: [] }]
      tags: [Executor]
      summary: Start Auto Executor
      operationId: startExecutor
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                  running: { type: boolean }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/stop:
    get:
      security: [{ HTTPBearer: [] }]
      tags: [Executor]
      summary: Stop Auto Executor
      operationId: stopExecutor
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: { type: boolean }
                  running: { type: boolean }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /executor/status:
    get:
      security: [{ HTTPBearer: [] }]
      tags: [Executor]
      summary: Auto Executor status
      operationId: executorStatus
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /report/pnl/pdf:
    get:
      security: [{ HTTPBearer: [] }]
      tags: [Reports]
      summary: Generate daily PnL PDF
      operationId: generatePnlPdf
      responses:
        "200":
          description: PDF path created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PnlPdfResponse" }
        "404":
          description: No data to export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /debug/binance-futures:
    get:
      security: [{ HTTPBearer: [] }]
      tags: [Debug]
      summary: Binance Futures connectivity/permissions check (no test order)
      operationId: debugBinanceFutures
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: BTCUSDT }
        - name: place_test
          in: query
          schema:
            type: boolean
            default: false
            description: "If true, checks private perms via lightweight account call (no order)."
      responses:
        "200":
          description: Binance debug results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ping_ok: { type: boolean }
                  mark_price:
                    oneOf:
                      - { type: object, additionalProperties: true }
                      - { type: 'null' }
                  symbols_count:
                    oneOf:
                      - { type: integer }
                      - { type: 'null' }
                  permission_ok:
                    oneOf:
                      - { type: boolean }
                      - { type: 'null' }
                  test_error:
                    oneOf:
                      - { type: string }
                      - { type: 'null' }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

security:
  - HTTPBearer: []










