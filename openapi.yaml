openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר Algo בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים, שמירת טריידים, חישובי SL/TP, הפקת גרפים ודוחות, תמיכה בחדשות קריפטו וחיזוי AI.
  version: 1.0.0

servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /:
    get:
      summary: בדיקת סטטוס השרת
      operationId: HealthCheck
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: AlgoGPT API is running

  /preset:
    get:
      summary: הצגת קובץ preset.txt
      operationId: GetPreset
      responses:
        '200':
          description: קובץ ההגדרות המלא
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset:
                    type: string
        '500':
          description: שגיאה כללית

  /strategy:
    get:
      summary: הצג את כללי האסטרטגיה של AlgoGPT
      description: מחזיר את כללי המסחר המוגדרים מראש בקובץ preset.txt, כולל אינדיקטורים, חוקים קשיחים, ומבנה תשובה נדרש.
      operationId: GetStrategyRules
      tags:
        - Strategy
      responses:
        '200':
          description: טקסט האסטרטגיה המלא
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy:
                    type: string
                    example: 🧠 הגדרת GPT – סוחר Algo מקצועי בזמן אמת...
        '500':
          description: שגיאה כללית

  /news:
    get:
      summary: שליפת חדשות קריפטו
      operationId: GetCryptoNews
      responses:
        '200':
          description: רשימת חדשות עם ציון השפעה
          content:
            application/json:
              schema:
                type: object
                properties:
                  news:
                    type: array
                    items:
                      type: object
        '500':
          description: כשל בשליפת חדשות

  /daily-report:
    get:
      summary: הפקת דוח יומי בפורמט PDF
      operationId: GenerateDailyPDF
      responses:
        '200':
          description: דוח מקודד בבסיס64
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_base64:
                    type: string
                    format: byte
        '400':
          description: קובץ סטטיסטיקה לא קיים
        '500':
          description: כשל בהפקת הדוח

  /ai-analyze:
    post:
      summary: ניתוח AI מתקדם לחיזוי טווח מחירים
      operationId: AIAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: ETHUSDT
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                        format: date-time
                      close:
                        type: number
      responses:
        '200':
          description: תחזית AI כולל גרף וניתוח
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  direction:
                    type: string
                    enum: [LONG, SHORT]
                  forecast:
                    type: array
                    items:
                      type: object
                  chart:
                    type: string
                    format: byte
        '400':
          description: נתונים חסרים או שגויים
        '500':
          description: ניתוח נכשל

components:
  schemas: {}





























