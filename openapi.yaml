openapi: 3.1.0
info:
  title: AlgoGPT API
  description: API לחישוב SL/TP, ניתוחים טכניים, שמירת טריידים, גרפים וחישובים בזמן אמת לפי כל החוקים
  version: 1.0.0
servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /price:
    get:
      summary: שלוף מחיר חי למטבע
      operationId: get_price
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: מחיר חי

  /analyze:
    post:
      summary: ניתוח טכני וגרף
      operationId: analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prices
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    required: [open, high, low, close]
                    properties:
                      open: { type: number }
                      high: { type: number }
                      low: { type: number }
                      close: { type: number }
      responses:
        '200':
          description: אות קנייה/מכירה + RSI, MACD וגרף
        '400':
          description: שגיאה בקלט
        '500':
          description: שגיאת שרת

  /calculate-sl-tp:
    post:
      summary: חשב SL/TP ו־RRR
      operationId: calculate_sl_tp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry, stop, target]
              properties:
                entry: { type: number }
                stop: { type: number }
                target: { type: number }
      responses:
        '200':
          description: תוצאה של SL/TP ו־RRR

  /calculate-quantity:
    post:
      summary: חשב כמות לפי תקציב
      operationId: calculate_quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget, entry, leverage]
              properties:
                budget: { type: number }
                entry: { type: number }
                leverage: { type: number }
      responses:
        '200':
          description: כמות לחישוב

  /save-trade:
    post:
      summary: שמור את הטרייד
      operationId: save_trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, entry, stop, tp, leverage, direction, confidence, type]
              properties:
                symbol:
                  type: string
                  description: סימבול (למשל BTCUSDT)
                entry:
                  type: number
                  description: מחיר כניסה
                stop:
                  type: number
                  description: SL
                tp:
                  type: number
                  description: TP
                leverage:
                  type: number
                  description: מינוף
                direction:
                  type: string
                  enum: [LONG, SHORT]
                  description: לונג או שורט
                confidence:
                  type: number
                  description: רמת ביטחון %
                type:
                  type: string
                  enum: [REGULAR, GRID]
                  description: סוג הטרייד
      responses:
        '200':
          description: נשמר

  /get-trades:
    get:
      summary: הצג את כל הטריידים
      operationId: get_trades
      responses:
        '200':
          description: רשימת טריידים

  /clear-trades:
    post:
      summary: מחק את כל הטריידים
      operationId: clear_trades
      responses:
        '200':
          description: נמחקו













