openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים, 
    טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.
  version: 1.1.0

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: Reports
  - name: AI
  - name: Config
  - name: News

paths:
  /:
    get:
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    get:
      summary: סריקה חיה של שוק Binance Futures לפי אינדיקטורים
      operationId: scanFuturesMarket
      responses:
        '200':
          description: רשימת סמלים עם נתונים טכניים
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                          example: ETHUSDT
                        last_price:
                          type: number
                          example: 2920.15
                        volume:
                          type: number
                          example: 35000000
                        rsi:
                          type: number
                          example: 28.7
                        adx:
                          type: number
                          example: 21.2
                        direction:
                          type: string
                          example: LONG

  /scan-and-execute:
    post:
      summary: סריקה חיה + ביצוע טרייד מיידי לפי חוקים מוגדרים
      operationId: scanAndExecute
      responses:
        '200':
          description: תוצאה של טרייד שבוצע
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  symbol:
                    type: string
                    example: ETHUSDT
                  entry_price:
                    type: number
                    example: 2915.4
                  stop:
                    type: number
                    example: 2868.1
                  tp:
                    type: number
                    example: 3032.7
                  quantity:
                    type: number
                    example: 0.036
                  leverage:
                    type: number
                    example: 10
                  confidence:
                    type: number
                    example: 91.2
                  quality_score:
                    type: number
                    example: 7
                  news_score:
                    type: number
                    example: 1
                  snapshot:
                    type: string
                    example: snapshots/ETHUSDT_LONG_2025-07-28.png

  /backtest:
    post:
      summary: ביצוע סימולציית Backtest על סדרת מחירים
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume:
                        type: number
      responses:
        '200':
          description: תוצאות backtest
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                    signal:
                      type: string
                      example: LONG
                    entry:
                      type: number
                    stop:
                      type: number
                    tp:
                      type: number
                    exit:
                      type: number
                    rrr:
                      type: number
                    pnl:
                      type: number
                    success:
                      type: boolean
                    quality_score:
                      type: number
        '400':
          description: חסרה היסטוריית מחירים
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Insufficient data – at least 30 candles are required
                  code:
                    type: string
                    example: ERR_TOO_SHORT

  # (המשך המקטעים יושלמו בקבצי המשך במסמך זה – קוצר מטעמי מגבלה)

components:
  schemas: {}










































