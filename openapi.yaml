openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים,
    טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.
  version: 1.3.0

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: AI
  - name: News
  - name: Reports
  - name: Config

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    get:
      tags: [Trades]
      summary: סריקה חיה על Binance Futures עם אינדיקטורים
      responses:
        '200':
          description: רשימת טריידים פוטנציאליים
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: { type: string }
                        entry_price: { type: number }
                        sl: { type: number }
                        tp: { type: number }
                        direction: { type: string }
                        price: { type: number }
                        rsi: { type: number }
                        adx: { type: number }
                        atr: { type: number }
                        macd_hist: { type: number }
                        stoch_k: { type: number }
                        volume: { type: number }
                        signal: { type: string }
                        quality_score: { type: number }
                        ai_analysis: { type: string }

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד בפועל כולל AI וניהול סיכונים
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: { type: string }
                entry: { type: number }
                stop: { type: number }
                tp: { type: number }
                direction: { type: string, enum: [LONG, SHORT] }
                leverage: { type: integer }
                budget: { type: number }
                use_grid: { type: boolean }
                use_trailing: { type: boolean }
                user_id: { type: string }
      responses:
        '200':
          description: טרייד בוצע
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  confidence: { type: number }
                  quality_score: { type: number }
                  quantity: { type: number }
                  snapshot: { type: string }
                  news_score: { type: number }
                  ai_opinion: { type: string }
        '500': { description: שגיאה בביצוע }

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות לפי תקציב, מחיר ומינוף
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: { type: string }
                price: { type: number }
                leverage: { type: number }
                budget: { type: number }
      responses:
        '200':
          description: כמות מחושבת
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity: { type: number }

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL/TP חכם לפי גרף וכיוון
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                df:
                  type: array
                  items: { type: object }
                direction: { type: string }
      responses:
        '200': { description: חישוב SL/TP בוצע }
        '500': { description: שגיאה }

  /backtest:
    post:
      tags: [Trades]
      summary: סימולציה על סדרת מחירים
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open: { type: number }
                      high: { type: number }
                      low: { type: number }
                      close: { type: number }
                      volume: { type: number }
                symbol: { type: string }
                interval: { type: string }
      responses:
        '200':
          description: תוצאות סימולציה
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol: { type: string }
                  interval: { type: string }
                  results:
                    type: array
                    items: { type: object }
                  success_count: { type: integer }
                  total_trades: { type: integer }
                  avg_quality: { type: number }

  /ai-analyze:
    post:
      tags: [AI]
      summary: ניתוח AI על סמך אינדיקטורים
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items: { type: number }
      responses:
        '200':
          description: תוצאה מה-AI
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis: { type: string }

  /news:
    get:
      tags: [News]
      summary: חדשות שוק קריפטו
      responses:
        '200': { description: רשימת חדשות }

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח סנטימנט חדשות
      responses:
        '200': { description: סנטימנט מחושב }

  /daily-report:
    get:
      tags: [Reports]
      summary: הפקת דוח יומי בפורמט PDF
      responses:
        '200':
          description: דוח ב-base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  base64_pdf: { type: string }
                  status: { type: string }












































