openapi: 3.1.0
info:
  title: AlgoGPT API
  description: API לחישוב SL/TP, ניתוחים טכניים, שמירת טריידים וחישובים לפי כללים קשיחים
  version: 1.0.0
servers:
  - url: https://market-gpt-api-template.onrender.com
paths:
  /sl_tp:
    post:
      summary: חשב SL/TP
      operationId: calculateSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
      responses:
        '200':
          description: תוצאה של SL/TP ו־RRR
  /quantity:
    post:
      summary: חשב כמות לפי תקציב
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: number
      responses:
        '200':
          description: כמות לחישוב
  /save:
    post:
      summary: שמור את הטרייד
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: number
                direction:
                  type: string
                confidence:
                  type: number
      responses:
        '200':
          description: טרייד נשמר
  /trades:
    get:
      summary: הצג את כל הטריידים
      operationId: getTrades
      responses:
        '200':
          description: רשימת טריידים
  /clear:
    post:
      summary: נקה את כל הטריידים
      operationId: clearTrades
      responses:
        '200':
          description: נמחקו כל הטריידים






