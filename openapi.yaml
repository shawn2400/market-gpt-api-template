openapi: 3.1.0
info:
  title: AlgoGPT API
  version: 2.0.1
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance,
    מבצע ניתוחים טכניים, טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Scan
  - name: Trades
  - name: AI
  - name: News
  - name: Reports
  - name: Executor
  - name: Config

paths:
  /:
    get:
      tags: [Executor]
      summary: בדיקת תקינות השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    post:
      tags: [Scan]
      summary: סריקה חיה של שוק הקריפטו לפי איכות וטרנד
      operationId: runLiveScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: תוצאה של סריקה
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /scan/multi:
    get:
      tags: [Scan]
      summary: סריקה מרובת טיימפריימים עם AI
      operationId: runMultiTFScan
      parameters:
        - name: min_quality
          in: query
          required: false
          schema:
            type: integer
            default: 6
        - name: top
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: frames
          in: query
          required: false
          schema:
            type: string
            default: 5m,15m,1h
        - name: markets
          in: query
          required: false
          schema:
            type: string
            default: futures,spot
        - name: trending_only
          in: query
          required: false
          schema:
            type: boolean
        - name: trending_source
          in: query
          required: false
          schema:
            type: string
            default: coingecko
      responses:
        '200':
          description: תוצאות מרובות טיימפריימים
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד בפועל
      operationId: executeTradeLive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '200':
          description: תוצאת ביצוע

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות לפי תקציב ומינוף
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantityRequest'
      responses:
        '200':
          description: כמות מחושבת
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL ו־TP חכם
      operationId: calculateSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLTPRequest'
      responses:
        '200':
          description: תוצאה של SL/TP

  /backtest:
    post:
      tags: [Trades]
      summary: הרצת Backtest על גרף
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: תוצאת הסימולציה

  /ai-analyze:
    post:
      tags: [AI]
      summary: ניתוח טרייד לפי RSI, ADX, מגמה, תבנית
      operationId: analyzeWithAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rsi:
                  type: number
                adx:
                  type: number
                pattern:
                  type: string
                trend:
                  type: string
                volume:
                  type: number
      responses:
        '200':
          description: ניתוח AI

  /predict-sl-tp:
    post:
      tags: [AI]
      summary: חיזוי SL ו־TP אופטימלי לפי GPT
      operationId: predictSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry_price:
                  type: number
                direction:
                  type: string
      responses:
        '200':
          description: SL ו־TP מוצעים

  /news:
    get:
      tags: [News]
      summary: שליפת חדשות קריפטו עדכניות
      operationId: getCryptoNews
      responses:
        '200':
          description: חדשות מוצגות

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח סנטימנט חדשות
      operationId: analyzeNewsSentiment
      responses:
        '200':
          description: ניתוח סנטימנט

  /daily-report:
    get:
      tags: [Reports]
      summary: הפקת דוח יומי ב־PDF
      operationId: generateDailyReport
      responses:
        '200':
          description: דוח בסיס64

  /executor/start:
    get:
      tags: [Executor]
      summary: התחלת אוטו־אקסקיושן
      operationId: startExecutorLoop
      responses:
        '200':
          description: הופעל

  /executor/stop:
    get:
      tags: [Executor]
      summary: עצירת האקסקיושן האוטומטי
      operationId: stopExecutorLoop
      responses:
        '200':
          description: נעצר

  /executor/status:
    get:
      tags: [Executor]
      summary: בדיקת סטטוס של הלולאה
      operationId: getExecutorStatus
      responses:
        '200':
          description: מצב פעיל/כבוי
          content:
            application/json:
              schema:
                type: object
                properties:
                  running:
                    type: boolean

components:
  schemas:
    ScanRequest:
      type: object
      properties:
        market:
          type: string
          example: futures
        min_quality:
          type: integer
          example: 6
        top:
          type: integer
          example: 1
        trending_only:
          type: boolean
          example: true
        trending_source:
          type: string
          example: coingecko

    SLTPRequest:
      type: object
      properties:
        df:
          type: array
          items:
            type: object
        direction:
          type: string

    QuantityRequest:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        leverage:
          type: number
        budget:
          type: number

    BacktestRequest:
      type: object
      properties:
        prices:
          type: array
          items:
            type: object
        symbol:
          type: string
        interval:
          type: string
          default: 15m

    TradeRequest:
      type: object
      properties:
        symbol:
          type: string
        entry:
          type: number
        stop:
          type: number
        target:
          type: number
        direction:
          type: string
        leverage:
          type: number
          default: 10
        market:
          type: string
          default: futures
        budget:
          type: number
          default: 100
























































