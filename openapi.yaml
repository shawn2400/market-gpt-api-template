openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AlgoGPT API
  version: 2.14.0
  description: |
    AlgoGPT – Real-time algorithmic trader for Binance (Futures/Spot/Grid),
    Multi-TF Scan with AI, dry-run/live trades, smart SL/TP, Auto-Backtest, and PnL PDF.
servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

tags:
  - name: Config
  - name: Dashboard
  - name: AI
  - name: Trades
  - name: Backtest

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 2.14.0

    MetricsResponse:
      type: object
      properties:
        boot_ts:
          type: integer
          example: 1723880000
        uptime_sec:
          type: integer
          example: 3600
        requests:
          type: integer
          example: 128
        errors:
          type: integer
          example: 1

    AiHealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        model:
          type:
            - string
            - "null"
          example: gpt-4o
        latency_ms:
          type:
            - number
            - "null"
          format: float
          example: 123.0
        error:
          type:
            - string
            - "null"

    ManualScanItem:
      type: object
      properties:
        symbol:
          type: string
          example: BTCUSDT
        market:
          type: string
          example: futures
        interval:
          type: string
          example: 15m
        frames:
          type: array
          items:
            type: string
        trend:
          type: string
          enum: [UP, DOWN]
        direction:
          type: string
          enum: [LONG, SHORT]
        rsi:
          type: number
        adx:
          type: number
        volume:
          type: number
        quality_score:
          type: number
          minimum: 0
          maximum: 10
        signal:
          type: string
          enum: [BUY, SELL, HOLD]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        reason:
          type: string
        close:
          type: number
        atr:
          type:
            - number
            - "null"

    SLTP3Response:
      type: object
      properties:
        sl:
          type: number
        tp1:
          type: number
        tp2:
          type: number

    TradeExecuteRequest:
      type: object
      required: [symbol, side, budget, leverage]
      properties:
        symbol:
          type: string
          example: BTCUSDT
        side:
          type: string
          enum: [LONG, SHORT]
        budget:
          type: number
          example: 100
        leverage:
          type: integer
          example: 10
        entry:
          type:
            - number
            - "null"
        sl:
          type:
            - number
            - "null"
        tp:
          type:
            - number
            - "null"
        dry_run:
          type: boolean
          default: true

    TradeExecuteResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        result:
          type: object
          additionalProperties: true

    BacktestRequest:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
          example: BTCUSDT
        timeframe:
          type: string
          enum: [5m, 15m, 1h, 4h]
          default: 15m
        limit:
          type: integer
          default: 200
        slippage_pct:
          type: number
          default: 0.1

    BacktestTrade:
      type: object
      properties:
        timestamp:
          description: ISO8601 if available
          type:
            - string
            - "null"
        signal:
          type: string
          enum: [LONG, SHORT]
        entry:
          type: number
        stop:
          type: number
        tp:
          type: number
        exit:
          type: number
        rrr:
          type: number
        pnl:
          type: number
        success:
          type: boolean
        quality_score:
          type: number

    BacktestPayload:
      type: object
      properties:
        symbol:
          type: string
        timeframe:
          type: string
        count:
          type: integer
        trades:
          type: array
          items:
            $ref: '#/components/schemas/BacktestTrade'

    BacktestResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        backtest:
          $ref: '#/components/schemas/BacktestPayload'

paths:
  /:
    get:
      tags: [Config]
      summary: Server status
      operationId: getRootStatus
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /metrics:
    get:
      tags: [Config]
      summary: Basic metrics
      operationId: getBasicMetrics
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Minimal HTML dashboard
      operationId: getDashboardHtml
      responses:
        '200':
          description: HTML
          content:
            text/html:
              schema:
                type: string

  /ai/health:
    get:
      tags: [AI]
      summary: AI health (OpenAI)
      operationId: getAiHealth
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiHealthResponse'

  /ai/manual-scan:
    get:
      tags: [AI]
      security:
        - HTTPBearer: []
      summary: Manual scan (per symbol)
      operationId: getAiManualScan
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManualScanItem'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trade/sltp:
    post:
      tags: [Trades]
      security:
        - HTTPBearer: []
      summary: Suggest SL/TP (ATR-aware)
      operationId: postTradeSltp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, direction, entry]
              properties:
                symbol:
                  type: string
                  example: BTCUSDT
                direction:
                  type: string
                  enum: [LONG, SHORT]
                entry:
                  type: number
                  example: 65000
                atr:
                  type:
                    - number
                    - "null"
                  example: 350
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLTP3Response'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trade/execute:
    post:
      tags: [Trades]
      security:
        - HTTPBearer: []
      summary: Execute trade (dry-run by default)
      operationId: postTradeExecute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeExecuteRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeExecuteResponse'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /backtest:
    post:
      tags: [Backtest]
      security:
        - HTTPBearer: []
      summary: Run strategy backtest for a symbol
      operationId: postBacktestRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'














