openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל-Binance, מבצע ניתוחים טכניים, 
    חיזוי AI, טריידים בפועל, גרפים, דוחות, וסטטיסטיקות.
  version: 1.0.0
servers:
  - url: https://algogpt-docker.onrender.com

paths:
  /:
    get:
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    get:
      summary: סריקה חיה של שוק Binance Futures לפי קריטריונים טכניים
      operationId: scanFuturesMarket
      responses:
        '200':
          description: רשימת תוצאות מסוננות
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        last_price:
                          type: number
                        volume:
                          type: number
                        rsi:
                          type: number
                        adx:
                          type: number
                        direction:
                          type: string

  /backtest:
    post:
      summary: ביצוע Backtest על סדרת מחירים
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume:
                        type: number
      responses:
        '200':
          description: תוצאות הסימולציה
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                    signal:
                      type: string
                    entry:
                      type: number
                    stop:
                      type: number
                    tp:
                      type: number
                    exit:
                      type: number
                    rrr:
                      type: number
                    pnl:
                      type: number
                    success:
                      type: boolean
                    quality_score:
                      type: number
        '400':
          description: שגיאת קלט – נשלחה פחות מדי היסטוריית מחירים (נדרש מינימום 30)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Insufficient data – at least 30 candles are required
                  code:
                    type: string
                    example: ERR_TOO_SHORT








































