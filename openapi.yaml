openapi: 3.1.0
info:
  title: AlgoGPT API
  description: >
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת עבור Binance. כולל תמיכה ב־Futures, Spot, Grid, ניתוחים טכניים, AI, דוחות ו־Auto Executor.
  version: 2.0.7

servers:
  - url: https://market-gpt-api-template.railway.app

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TradeRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol:
          type: string
          description: סימבול (למשל BTCUSDT)
        side:
          type: string
          enum: [LONG, SHORT]
          description: כיוון טרייד
        entry:
          type: number
          nullable: true
          description: מחיר כניסה (אם ריק — ישתמש במחיר שוק)
        sl:
          type: number
          nullable: true
          description: Stop Loss
        tp:
          type: number
          nullable: true
          description: Take Profit
        budget:
          type: number
          default: 100
          description: תקציב ב־USDT
        leverage:
          type: number
          default: 10
          description: מינוף

    GridTradeRequest:
      type: object
      required: [symbol, budget]
      properties:
        symbol:
          type: string
        budget:
          type: number
        grid_count:
          type: integer
          default: 6
        grid_pct:
          type: number
          default: 0.4
        leverage:
          type: integer
          default: 20
        futures:
          type: boolean
          default: true
        tp_pct:
          type: number
          default: 1.5
        sl_pct:
          type: number
          default: 1

    AiAnalyzeRequest:
      type: object
      required: [symbol, rsi, adx, trend, pattern, volume]
      properties:
        symbol:
          type: string
        rsi:
          type: number
        adx:
          type: number
        trend:
          type: string
        pattern:
          type: string
        volume:
          type: number

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        "200":
          description: השרת פועל

  /trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד חי בפועל
      operationId: placeTrade
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: טרייד בוצע

  /scan/multi:
    get:
      tags: [Trades]
      summary: סריקת שוק לפי ניתוח טכני וציון איכות
      operationId: scanMulti
      parameters:
        - name: interval
          in: query
          required: false
          schema:
            type: string
            default: 15m
          description: טיימפריימים מופרדים בפסיקים (למשל "5m,15m,1h")
        - name: min_quality
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 10
          description: סף ציון איכות מינימלי (0–10)
        - name: top
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
          description: מספר הטריידים המובילים
        - name: market_type
          in: query
          required: false
          schema:
            type: string
            enum: [futures, spot]
            default: futures
          description: סוג שוק לסריקה
        - name: trending_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: האם לסרוק רק מטבעות טרנדיים
        - name: trending_source
          in: query
          required: false
          schema:
            type: string
            default: coingecko
          description: מקור המטבעות הטרנדיים (binance / coingecko / lunarcrush)
      responses:
        "200":
          description: רשימת טריידים מסוננים לפי איכות
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        quality_score:
                          type: number
                        direction:
                          type: string
                          enum: [LONG, SHORT]
                        trend:
                          type: string
                        rsi:
                          type: number
                        adx:
                          type: number
                        volume:
                          type: number
                        market:
                          type: string

  /grid/trade:
    post:
      tags: [Grid]
      summary: פתיחת גריד מול Binance
      operationId: executeGrid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GridTradeRequest"
      responses:
        "200":
          description: פקודות הגריד נשלחו

  /ai-analyze:
    post:
      tags: [AI]
      summary: ניתוח שוק עם GPT
      operationId: aiAnalyze
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAnalyzeRequest"
      responses:
        "200":
          description: ניתוח נוצר

  /price:
    get:
      tags: [Trades]
      summary: שליפת מחיר נוכחי מ־Binance
      operationId: getPrice
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
      responses:
        "200":
          description: מחיר נשלף
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  price:
                    type: number

  /executor/start:
    get:
      tags: [Executor]
      summary: התחלת Auto Executor
      operationId: startExecutor
      responses:
        "200":
          description: התחיל

  /executor/stop:
    get:
      tags: [Executor]
      summary: עצירת Auto Executor
      operationId: stopExecutor
      responses:
        "200":
          description: נעצר

  /executor/status:
    get:
      tags: [Executor]
      summary: סטטוס Auto Executor
      operationId: executorStatus
      responses:
        "200":
          description: פועל/לא

security:
  - bearerAuth: []

