openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים,
    טריידים בפועל, חיזוי AI, גרפים, דוחות וסטטיסטיקות חכמות.
  version: 1.3.0

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: Reports
  - name: AI
  - name: Config
  - name: News

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅

  /scan:
    get:
      tags: [Trades]
      summary: סריקה חיה של שוק Binance Futures לפי אינדיקטורים
      operationId: scanFuturesMarket
      responses:
        '200':
          description: רשימת סמלים עם נתונים טכניים
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        last_price:
                          type: number
                        volume:
                          type: number
                        rsi:
                          type: number
                        adx:
                          type: number
                        direction:
                          type: string

  /backtest:
    post:
      tags: [Trades]
      summary: ביצוע סימולציית Backtest על סדרת מחירים
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume:
                        type: number
                symbol:
                  type: string
                interval:
                  type: string
      responses:
        '200':
          description: תוצאות backtest
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  interval:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                        signal:
                          type: string
                        entry:
                          type: number
                        stop:
                          type: number
                        tp:
                          type: number
                        exit:
                          type: number
                        rrr:
                          type: number
                        pnl:
                          type: number
                        success:
                          type: boolean
                        quality_score:
                          type: number
                  success_count:
                    type: number
                  total_trades:
                    type: number
                  avg_quality:
                    type: number
        '400':
          description: חסרה היסטוריית מחירים
        '500':
          description: שגיאה כללית

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד בפועל על Binance Futures
      operationId: executeLiveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                direction:
                  type: string
                  enum: [LONG, SHORT]
                leverage:
                  type: number
                budget:
                  type: number
                use_grid:
                  type: boolean
                use_trailing:
                  type: boolean
                user_id:
                  type: string
      responses:
        '200':
          description: טרייד בוצע
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  confidence:
                    type: number
                  quality_score:
                    type: number
                  quantity:
                    type: number
                  snapshot:
                    type: string
                  news_score:
                    type: number
        '500':
          description: שגיאה בביצוע

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות נכונה לפי מחיר, מינוף ותקציב
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                price:
                  type: number
                leverage:
                  type: number
                budget:
                  type: number
      responses:
        '200':
          description: תוצאה
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL ו־TP לפי גרף
      operationId: calculateSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                df:
                  type: array
                  items:
                    type: object
                direction:
                  type: string
      responses:
        '200':
          description: תוצאה
        '500':
          description: שגיאה

  /news:
    get:
      tags: [News]
      summary: שליפת חדשות קריפטו
      operationId: getNews
      responses:
        '200':
          description: רשימת חדשות

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח חדשות וסנטימנט
      operationId: analyzeNews
      responses:
        '200':
          description: ניתוח סנטימנט

  /daily-report:
    get:
      tags: [Reports]
      summary: הפקת דוח יומי כולל סטטיסטיקות
      operationId: getDailyReport
      responses:
        '200':
          description: דוח ב־base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  base64_pdf:
                    type: string
                  status:
                    type: string

  /ai-analyze:
    post:
      tags: [AI]
      summary: ניתוח גרפי וסטטיסטי עם AI
      operationId: analyzeWithAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: number
      responses:
        '200':
          description: תוצאה מה-AI
          content:
            application/json:
              schema:
                type: object
                properties:
                  trend:
                    type: string
                  confidence:
                    type: number

components:
  schemas: {}











































