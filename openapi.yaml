openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר Algo בזמן אמת המתחבר ל־Binance, מבצע ניתוחים טכניים, שמירת טריידים, חישובי SL/TP, הפקת גרפים ודוחות, תמיכה בחדשות קריפטו וחיזוי AI.
  version: 1.0.0

servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /:
    get:
      summary: בדיקת סטטוס השרת
      operationId: HealthCheck
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: AlgoGPT API is running

  /price:
    get:
      summary: קבלת מחיר נוכחי של מטבע
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
      operationId: GetPrice
      responses:
        '200':
          description: מחיר נוכחי
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  price:
                    type: number
        '400':
          description: פרמטר חסר
        '500':
          description: שגיאה כללית

  /sl_tp:
    post:
      summary: חישוב SL ו־TP לפי Entry ו־RRR
      operationId: CalculateSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
      responses:
        '200':
          description: חישוב תקין
          content:
            application/json:
              schema:
                type: object
                properties:
                  rrr:
                    type: number
        '400':
          description: נתונים חסרים
        '500':
          description: שגיאה כללית

  /save:
    post:
      summary: שמירת טרייד חדש
      operationId: SaveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: number
                direction:
                  type: string
                confidence:
                  type: number
                type:
                  type: string
      responses:
        '200':
          description: טרייד נשמר בהצלחה
        '400':
          description: פרמטרים חסרים או לא תקינים

  /trades:
    get:
      summary: הצגת כל הטריידים הפתוחים
      operationId: GetTrades
      responses:
        '200':
          description: רשימת טריידים
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '500':
          description: שגיאה כללית

  /clear:
    post:
      summary: ניקוי כל הטריידים מהמערכת
      operationId: ClearTrades
      responses:
        '200':
          description: כל הטריידים נמחקו
        '500':
          description: שגיאה במחיקה

  /snapshot:
    get:
      summary: שליפת גרף ניתוח של טרייד פתוח
      operationId: GetSnapshot
      responses:
        '200':
          description: גרף ב־Base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  chart:
                    type: string
                    format: byte

  /execute-trade:
    post:
      summary: ביצוע טרייד בפועל דרך Binance API
      operationId: ExecuteTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: number
                direction:
                  type: string
                quantity:
                  type: number
                order_type:
                  type: string
      responses:
        '200':
          description: פקודה בוצעה
        '500':
          description: שגיאה בביצוע

  /calculate-quantity:
    post:
      summary: חישוב כמות לכניסה לפי תקציב, מחיר ומינוף
      operationId: CalculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: number
      responses:
        '200':
          description: כמות מתאימה
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number

  /preset:
    get:
      summary: הצגת preset.txt המלא
      operationId: GetPreset
      responses:
        '200':
          description: קובץ ההגדרות
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset:
                    type: string

  /strategy:
    get:
      summary: הצגת כללי האסטרטגיה של AlgoGPT
      operationId: GetStrategy
      responses:
        '200':
          description: תיאור כללי
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy:
                    type: string

  /news:
    get:
      summary: שליפת חדשות קריפטו
      operationId: GetCryptoNews
      responses:
        '200':
          description: חדשות עם ציון השפעה
          content:
            application/json:
              schema:
                type: object
                properties:
                  news:
                    type: array
                    items:
                      type: object

  /daily-report:
    get:
      summary: הפקת דוח יומי בפורמט PDF
      operationId: GenerateDailyPDF
      responses:
        '200':
          description: דוח מקודד בבסיס64
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_base64:
                    type: string
                    format: byte

  /ai-analyze:
    post:
      summary: ניתוח AI מתקדם לחיזוי טווח מחירים
      operationId: AIAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                        format: date-time
                      close:
                        type: number
      responses:
        '200':
          description: תחזית AI כולל גרף
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  direction:
                    type: string
                    enum: [LONG, SHORT]
                  forecast:
                    type: array
                    items:
                      type: object
                  chart:
                    type: string
                    format: byte

  /stats:
    get:
      summary: סטטיסטיקת ביצועים מתוך PNL Tracker
      operationId: GetStats
      responses:
        '200':
          description: סיכום יומי, רווחים, הצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  success_rate:
                    type: number
                  total_trades:
                    type: integer
                  daily_profit:
                    type: number
                  win_loss:
                    type: object
        '500':
          description: שגיאה בחישוב סטטיסטיקה

components:
  schemas: {}































