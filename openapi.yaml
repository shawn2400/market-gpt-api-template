openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: AlgoGPT API
  version: 2.14.0
  description: |
    AlgoGPT – Real-time algorithmic trader for Binance (Futures).
    Scanner חד/רב-סימבולים, איכות טרייד (AI), Backtest, Dashboard, Health.
    הרחבות: Top-Volume, קורלציה ALT/BTC, מאקרו/חדשות/סנטימנט, ETA, Decision Engine.

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

tags:
  - name: Config
  - name: AI
  - name: Trades
  - name: Backtest
  - name: Scan
  - name: Indicators
  - name: Analytics
  - name: News
  - name: Health
  - name: Dashboard
  - name: Risk

# כל ה־operations מוגנים כברירת מחדל ב־Bearer
security:
  - HTTPBearer: []

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        detail: { type: string }
        code:
          oneOf: [ {type: string}, {type: "null"} ]

    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 2.14.0 }

    MetricsResponse:
      type: object
      properties:
        boot_ts: { type: integer }
        uptime_sec: { type: integer }
        requests:
          type: object
          properties: {}
          additionalProperties: true
        latency_ms:
          type: object
          properties: {}
          additionalProperties: true

    # ---------- AI ----------
    AiHealthResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        model:
          oneOf: [ {type: string}, {type: "null"} ]
        latency_ms:
          oneOf: [ {type: number}, {type: "null"} ]
        error:
          oneOf: [ {type: string}, {type: "null"} ]

    AiQualityRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol: { type: string, example: BTCUSDT }
        side:   { type: string, enum: [LONG, SHORT] }
        entry:  { oneOf: [ {type: number}, {type: "null"} ] }
        sl:     { oneOf: [ {type: number}, {type: "null"} ] }
        tp:     { oneOf: [ {type: number}, {type: "null"} ] }
        leverage: { type: integer, default: 10 }
        budget:   { type: number, default: 100 }
        atr:      { oneOf: [ {type: number}, {type: "null"} ] }

    AiAnalyzeResponse:
      type: object
      properties:
        quality_score: { type: number }
        success_pct:   { type: number }
        anchor:
          type: object
          properties: {}
          additionalProperties: true
        components:
          type: object
          properties: {}
          additionalProperties: true

    ManualScanItem:
      type: object
      properties:
        symbol: { type: string, example: BTCUSDT }
        market: { type: string, example: futures }
        interval: { type: string, example: 15m }
        frames: { type: array, items: { type: string } }
        trend:
          oneOf:
            - type: string
              enum: [UP, DOWN]
            - type: "null"
        direction:
          oneOf:
            - type: string
              enum: [LONG, SHORT]
            - type: "null"
        rsi: { oneOf: [ {type: number}, {type: "null"} ] }
        adx: { oneOf: [ {type: number}, {type: "null"} ] }
        volume: { oneOf: [ {type: number}, {type: "null"} ] }
        quality_score:
          oneOf:
            - type: number
              minimum: 0
              maximum: 10
            - type: "null"
        signal:
          oneOf:
            - type: string
              enum: [BUY, SELL, HOLD]
            - type: "null"
        confidence:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 100
            - type: "null"
        reason: { oneOf: [ {type: string}, {type: "null"} ] }
        close:  { oneOf: [ {type: number}, {type: "null"} ] }
        atr:    { oneOf: [ {type: number}, {type: "null"} ] }

    AiManualScanResponse:
      type: object
      properties:
        symbol: { type: string }
        results: { $ref: "#/components/schemas/ManualScanItem" }

    # ---------- Trades ----------
    SLTP3Response:
      type: object
      properties:
        symbol:    { type: string }
        direction: { type: string, enum: [LONG, SHORT] }
        sl:  { type: number }
        tp1: { type: number }
        tp2: { type: number }

    TradeExecuteRequest:
      type: object
      required: [symbol, side, budget, leverage]
      properties:
        symbol:   { type: string, example: BTCUSDT }
        side:     { type: string, enum: [LONG, SHORT] }
        budget:   { type: number, example: 100 }
        leverage: { type: integer, example: 10 }
        entry:    { oneOf: [ {type: number}, {type: "null"} ] }
        sl:       { oneOf: [ {type: number}, {type: "null"} ] }
        tp:       { oneOf: [ {type: number}, {type: "null"} ] }
        atr:
          oneOf:
            - type: number
              description: Optional ATR for SL/TP calculation
            - type: "null"
        dry_run:  { type: boolean, default: true }

    TradeExecuteResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        result:
          type: object
          properties: {}
          additionalProperties: true

    # ---------- Backtest ----------
    BacktestTrade:
      type: object
      properties:
        timestamp: { type: integer, description: epoch seconds }
        price: { type: number }
        side:  { type: string, enum: [LONG, SHORT] }
        pnl:   { type: number }

    BacktestResult:
      type: object
      properties:
        symbol: { type: string }
        timeframe: { type: string }
        trades: { type: array, items: { $ref: "#/components/schemas/BacktestTrade" } }
        win_rate:  { type: number }
        total_pnl: { type: number }
        count:     { type: integer }

    # ---------- Scan ----------
    ScanSignal:
      type: object
      required: [symbol, timeframe, score]
      properties:
        symbol: { type: string, example: BTCUSDT }
        timeframe: { type: string, example: 15m }
        side:
          oneOf:
            - type: string
              enum: [LONG, SHORT]
            - type: "null"
        score: { type: number, minimum: 0, maximum: 10 }
        note:  { oneOf: [ {type: string}, {type: "null"} ] }
        details:
          oneOf:
            - type: object
              properties: {}
              additionalProperties: true
            - type: "null"

    ScanResponse:
      type: object
      properties:
        ok: { type: boolean }
        count: { type: integer }
        signals: { type: array, items: { $ref: "#/components/schemas/ScanSignal" } }

    # ---------- Indicators ----------
    IndicatorsRecord:
      type: object
      properties: {}
      additionalProperties: true

    # ---------- Analytics / News ----------
    TopVolumeResponse:
      type: object
      properties:
        ok: { type: boolean }
        market: { type: string, example: futures }
        quote:  { type: string, example: USDT }
        limit:  { type: integer, example: 50 }
        symbols: { type: array, items: { type: string, example: BTCUSDT } }

    CorrelationItem:
      type: object
      properties:
        symbol: { type: string, example: ETHUSDT }
        ref_symbol: { type: string, example: BTCUSDT }
        window: { type: integer, example: 200 }
        corr_close:
          oneOf:
            - type: number
              description: Pearson correlation of returns
            - type: "null"
        beta: { oneOf: [ {type: number}, {type: "null"} ] }
        lead_lag_bars: { oneOf: [ {type: integer}, {type: "null"} ] }
        note: { oneOf: [ {type: string}, {type: "null"} ] }

    CorrelationResponse:
      type: object
      properties:
        ok: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/CorrelationItem" } }

    MacroSnapshot:
      type: object
      properties:
        ok: { type: boolean }
        dxy: { oneOf: [ {type: number}, {type: "null"} ] }
        ndx: { oneOf: [ {type: number}, {type: "null"} ] }
        spx: { oneOf: [ {type: number}, {type: "null"} ] }
        btc_dominance: { oneOf: [ {type: number}, {type: "null"} ] }
        fear_greed: { oneOf: [ {type: integer}, {type: "null"} ] }
        updated_at: { oneOf: [ {type: string}, {type: "null"} ] }
        note: { oneOf: [ {type: string}, {type: "null"} ] }

    NewsItem:
      type: object
      properties:
        title: { type: string }
        url: { type: string }
        published_at: { oneOf: [ {type: string}, {type: "null"} ] }
        impact_score: { type: integer }
        source:
          oneOf:
            - type: object
              properties: {}
              additionalProperties: true
            - type: "null"
        currencies:
          oneOf:
            - type: array
              items: { type: object, properties: {}, additionalProperties: true }
            - type: "null"

    NewsResponse:
      type: object
      properties:
        ok: { type: boolean }
        count: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/NewsItem" } }

    SentimentSummary:
      type: object
      properties:
        ok: { type: boolean }
        score: { type: number, description: "-100..100" }
        buckets:
          type: object
          properties: {}
          additionalProperties: { type: integer }
        samples: { type: integer }

    EtaRequest:
      type: object
      required: [entry, tp, sl, atr, timeframe]
      properties:
        entry: { type: number }
        tp:    { type: number }
        sl:    { type: number }
        atr:   { type: number }
        timeframe: { type: string, example: 15m }

    EtaResponse:
      type: object
      properties:
        ok: { type: boolean }
        eta_tp_minutes: { oneOf: [ {type: number}, {type: "null"} ] }
        eta_sl_minutes: { oneOf: [ {type: number}, {type: "null"} ] }
        speed_note: { oneOf: [ {type: string}, {type: "null"} ] }

    DecisionCandidate:
      type: object
      properties:
        symbol: { type: string }
        side:   { type: string, enum: [LONG, SHORT] }
        quality_score: { type: number }
        success_pct:   { oneOf: [ {type: number}, {type: "null"} ] }
        volatility:    { oneOf: [ {type: number}, {type: "null"} ] }
        eta_minutes:   { oneOf: [ {type: number}, {type: "null"} ] }
        corr_to_btc:   { oneOf: [ {type: number}, {type: "null"} ] }

    DecisionRequest:
      type: object
      properties:
        candidates: { type: array, items: { $ref: "#/components/schemas/DecisionCandidate" } }
        top_n: { type: integer, default: 5 }
        diversify_by_symbol: { type: boolean, default: true }

    DecisionResponse:
      type: object
      properties:
        ok: { type: boolean }
        selected: { type: array, items: { $ref: "#/components/schemas/DecisionCandidate" } }
        note: { oneOf: [ {type: string}, {type: "null"} ] }

    # ---------- Risk ----------
    RiskSuggestRequest:
      type: object
      required: [symbol, side, entry, sl]
      properties:
        symbol: { type: string, example: BTCUSDT }
        side:   { type: string, enum: [LONG, SHORT] }
        entry:  { type: number }
        sl:     { type: number }
        tp:     { type: number, nullable: true }
        atr:    { type: number, nullable: true }
        equity_usdt:     { type: number, nullable: true }
        confidence:      { type: number, nullable: true, minimum: 0, maximum: 100, default: 55 }
        max_budget_usdt: { type: number, nullable: true }
        max_leverage:    { type: integer, nullable: true, minimum: 1, maximum: 125 }

    RiskSuggestResponse:
      type: object
      properties:
        ok: { type: boolean }
        suggested:
          type: object
          additionalProperties: true
        inputs:
          type: object
          additionalProperties: true
        constraints:
          type: object
          nullable: true
          additionalProperties: true
        note:
          type: string
          nullable: true

paths:
  /:
    get:
      tags: [Config]
      summary: Server status
      operationId: getRootStatus
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /metrics:
    get:
      tags: [Config]
      summary: Basic metrics
      operationId: getBasicMetrics
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResponse" }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Minimal HTML dashboard
      operationId: getDashboardHtml
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema: { type: string }

  # ---------- AI ----------
  /ai/health:
    get:
      tags: [AI]
      summary: AI health (OpenAI)
      operationId: getAiHealth
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiHealthResponse" }

  /ai/quality:
    post:
      tags: [AI]
      summary: Compute trade quality score
      operationId: postAiQuality
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiQualityRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalyzeResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai-analyze:
    post:
      tags: [AI]
      summary: Analyze trade idea (AI, same engine as /ai/quality)
      operationId: postAiAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiQualityRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalyzeResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/manual-scan:
    get:
      tags: [AI]
      summary: Manual scan (per symbol)
      operationId: getAiManualScan
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string, example: BTCUSDT }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiManualScanResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------- Trades ----------
  /trade/sltp:
    post:
      tags: [Trades]
      summary: Suggest SL/TP (ATR-aware)
      operationId: postTradeSltp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, direction, entry]
              properties:
                symbol: { type: string }
                direction: { type: string, enum: [LONG, SHORT] }
                entry: { type: number }
                atr: { oneOf: [ {type: number}, {type: "null"} ] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLTP3Response" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trade/execute:
    post:
      tags: [Trades]
      summary: Execute trade (dry-run by default)
      operationId: postTradeExecute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeExecuteRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeExecuteResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------- Backtest ----------
  /backtest:
    post:
      tags: [Backtest]
      summary: Run strategy backtest for a symbol
      operationId: postBacktestRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:    { type: string, example: BTCUSDT }
                timeframe: { type: string, enum: [5m, 15m, 1h, 4h], default: 15m }
                limit:     { type: integer, default: 200 }
                slippage_pct: { type: number, default: 0.1 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestResult" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------- Scan ----------
  /scan:
    get:
      tags: [Scan]
      summary: Scanner heartbeat / info
      operationId: getScanInfo
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Scan]
      summary: Run single-symbol scan
      operationId: postScanSingle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol:    { type: string, example: BTCUSDT }
                timeframe: { type: string, default: 15m }
                limit:     { type: integer, default: 200 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /scan/multi:
    post:
      tags: [Scan]
      summary: Run multi-symbol scan
      operationId: postScanMulti
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                symbols: { type: array, items: { type: string } }
                timeframe: { type: string, default: 15m }
                limit: { type: integer, default: 200 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /scan/top-volume:
    get:
      tags: [Scan]
      summary: Scan top-volume symbols concurrently (extended)
      operationId: getScanTopVolume
      parameters:
        - in: query
          name: market
          schema: { type: string, enum: [futures, spot], default: futures }
        - in: query
          name: quote
          schema: { type: string, default: USDT }
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - in: query
          name: timeframe
          schema: { type: string, default: 15m }
        - in: query
          name: bars
          schema: { type: integer, default: 200, minimum: 50, maximum: 1500 }
        - in: query
          name: trending_only
          schema: { type: boolean, default: false }
          description: אם true – מחזיר רק סימבולים בטרנד פעיל
        - in: query
          name: min_adx
          schema: { type: number, default: 20.0, minimum: 5.0, maximum: 60.0 }
        - in: query
          name: ema_fast
          schema: { type: integer, default: 21, minimum: 3, maximum: 200 }
        - in: query
          name: ema_slow
          schema: { type: integer, default: 50, minimum: 5, maximum: 400 }
        - in: query
          name: adx_len
          schema: { type: integer, default: 14, minimum: 5, maximum: 50 }
        - in: query
          name: st_period
          schema: { type: integer, default: 10, minimum: 5, maximum: 50 }
        - in: query
          name: st_factor
          schema: { type: number, default: 3.0, minimum: 1.0, maximum: 10.0 }
        - in: query
          name: ich_conv
          schema: { type: integer, default: 9, minimum: 5, maximum: 50 }
        - in: query
          name: ich_base
          schema: { type: integer, default: 26, minimum: 10, maximum: 100 }
        - in: query
          name: ich_span_b
          schema: { type: integer, default: 52, minimum: 20, maximum: 200 }
        - in: query
          name: ms_lookback
          schema: { type: integer, default: 5, minimum: 2, maximum: 20 }
        - in: query
          name: ms_pivot_span
          schema: { type: integer, default: 3, minimum: 1, maximum: 10 }
        - in: query
          name: concurrency
          schema: { type: integer, default: 16, minimum: 2, maximum: 64 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /symbols/top-volume:
    get:
      tags: [Analytics]
      summary: Top symbols by volume (Binance)
      operationId: getTopVolumeSymbols
      parameters:
        - in: query
          name: market
          schema: { type: string, enum: [futures, spot], default: futures }
        - in: query
          name: quote
          schema: { type: string, default: USDT }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: min_quote_volume
          schema: { type: number, default: 0.0 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopVolumeResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /analytics/correlation:
    get:
      tags: [Analytics]
      summary: Correlation ALT to BTC
      operationId: getCorrelation
      parameters:
        - in: query
          name: symbols
          required: true
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - in: query
          name: ref_symbol
          schema: { type: string, default: BTCUSDT }
        - in: query
          name: timeframe
          schema: { type: string, default: 15m }
        - in: query
          name: window
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrelationResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /analytics/macro:
    get:
      tags: [Analytics]
      summary: Macro snapshot (DXY/NDX/SPX/FG/BTC.D)
      operationId: getMacro
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MacroSnapshot" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /news/crypto:
    get:
      tags: [News]
      summary: Crypto news (CryptoPanic) with impact score
      operationId: getCryptoNews
      parameters:
        - in: query
          name: filter
          schema:
            oneOf: [ {type: string}, {type: "null"} ]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsResponse" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sentiment/summary:
    get:
      tags: [Analytics]
      summary: Sentiment summary (-100..100)
      operationId: getSentiment
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentimentSummary" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /eta/time-to-target:
    post:
      tags: [Analytics]
      summary: ETA to TP/SL by ATR speed
      operationId: postEtaToTarget
      requestBody:
        required: true
        content:
