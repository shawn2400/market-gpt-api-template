openapi: 3.1.0
info:
  title: AlgoGPT API
  description: >
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל־Binance,
    מבצע ניתוחים טכניים, טריידים חיים, גרידים, דוחות, ניתוחים גרפיים ו־AI.
  version: 2.0.3

servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Trades
  - name: Grid
  - name: Reports
  - name: AI
  - name: Executor
  - name: Config
  - name: News

paths:
  /:
    get:
      tags: [Config]
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /scan:
    post:
      tags: [Trades]
      summary: סריקה טכנית חיה
      operationId: scanLiveMarket
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        '200':
          description: הצלחה

  /scan/multi:
    get:
      tags: [Trades]
      summary: סריקת Multi-TF עם AI
      operationId: multiTfScan
      parameters:
        - name: market
          in: query
          schema:
            type: string
        - name: trending_only
          in: query
          schema:
            type: boolean
        - name: trending_source
          in: query
          schema:
            type: string
        - name: top
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: הצלחה

  /execute-trade:
    post:
      tags: [Trades]
      summary: ביצוע טרייד חי בפועל
      operationId: executeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        '200':
          description: טרייד בוצע

  /grid/trade:
    post:
      tags: [Grid]
      summary: פתיחת גריד חי מול Binance
      operationId: executeGridTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GridTradeRequest"
      responses:
        '200':
          description: פקודות הגריד נשלחו לבורסה

  /grid/status:
    get:
      tags: [Grid]
      summary: סטטוס הגריד האחרון שבוצע
      operationId: getGridStatus
      responses:
        '200':
          description: סטטוס נשלף
        '404':
          description: לא בוצע גריד עדיין

  /calculate-quantity:
    post:
      tags: [Trades]
      summary: חישוב כמות לפי תקציב ומינוף
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuantityRequest"
      responses:
        '200':
          description: הכמות חושבה

  /sl_tp:
    post:
      tags: [Trades]
      summary: חישוב SL ו־TP חכם
      operationId: calculateSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SLTPRequest"
      responses:
        '200':
          description: סטופ וטייק חושבו

  /predict-sl-tp:
    post:
      tags: [AI]
      summary: חיזוי SL ו־TP עם GPT
      operationId: aiPredictSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictSLTPRequest"
      responses:
        '200':
          description: SL/TP נוצרו

  /ai-analyze:
    post:
      tags: [AI]
      summary: חיזוי AI גרפי
      operationId: aiPricePrediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAnalyzeRequest"
      responses:
        '200':
          description: AI ניתח טווח

  /backtest:
    post:
      tags: [Trades]
      summary: הרצת Backtest
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRequest"
      responses:
        '200':
          description: backtest הושלם

  /news:
    get:
      tags: [News]
      summary: קבלת חדשות קריפטו
      operationId: getCryptoNews
      responses:
        '200':
          description: חדשות נשלפו

  /analyze-news:
    get:
      tags: [News]
      summary: ניתוח סנטימנט חדשות
      operationId: analyzeNews
      responses:
        '200':
          description: סנטימנט נוצר

  /daily-report:
    get:
      tags: [Reports]
      summary: הפקת דוח יומי PDF
      operationId: getDailyReport
      responses:
        '200':
          description: דוח PDF נוצר

  /executor/start:
    get:
      tags: [Executor]
      summary: התחלת Auto Executor
      operationId: startAutoExecutor
      responses:
        '200':
          description: לולאה התחילה

  /executor/stop:
    get:
      tags: [Executor]
      summary: עצירת Auto Executor
      operationId: stopAutoExecutor
      responses:
        '200':
          description: לולאה נעצרה

  /executor/status:
    get:
      tags: [Executor]
      summary: בדיקת סטטוס Auto Executor
      operationId: getExecutorStatus
      responses:
        '200':
          description: סטטוס נשלף

components:
  schemas:
    ScanRequest:
      type: object
      properties:
        market:
          type: string
          example: futures
        min_quality:
          type: integer
          example: 6
        top:
          type: integer
          example: 1
        trending_only:
          type: boolean
          example: false
        trending_source:
          type: string
          example: coingecko

    TradeRequest:
      type: object
      properties:
        symbol:
          type: string
        entry:
          type: number
        stop:
          type: number
        target:
          type: number
        direction:
          type: string
        leverage:
          type: number
          default: 10
        market:
          type: string
          default: futures
        budget:
          type: number
          default: 100
        trailing:
          type: boolean
          default: false

    QuantityRequest:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        leverage:
          type: number
        budget:
          type: number

    SLTPRequest:
      type: object
      properties:
        df:
          type: array
          items:
            type: object
        direction:
          type: string

    PredictSLTPRequest:
      type: object
      properties:
        symbol:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT]
        entry:
          type: number

    AiAnalyzeRequest:
      type: object
      properties:
        rsi:
          type: number
        adx:
          type: number
        trend:
          type: string
        volume:
          type: string
        pattern:
          type: string

    BacktestRequest:
      type: object
      properties:
        prices:
          type: array
          items:
            type: object
        symbol:
          type: string
        interval:
          type: string
          default: "15m"

    GridTradeRequest:
      type: object
      properties:
        symbol:
          type: string
        budget:
          type: number
        grid_count:
          type: integer
        grid_pct:
          type: number
        leverage_min:
          type: integer
        leverage_max:
          type: integer
        direction:
          type: string
          enum: [BOTH, BUY, SELL]
        tp_pct:
          type: number
        sl_pct:
          type: number
        futures:
          type: boolean




























































