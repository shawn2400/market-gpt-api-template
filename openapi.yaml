openapi: 3.1.0
info:
  title: AlgoGPT Trader API
  description: >
    ממשק API למסחר חכם בזמן אמת – כולל ניתוחים טכניים, שמירת טריידים,
    חישובי SL/TP/כמות, איתור טריידים, גרפים, פקודות limit ו־grid, תמיכה ב־Trailing SL
    וניתוח רמת ביטחון (Confidence).
  version: "1.0.0"
servers:
  - url: https://market-gpt-api-template.onrender.com
paths:
  /price:
    get:
      summary: קבלת מחיר נוכחי
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: מחיר נוכחי
  /calculate-sl-tp:
    post:
      summary: חישוב SL, TP, יחס RRR ו־Trailing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
      responses:
        "200":
          description: תוצאות החישוב
  /calculate-quantity:
    post:
      summary: חישוב כמות נכונה לפי תקציב
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: number
      responses:
        "200":
          description: הכמות המחושבת
  /save-trade:
    post:
      summary: שמירת טרייד חדש
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: integer
                direction:
                  type: string
                  enum: [LONG, SHORT]
                confidence:
                  type: number
                rrr:
                  type: number
                type:
                  type: string
                  enum: [REGULAR, GRID]
                order_type:
                  type: string
                  enum: [LIMIT, STOP_LIMIT]
                quality_score:
                  type: number
      responses:
        "200":
          description: טרייד נשמר בהצלחה
  /get-trades:
    get:
      summary: קבלת כל הטריידים
      responses:
        "200":
          description: רשימת הטריידים
  /clear-trades:
    post:
      summary: מחיקת כל הטריידים
      responses:
        "200":
          description: כל הטריידים נמחקו
  /active-trade:
    get:
      summary: בדיקה אם יש טרייד פתוח כרגע
      responses:
        "200":
          description: טרייד פתוח (אם קיים)
  /update-trade:
    post:
      summary: עדכון סטטוס של טרייד לסגור (CLOSED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
      responses:
        "200":
          description: סטטוס טרייד עודכן
  /backtest:
    post:
      summary: בדיקת אסטרטגיה היסטורית
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        "200":
          description: טריידים תקפים שהתגלו בבק־טסט
  /analyze:
    post:
      summary: ניתוח טכני מלא כולל RSI, MACD, ATR, SL/TP וגרף
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        "200":
          description: תוצאות ניתוח כולל אות, RSI, MACD, SL/TP וגרף

components: {}

















