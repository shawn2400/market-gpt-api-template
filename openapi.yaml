openapi: 3.1.0
info:
  title: AlgoGPT API
  description: API עבור ניתוחים טכניים, חישובי SL/TP, שמירת טריידים, ביצוע מסחר, דוחות, חדשות ו־AI בזמן אמת.
  version: 1.0.0

servers:
  - url: https://market-gpt-api-template.onrender.com

paths:

  /price:
    get:
      summary: קבלת מחיר עדכני למטבע
      operationId: getPrice
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: סימול המטבע (כמו BTCUSDT)
      responses:
        '200':
          description: מחיר התקבל בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  price:
                    type: number
              example:
                symbol: BTCUSDT
                price: 29450.12

  /calculate-sl-tp:
    post:
      summary: חישוב SL ו־TP כולל יחס סיכון־רווח (RRR)
      operationId: calculateSlTp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
      responses:
        '200':
          description: חישוב בוצע בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  sl:
                    type: number
                  tp:
                    type: number
                  rrr:
                    type: number
              example:
                sl: 3.5
                tp: 4.2
                rrr: 2.8

  /calculate-quantity:
    post:
      summary: חישוב כמות לפי תקציב, מינוף ומחיר כניסה
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: number
      responses:
        '200':
          description: הכמות חושבה בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number
              example:
                quantity: 15.23

  /save-trade:
    post:
      summary: שמירת טרייד חדש למעקב
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: number
                direction:
                  type: string
                confidence:
                  type: number
                type:
                  type: string
                order_type:
                  type: string
      responses:
        '200':
          description: הטרייד נשמר בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: saved

  /save-and-execute:
    post:
      summary: שמירת טרייד + ביצוע LIVE מיידי בבינאנס
      operationId: saveAndExecute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: number
                direction:
                  type: string
                confidence:
                  type: number
                type:
                  type: string
                order_type:
                  type: string
                quantity:
                  type: number
      responses:
        '200':
          description: טרייד נשמר ובוצע מיידית
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: executed

  /get-trades:
    get:
      summary: הצגת כל הטריידים השמורים
      operationId: getTrades
      responses:
        '200':
          description: רשימת הטריידים התקבלה
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        entry:
                          type: number
                        stop:
                          type: number
                        tp:
                          type: number
                        status:
                          type: string
              example:
                trades:
                  - symbol: BTCUSDT
                    entry: 30000
                    stop: 29000
                    tp: 32500
                    status: OPEN

  /clear-trades:
    post:
      summary: ניקוי מוחלט של כל הטריידים
      operationId: clearTrades
      responses:
        '200':
          description: הטריידים נמחקו בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: cleared

  /stats:
    get:
      summary: הצגת סטטיסטיקות כוללות של ביצועים
      operationId: getStats
      responses:
        '200':
          description: סטטיסטיקות יומיות
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_trades:
                    type: integer
                  profitable_trades:
                    type: integer
                  win_rate:
                    type: number
                  total_pnl:
                    type: number
                  today_pnl:
                    type: number
              example:
                total_trades: 21
                profitable_trades: 18
                win_rate: 85.7
                total_pnl: 653.42
                today_pnl: 84.15

  /daily-report:
    get:
      summary: הפקת דוח יומי ב־PDF כולל גרף PNL
      operationId: getDailyReport
      responses:
        '200':
          description: דוח נוצר בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_base64:
                    type: string
              example:
                pdf_base64: "JVBERi0xLjQKJ..."

  /news:
    get:
      summary: קבלת חדשות קריפטו וניתוח השפעתן
      operationId: getCryptoNews
      responses:
        '200':
          description: חדשות נותחו בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  news:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        impact_score:
                          type: number
                        sentiment:
                          type: string
              example:
                news:
                  - title: "Bitcoin rallies 12%"
                    impact_score: 0.85
                    sentiment: "positive"

  /ai-analyze:
    post:
      summary: ניתוח AI עם Prophet לחיזוי מגמה עתידית
      operationId: aiAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                      close:
                        type: number
      responses:
        '200':
          description: ניתוח בוצע בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  direction:
                    type: string
                  forecast:
                    type: array
                    items:
                      type: object
                      properties:
                        ds:
                          type: string
                        yhat:
                          type: number
                        yhat_lower:
                          type: number
                        yhat_upper:
                          type: number
                  chart:
                    type: string
              example:
                symbol: ETHUSDT
                direction: LONG
                forecast:
                  - ds: "2025-07-27T12:00:00"
                    yhat: 3620.15
                    yhat_lower: 3598.22
                    yhat_upper: 3642.01
                chart: "<base64>"

components:
  schemas: {}




























