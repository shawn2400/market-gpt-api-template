openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: AlgoGPT API
  version: 2.14.3
  description: >
    AlgoGPT — מסחר אלגוריתמי בזמן אמת ב-Binance (Futures/Spot).
    כולל: Scan / AI / Trades / Backtest / News / Grid / Risk / Indicators / Analytics.

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

tags:
  - name: Config
  - name: Debug
  - name: Grid
  - name: Scan
  - name: AI
  - name: Trades
  - name: Backtest
  - name: Indicators
  - name: Analytics
  - name: News
  - name: Health
  - name: Dashboard
  - name: Risk
  - name: Snapshots
  - name: PnL
  - name: Strategy

security:
  - HTTPBearer: []

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        detail: { type: string, example: Unauthorized }

    BasicStatus:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 2.14.3 }

    MetricsResponse:
      type: object
      properties:
        boot_ts: { type: integer }
        uptime_sec: { type: integer }

    RoutesList:
      type: object
      properties:
        count: { type: integer, example: 25 }
        routes:
          type: array
          items:
            type: object
            properties:
              path: { type: string, example: /grid/status }
              methods: { type: array, items: { type: string } }

    GridStatus:
      type: object
      properties:
        ok: { type: boolean }
        active: { type: boolean }
        symbol: { type: string }
        orders:
          type: array
          items:
            type: object
            additionalProperties: true
        params:
          type: object
          additionalProperties: true

    ScanInfo:
      type: object
      properties:
        ok: { type: boolean }
        now_utc: { type: string }
        executor_running: { type: boolean }
        config: { type: object }

    ScanSignal:
      type: object
      properties:
        symbol: { type: string }
        market: { type: string }
        interval: { type: string }
        trend: { type: string }
        direction: { type: string }
        rsi: { type: number }
        adx: { type: number }
        volume: { type: number }
        quality_score: { type: number }
        signal: { type: string }
        confidence: { type: integer }
        reason: { type: string }
        close: { type: number }
        atr: { type: number }

    ScanResponse:
      type: object
      properties:
        ok: { type: boolean }
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ScanSignal" }

    AiHealthResponse:
      type: object
      properties:
        ok: { type: boolean }
        model: { type: string }
        latency_ms: { type: number }
        error: { type: string }

    AiQualityRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol: { type: string }
        side: { type: string, enum: [LONG, SHORT] }
        entry: { type: number }
        sl: { type: number }
        tp: { type: number }
        leverage: { type: integer }
        budget: { type: number }

    AiAnalyzeResponse:
      type: object
      properties:
        quality_score: { type: number }
        success_pct: { type: number }
        anchor: { type: object }
        components: { type: object }

    TradeRequest:
      type: object
      required: [symbol, side, entry]
      properties:
        symbol: { type: string }
        side: { type: string, enum: [LONG, SHORT] }
        entry: { type: number }
        sl: { type: number }
        tp: { type: number }
        leverage: { type: integer }
        budget: { type: number }

    TradeResponse:
      type: object
      properties:
        ok: { type: boolean }
        trade_id: { type: string }
        symbol: { type: string }
        side: { type: string }
        entry: { type: number }
        sl: { type: number }
        tp: { type: number }
        leverage: { type: integer }
        budget: { type: number }
        status: { type: string }

    PnlUpdate:
      type: object
      required: [symbol, direction, entry, exit_price, leverage, qty]
      properties:
        symbol: { type: string }
        direction: { type: string }
        entry: { type: number }
        exit_price: { type: number }
        leverage: { type: number }
        qty: { type: number }

    GenericResponse:
      type: object
      description: "Generic dynamic response (fallback)"
      properties: {}
      additionalProperties: true

paths:
  /:
    get:
      tags: [Config]
      summary: Server status
      operationId: getRootStatus
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicStatus" }

  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicStatus" }

  /health/live:
    get:
      tags: [Health]
      summary: Live health check
      operationId: getHealthLive
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: live }

  /grid/status:
    get:
      tags: [Grid]
      summary: Grid status
      operationId: getGridStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridStatus" }

  /grid/start:
    post:
      tags: [Grid]
      summary: Start grid trading
      operationId: postGridStart
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /grid/stop:
    post:
      tags: [Grid]
      summary: Stop grid trading
      operationId: postGridStop
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /trade:
    post:
      tags: [Trades]
      summary: Open new trade
      operationId: postOpenTrade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeResponse" }

  /pnl/update:
    post:
      tags: [PnL]
      summary: Update PnL from a trade
      operationId: postPnlUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PnlUpdate" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /pnl/daily:
    get:
      tags: [PnL]
      summary: Get daily PnL summary
      operationId: getPnlDaily
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /pnl/report:
    get:
      tags: [PnL]
      summary: Generate PnL PDF report
      operationId: getPnlReport
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /strategy/version:
    get:
      tags: [Strategy]
      summary: Get strategy version
      operationId: getStrategyVersion
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }



































