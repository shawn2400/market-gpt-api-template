openapi: "3.1.0"
info:
  title: "AlgoGPT API PRO Ultra"
  version: "2.0.1"
  description: |
    AlgoGPT – סוחר אלגוריתמי בזמן אמת (Binance Futures/Spot/Grid/AI)
    כולל טריידים חיים, גרידים, דוחות, ניתוחים חכמים, ניהול סיכונים,
    TP/SL חכם, Watchlist, Multi-TF Scan ועוד.
servers:
  - url: https://algogpt-docker.onrender.com

tags:
  - name: Config
  - name: Trades
  - name: Reports
  - name: AI
  - name: News
  - name: Watchlist
  - name: AutoExecutor

paths:
  /:
    get:
      tags: [Config]
      summary: "בדיקת תקינות השרת"
      operationId: checkServerStatus
      responses:
        "200":
          description: "השרת פועל"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /scan/multi:
    get:
      tags: [Trades]
      summary: "סריקת Multi-TF עם GPT"
      operationId: multiTFscan
      parameters:
        - name: min_quality
          in: query
          schema:
            type: integer
        - name: top
          in: query
          schema:
            type: integer
        - name: frames
          in: query
          schema:
            type: string
        - name: markets
          in: query
          schema:
            type: string
        - name: trending_only
          in: query
          schema:
            type: boolean
        - name: trending_source
          in: query
          schema:
            type: string
            enum: [coingecko, coinmarketcap, watchlist]
      responses:
        "200":
          description: "תוצאות סריקה Multi-TF"
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MultiTFResult"
        "500":
          description: "שגיאת שרת"

components:
  schemas:
    ScanSymbol:
      type: object
      properties:
        symbol:
          type: string
        close:
          type: number
        volume:
          type: number
        rsi:
          type: number
        adx:
          type: number
        macd:
          type: number
        macd_hist:
          type: number
        ema_21:
          type: number
        ema_50:
          type: number
        vwap:
          type: number
        bb_upper:
          type: number
        bb_lower:
          type: number
        stoch_k:
          type: number
        stoch_d:
          type: number
        obv:
          type: number
        cci:
          type: number
        mfi:
          type: number
        atr:
          type: number
        direction:
          type: string
        quality_score:
          type: integer

    MultiTFResult:
      type: object
      properties:
        symbol:
          type: string
        confluence:
          type: integer
        main_direction:
          type: string
        avg_quality:
          type: number
        frames:
          type: array
          items:
            type: string
        ai_opinion:
          type: string
        ai_score:
          type: number
        details:
          type: array
          items:
            $ref: "#/components/schemas/ScanSymbol"



















































