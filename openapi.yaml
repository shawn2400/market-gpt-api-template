openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: AlgoGPT API
  version: 2.15.0
  description: |
    AlgoGPT — מערכת מסחר אלגוריתמי בזמן אמת על Binance (Futures + Spot).
    כולל: Scan / AI / Trades / Grid / Risk / Indicators / Anchor / Executor / WS.
    ⚠️ רוב ה־endpoints דורשים Bearer Token (חוץ מ־/health).

servers:
  - url: https://algogpt-docker.onrender.com
    description: Production

tags:
  - name: Config
  - name: Health
  - name: Grid
  - name: Scan
  - name: AI
  - name: Trades
  - name: Indicators
  - name: Anchor
  - name: Executor
  - name: Price
  - name: Market
  - name: Utils
  - name: Debug
  - name: Websocket

security:
  - HTTPBearer: []

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          example: Unauthorized

    BasicStatus:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 2.15.0 }
        mode: { type: string, example: normal }

    GenericResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        message: { type: string, example: "Operation completed successfully" }
      additionalProperties: true

paths:
  /:
    get:
      tags: [Config]
      summary: Server status
      operationId: getRootStatus
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicStatus" }

  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealthStatus
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasicStatus" }

  /health/live:
    get:
      tags: [Health]
      summary: Live health check
      operationId: getHealthLive
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: live }

  /grid/status:
    get:
      tags: [Grid]
      summary: Grid status list
      operationId: getGridStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /grid/active:
    get:
      tags: [Grid]
      summary: Active grids only
      operationId: getGridActive
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /grid/start:
    post:
      tags: [Grid]
      summary: Start grid trading
      operationId: startGridTrading
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /grid/stop:
    post:
      tags: [Grid]
      summary: Stop grid trading
      operationId: stopGridTrading
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /trade/open:
    get:
      tags: [Trades]
      summary: List open trades
      operationId: getOpenTrades
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /trade/history:
    get:
      tags: [Trades]
      summary: Trade history
      operationId: getTradeHistory
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /trade/execute:
    post:
      tags: [Trades]
      summary: Execute trade
      operationId: executeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenericResponse" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /anchor/history:
    get:
      tags: [Anchor]
      summary: Anchor snapshot history
      operationId: getAnchorHistory
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /anchor/live:
    get:
      tags: [Anchor]
      summary: Live anchor evaluation
      operationId: getAnchorLive
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /price/{symbol}:
    get:
      tags: [Price]
      summary: Get latest price for symbol
      operationId: getPriceForSymbol
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /market/tickers:
    get:
      tags: [Market]
      summary: Get top tickers snapshot
      operationId: getMarketTickers
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /executor/status:
    get:
      tags: [Executor]
      summary: Executor status
      operationId: getExecutorStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /executor/symbols:
    get:
      tags: [Executor]
      summary: Executor symbols
      operationId: getExecutorSymbols
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /executor/logs:
    get:
      tags: [Executor]
      summary: Executor logs
      operationId: getExecutorLogs
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /executor/trades:
    get:
      tags: [Executor]
      summary: Executor trades
      operationId: getExecutorTrades
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /executor/open_positions:
    get:
      tags: [Executor]
      summary: Executor open positions
      operationId: getExecutorOpenPositions
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /executor/force_close:
    post:
      tags: [Executor]
      summary: Force close a position
      operationId: forceCloseExecutorPosition
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /utils/ping:
    get:
      tags: [Utils]
      summary: Ping server
      operationId: utilsPing
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /debug/health:
    get:
      tags: [Debug]
      summary: Get recent logs (only if not LIGHT_MODE)
      operationId: getDebugHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResponse" }

  /ws/stream:
    get:
      tags: [Websocket]
      summary: WebSocket price stream (multi-symbol)
      operationId: getWsStream
      description: Upgrade to websocket protocol
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)








































