openapi: 3.1.0
info:
  title: Market GPT API בעברית
  version: 1.0.0
description: |
  API אישי ל־GPT שמבצע חישובי SL/TP, שמירת טריידים, ניתוחים וגרידים חכמים.
  כולל פקודות מוכנות (Presets) בעברית.
servers:
  - url: https://market-gpt-api-template.onrender.com
paths:
  /auto-sl-tp:
    post:
      operationId: autoSlTp
      summary: חשב SL/TP אוטומטי
      description: מחשב סטופ לוס וטייק פרופיט לפי ATR ויחס סיכון/רווח.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                atr_sl:
                  type: number
                atr_tp:
                  type: number
              required:
                - symbol
                - entry
      responses:
        '200':
          description: תוצאה עם SL, TP ו־RRR
  /analyze-trade:
    post:
      operationId: analyzeTrade
      summary: חשב RRR
      description: מחשב יחס סיכון/רווח לפי כניסה, סטופ וטייק.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
              required:
                - entry
                - stop
                - tp
      responses:
        '200':
          description: מחזיר רק RRR
  /save-trade:
    post:
      operationId: saveTrade
      summary: שמור טרייד
      description: שומר טרייד עם פרטים כמו כניסה, SL, TP ו־RRR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                rrr:
                  type: number
                direction:
                  type: string
              required:
                - symbol
                - entry
                - stop
                - tp
      responses:
        '200':
          description: סטטוס שמירה
  /get-trades:
    get:
      operationId: getTrades
      summary: הצג את כל הטריידים
      description: מחזיר את כל הטריידים השמורים.
      responses:
        '200':
          description: רשימת טריידים
  /clear-trades:
    post:
      operationId: clearTrades
      summary: נקה את כל הטריידים
      description: מוחק את כל הטריידים מהזיכרון.
      responses:
        '200':
          description: טריידים נמחקו



