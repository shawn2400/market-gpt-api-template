openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר אלגוריתמי בזמן אמת המתחבר ל-Binance, מבצע ניתוחים טכניים, 
    חיזוי AI, טריידים בפועל, גרפים, דוחות, וסטטיסטיקות.
  version: 1.0.0
servers:
  - url: https://algogpt-docker.onrender.com
paths:
  /:
    get:
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AlgoGPT API is running ✅
  /scan:
    get:
      summary: סריקה חיה של שוק Binance Futures לפי קריטריונים טכניים
      operationId: scanFuturesMarket
      responses:
        '200':
          description: רשימת תוצאות מסוננות
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        last_price:
                          type: number
                        volume:
                          type: number
                        rsi:
                          type: number
                        adx:
                          type: number
                        direction:
                          type: string
  /backtest:
    post:
      summary: ביצוע Backtest על סדרת מחירים
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume?:
                        type: number
      responses:
        '200':
          description: תוצאות הסימולציה
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                    signal:
                      type: string
                    entry:
                      type: number
                    stop:
                      type: number
                    tp:
                      type: number
                    exit:
                      type: number
                    rrr:
                      type: number
                    pnl:
                      type: number
                    success:
                      type: boolean
                    quality_score:
                      type: number
  /execute-trade:
    post:
      summary: ביצוע טרייד חי בפועל
      operationId: executeLiveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                direction:
                  type: string
                  enum: [LONG, SHORT]
                leverage:
                  type: integer
                budget:
                  type: number
                use_grid:
                  type: boolean
      responses:
        '200':
          description: תוצאה מה־Binance Futures
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  symbol:
                    type: string
                  entry_price:
                    type: number
                  quantity:
                    type: number
                  stop:
                    type: number
                  tp:
                    type: number
                  leverage:
                    type: number
                  side:
                    type: string
        '400':
          description: שגיאה בבקשה
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
  /scan-and-execute:
    post:
      summary: סריקה + ביצוע טריידים במקביל
      operationId: scanAndExecuteBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget:
                  type: number
                leverage:
                  type: integer
                max_trades:
                  type: integer
      responses:
        '200':
          description: ביצוע סדרה של טריידים
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  executed_trades:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        entry:
                          type: number
                        stop_loss:
                          type: number
                        take_profit:
                          type: number
                        quantity:
                          type: number
                        leverage:
                          type: number
                        quality_score:
                          type: number
                        pnl_simulated:
                          type: number
                        trade_result:
                          type: object
  /pnl-report:
    get:
      summary: דוח יומי בפורמט PDF base64
      operationId: generateDailyReport
      responses:
        '200':
          description: דוח PDF מוצפן ב‑base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  report_name:
                    type: string
                  pdf_base64:
                    type: string
        '404':
          description: אין דוח זמין
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
  /news:
    get:
      summary: שליפת חדשות קריפטו מ‑CryptoPanic
      operationId: fetchCryptoNews
      responses:
        '200':
          description: רשימת חדשות (raw)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        published_at:
                          type: string
                        url:
                          type: string
  /news-impact:
    get:
      summary: ניתוח סנטימנט של חדשות קריפטו
      operationId: analyzeCryptoNewsImpact
      responses:
        '200':
          description: חדשות עם ציון השפעה
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    published_at:
                      type: string
                    url:
                      type: string
                    impact_score:
                      type: integer
  /save:
    post:
      summary: שמירת טרייד במאגר מקומי
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: integer
                direction:
                  type: string
                confidence:
                  type: number
                type:
                  type: string
      responses:
        '200':
          description: אישור שמירה
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /trades:
    get:
      summary: הצגת כל הטריידים השמורים
      operationId: listSavedTrades
      responses:
        '200':
          description: רשימת טריידים
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /clear:
    post:
      summary: ניקוי כל הטריידים המקומיים
      operationId: clearAllTrades
      responses:
        '200':
          description: טראנסקציה התקבלה, הטריידים נמחקו
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /strategy:
    get:
      summary: שליפת אסטרטגיה גולמית מקובץ preset.txt
      operationId: getStrategyText
      responses:
        '200':
          description: טקסט גולמי של אסטרטגיה
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy:
                    type: string
  /preset:
    get:
      summary: שליפת הגדרות preset כ‑JSON
      operationId: getPresetJson
      responses:
        '200':
          description: תוכן premise
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset:
                    type: string





































