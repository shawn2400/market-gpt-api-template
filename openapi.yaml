openapi: 3.1.0
info:
  title: AlgoGPT API
  description: |
    AlgoGPT הוא סוחר Algo בזמן אמת המתחבר ל-Binance, מבצע ניתוחים טכניים, חיזוי AI, טריידים בפועל, גרפים, דוחות, וסטטיסטיקות.
  version: 1.0.0

servers:
  - url: https://market-gpt-api-template.onrender.com

paths:
  /:
    get:
      summary: בדיקת סטטוס השרת
      operationId: checkServerStatus
      responses:
        '200':
          description: השרת פועל
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: AlgoGPT API is running

  /scan:
    get:
      summary: סריקה חיה של שוק Binance Futures לפי קריטריונים טכניים
      operationId: scanFuturesMarket
      responses:
        '200':
          description: רשימת תוצאות מסוננות
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        last_price:
                          type: number
                        volume:
                          type: number
                        rsi:
                          type: number
                        adx:
                          type: number
                        direction:
                          type: string

  /backtest:
    post:
      summary: ביצוע Backtest על סדרת מחירים
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
      responses:
        '200':
          description: תוצאות הסימולציה
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                  total_return:
                    type: number
                  win_rate:
                    type: number
                  chart:
                    type: string

  /execute-trade:
    post:
      summary: ביצוע טרייד בפועל
      operationId: executeLiveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: integer
                direction:
                  type: string
                  enum: [LONG, SHORT]
                budget:
                  type: number
                  description: סכום השקעה בדולרים
                use_grid:
                  type: boolean
                  description: הפעלת גריד חכם
      responses:
        '200':
          description: תוצאה מה-Binance
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  symbol:
                    type: string
                  qty:
                    type: number
                  entry:
                    type: number
                  leverage:
                    type: number
                  budget_used:
                    type: number
                  side:
                    type: string
                  grid:
                    type: boolean

  /sl_tp:
    post:
      summary: חישוב SL/TP לפי ATR ו-RRR
      operationId: calculateSLTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: number
                atr:
                  type: number
                direction:
                  type: string
                rrr:
                  type: number
      responses:
        '200':
          description: ערכי SL ו-TP מחושבים
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    type: number
                  stop:
                    type: number
                  tp:
                    type: number
                  rrr:
                    type: number

  /calculate-quantity:
    post:
      summary: חישוב כמות נכס לפי תקציב ומינוף
      operationId: calculateQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget:
                  type: number
                entry:
                  type: number
                leverage:
                  type: number
      responses:
        '200':
          description: כמות נכס מחושבת
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity:
                    type: number

  /daily-report:
    get:
      summary: הפקת דוח יומי (PDF מקודד ב-base64)
      operationId: generateDailyReport
      responses:
        '200':
          description: דוח יומי בקידוד base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_base64:
                    type: string

  /news:
    get:
      summary: שליפת חדשות קריפטו מ-CryptoPanic
      operationId: fetchCryptoNews
      responses:
        '200':
          description: רשימת חדשות
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        published_at:
                          type: string
                        url:
                          type: string

  /news-impact:
    get:
      summary: ניתוח סנטימנט של חדשות קריפטו
      operationId: analyzeCryptoNewsImpact
      responses:
        '200':
          description: רשימת חדשות עם ציון השפעה
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    published_at:
                      type: string
                    url:
                      type: string
                    impact_score:
                      type: integer

  /save:
    post:
      summary: שמירת טרייד בזיכרון
      operationId: saveTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                entry:
                  type: number
                stop:
                  type: number
                tp:
                  type: number
                leverage:
                  type: integer
                direction:
                  type: string
                confidence:
                  type: number
                type:
                  type: string
      responses:
        '200':
          description: טרייד נשמר

  /trades:
    get:
      summary: שליפת כל הטריידים השמורים
      operationId: getSavedTrades
      responses:
        '200':
          description: רשימת טריידים

  /clear:
    post:
      summary: ניקוי רשימת הטריידים
      operationId: clearAllTrades
      responses:
        '200':
          description: רשימת טריידים נוקתה

  /strategy:
    get:
      summary: שליפת אסטרטגיה גולמית בקובץ preset.txt
      operationId: getStrategyText
      responses:
        '200':
          description: טקסט האסטרטגיה

  /preset:
    get:
      summary: שליפת תוכן קובץ preset.txt בפורמט JSON
      operationId: getPresetJson
      responses:
        '200':
          description: תוכן preset
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset:
                    type: string




































