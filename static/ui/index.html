<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AlgoGPT Dashboard</title>
  <style>
    html,body{margin:0;background:#0b1220;color:#fff;font-family:Inter,Arial,Helvetica,sans-serif}
    a{color:#93c5fd}
    a:hover{text-decoration:none}
  </style>
  <script>
    // השרת יחליף את המחרוזת __API_TOKEN__ בזמן ההגשה (routes/ui_grid.py::_inject_index)
    window.API_BASE = ""; 
    window.API_TOKEN = "__API_TOKEN__";
  </script>
  <!-- שים לב: ה-CSP בקובץ render.yaml מעודכן לאפשר unpkg + unsafe-eval (בשביל Babel) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="ai-chat" style="position:fixed;top:0;left:0;width:340px;height:100%;background:#0f172a;border-inline-end:1px solid #1f2937;display:flex;flex-direction:column;z-index:50;padding:12px;box-sizing:border-box">
    <div style="font-weight:700;margin-bottom:8px">AI Chat</div>
    <div id="ai-chat-log" style="flex:1;overflow:auto;font-size:14px;opacity:.85"></div>
    <div style="display:flex;gap:8px">
      <input id="ai-chat-input" placeholder="כתוב חופשי..." style="flex:1;padding:8px;background:#111827;color:#fff;border:1px solid #374151;border-radius:8px" />
      <button id="ai-chat-send" style="padding:8px 12px;background:#2563eb;border:none;border-radius:8px;color:#fff">שלח</button>
    </div>
  </div>

  <div id="app-main" style="margin-inline-start:360px"></div>

  <!-- app.jsx (עם Babel בדפדפן) -->
  <script type="text/babel">
    const {useEffect,useState} = React;

    const API_BASE = (window.API_BASE || "").replace(/\/+$/,"") || "";

    function authHeaders(){
      const tok = window.API_TOKEN || "";
      // גם X-API-Key וגם Bearer (השרת מאמת אחד מהם)
      return {"X-API-Key":tok,"Authorization":"Bearer "+tok};
    }

    async function jget(path){
      const r = await fetch(API_BASE+path,{headers:authHeaders(), credentials:"same-origin"});
      if(!r.ok){
        if(r.status===401){ throw new Error("Unauthorized – בדוק את window.API_TOKEN / הרשאות גישה");}
        throw new Error(`HTTP ${r.status}`);
      }
      return r.json();
    }

    function App(){
      const [accounts,setAccounts]=useState([]);
      const [accountId,setAccountId]=useState("");
      const [activeGrids,setActiveGrids]=useState([]);
      const [trades,setTrades]=useState([]);
      const [pnl,setPnl]=useState(null);
      const [err,setErr]=useState("");

      useEffect(()=>{
        jget("/ui/grid/accounts").then((data)=>{
          if(data.ok){
            const list=Array.isArray(data.accounts)?data.accounts:[];
            setAccounts(list); if(list.length) setAccountId(list[0]);
          }else{
            setErr("Accounts API returned !ok");
          }
        }).catch(e=>setErr(String(e)));
      },[]);

      const loadData=()=>{
        if(!accountId) return; setErr("");
        jget(`/ui/grid/active?account_id=${encodeURIComponent(accountId)}`).then(d=>{
          setActiveGrids(Array.isArray(d.active)?d.active:[]);
        }).catch(e=>setErr(String(e)));

        jget(`/ui/grid/trades?account_id=${encodeURIComponent(accountId)}`).then(d=>{
          setTrades(Array.isArray(d.trades)?d.trades:[]);
        }).catch(e=>setErr(String(e)));

        jget(`/ui/grid/pnl?account_id=${encodeURIComponent(accountId)}`).then(d=>{
          setPnl(d?.summary??null);
        }).catch(e=>setErr(String(e)));
      };

      useEffect(()=>{ loadData(); },[accountId]);

      return (
        <div style={{minHeight:"100vh",background:"#0b1220",color:"#fff",padding:"24px",boxSizing:"border-box"}}>
          <h1 style={{fontSize:"22px",fontWeight:700,marginBottom:"12px"}}>AlgoGPT Grid Dashboard</h1>

          {err && <div style={{marginBottom:"12px",background:"#7f1d1d",border:"1px solid #ef4444",borderRadius:"8px",padding:"8px",fontSize:"14px"}}>{err}</div>}

          <div style={{marginBottom:"20px"}}>
            <label style={{marginInlineEnd:"8px"}}>בחר חשבון:</label>
            <select value={accountId} onChange={e=>setAccountId(e.target.value)}
                    style={{background:"#111827",border:"1px solid #4b5563",padding:"8px",borderRadius:"8px"}}>
              {accounts.map(acc=><option key={acc} value={acc}>{acc}</option>)}
            </select>
            <button onClick={loadData}
                    style={{marginInlineStart:"12px",background:"#2563eb",padding:"6px 12px",borderRadius:"8px",border:"none",color:"#fff"}}>
              רענן
            </button>
          </div>

          <div style={{marginBottom:"20px"}}>
            <h2 style={{fontSize:"18px",fontWeight:600,marginBottom:"8px"}}>גרידים פעילים</h2>
            {activeGrids.length===0? <p>אין גרידים פעילים.</p>:
            <table style={{width:"100%",borderCollapse:"collapse",border:"1px solid #374151",fontSize:"14px"}}>
              <thead>
                <tr style={{background:"#111827"}}>
                  <th style={{padding:"8px",border:"1px solid #374151"}}>Symbol</th>
                  <th style={{padding:"8px",border:"1px solid #374151"}}>Orders</th>
                </tr>
              </thead>
              <tbody>
                {activeGrids.map((g,i)=>
                  <tr key={i} style={{background:"#0b1220"}}>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{g.symbol}</td>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{Array.isArray(g.orders)?g.orders.length:0}</td>
                  </tr>
                )}
              </tbody>
            </table>}
          </div>

          <div style={{marginBottom:"20px"}}>
            <h2 style={{fontSize:"18px",fontWeight:600,marginBottom:"8px"}}>טריידים</h2>
            {trades.length===0? <p>אין טריידים להצגה.</p>:
            <table style={{width:"100%",borderCollapse:"collapse",border:"1px solid #374151",fontSize:"13px"}}>
              <thead>
                <tr style={{background:"#111827"}}>
                  {["ID","Symbol","Side","Entry","SL","TP","PNL"].map(h=>
                    <th key={h} style={{padding:"8px",border:"1px solid #374151"}}>{h}</th>
                  )}
                </tr>
              </thead>
              <tbody>
                {trades.map((t,i)=>
                  <tr key={i}>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{t.trade_id}</td>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{t.symbol}</td>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{t.side}</td>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{t.entry_price}</td>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{t.stop_price}</td>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{Array.isArray(t.tp_prices)?t.tp_prices.join(", "):""}</td>
                    <td style={{padding:"8px",border:"1px solid #374151"}}>{t.realized_pnl}</td>
                  </tr>
                )}
              </tbody>
            </table>}
          </div>

          <div>
            <h2 style={{fontSize:"18px",fontWeight:600,marginBottom:"8px"}}>סיכום PnL</h2>
            {!pnl? <p>אין נתונים.</p>:
            <pre style={{background:"#111827",padding:"12px",borderRadius:"8px",overflow:"auto"}}>{JSON.stringify(pnl,null,2)}</pre>}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app-main'));
    root.render(React.createElement(App));

    // צד שמאל – דמו צ'אט
    document.getElementById('ai-chat-send').onclick=()=>{
      const inp=document.getElementById('ai-chat-input');
      const log=document.getElementById('ai-chat-log');
      const q=(inp.value||"").trim(); if(!q) return;
      const p=document.createElement('div'); p.textContent="אתה: "+q; log.appendChild(p);
      const a=document.createElement('div'); a.textContent="AI: (placeholder)"; a.style.opacity=".7"; log.appendChild(a);
      inp.value=""; log.scrollTop=log.scrollHeight;
    };
  </script>
</body>
</html>
