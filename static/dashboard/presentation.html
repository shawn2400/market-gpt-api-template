<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בס"ד - AlgoGPT Ultimate Edition</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            overflow: hidden;
        }
        
        .gradient-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        
        .card-hover:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(139, 92, 246, 0.3), 
                        0 20px 25px -5px rgba(139, 92, 246, 0.2);
        }
        
        .tab-active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .pulse-green {
            animation: pulse-green 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse-green {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            50% {
                opacity: 0.8;
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }
        }
        
        @keyframes pulse-orange {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            }
            50% {
                opacity: 0.8;
                box-shadow: 0 0 0 10px rgba(245, 158, 11, 0);
            }
        }
        
        @keyframes pulse-red {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            50% {
                opacity: 0.8;
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }
        
        .status-active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 12px #10b981, 0 0 24px rgba(16, 185, 129, 0.5);
            animation: pulse-green 2s infinite;
        }
        
        .status-planned {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 0 12px #f59e0b;
            animation: pulse-orange 2s infinite;
        }
        
        .status-error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 0 12px #ef4444, 0 0 24px rgba(239, 68, 68, 0.5);
            animation: pulse-red 2s infinite;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(107, 114, 128, 0.3);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 999px;
            transition: width 1s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer-progress 2s infinite;
        }
        
        @keyframes shimmer-progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .chart-container {
            position: relative;
            height: 280px;
            padding: 10px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, rgba(107, 114, 128, 0.1) 0%, rgba(107, 114, 128, 0.05) 100%);
            border: 1px solid rgba(139, 92, 246, 0.2);
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
        }
        
        .icon-lg {
            font-size: 2rem;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }
        
        .tooltip {
            position: relative;
            display: inline-block;
        }
        
        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1000;
            margin-bottom: 8px;
        }
        
        .glass-effect {
            background: rgba(31, 41, 55, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tab-compact {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        
        .compact-header {
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        .compact-title {
            font-size: 1rem;
            font-weight: 600;
        }
    </style>
</head>

    <div id="root"></div>

            },
            en: {
                header: 'B"H - AlgoGPT Ultimate Edition',
                subtitle: 'Production-Grade 24/7 Autonomous Algorithmic Trading Platform',
                tabs: {
                    architecture: '🏗️ Architecture',
                    ai_mesh: '🤖 8-AI Mesh',
                    news: '📰 News Sources',
                    benchmarking: '📊 Benchmarking',
                    budget: '💰 Budget',
                    roadmap: '🗺️ ROADMAP',
                    metrics: '📈 Metrics',
                    quickstart: '⚡ Quick Start'
                },
                connected: 'Connected',
                disconnected: 'Disconnected',
                reconnecting: 'Reconnecting...',
                loading: 'Loading...',
                error: 'Error loading data',
                status: 'Status',
                active: 'Active',
                planned: 'Planned',
                weight: 'Weight',
                provider: 'Provider',
                model: 'Model',
                type: 'Type',
                category: 'Category',
                totalWeight: 'Total Weight',
                consensusThreshold: 'Consensus Threshold',
                totalSources: 'Total Sources',
                activeSources: 'Active Sources',
                totalEngines: 'Total Engines',
                monthlyBudget: 'Monthly Budget',
                recommended: '⭐ Recommended',
                features: 'Features',
                additionalCosts: 'Additional Costs',
                totalEstimated: 'Total Estimated',
                totalWeeks: 'Total Weeks',
                totalTasks: 'Total Tasks',
                currentPhase: 'Current Phase',
                completion: 'Completion',
                phase: 'Phase',
                weeks: 'Weeks',
                tasks: 'Tasks',
                systemUptime: 'System Uptime',
                tradesToday: 'Trades Today',
                tradesWeek: 'Trades This Week',
                tradesAllTime: 'All Time Trades',
                winRate: 'Win Rate',
                totalPnL: 'Total P&L',
                avgRR: 'Avg RR',
                bestTrade: 'Best Trade',
                worstTrade: 'Worst Trade',
                hosting: '🌐 Hosting',
                versionControl: '📦 Version Control',
                aiReviewer: '🤖 AI Reviewer',
                backend: '⚙️ Backend',
                frontend: '🎨 Frontend',
                workers: '👷 Workers',
                days: 'days',
                hours: 'hours'
            }
        };

        function App() {
            const [data, setData] = useState(null);
            const [activeTab, setActiveTab] = useState('ai_mesh');
            const [wsStatus, setWsStatus] = useState('disconnected');
            const [language, setLanguage] = useState('he');
            const [lastUpdate, setLastUpdate] = useState(null);
            const wsRef = useRef(null);
            const reconnectTimeoutRef = useRef(null);

            const t = translations[language];

            useEffect(() => {
                document.documentElement.lang = language;
                document.documentElement.dir = language === 'he' ? 'rtl' : 'ltr';
            }, [language]);

            useEffect(() => {
                fetchData();
                connectWebSocket();

                return () => {
                    if (wsRef.current) {
                        wsRef.current.close();
                    }
                    if (reconnectTimeoutRef.current) {
                        clearTimeout(reconnectTimeoutRef.current);
                    }
                };
            }, []);

            const fetchData = async () => {
                try {
                    const response = await fetch('/dashboard/presentation');
                    if (!response.ok) throw new Error('Failed to fetch');
                    const json = await response.json();
                    setData(json);
                    setLastUpdate(new Date());
                } catch (error) {
                    console.error('Error fetching data:', error);
                }
            };

            const connectWebSocket = () => {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/dashboard/ws/presentation`;

                try {
                    const ws = new WebSocket(wsUrl);
                    wsRef.current = ws;

                    ws.onopen = () => {
                        console.log('WebSocket connected');
                        setWsStatus('connected');
                    };

                    ws.onmessage = (event) => {
                        try {
                            const update = JSON.parse(event.data);
                            if (update.type === 'metrics_update' && data) {
                                setData(prevData => ({
                                    ...prevData,
                                    sections: {
                                        ...prevData.sections,
                                        metrics: update.data
                                    }
                                }));
                                setLastUpdate(new Date());
                            }
                        } catch (error) {
                            console.error('Error parsing WebSocket message:', error);
                        }
                    };

                    ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        setWsStatus('error');
                    };

                    ws.onclose = () => {
                        console.log('WebSocket closed');
                        setWsStatus('reconnecting');
                        
                        reconnectTimeoutRef.current = setTimeout(() => {
                            connectWebSocket();
                        }, 5000);
                    };
                } catch (error) {
                    console.error('Error creating WebSocket:', error);
                    setWsStatus('error');
                }
            };

            const toggleLanguage = () => {
                setLanguage(prev => prev === 'he' ? 'en' : 'he');
            };

            if (!data) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-900">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-16 w-16 border-b-4 border-purple-500 mx-auto mb-4"></div>
                            <p className="text-xl text-gray-300">{t?.loading || 'Loading...'}</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-900 fade-in">
                    <header className="gradient-bg shadow-2xl sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 py-3 relative z-10">
                            <div className="flex justify-between items-center flex-wrap gap-3">
                                <div>
                                    <h1 className="text-xl sm:text-2xl font-bold text-white mb-1">{t.header}</h1>
                                    <p className="text-xs sm:text-sm text-purple-100">{t.subtitle}</p>
                                </div>
                                <div className="flex items-center gap-2 sm:gap-3">
                                    <button
                                        onClick={toggleLanguage}
                                        className="bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-3 py-1.5 text-sm rounded-lg transition-all hover:scale-105"
                                    >
                                        {language === 'he' ? 'EN' : 'עב'}
                                    </button>
                                    <div className="flex items-center gap-2 glass-effect px-3 py-1.5 rounded-lg">
                                        <span className={`status-dot ${wsStatus === 'connected' ? 'status-active' : wsStatus === 'error' ? 'status-error' : 'status-planned'}`}></span>
                                        <span className="text-xs sm:text-sm text-white">
                                            {wsStatus === 'connected' ? t.connected : wsStatus === 'reconnecting' ? t.reconnecting : t.disconnected}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 py-4">
                        <div className="glass-effect rounded-xl shadow-2xl overflow-hidden mb-4">
                            <div className="flex overflow-x-auto scrollbar-hide">
                                {Object.entries(t.tabs).map(([key, label]) => (
                                    <button
                                        key={key}
                                        onClick={() => setActiveTab(key)}
                                        className={`tab-compact font-semibold whitespace-nowrap transition-all ${
                                            activeTab === key
                                                ? 'tab-active'
                                                : 'text-gray-300 hover:text-white hover:bg-gray-700'
                                        }`}
                                    >
                                        {label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="glass-effect rounded-xl shadow-2xl p-3 sm:p-5 fade-in">
                            {activeTab === 'architecture' && <ArchitectureTab data={data.sections.architecture} t={t} />}
                            {activeTab === 'ai_mesh' && <AIMeshTab data={data.sections.ai_mesh} t={t} />}
                            {activeTab === 'news' && <NewsTab data={data.sections.news_sources} t={t} />}
                            {activeTab === 'benchmarking' && <BenchmarkingTab data={data.sections.benchmarking} t={t} />}
                            {activeTab === 'budget' && <BudgetTab data={data.sections.budget} t={t} />}
                            {activeTab === 'roadmap' && <RoadmapTab data={data.sections.roadmap} t={t} />}
                            {activeTab === 'metrics' && <MetricsTab data={data.sections.metrics} t={t} />}
                            {activeTab === 'quickstart' && <QuickStartTab data={data.sections.quick_start} t={t} />}
                        </div>

                        {lastUpdate && (
                            <footer className="mt-4 text-center text-gray-500 text-xs">
                                Last updated: {lastUpdate.toLocaleString(language === 'he' ? 'he-IL' : 'en-US')}
                            </footer>
                        )}
                    </div>
                </div>
            );
        }

        function ArchitectureTab({ data, t }) {
            return (
                <div className="space-y-4">
                    <h2 className="compact-title text-purple-400 mb-4">🏗️ {t.tabs.architecture}</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div className="metric-card rounded-lg p-4 card-hover fade-in">
                            <h3 className="compact-header text-purple-300 mb-3 flex items-center gap-2">
                                {t.hosting}
                            </h3>
                            <div className="space-y-2 text-sm">
                                <p><span className="text-gray-400">Provider:</span> <span className="text-green-400 font-semibold">{data.hosting.provider}</span></p>
                                <p><span className="text-gray-400">Tier:</span> <span className="text-purple-400 font-semibold">{data.hosting.tier}</span></p>
                                <div className="mt-3">
                                    <p className="text-gray-400 text-xs mb-2">{t.features}:</p>
                                    <ul className="list-none space-y-1 text-xs">
                                        {data.hosting.features.map((feature, i) => (
                                            <li key={i} className="flex items-center gap-2">
                                                <span className="text-green-400">✓</span>
                                                <span>{feature}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div className="metric-card rounded-lg p-4 card-hover fade-in">
                            <h3 className="compact-header text-purple-300 mb-3 flex items-center gap-2">
                                {t.versionControl}
                            </h3>
                            <div className="space-y-2 text-sm">
                                <p><span className="text-gray-400">Provider:</span> <span className="text-purple-400 font-semibold">{data.version_control.provider}</span></p>
                                <div className="mt-3">
                                    <p className="text-gray-400 text-xs mb-2">{t.features}:</p>
                                    <ul className="list-none space-y-1 text-xs">
                                        {data.version_control.features.map((feature, i) => (
                                            <li key={i} className="flex items-center gap-2">
                                                <span className="text-green-400">✓</span>
                                                <span>{feature}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div className="metric-card rounded-lg p-4 card-hover fade-in">
                            <h3 className="compact-header text-purple-300 mb-3 flex items-center gap-2">
                                {t.backend}
                            </h3>
                            <div className="space-y-2 text-sm">
                                <p className="flex items-center gap-2">
                                    <span className="text-gray-400">Framework:</span> 
                                    <span className="bg-green-900 bg-opacity-40 px-2 py-0.5 rounded text-green-300 text-xs">{data.backend.framework}</span>
                                </p>
                                <p className="flex items-center gap-2">
                                    <span className="text-gray-400">Language:</span>
                                    <span className="bg-blue-900 bg-opacity-40 px-2 py-0.5 rounded text-blue-300 text-xs">{data.backend.language}</span>
                                </p>
                                <p className="flex items-center gap-2">
                                    <span className="text-gray-400">Database:</span>
                                    <span className="bg-purple-900 bg-opacity-40 px-2 py-0.5 rounded text-purple-300 text-xs">{data.backend.database}</span>
                                </p>
                                <p className="flex items-center gap-2">
                                    <span className="text-gray-400">Cache:</span>
                                    <span className="bg-red-900 bg-opacity-40 px-2 py-0.5 rounded text-red-300 text-xs">{data.backend.cache}</span>
                                </p>
                            </div>
                        </div>

                        <div className="metric-card rounded-lg p-4 card-hover fade-in">
                            <h3 className="compact-header text-purple-300 mb-3 flex items-center gap-2">
                                {t.frontend}
                            </h3>
                            <div className="space-y-2 text-sm">
                                <p className="flex items-center gap-2">
                                    <span className="text-gray-400">Framework:</span>
                                    <span className="bg-cyan-900 bg-opacity-40 px-2 py-0.5 rounded text-cyan-300 text-xs">{data.frontend.framework}</span>
                                </p>
                                <p className="flex items-center gap-2">
                                    <span className="text-gray-400">Styling:</span>
                                    <span className="bg-indigo-900 bg-opacity-40 px-2 py-0.5 rounded text-indigo-300 text-xs">{data.frontend.styling}</span>
                                </p>
                                <p className="flex items-center gap-2">
                                    <span className="text-gray-400">Charts:</span>
                                    <span className="bg-pink-900 bg-opacity-40 px-2 py-0.5 rounded text-pink-300 text-xs">{data.frontend.charts}</span>
                                </p>
                                <p className="flex items-center gap-2">
                                    <span className="text-gray-400">Mobile:</span>
                                    <span className="bg-emerald-900 bg-opacity-40 px-2 py-0.5 rounded text-emerald-300 text-xs">{data.frontend.mobile}</span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="metric-card rounded-lg p-4 card-hover fade-in">
                        <h3 className="compact-header text-purple-300 mb-3 flex items-center gap-2">
                            {t.workers} <span className="text-xs text-gray-400">({data.workers.length} active)</span>
                        </h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                            {data.workers.map((worker, i) => (
                                <div key={i} className="bg-gray-800 bg-opacity-50 rounded-lg p-2 text-xs flex items-center gap-2 hover:bg-opacity-70 transition-all">
                                    <span className="status-dot status-active"></span>
                                    <span>{worker}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AIMeshTab({ data, t }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current && data.models) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    const activeModels = data.models.filter(m => m.weight > 0);
                    
                    chartInstance.current = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: activeModels.map(m => m.name),
                            datasets: [{
                                data: activeModels.map(m => m.weight),
                                backgroundColor: [
                                    'rgba(139, 92, 246, 0.9)',
                                    'rgba(236, 72, 153, 0.9)',
                                    'rgba(245, 158, 11, 0.9)',
                                    'rgba(16, 185, 129, 0.9)',
                                    'rgba(59, 130, 246, 0.9)',
                                    'rgba(239, 68, 68, 0.9)',
                                    'rgba(99, 102, 241, 0.9)',
                                    'rgba(20, 184, 166, 0.9)'
                                ],
                                borderWidth: 3,
                                borderColor: '#1f2937',
                                hoverOffset: 15
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'right',
                                    labels: {
                                        color: '#e5e7eb',
                                        padding: 12,
                                        font: { size: 11 }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    titleFont: { size: 13 },
                                    bodyFont: { size: 12 },
                                    callbacks: {
                                        label: function(context) {
                                            const model = activeModels[context.dataIndex];
                                            return [
                                                `${context.label}: ${context.parsed}%`,
                                                `Provider: ${model.provider}`,
                                                `Status: ${model.status}`
                                            ];
                                        }
                                    }
                                }
                            },
                            animation: {
                                animateRotate: true,
                                animateScale: true
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [data]);

            return (
                <div className="space-y-4">
                    <h2 className="compact-title text-purple-400 mb-4">🤖 {t.tabs.ai_mesh}</h2>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">{t.totalWeight}</p>
                            <p className="text-3xl font-bold text-purple-400">{data.total_weight}%</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">{t.consensusThreshold}</p>
                            <p className="text-3xl font-bold text-green-400">{data.consensus_threshold}%</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">Total Models</p>

                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <div className="metric-card rounded-lg p-4 fade-in">
                            <h3 className="compact-header text-purple-300 mb-3">📊 Weight Distribution</h3>
                            <div className="chart-container">
                                <canvas ref={chartRef}></canvas>
                            </div>
                        </div>

                        <div className="space-y-2">
                            {data.models.map((model, i) => (
                                <div key={i} className="metric-card rounded-lg p-3 card-hover fade-in">
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="flex-1">
                                            <h4 className="text-sm font-semibold flex items-center gap-2">
                                                {model.name}
                                                {model.status === 'active' && <span className="text-xs">✓</span>}
                                            </h4>
                                            <p className="text-xs text-gray-400">{model.provider} • {model.model}</p>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className={`status-dot ${model.status === 'active' ? 'status-active' : 'status-planned'}`}></span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="flex-1 progress-bar">
                                            <div 
                                                className="progress-fill"
                                                style={{ width: `${model.weight}%` }}
                                            ></div>
                                        </div>
                                        <span className="text-sm font-semibold text-purple-400">{model.weight}%</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function NewsTab({ data, t }) {
            const activeCount = data.sources.filter(s => s.status === 'active').length;

            return (
                <div className="space-y-4">
                    <h2 className="compact-title text-purple-400 mb-4">📰 {t.tabs.news}</h2>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">{t.totalSources}</p>
                            <p className="text-3xl font-bold text-purple-400">{data.total_sources}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">{t.activeSources}</p>
                            <p className="text-3xl font-bold text-green-400">{activeCount}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">Planned</p>
                            <p className="text-3xl font-bold text-yellow-400">{data.total_sources - activeCount}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {data.sources.map((source, i) => (
                            <div key={i} className="metric-card rounded-lg p-3 card-hover fade-in">
                                <div className="flex justify-between items-start mb-2">
                                    <h3 className="text-sm font-semibold flex items-center gap-2">
                                        {source.name}
                                    </h3>
                                    <span className={`status-dot ${source.status === 'active' ? 'status-active' : 'status-planned'}`}></span>
                                </div>
                                <div className="space-y-1 text-xs">
                                    <p className="flex items-center gap-2">
                                        <span className="text-gray-400">{t.type}:</span>
                                        <span className="bg-blue-900 bg-opacity-40 px-2 py-0.5 rounded text-blue-300">{source.type}</span>
                                    </p>
                                    <p className="flex items-center gap-2">
                                        <span className="text-gray-400">{t.category}:</span>
                                        <span className="text-gray-300">{source.category}</span>
                                    </p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function BenchmarkingTab({ data, t }) {
            return (
                <div className="space-y-4">
                    <h2 className="compact-title text-purple-400 mb-4">📊 {t.tabs.benchmarking}</h2>
                    
                    <div className="metric-card rounded-lg p-3 text-center mb-4 card-hover fade-in">
                        <p className="text-gray-400 text-xs mb-1">{t.totalEngines}</p>
                        <p className="text-4xl font-bold text-purple-400">{data.total_engines}</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {data.engines.map((engine, i) => (
                            <div key={i} className="metric-card rounded-lg p-3 card-hover fade-in">
                                <div className="flex justify-between items-start mb-2">
                                    <div>
                                        <h3 className="text-sm font-semibold">{engine.name}</h3>
                                        <p className="text-xs text-gray-400">{engine.language}</p>
                                    </div>
                                    <span className={`status-dot ${engine.status === 'active' ? 'status-active' : 'status-planned'}`}></span>
                                </div>
                                <p className="text-xs text-gray-300 mb-2">{engine.use_case}</p>
                                <div className="text-xs">
                                    <span className={`px-2 py-0.5 rounded ${
                                        engine.status === 'active' 
                                            ? 'bg-green-900 bg-opacity-40 text-green-300' 
                                            : 'bg-yellow-900 bg-opacity-40 text-yellow-300'
                                    }`}>
                                        {engine.status}
                                    </span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function BudgetTab({ data, t }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current && data.options) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.options.map(o => o.ram),
                            datasets: [{
                                label: 'Monthly Cost (USD)',
                                data: data.options.map(o => o.monthly_cost_usd),
                                backgroundColor: [
                                    'rgba(245, 158, 11, 0.8)',
                                    'rgba(139, 92, 246, 0.8)'
                                ],
                                borderColor: [
                                    'rgba(245, 158, 11, 1)',
                                    'rgba(139, 92, 246, 1)'
                                ],
                                borderWidth: 2,
                                borderRadius: 8,
                                hoverBackgroundColor: [
                                    'rgba(245, 158, 11, 1)',
                                    'rgba(139, 92, 246, 1)'
                                ]
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: {
                                        color: '#e5e7eb',
                                        font: { size: 12 }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    callbacks: {
                                        label: function(context) {
                                            const option = data.options[context.dataIndex];
                                            return [
                                                `Cost: $${context.parsed.y}/month`,
                                                `Features: ${option.features.length}`,
                                                `Recommended: ${option.recommended ? 'Yes ⭐' : 'No'}`
                                            ];
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        color: '#e5e7eb',
                                        font: { size: 11 },
                                        callback: value => `$${value}`
                                    },
                                    grid: {
                                        color: 'rgba(75, 85, 99, 0.3)'
                                    }
                                },
                                x: {
                                    ticks: {
                                        color: '#e5e7eb',
                                        font: { size: 11 }
                                    },
                                    grid: {
                                        color: 'rgba(75, 85, 99, 0.3)'
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [data]);

            return (
                <div className="space-y-4">
                    <h2 className="compact-title text-purple-400 mb-4">💰 {t.tabs.budget}</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                        {data.options.map((option, i) => (
                            <div key={i} className={`metric-card rounded-lg p-4 card-hover fade-in ${option.recommended ? 'ring-2 ring-purple-500' : ''}`}>
                                {option.recommended && (
                                    <div className="bg-purple-600 text-white px-2 py-1 rounded-full text-xs inline-block mb-2">
                                        {t.recommended}
                                    </div>
                                )}
                                <h3 className="compact-header mb-2">{option.name}</h3>
                                <p className="text-2xl font-bold text-purple-400 mb-3">${option.monthly_cost_usd}<span className="text-sm text-gray-400">/mo</span></p>
                                <div className="space-y-2">
                                    <p className="text-sm text-gray-300">RAM: <span className="text-purple-300 font-semibold">{option.ram}</span></p>
                                    <div>
                                        <p className="text-gray-400 text-xs mb-2">{t.features}:</p>
                                        <ul className="list-none space-y-1 text-xs">
                                            {option.features.map((feature, j) => (
                                                <li key={j} className="flex items-center gap-2">
                                                    <span className="text-green-400">✓</span>
                                                    <span>{feature}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="metric-card rounded-lg p-4 fade-in">
                        <h3 className="compact-header text-purple-300 mb-3">📊 Cost Comparison</h3>
                        <div className="chart-container mb-4">
                            <canvas ref={chartRef}></canvas>
                        </div>
                        <div className="bg-purple-900 bg-opacity-30 rounded-lg p-3 text-center">
                            <p className="text-gray-400 text-xs mb-1">{t.totalEstimated} (with APIs)</p>
                            <p className="text-2xl font-bold text-purple-400">${data.additional_costs.total_estimated_monthly}<span className="text-sm">/mo</span></p>
                        </div>
                    </div>
                </div>
            );
        }

        function RoadmapTab({ data, t }) {
            return (
                <div className="space-y-4">
                    <h2 className="compact-title text-purple-400 mb-4">🗺️ {t.tabs.roadmap}</h2>
                    
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">{t.totalWeeks}</p>
                            <p className="text-3xl font-bold text-purple-400">{data.total_weeks}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">{t.totalTasks}</p>
                            <p className="text-3xl font-bold text-purple-400">{data.total_tasks}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">{t.currentPhase}</p>
                            <p className="text-3xl font-bold text-green-400">{data.current_phase}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">{t.completion}</p>
                            <p className="text-3xl font-bold text-purple-400">{data.completion_percentage}%</p>
                        </div>
                    </div>

                    <div className="space-y-3">
                        {data.phases.map((phase, i) => {
                            const progress = phase.status === 'completed' ? 100 : 
                                           phase.status === 'in_progress' ? 40 : 0;
                            
                            return (
                                <div key={i} className="metric-card rounded-lg p-4 card-hover fade-in">
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="flex-1">
                                            <h3 className="text-sm font-semibold flex items-center gap-2">
                                                <span className="text-purple-400">{t.phase} {phase.phase}:</span>
                                                <span>{phase.name}</span>
                                            </h3>
                                            <p className="text-xs text-gray-400 mt-1">
                                                {t.weeks} {phase.weeks} • {phase.tasks} {t.tasks}
                                            </p>
                                        </div>
                                        <span className={`px-2 py-1 rounded-full text-xs font-semibold ${
                                            phase.status === 'in_progress' ? 'bg-green-600' :
                                            phase.status === 'completed' ? 'bg-purple-600' :
                                            'bg-gray-600'
                                        }`}>
                                            {phase.status === 'in_progress' ? '🔄 In Progress' :
                                             phase.status === 'completed' ? '✓ Done' :
                                             '⏳ Planned'}
                                        </span>
                                    </div>
                                    <div className="progress-bar">
                                        <div 
                                            className="progress-fill"
                                            style={{ width: `${progress}%` }}
                                        ></div>
                                    </div>
                                    <div className="flex justify-between items-center mt-2 text-xs text-gray-400">
                                        <span>{progress}% Complete</span>
                                        <span>{phase.tasks} tasks</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function MetricsTab({ data, t }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current && data.trades) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Today', 'This Week', 'All Time'],
                            datasets: [{
                                label: 'Total Trades',
                                data: [data.trades.total_today, data.trades.total_week, data.trades.total_all_time],
                                borderColor: 'rgba(139, 92, 246, 1)',
                                backgroundColor: 'rgba(139, 92, 246, 0.2)',
                                tension: 0.4,
                                fill: true,
                                borderWidth: 3,
                                pointRadius: 6,
                                pointHoverRadius: 8,
                                pointBackgroundColor: 'rgba(139, 92, 246, 1)',
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: {
                                        color: '#e5e7eb',
                                        font: { size: 12 }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    callbacks: {
                                        label: function(context) {
                                            return `Trades: ${context.parsed.y}`;
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        color: '#e5e7eb',
                                        font: { size: 11 }
                                    },
                                    grid: {
                                        color: 'rgba(75, 85, 99, 0.3)'
                                    }
                                },
                                x: {
                                    ticks: {
                                        color: '#e5e7eb',
                                        font: { size: 11 }
                                    },
                                    grid: {
                                        color: 'rgba(75, 85, 99, 0.3)'
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [data, t]);

            return (
                <div className="space-y-4">
                    <h2 className="compact-title text-purple-400 mb-4">📈 {t.tabs.metrics}</h2>
                    
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">⏱️ {t.systemUptime}</p>
                            <p className="text-2xl font-bold text-purple-400">
                                {data.system.uptime_days}
                            </p>
                            <p className="text-xs text-gray-400 mt-1">{t.days}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">📅 {t.tradesToday}</p>
                            <p className="text-2xl font-bold text-green-400">{data.trades.total_today}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">📆 {t.tradesWeek}</p>
                            <p className="text-2xl font-bold text-blue-400">{data.trades.total_week}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">📊 {t.tradesAllTime}</p>
                            <p className="text-2xl font-bold text-purple-400">{data.trades.total_all_time}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">🎯 {t.winRate}</p>
                            <p className="text-2xl font-bold text-green-400">{data.trades.win_rate}%</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">💵 {t.totalPnL}</p>
                            <p className={`text-2xl font-bold ${data.trades.total_pnl >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                ${data.trades.total_pnl.toFixed(2)}
                            </p>
                        </div>
                    </div>

                    <div className="metric-card rounded-lg p-4 fade-in">
                        <h3 className="compact-header text-purple-300 mb-3">📊 Trade Activity</h3>
                        <div className="chart-container">
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">⚖️ {t.avgRR}</p>
                            <p className="text-2xl font-bold text-purple-400">{data.performance.avg_rr.toFixed(2)}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">🏆 {t.bestTrade}</p>
                            <p className="text-2xl font-bold text-green-400">${data.performance.best_trade_pnl.toFixed(2)}</p>
                        </div>
                        <div className="metric-card rounded-lg p-3 text-center card-hover fade-in">
                            <p className="text-gray-400 text-xs mb-1">📉 {t.worstTrade}</p>
                            <p className="text-2xl font-bold text-red-400">${data.performance.worst_trade_pnl.toFixed(2)}</p>
                        </div>
                    </div>
                </div>
            );
        }

        function QuickStartTab({ data, t }) {
            return (
                <div className="space-y-4">
                    <h2 className="compact-title text-purple-400 mb-4">⚡ {t.tabs.quickstart}</h2>
                    
                    <div className="space-y-2">
                        {data.steps.map((step, i) => (
                            <div key={i} className="metric-card rounded-lg p-3 card-hover fade-in flex items-start gap-3">
                                <div className="flex-shrink-0 w-7 h-7 rounded-full bg-purple-600 flex items-center justify-center text-white text-sm font-bold">
                                    {i + 1}

                                <p className="text-sm text-gray-200 flex-1 pt-0.5">{step}</p>
                            </div>
                        ))}
                    </div>

                    <div className="metric-card rounded-lg p-4 mt-6 border-2 border-purple-500 fade-in">
                        <h3 className="compact-header text-purple-300 mb-3 flex items-center gap-2">
                            🚀 Ready to Deploy!
                        </h3>
                        <p className="text-sm text-gray-300">
                            Follow the steps above to get your AlgoGPT system up and running.
                            All components are production-ready and optimized for 24/7 autonomous trading.
                        </p>
                    </div>
                </div>

        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
