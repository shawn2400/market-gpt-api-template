<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AlgoGPT Ultimate Edition - Algorithmic Trading Platform</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --glass-bg: rgba(31, 41, 55, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --bg-dark: #0a0a1a;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --sidebar-width: 280px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 24px 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        .logo-container {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }
        
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
        }
        
        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        
        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .nav-section {
            margin-bottom: 24px;
            padding: 0 12px;
        }
        
        .nav-section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }
        
        .nav-items {
            list-style: none;
        }
        
        .nav-item {
            margin-bottom: 4px;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .nav-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: var(--text-primary);
            transform: translateX(2px);
        }
        
        .nav-link.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            color: var(--text-primary);
            border-left: 3px solid var(--primary);
        }
        
        .nav-icon {
            font-size: 1.4rem;
            min-width: 24px;
            text-align: center;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 32px;
            min-height: 100vh;
        }
        
        .page-header {
            margin-bottom: 32px;
        }
        
        .page-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .stat-icon {
            font-size: 2rem;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.4);
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .status-paused {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }
        
        .content-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--glass-border);
        }
        
        .metric-row:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .metric-value {
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Navigation Configuration
        const navigation = [
            {
                section: "Overview",
                items: [
                    { id: "home", label: "Dashboard", icon: "🏠", page: "home" },
                    { id: "status", label: "System Status", icon: "💚", page: "status" },
                ]
            },
            {
                section: "Trading",
                items: [
                    { id: "trades", label: "Active Trades", icon: "📊", page: "trades" },
                    { id: "proposals", label: "AI Proposals", icon: "🤖", page: "proposals" },
                    { id: "scanner", label: "Market Scanner", icon: "🔍", page: "scanner" },
                    { id: "grid", label: "Grid Trading", icon: "📐", page: "grid" },
                ]
            },
            {
                section: "AI & Analysis",
                items: [
                    { id: "consensus", label: "Multi-AI Consensus", icon: "🧠", page: "consensus" },
                    { id: "sentiment", label: "Market Sentiment", icon: "📈", page: "sentiment" },
                    { id: "intelligence", label: "Market Intel", icon: "🎯", page: "intelligence" },
                ]
            },
            {
                section: "Risk Management",
                items: [
                    { id: "breaker", label: "Circuit Breaker", icon: "🛡️", page: "breaker" },
                    { id: "health", label: "Health Monitor", icon: "💊", page: "health" },
                    { id: "positions", label: "Position Monitor", icon: "📍", page: "positions" },
                ]
            },
            {
                section: "Validation",
                items: [
                    { id: "backtest", label: "Backtesting", icon: "⏮️", page: "backtest" },
                    { id: "validation", label: "Strategy Validation", icon: "✅", page: "validation" },
                    { id: "performance", label: "Performance", icon: "📉", page: "performance" },
                ]
            },
            {
                section: "Settings",
                items: [
                    { id: "config", label: "Configuration", icon: "⚙️", page: "config" },
                    { id: "api", label: "API Settings", icon: "🔑", page: "api" },
                ]
            }
        ];
        
        // Main App Component
        function App() {
            const [activePage, setActivePage] = useState('home');
            const [systemData, setSystemData] = useState(null);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                loadSystemData();
                const interval = setInterval(loadSystemData, 5000);
                return () => clearInterval(interval);
            }, []);
            
            const loadSystemData = async () => {
                try {
                    const response = await fetch('/api/info');
                    const data = await response.json();
                    setSystemData(data);
                    setLoading(false);
                } catch (error) {
                    console.error('Failed to load system data:', error);
                    setLoading(false);
                }
            };
            
            const renderPage = () => {
                switch(activePage) {
                    case 'home': return <HomePage systemData={systemData} />;
                    case 'breaker': return <CircuitBreakerPage />;
                    case 'health': return <HealthMonitorPage />;
                    case 'validation': return <ValidationPage />;
                    case 'trades': return <TradesPage />;
                    case 'status': return <StatusPage systemData={systemData} />;
                    default: return <ComingSoonPage pageName={activePage} />;
                }
            };
            
            return (
                <div className="app-container">
                    <Sidebar navigation={navigation} activePage={activePage} setActivePage={setActivePage} />
                    <div className="main-content">
                        {renderPage()}
                    </div>
                </div>
            );
        }
        
        // Sidebar Component
        function Sidebar({ navigation, activePage, setActivePage }) {
            return (
                <div className="sidebar">
                    <div className="logo-container">
                        <div className="logo-wrapper">
                            <div className="logo-icon">🚀</div>
                            <div className="logo-text">
                                <h1>AlgoGPT</h1>
                                <p>Ultimate Edition</p>
                            </div>
                        </div>
                    </div>
                    
                    {navigation.map((section, idx) => (
                        <div key={idx} className="nav-section">
                            <div className="nav-section-title">{section.section}</div>
                            <ul className="nav-items">
                                {section.items.map(item => (
                                    <li key={item.id} className="nav-item">
                                        <a
                                            className={`nav-link ${activePage === item.page ? 'active' : ''}`}
                                            onClick={() => setActivePage(item.page)}
                                        >
                                            <span className="nav-icon">{item.icon}</span>
                                            <span>{item.label}</span>
                                        </a>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    ))}
                </div>
            );
        }
        
        // Home Page
        function HomePage({ systemData }) {
            const [stats, setStats] = useState({
                activeTrades: 0,
                dailyPnL: 0,
                circuitBreaker: 'Active',
                aiConsensus: 85
            });
            
            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">🚀 Dashboard Overview</h1>
                        <p className="page-subtitle">Real-time monitoring of your algorithmic trading system</p>
                    </div>
                    
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-header">
                                <div className="stat-icon">📊</div>
                                <span className="status-badge status-active">
                                    <span>●</span> Active
                                </span>
                            </div>
                            <div className="stat-value">{stats.activeTrades}</div>
                            <div className="stat-label">Active Trades</div>
                        </div>
                        
                        <div className="stat-card">
                            <div className="stat-header">
                                <div className="stat-icon">💰</div>
                                <span className={`status-badge ${stats.dailyPnL >= 0 ? 'status-active' : 'status-error'}`}>
                                    <span>●</span> {stats.dailyPnL >= 0 ? 'Profit' : 'Loss'}
                                </span>
                            </div>
                            <div className="stat-value">${stats.dailyPnL.toFixed(2)}</div>
                            <div className="stat-label">Daily P&L</div>
                        </div>
                        
                        <div className="stat-card">
                            <div className="stat-header">
                                <div className="stat-icon">🛡️</div>
                                <span className="status-badge status-active">
                                    <span>●</span> {stats.circuitBreaker}
                                </span>
                            </div>
                            <div className="stat-value">0%</div>
                            <div className="stat-label">Daily Drawdown</div>
                        </div>
                        
                        <div className="stat-card">
                            <div className="stat-header">
                                <div className="stat-icon">🧠</div>
                                <span className="status-badge status-active">
                                    <span>●</span> High
                                </span>
                            </div>
                            <div className="stat-value">{stats.aiConsensus}%</div>
                            <div className="stat-label">AI Consensus</div>
                        </div>
                    </div>
                    
                    <div className="content-card">
                        <h2 style={{marginBottom: '16px', fontSize: '1.5rem', fontWeight: '700'}}>System Information</h2>
                        {systemData && (
                            <div>
                                <div className="metric-row">
                                    <span className="metric-label">Service</span>
                                    <span className="metric-value">{systemData.service || 'AlgoGPT'}</span>
                                </div>
                                <div className="metric-row">
                                    <span className="metric-label">Version</span>
                                    <span className="metric-value">{systemData.version || '3.6.0'}</span>
                                </div>
                                <div className="metric-row">
                                    <span className="metric-label">Status</span>
                                    <span className="metric-value">
                                        <span className="status-badge status-active">
                                            <span>●</span> Operational
                                        </span>
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        // Circuit Breaker Page
        function CircuitBreakerPage() {
            const [breakerStatus, setBreakerStatus] = useState(null);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                loadBreakerStatus();
                const interval = setInterval(loadBreakerStatus, 3000);
                return () => clearInterval(interval);
            }, []);
            
            const loadBreakerStatus = async () => {
                try {
                    const response = await fetch('/monitors/breaker/status');
                    const data = await response.json();
                    setBreakerStatus(data);
                    setLoading(false);
                } catch (error) {
                    console.error('Failed to load breaker status:', error);
                    setLoading(false);
                }
            };
            
            const handlePause = async () => {
                try {
                    const response = await fetch('/monitors/breaker/pause', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ reason: 'Manual pause from dashboard' })
                    });
                    const data = await response.json();
                    alert('Circuit breaker paused successfully');
                    loadBreakerStatus();
                } catch (error) {
                    alert('Failed to pause circuit breaker: ' + error.message);
                }
            };
            
            const handleReset = async () => {
                if (!confirm('Are you sure you want to reset the circuit breaker?')) return;
                try {
                    const response = await fetch('/monitors/breaker/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ reason: 'Manual reset from dashboard' })
                    });
                    const data = await response.json();
                    alert('Circuit breaker reset successfully');
                    loadBreakerStatus();
                } catch (error) {
                    alert('Failed to reset circuit breaker: ' + error.message);
                }
            };
            
            if (loading) {
                return (
                    <div>
                        <div className="page-header">
                            <h1 className="page-title">🛡️ Circuit Breaker Control</h1>
                            <p className="page-subtitle">Automated risk management and trading pause system</p>
                        </div>
                        <div className="content-card" style={{textAlign: 'center', padding: '60px'}}>
                            <div className="loading"></div>
                            <p style={{marginTop: '20px', color: 'var(--text-secondary)'}}>Loading circuit breaker status...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">🛡️ Circuit Breaker Control</h1>
                        <p className="page-subtitle">Automated risk management and trading pause system</p>
                    </div>
                    
                    <div className="content-card">
                        <h2 style={{marginBottom: '24px', fontSize: '1.5rem', fontWeight: '700'}}>Current Status</h2>
                        
                        {breakerStatus && (
                            <>
                                <div className="metric-row">
                                    <span className="metric-label">Circuit Breaker Status</span>
                                    <span className="metric-value">
                                        <span className={`status-badge ${breakerStatus.paused ? 'status-paused' : 'status-active'}`}>
                                            <span>●</span> {breakerStatus.paused ? 'PAUSED' : 'ACTIVE'}
                                        </span>
                                    </span>
                                </div>
                                
                                <div className="metric-row">
                                    <span className="metric-label">Daily Drawdown</span>
                                    <span className="metric-value" style={{color: breakerStatus.metrics?.daily_dd > 5 ? 'var(--error)' : 'var(--success)'}}>
                                        {breakerStatus.metrics?.daily_dd?.toFixed(2)}%
                                    </span>
                                </div>
                                
                                <div className="metric-row">
                                    <span className="metric-label">Peak Drawdown</span>
                                    <span className="metric-value">
                                        {breakerStatus.metrics?.daily_dd_peak?.toFixed(2)}%
                                    </span>
                                </div>
                                
                                <div className="metric-row">
                                    <span className="metric-label">Consecutive Losses</span>
                                    <span className="metric-value" style={{color: breakerStatus.metrics?.consec_losses > 3 ? 'var(--error)' : 'var(--success)'}}>
                                        {breakerStatus.metrics?.consec_losses || 0}
                                    </span>
                                </div>
                                
                                {breakerStatus.pause_reason && (
                                    <div className="metric-row">
                                        <span className="metric-label">Pause Reason</span>
                                        <span className="metric-value">{breakerStatus.pause_reason}</span>
                                    </div>
                                )}
                            </>
                        )}
                        
                        <div className="controls-grid">
                            <button className="btn btn-danger" onClick={handlePause}>
                                ⏸️ Pause Trading
                            </button>
                            <button className="btn btn-success" onClick={handleReset}>
                                🔄 Reset Breaker
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        
        // Health Monitor Page
        function HealthMonitorPage() {
            const [health, setHealth] = useState(null);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                loadHealth();
                const interval = setInterval(loadHealth, 5000);
                return () => clearInterval(interval);
            }, []);
            
            const loadHealth = async () => {
                try {
                    const response = await fetch('/monitors/health');
                    const data = await response.json();
                    setHealth(data);
                    setLoading(false);
                } catch (error) {
                    console.error('Failed to load health:', error);
                    setHealth({ error: error.message });
                    setLoading(false);
                }
            };
            
            if (loading) {
                return (
                    <div>
                        <div className="page-header">
                            <h1 className="page-title">💊 Health Monitor</h1>
                            <p className="page-subtitle">Real-time system health and performance metrics</p>
                        </div>
                        <div className="content-card" style={{textAlign: 'center', padding: '60px'}}>
                            <div className="loading"></div>
                            <p style={{marginTop: '20px', color: 'var(--text-secondary)'}}>Loading health metrics...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">💊 Health Monitor</h1>
                        <p className="page-subtitle">Real-time system health and performance metrics</p>
                    </div>
                    
                    <div className="content-card">
                        <h2 style={{marginBottom: '24px', fontSize: '1.5rem', fontWeight: '700'}}>System Health Status</h2>
                        
                        {health?.error ? (
                            <div style={{padding: '40px', textAlign: 'center'}}>
                                <div style={{fontSize: '3rem', marginBottom: '16px'}}>⚠️</div>
                                <h3 style={{color: 'var(--warning)', marginBottom: '8px'}}>Health Data Unavailable</h3>
                                <p style={{color: 'var(--text-secondary)'}}>{health.error}</p>
                                <p style={{color: 'var(--text-secondary)', marginTop: '16px', fontSize: '0.875rem'}}>
                                    The system needs at least 7 days of trading history to display health metrics.
                                </p>
                            </div>
                        ) : health ? (
                            <>
                                <div className="metric-row">
                                    <span className="metric-label">Health Status</span>
                                    <span className="metric-value">
                                        <span className={`status-badge ${health.ok ? 'status-active' : 'status-error'}`}>
                                            <span>●</span> {health.ok ? 'HEALTHY' : 'UNHEALTHY'}
                                        </span>
                                    </span>
                                </div>
                                
                                <div className="metric-row">
                                    <span className="metric-label">Recommended Action</span>
                                    <span className="metric-value">{health.action || 'None'}</span>
                                </div>
                                
                                <div className="metric-row">
                                    <span className="metric-label">Reason</span>
                                    <span className="metric-value">{health.reason || 'All systems operational'}</span>
                                </div>
                                
                                {health.metrics && (
                                    <>
                                        <h3 style={{marginTop: '32px', marginBottom: '16px', fontSize: '1.25rem', fontWeight: '600'}}>Performance Metrics</h3>
                                        {Object.entries(health.metrics).map(([key, value]) => (
                                            <div key={key} className="metric-row">
                                                <span className="metric-label">{key.replace(/_/g, ' ').toUpperCase()}</span>
                                                <span className="metric-value">{typeof value === 'number' ? value.toFixed(2) : value}</span>
                                            </div>
                                        ))}
                                    </>
                                )}
                            </>
                        ) : null}
                    </div>
                </div>
            );
        }
        
        // Validation Page
        function ValidationPage() {
            const [validationId, setValidationId] = useState(null);
            const [status, setStatus] = useState(null);
            const [loading, setLoading] = useState(false);
            
            const runValidation = async () => {
                setLoading(true);
                try {
                    const response = await fetch('/validate/run', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            symbols: ['BTCUSDT', 'ETHUSDT'],
                            strategy: 'sop_v3',
                            start: '-240d',
                            end: 'now',
                            folds: 6
                        })
                    });
                    const data = await response.json();
                    setValidationId(data.run_id);
                    alert('Validation started! ID: ' + data.run_id);
                } catch (error) {
                    alert('Failed to start validation: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };
            
            const checkStatus = async () => {
                if (!validationId) {
                    alert('Please start a validation run first');
                    return;
                }
                try {
                    const response = await fetch(`/validate/status?id=${validationId}`);
                    const data = await response.json();
                    setStatus(data);
                } catch (error) {
                    alert('Failed to check status: ' + error.message);
                }
            };
            
            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">✅ Strategy Validation</h1>
                        <p className="page-subtitle">Backtest and validate trading strategies</p>
                    </div>
                    
                    <div className="content-card">
                        <h2 style={{marginBottom: '24px', fontSize: '1.5rem', fontWeight: '700'}}>Run Backtest Validation</h2>
                        
                        <div className="controls-grid">
                            <button className="btn btn-primary" onClick={runValidation} disabled={loading}>
                                {loading ? <div className="loading"></div> : '▶️'} Run Validation
                            </button>
                            <button className="btn btn-primary" onClick={checkStatus} disabled={!validationId}>
                                🔍 Check Status
                            </button>
                        </div>
                        
                        {validationId && (
                            <div style={{marginTop: '24px', padding: '16px', background: 'rgba(102, 126, 234, 0.1)', borderRadius: '8px'}}>
                                <p style={{fontSize: '0.875rem', color: 'var(--text-secondary)'}}>Validation ID:</p>
                                <p style={{fontWeight: '600', fontFamily: 'monospace'}}>{validationId}</p>
                            </div>
                        )}
                        
                        {status && (
                            <div style={{marginTop: '24px'}}>
                                <h3 style={{marginBottom: '16px', fontSize: '1.25rem', fontWeight: '600'}}>Validation Status</h3>
                                <div className="metric-row">
                                    <span className="metric-label">Status</span>
                                    <span className="metric-value">
                                        <span className={`status-badge ${status.status === 'completed' ? 'status-active' : status.status === 'failed' ? 'status-error' : 'status-paused'}`}>
                                            <span>●</span> {status.status.toUpperCase()}
                                        </span>
                                    </span>
                                </div>
                                {status.progress && (
                                    <div className="metric-row">
                                        <span className="metric-label">Progress</span>
                                        <span className="metric-value">{status.progress}%</span>
                                    </div>
                                )}
                                {status.result && (
                                    <div style={{marginTop: '16px', padding: '16px', background: 'rgba(16, 185, 129, 0.1)', borderRadius: '8px'}}>
                                        <pre style={{fontSize: '0.875rem', overflow: 'auto'}}>{JSON.stringify(status.result, null, 2)}</pre>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        // Trades Page
        function TradesPage() {
            return <ComingSoonPage pageName="Active Trades" icon="📊" />;
        }
        
        // Status Page
        function StatusPage({ systemData }) {
            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">💚 System Status</h1>
                        <p className="page-subtitle">Comprehensive system health and worker status</p>
                    </div>
                    
                    <div className="content-card">
                        <h2 style={{marginBottom: '24px', fontSize: '1.5rem', fontWeight: '700'}}>System Information</h2>
                        {systemData && (
                            <div>
                                <div className="metric-row">
                                    <span className="metric-label">Service</span>
                                    <span className="metric-value">{systemData.service || 'AlgoGPT'}</span>
                                </div>
                                <div className="metric-row">
                                    <span className="metric-label">Version</span>
                                    <span className="metric-value">{systemData.version || '3.6.0'}</span>
                                </div>
                                <div className="metric-row">
                                    <span className="metric-label">Environment</span>
                                    <span className="metric-value">{systemData.environment || 'production'}</span>
                                </div>
                                <div className="metric-row">
                                    <span className="metric-label">Status</span>
                                    <span className="metric-value">
                                        <span className="status-badge status-active">
                                            <span>●</span> Operational
                                        </span>
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        // Coming Soon Page
        function ComingSoonPage({ pageName, icon = "🚧" }) {
            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">{icon} {pageName}</h1>
                        <p className="page-subtitle">Feature in development</p>
                    </div>
                    
                    <div className="content-card" style={{textAlign: 'center', padding: '80px 40px'}}>
                        <div style={{fontSize: '4rem', marginBottom: '24px'}}>🚧</div>
                        <h2 style={{fontSize: '2rem', fontWeight: '700', marginBottom: '12px'}}>Coming Soon</h2>
                        <p style={{color: 'var(--text-secondary)', fontSize: '1.125rem'}}>
                            This feature is currently under development and will be available in a future update.
                        </p>
                    </div>
                </div>
            );
        }
        
        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
        
        console.log('AlgoGPT Ultimate Edition Dashboard Loaded');
    </script>
</body>
</html>
