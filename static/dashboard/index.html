<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlgoGPT • Dashboard</title>
<style>
  :root{--bg:#0f1115;--card:#161a22;--txt:#e6e8ef;--muted:#a0a6b5;--acc:#24c8a5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .wrap{max-width:980px;margin:40px auto;padding:0 16px}
  h1{font-size:22px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .card{background:var(--card);border:1px solid #1f2430;border-radius:14px;padding:16px}
  .muted{color:var(--muted)}
  button,a.btn{display:inline-block;background:var(--acc);color:#06291f;text-decoration:none;border:0;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #2a3140;background:#0f131a;color:var(--txt);font:inherit}
  pre{white-space:pre-wrap;background:#0c0f14;border:1px solid #1f2430;border-radius:10px;padding:12px}
  small{color:var(--muted)}
</style>
<body>
<div class="wrap">
  <h1>AlgoGPT • Dashboard</h1>

  <div class="grid">
    <div class="card">
      <h3>מצב מערכת</h3>
      <div id="status" class="muted">טוען…</div>
      <div style="margin-top:10px">
        <button onclick="loadStatus()">רענן</button>
        <a class="btn" href="/docs" target="_blank">OpenAPI</a>
      </div>
    </div>

    <div class="card">
      <h3>UI מהיר לאישור אופס</h3>
      <p class="muted">פתח את מסך יצירת הטיקט (MARKET / HYBRID / AUTO):</p>
      <a class="btn" href="/ops/ui" target="_blank">פתח /ops/ui</a>
    </div>

    <div class="card" style="grid-column:1/-1">
      <h3>בדיקת מחיר מהירה</h3>
      <div class="row">
        <input id="sym" value="BTCUSDT">
        <button onclick="loadPrice()">בדוק</button>
      </div>
      <pre id="pricebox" style="margin-top:10px"></pre>
      <small>REST: <code>/price/&lt;symbol&gt;</code></small>
    </div>
  </div>
</div>

<script>
async function loadStatus(){
  try{
    const r = await fetch('/status/all'); const j = await r.json();
    document.getElementById('status').textContent = JSON.stringify(j, null, 2);
  }catch(e){
    document.getElementById('status').textContent = 'שגיאה: '+ e;
  }
}
async function loadPrice(){
  const s = (document.getElementById('sym').value||'').toUpperCase();
  const box = document.getElementById('pricebox');
  if(!s){ box.textContent = 'נא להקליד סימבול'; return; }
  try{
    const r = await fetch('/price/'+encodeURIComponent(s)); const j = await r.json();
    box.textContent = JSON.stringify(j, null, 2);
  }catch(e){
    box.textContent = 'שגיאה: '+ e;
  }
}
loadStatus();
</script>
</body>
</html>
