<!DOCTYPE html>
<html lang="en">
<head>

  <title>AlgoGPT Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f4f6f8; color: #333; }

    .fail { color: red; font-weight: bold; }

  </div>
