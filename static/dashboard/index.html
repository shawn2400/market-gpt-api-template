<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AlgoGPT Ultimate Edition - Algorithmic Trading Platform</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --glass-bg: rgba(31, 41, 55, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --bg-dark: #0a0a1a;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --sidebar-width: 280px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 24px 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        .logo-container {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }
        
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
        }
        
        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        
        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .nav-section {
            margin-bottom: 24px;
            padding: 0 12px;
        }
        
        .nav-section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }
        
        .nav-items {
            list-style: none;
        }
        
        .nav-item {
            margin-bottom: 4px;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .nav-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: var(--text-primary);
            transform: translateX(2px);
        }
        
        .nav-link.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            color: var(--text-primary);
            border-left: 3px solid var(--primary);
        }
        
        .nav-icon {
            font-size: 1.4rem;
            min-width: 24px;
            text-align: center;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 32px;
            min-height: 100vh;
        }
        
        .page-header {
            margin-bottom: 32px;
        }
        
        .page-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .stat-icon {
            font-size: 2rem;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.4);
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .status-paused {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }
        
        .content-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--glass-border);
        }
        
        .metric-row:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .metric-value {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 16px;
        }

        .table th {
            background: rgba(102, 126, 234, 0.1);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--glass-border);
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        .table tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Navigation Configuration
        const navigation = [
            {
                section: "Overview",
                items: [
                    { id: "home", label: "Dashboard", icon: "🏠", page: "home" },
                    { id: "roadmap", label: "Feature Roadmap", icon: "🗺️", page: "roadmap" },
                    { id: "status", label: "System Status", icon: "💚", page: "status" },
                ]
            },
            {
                section: "Trading",
                items: [
                    { id: "trades", label: "Active Trades", icon: "📊", page: "trades" },
                    { id: "proposals", label: "AI Proposals", icon: "🤖", page: "proposals" },
                    { id: "scanner", label: "Market Scanner", icon: "🔍", page: "scanner" },
                    { id: "grid", label: "Grid Trading", icon: "📐", page: "grid" },
                ]
            },
            {
                section: "AI & Analysis",
                items: [
                    { id: "consensus", label: "Multi-AI Consensus", icon: "🧠", page: "consensus" },
                    { id: "sentiment", label: "Market Sentiment", icon: "📈", page: "sentiment" },
                    { id: "intelligence", label: "Market Intel", icon: "🎯", page: "intelligence" },
                ]
            },
            {
                section: "Performance",
                items: [
                    { id: "performance", label: "Performance Analytics", icon: "📉", page: "performance" },
                    { id: "positions", label: "Position Monitor", icon: "📍", page: "positions" },
                ]
            },
            {
                section: "Risk Management",
                items: [
                    { id: "breaker", label: "Circuit Breaker", icon: "🛡️", page: "breaker" },
                    { id: "health", label: "Health Monitor", icon: "💊", page: "health" },
                ]
            },
            {
                section: "Validation",
                items: [
                    { id: "backtest", label: "Backtesting", icon: "⏮️", page: "backtest" },
                    { id: "validation", label: "Strategy Validation", icon: "✅", page: "validation" },
                ]
            },
            {
                section: "Settings",
                items: [
                    { id: "config", label: "Configuration", icon: "⚙️", page: "config" },
                    { id: "api", label: "API Settings", icon: "🔑", page: "api" },
                ]
            }
        ];
        
        // Main App Component
        function App() {
            const [activePage, setActivePage] = useState('home');
            const [systemData, setSystemData] = useState(null);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                loadSystemData();
                const interval = setInterval(loadSystemData, 5000);
                return () => clearInterval(interval);
            }, []);
            
            const loadSystemData = async () => {
                try {
                    const response = await fetch('/api/info');
                    const data = await response.json();
                    setSystemData(data);
                    setLoading(false);
                } catch (error) {
                    console.error('Failed to load system data:', error);
                    setLoading(false);
                }
            };
            
            const renderPage = () => {
                switch(activePage) {
                    case 'home': return <HomePage systemData={systemData} />;
                    case 'roadmap': return <RoadmapPage />;
                    case 'trades': return <TradesPage />;
                    case 'proposals': return <ProposalsPage />;
                    case 'scanner': return <ScannerPage />;
                    case 'grid': return <GridTradingPage />;
                    case 'consensus': return <ConsensusPage />;
                    case 'sentiment': return <SentimentPage />;
                    case 'intelligence': return <IntelligencePage />;
                    case 'performance': return <PerformancePage />;
                    case 'positions': return <PositionsPage />;
                    case 'breaker': return <CircuitBreakerPage />;
                    case 'health': return <HealthMonitorPage />;
                    case 'backtest': return <BacktestPage />;
                    case 'validation': return <ValidationPage />;
                    case 'config': return <ConfigPage />;
                    case 'api': return <APISettingsPage />;
                    case 'status': return <StatusPage systemData={systemData} />;
                    default: return <HomePage systemData={systemData} />;
                }
            };
            
            return (
                <div className="app-container">
                    <Sidebar navigation={navigation} activePage={activePage} setActivePage={setActivePage} />
                    <div className="main-content">
                        {renderPage()}
                    </div>
                </div>
            );
        }
        
        // Sidebar Component
        function Sidebar({ navigation, activePage, setActivePage }) {
            return (
                <div className="sidebar">
                    <div className="logo-container">
                        <div className="logo-wrapper">
                            <div className="logo-icon">🚀</div>
                            <div className="logo-text">
                                <h1>AlgoGPT</h1>
                                <p>Ultimate Edition</p>
                            </div>
                        </div>
                    </div>
                    
                    {navigation.map((section, idx) => (
                        <div key={idx} className="nav-section">
                            <div className="nav-section-title">{section.section}</div>
                            <ul className="nav-items">
                                {section.items.map(item => (
                                    <li key={item.id} className="nav-item">
                                        <a
                                            className={`nav-link ${activePage === item.page ? 'active' : ''}`}
                                            onClick={() => setActivePage(item.page)}
                                        >
                                            <span className="nav-icon">{item.icon}</span>
                                            <span>{item.label}</span>
                                        </a>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    ))}
                </div>
            );
        }
        
        // Home Page
        function HomePage({ systemData }) {
            const [stats, setStats] = useState({
                activeTrades: 0,
                dailyPnL: 0,
                circuitBreaker: 'Active',
                aiConsensus: 0,
                totalSymbols: 532
            });
            
            useEffect(() => {
                loadStats();
                const interval = setInterval(loadStats, 5000);
                return () => clearInterval(interval);
            }, []);
            
            const loadStats = async () => {
                try {
                    const [posResponse, pnlResponse, scanResponse] = await Promise.all([
                        fetch('/executor/positions').catch(() => ({ ok: false })),
                        fetch('/pnl/summary').catch(() => ({ ok: false })),
                        fetch('/scan/public-topk').catch(() => ({ ok: false }))
                    ]);
                    
                    if (posResponse.ok) {
                        const posData = await posResponse.json();
                        setStats(prev => ({ ...prev, activeTrades: posData.positions?.length || 0 }));
                    }
                    
                    if (pnlResponse.ok) {
                        const pnlData = await pnlResponse.json();
                        setStats(prev => ({ ...prev, dailyPnL: pnlData.summary?.daily_pnl || 0 }));
                    }
                    
                    if (scanResponse.ok) {
                        const scanData = await scanResponse.json();
                        setStats(prev => ({ ...prev, totalSymbols: scanData.items?.length || 532 }));
                    }
                } catch (error) {
                    console.error('Failed to load stats:', error);
                }
            };
            
            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">🚀 Dashboard Overview</h1>
                        <p className="page-subtitle">Real-time monitoring of your algorithmic trading system</p>
                    </div>
                    
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-header">
                                <div className="stat-icon">📊</div>
                                <span className="status-badge status-active">
                                    <span>●</span> Active
                                </span>
                            </div>
                            <div className="stat-value">{stats.activeTrades}</div>
                            <div className="stat-label">Active Trades</div>
                        </div>
                        
                        <div className="stat-card">
                            <div className="stat-header">
                                <div className="stat-icon">💰</div>
                                <span className={`status-badge ${stats.dailyPnL >= 0 ? 'status-active' : 'status-error'}`}>
                                    <span>●</span> {stats.dailyPnL >= 0 ? 'Profit' : 'Loss'}
                                </span>
                            </div>
                            <div className="stat-value">${stats.dailyPnL.toFixed(2)}</div>
                            <div className="stat-label">Daily P&L</div>
                        </div>
                        
                        <div className="stat-card">
                            <div className="stat-header">
                                <div className="stat-icon">🔍</div>
                                <span className="status-badge status-active">
                                    <span>●</span> Scanning
                                </span>
                            </div>
                            <div className="stat-value">{stats.totalSymbols}</div>
                            <div className="stat-label">Market Symbols</div>
                        </div>
                        
                        <div className="stat-card">
                            <div className="stat-header">
                                <div className="stat-icon">🧠</div>
                                <span className="status-badge status-active">
                                    <span>●</span> Active
                                </span>
                            </div>
                            <div className="stat-value">Multi-AI</div>
                            <div className="stat-label">Consensus Engine</div>
                        </div>
                    </div>
                    
                    <div className="content-card">
                        <h2 style={{marginBottom: '16px', fontSize: '1.5rem', fontWeight: '700'}}>System Information</h2>
                        {systemData && (
                            <div>
                                <div className="metric-row">
                                    <span className="metric-label">Service</span>
                                    <span className="metric-value">{systemData.service || 'AlgoGPT'}</span>
                                </div>
                                <div className="metric-row">
                                    <span className="metric-label">Version</span>
                                    <span className="metric-value">{systemData.version || '3.6.0'}</span>
                                </div>
                                <div className="metric-row">
                                    <span className="metric-label">Status</span>
                                    <span className="metric-value">
                                        <span className="status-badge status-active">
                                            <span>●</span> Operational
                                        </span>
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Roadmap Page
        function RoadmapPage() {
            const features = [
                { category: '🎯 Core Trading', items: [
                    { name: 'Active Trades Monitor', status: 'completed', progress: 100 },
                    { name: 'AI Trade Proposals', status: 'completed', progress: 100 },
                    { name: 'Market Scanner (530+ symbols)', status: 'completed', progress: 100 },
                    { name: 'Grid Trading System', status: 'completed', progress: 100 },
                    { name: 'Position Management', status: 'completed', progress: 100 },
                ]},
                { category: '🧠 AI & Intelligence', items: [
                    { name: 'Multi-AI Consensus (GPT-5, DeepSeek, Grok)', status: 'completed', progress: 100 },
                    { name: 'Market Sentiment Analysis', status: 'completed', progress: 100 },
                    { name: 'Market Intelligence Engine', status: 'completed', progress: 100 },
                    { name: 'AI Performance Tracking', status: 'completed', progress: 100 },
                ]},
                { category: '📊 Analytics & Performance', items: [
                    { name: 'Performance Analytics Dashboard', status: 'completed', progress: 100 },
                    { name: 'P&L Charts & Metrics', status: 'completed', progress: 100 },
                    { name: 'Win Rate Analysis', status: 'completed', progress: 100 },
                    { name: 'Equity Curve Tracking', status: 'completed', progress: 100 },
                ]},
                { category: '🛡️ Risk Management', items: [
                    { name: 'Circuit Breaker System', status: 'completed', progress: 100 },
                    { name: 'Health Monitor', status: 'completed', progress: 100 },
                    { name: 'Position Monitor', status: 'completed', progress: 100 },
                    { name: 'Risk Analytics', status: 'completed', progress: 100 },
                ]},
                { category: '✅ Validation & Testing', items: [
                    { name: 'Strategy Backtesting', status: 'completed', progress: 100 },
                    { name: 'Walk-Forward Validation', status: 'completed', progress: 100 },
                    { name: 'Performance Validation', status: 'completed', progress: 100 },
                ]},
                { category: '⚙️ Configuration', items: [
                    { name: 'System Configuration', status: 'completed', progress: 100 },
                    { name: 'API Settings', status: 'completed', progress: 100 },
                    { name: 'Integration Management', status: 'completed', progress: 100 },
                ]}
            ];

            const totalFeatures = features.reduce((sum, cat) => sum + cat.items.length, 0);
            const completedFeatures = features.reduce((sum, cat) => 
                sum + cat.items.filter(item => item.status === 'completed').length, 0
            );
            const overallProgress = Math.round((completedFeatures / totalFeatures) * 100);

            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">🗺️ Feature Roadmap</h1>
                        <p className="page-subtitle">Track all 28+ features and their completion status</p>
                    </div>

                    <div className="stats-grid" style={{gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))'}}>
                        <div className="stat-card">
                            <div className="stat-value">{totalFeatures}</div>
                            <div className="stat-label">Total Features</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-value" style={{color: 'var(--success)'}}>{completedFeatures}</div>
                            <div className="stat-label">Completed</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-value">{overallProgress}%</div>
                            <div className="stat-label">Overall Progress</div>
                            <div className="progress-bar" style={{marginTop: '12px'}}>
                                <div className="progress-fill" style={{width: `${overallProgress}%`}}></div>
                            </div>
                        </div>
                    </div>

                    {features.map((category, idx) => (
                        <div key={idx} className="content-card">
                            <h2 style={{marginBottom: '20px', fontSize: '1.25rem', fontWeight: '700'}}>{category.category}</h2>
                            {category.items.map((item, itemIdx) => (
                                <div key={itemIdx} style={{marginBottom: '16px'}}>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px'}}>
                                        <span style={{fontWeight: '600'}}>{item.name}</span>

        function ValidationPage() {
            const [validationId, setValidationId] = useState(null);
            const [status, setStatus] = useState(null);
            const [loading, setLoading] = useState(false);
            
            const runValidation = async () => {
                setLoading(true);
                try {
                    const response = await fetch('/validate/run', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            symbols: ['BTCUSDT', 'ETHUSDT'],
                            strategy: 'sop_v3',
                            start: '-240d',
                            end: 'now',
                            folds: 6
                        })
                    });
                    const data = await response.json();
                    setValidationId(data.run_id);
                    alert('Validation started! ID: ' + data.run_id);
                } catch (error) {
                    alert('Failed to start validation: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };
            
            const checkStatus = async () => {
                if (!validationId) {
                    alert('Please start a validation run first');
                    return;
                }
                try {
                    const response = await fetch(`/validate/status?id=${validationId}`);
                    const data = await response.json();
                    setStatus(data);
                } catch (error) {
                    alert('Failed to check status: ' + error.message);
                }
            };
            
            return (
                <div>

                        <div className="controls-grid">

                        {validationId && (
