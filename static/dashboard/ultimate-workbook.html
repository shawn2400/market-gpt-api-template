<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בס"ד - AlgoGPT Ultimate Dynamic Workbook</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --glass-bg: rgba(31, 41, 55, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --bg-dark: #0a0a1a;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }
        
        [data-theme="ocean"] {
            --primary: #06b6d4;
            --secondary: #0891b2;
            --accent: #22d3ee;
        }
        
        [data-theme="forest"] {
            --primary: #10b981;
            --secondary: #059669;
            --accent: #34d399;
        }
        
        [data-theme="sunset"] {
            --primary: #f59e0b;
            --secondary: #d97706;
            --accent: #fb923c;
        }
        
        [data-theme="dark"] {
            --primary: #6b7280;
            --secondary: #4b5563;
            --accent: #9ca3af;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heebo', 'Rubik', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.3);
        }
        
        .tab-button {
            padding: 12px 20px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            white-space: nowrap;
        }
        
        .tab-button:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: var(--primary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }
        
        .tab-button.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(107, 114, 128, 0.3);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 999px;
            transition: width 1s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .status-active {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }
        
        .status-planned {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }
        
        .status-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }
        
        .status-waiting {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }
        
        .metric-card {
            background: rgba(17, 24, 39, 0.8);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
        }
        
        .metric-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .metric-value {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: var(--text-secondary);
        }
        
        .error {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: var(--error);
        }
        
        .icon-box {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--glass-border);
        }
        
        th {
            background: rgba(102, 126, 234, 0.1);
            font-weight: 700;
            color: var(--primary);
        }
        
        tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }
        
        .theme-picker {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }
        
        .theme-option {
            padding: 20px;
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .theme-option:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }
        
        .theme-option.active {
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.1);
        }
        
        #flow-viz {
            width: 100%;
            height: 600px;
            background: rgba(17, 24, 39, 0.5);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        
        .node {
            cursor: pointer;
        }
        
        .node circle {
            transition: all 0.3s;
        }
        
        .node:hover circle {
            r: 40;
            fill-opacity: 0.9;
        }
        
        .link {
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
            opacity: 0.6;
            transition: all 0.3s;
        }
        
        .link:hover {
            stroke-width: 4;
            opacity: 1;
        }
        
        .whats-new-card {
            background: rgba(17, 24, 39, 0.6);
            padding: 20px;
            border-radius: 12px;
            border-right: 4px solid var(--primary);
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        
        .whats-new-card:hover {
            transform: translateX(-4px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }
        
        .timeline {
            position: relative;
            padding-right: 40px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            right: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
        }
        
        .timeline-item {
            position: relative;
            padding-bottom: 24px;
        }
        
        .timeline-dot {
            position: absolute;
            right: 12px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.6);
        }
        
        .news-item {
            padding: 16px;
            background: rgba(17, 24, 39, 0.5);
            border-radius: 8px;
            border-right: 3px solid var(--info);
            margin-bottom: 12px;
        }
        
        .sentiment-bullish {
            color: var(--success);
            font-weight: 700;
        }
        
        .sentiment-bearish {
            color: var(--error);
            font-weight: 700;
        }
        
        .sentiment-neutral {
            color: var(--text-secondary);
            font-weight: 700;
        }
        
        .impact-high {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        
        .impact-medium {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        
        .impact-low {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(107, 114, 128, 0.3);
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.6);
        }
        
        .tooltip {
            position: absolute;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.5);
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const UltimateWorkbook = () => {
            const [activeTab, setActiveTab] = useState(1);
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [theme, setTheme] = useState('default');
            const [fontSize, setFontSize] = useState(16);
            const [glassEffect, setGlassEffect] = useState(0.6);
            const [rtl, setRtl] = useState(true);
            const [currentTime, setCurrentTime] = useState('');
            
            const fetchData = async () => {
                try {
                    const response = await fetch('/dashboard/ultimate-data');
                    if (!response.ok) throw new Error('Failed to fetch data');
                    const json = await response.json();
                    setData(json);
                    setLoading(false);
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };
            
            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 30000);
                return () => clearInterval(interval);
            }, []);
            
            useEffect(() => {
                document.body.style.fontSize = `${fontSize}px`;
                document.body.dir = rtl ? 'rtl' : 'ltr';
                document.body.setAttribute('data-theme', theme);
                document.documentElement.style.setProperty('--glass-bg', `rgba(31, 41, 55, ${glassEffect})`);
                
                localStorage.setItem('ultimate-workbook-prefs', JSON.stringify({
                    theme, fontSize, glassEffect, rtl
                }));
            }, [theme, fontSize, glassEffect, rtl]);
            
            useEffect(() => {
                const prefs = localStorage.getItem('ultimate-workbook-prefs');
                if (prefs) {
                    const parsed = JSON.parse(prefs);
                    setTheme(parsed.theme || 'default');
                    setFontSize(parsed.fontSize || 16);
                    setGlassEffect(parsed.glassEffect || 0.6);
                    setRtl(parsed.rtl !== undefined ? parsed.rtl : true);
                }
            }, []);
            
            useEffect(() => {
                const updateIsraelTime = () => {
                    const now = new Date();
                    const israelTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Jerusalem' }));
                    const days = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
                    const dayName = days[israelTime.getDay()];
                    const dateStr = israelTime.toLocaleDateString('he-IL', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    const timeStr = israelTime.toLocaleTimeString('he-IL', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    setCurrentTime(`יום ${dayName}, ${dateStr}, ${timeStr}`);
                };
                updateIsraelTime();
                const interval = setInterval(updateIsraelTime, 1000);
                return () => clearInterval(interval);
            }, []);
            
            useEffect(() => {
                const lastTab = localStorage.getItem('ultimate-workbook-last-tab');
                if (lastTab) {
                    setActiveTab(parseInt(lastTab));
                }
            }, []);
            
            useEffect(() => {
                localStorage.setItem('ultimate-workbook-last-tab', activeTab.toString());
            }, [activeTab]);
            
            const tabs = [
                { id: 1, name: 'Dashboard', icon: '📊' },
                { id: 2, name: 'Finance', icon: '💰' },
                { id: 3, name: 'What\'s New', icon: '📋' },
                { id: 4, name: 'Changelog', icon: '📚' },
                { id: 5, name: 'Live Flow', icon: '🔄' },
                { id: 6, name: 'Approvals', icon: '📱' },
                { id: 7, name: 'News', icon: '📰' },
                { id: 8, name: 'Strategies', icon: '🎯' },
                { id: 9, name: '8-AI Mesh', icon: '🤖' },
                { id: 10, name: 'Architecture', icon: '🏗️' },
                { id: 11, name: 'Live Metrics', icon: '📈' },
                { id: 12, name: 'ROI Analysis', icon: '💵' },
                { id: 13, name: 'System Map', icon: '🗺️' },
                { id: 14, name: 'Theme', icon: '🎨' },
                { id: 15, name: 'User Guide', icon: '📖' },
                { id: 16, name: 'ROADMAP', icon: '🗺️' },
                { id: 17, name: 'Tech Indicators', icon: '📊' },
                { id: 18, name: 'System Docs', icon: '📚' },
                { id: 19, name: 'Control Center', icon: '🎛️' },
                { id: 20, name: 'AI Leaderboard', icon: '🏆' },
                { id: 21, name: 'Agents', icon: '🤖' },
                { id: 22, name: 'Budget', icon: '💰' },
                { id: 23, name: 'Telegram Approvals', icon: '✅' }
            ];
            
            if (loading) return (
                <div className="loading">
                    <div className="pulse">⏳ טוען נתונים...</div>
                </div>
            );
            
            if (error) return (
                <div className="error">
                    ❌ שגיאה: {error}
                    <br />
                    <button onClick={fetchData} style={{marginTop: '20px', padding: '10px 20px', cursor: 'pointer'}}>
                        נסה שוב
                    </button>
                </div>
            );
            
            if (!data) return <div className="error">❌ אין נתונים</div>;
            
            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto">
                    <div className="flex justify-center mb-4 fade-in" style={{animation: 'fadeIn 1s ease-out, pulse 3s infinite'}}>
                        <img src="algogpt-logo.svg" alt="AlgoGPT Logo" style={{height: '100px', filter: 'drop-shadow(0 0 20px rgba(102, 126, 234, 0.5))'}} />
                    </div>
                    
                    <header className="glass-card p-6 mb-6 fade-in">
                        <div className="flex items-center justify-between flex-wrap gap-4">
                            <div>
                                <h1 className="text-4xl font-bold gradient-text mb-2">
                                    בס"ד - AlgoGPT Ultimate Edition
                                </h1>
                                <p className="text-xl text-gray-300">
                                    Ultimate Dynamic Workbook - ספר עבודה דינמי מלא
                                </p>
                            </div>
                            <div className="text-left">
                                <div className="text-sm text-gray-400">🕐 Israel Time</div>
                                <div className="text-lg font-semibold text-blue-300">
                                    {currentTime}
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    <div className="glass-card p-4 mb-6 fade-in">
                        <div className="flex items-center gap-4 mb-3">
                            <select 
                                value={activeTab} 
                                onChange={(e) => setActiveTab(parseInt(e.target.value))}
                                className="glass-card px-4 py-2 rounded-lg border border-purple-500/30 bg-slate-900/50 text-white cursor-pointer hover:bg-slate-800/70 transition-all"
                                style={{minWidth: '250px'}}
                            >
                                {tabs.map(tab => (
                                    <option key={tab.id} value={tab.id}>
                                        {tab.icon} {tab.name}
                                    </option>
                                ))}
                            </select>
                            <div className="text-sm text-gray-400">
                                📑 בחר טאב מהרשימה | {tabs.length} טאבים זמינים
                            </div>
                        </div>
                        <div className="overflow-x-auto scrollbar-thin">
                            <div className="flex flex-wrap gap-2 min-w-max">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        className={`tab-button ${activeTab === tab.id ? 'active' : ''}`}
                                        onClick={() => setActiveTab(tab.id)}
                                    >
                                        <span>{tab.icon}</span>
                                        <span>{tab.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    <div className="fade-in">
                        {activeTab === 1 && <Tab1Dashboard data={data} />}
                        {activeTab === 2 && data?.finance_orchestrator && <Tab2Finance data={data.finance_orchestrator} />}
                        {activeTab === 3 && data?.whats_new && <Tab3WhatsNew data={data.whats_new} />}
                        {activeTab === 4 && data?.changelog && <Tab4Changelog data={data.changelog} />}
                        {activeTab === 5 && data?.live_flow && <Tab5LiveFlow data={data.live_flow} />}
                        {activeTab === 6 && data?.pending_approvals && <Tab6Approvals data={data.pending_approvals} />}
                        {activeTab === 7 && data?.news_feed && <Tab7News data={data.news_feed} />}
                        {activeTab === 8 && data?.strategy_performance && <Tab8Strategies data={data.strategy_performance} />}
                        {activeTab === 9 && data?.ai_mesh && <Tab9AIMesh data={data.ai_mesh} />}
                        {activeTab === 10 && data?.architecture && <Tab10Architecture data={data.architecture} />}
                        {activeTab === 11 && data?.live_metrics && <Tab11LiveMetrics data={data.live_metrics} />}
                        {activeTab === 12 && data?.roi_analysis && <Tab12ROI data={data.roi_analysis} />}
                        {activeTab === 13 && data?.system_map && <Tab13SystemMap data={data.system_map} />}
                        {activeTab === 14 && <Tab14Theme theme={theme} setTheme={setTheme} fontSize={fontSize} setFontSize={setFontSize} glassEffect={glassEffect} setGlassEffect={setGlassEffect} rtl={rtl} setRtl={setRtl} />}
                        {activeTab === 15 && <Tab15UserGuide />}
                        {activeTab === 16 && <Tab16Roadmap />}
                        {activeTab === 17 && <Tab17TechnicalIndicators />}
                        {activeTab === 18 && <Tab18SystemDocs />}
                        {activeTab === 19 && <Tab19ControlCenter />}
                        {activeTab === 20 && <Tab20AILeaderboard />}
                        {activeTab === 21 && <Tab21Agents />}
                        {activeTab === 22 && <Tab22Budget />}
                        {activeTab === 23 && <Tab23TelegramApprovals />}
                    </div>
                </div>
            );
        };
        
        const Tab1Dashboard = ({ data }) => {
            if (!data) return <div className="loading">⏳ טוען נתונים...</div>;
            
            return (
            <div className="space-y-6">
                <div className="glass-card p-6">
                    <div className="flex items-center gap-4 mb-6">
                        <div className="icon-box">📊</div>
                        <h2 className="text-3xl font-bold gradient-text">Dashboard Overview</h2>
                    </div>
                    
                    <div className="grid md:grid-cols-4 gap-4">
                        <div className="metric-card">
                            <div className="text-sm text-gray-400 mb-2">Total AUM</div>
                            <div className="metric-value">${data.finance_orchestrator.aum.total.toLocaleString()}</div>
                            <div className="text-xs text-success mt-1">+{data.finance_orchestrator.aum.growth_ytd}% YTD</div>
                        </div>
                        
                        <div className="metric-card">
                            <div className="text-sm text-gray-400 mb-2">Active Users</div>
                            <div className="metric-value">{data.finance_orchestrator.users.length}</div>
                            <div className="text-xs text-gray-400 mt-1">Multi-tenant ready</div>
                        </div>
                        
                        <div className="metric-card">
                            <div className="text-sm text-gray-400 mb-2">Monthly TCO</div>
                            <div className="metric-value">${data.finance_orchestrator.monthly_tco.total}</div>
                            <div className="text-xs text-gray-400 mt-1">All services included</div>

                fetch('/dashboard/roadmap/data')
                    .then(res => res.json())
                    .then(data => setRoadmapData(data))
                    .catch(err => console.error('Error loading roadmap:', err));
            }, []);
            
            useEffect(() => {
                if (!roadmapData || !ganttRef.current) return;
                
                const svg = d3.select(ganttRef.current);
                svg.selectAll('*').remove();
                
                const width = ganttRef.current.clientWidth;
                const height = 400;
                const margin = { top: 40, right: 80, bottom: 60, left: 200 };
                const chartWidth = width - margin.left - margin.right;
                const chartHeight = height - margin.top - margin.bottom;
                
                const g = svg.append('g')
                    .attr('transform', `translate(${margin.left},${margin.top})`);
                
                const parseDate = d3.timeParse('%Y-%m-%d');
                const timeFormat = d3.timeFormat('%b %d');
                
                const phases = roadmapData.phases.map(p => ({
                    ...p,
                    startDate: parseDate(p.start_date),
                    endDate: parseDate(p.end_date)
                }));
                
                const minDate = d3.min(phases, d => d.startDate);
                const maxDate = d3.max(phases, d => d.endDate);
                
                const xScale = d3.scaleTime()
                    .domain([minDate, maxDate])
                    .range([0, chartWidth]);
                
                const yScale = d3.scaleBand()
                    .domain(phases.map(p => p.name))
                    .range([0, chartHeight])
                    .padding(0.3);
                
                const colorScale = d3.scaleOrdinal()
                    .domain(['completed', 'in_progress', 'planned'])
                    .range(['#10b981', '#667eea', '#6b7280']);
                
                g.append('g')
                    .attr('class', 'x-axis')
                    .attr('transform', `translate(0,${chartHeight})`)
                    .call(d3.axisBottom(xScale).tickFormat(timeFormat).ticks(8))
                    .selectAll('text')
                    .style('fill', '#9ca3af')
                    .style('font-size', '12px');
                
                g.append('g')
                    .attr('class', 'y-axis')
                    .call(d3.axisLeft(yScale))
                    .selectAll('text')
                    .style('fill', '#f3f4f6')
                    .style('font-weight', '600')
                    .style('font-size', '13px');
                
                g.selectAll('.domain, .tick line')
                    .style('stroke', 'rgba(255,255,255,0.1)');
                
                const tooltip = d3.select('body').append('div')
                    .attr('class', 'tooltip')
                    .style('opacity', 0)
                    .style('position', 'absolute')
                    .style('pointer-events', 'none');
                
                const bars = g.selectAll('.phase-bar')
                    .data(phases)
                    .enter()
                    .append('g')
                    .attr('class', 'phase-bar');
                
                bars.append('rect')
                    .attr('x', d => xScale(d.startDate))
                    .attr('y', d => yScale(d.name))
                    .attr('width', d => xScale(d.endDate) - xScale(d.startDate))
                    .attr('height', yScale.bandwidth())
                    .attr('fill', d => colorScale(d.status))
                    .attr('rx', 6)
                    .style('opacity', 0.8)
                    .on('mouseover', function(event, d) {
                        d3.select(this).style('opacity', 1);
                        tooltip.transition().duration(200).style('opacity', 1);
                        tooltip.html(`
                            <strong>${d.name}</strong><br/>
                            Status: ${d.status}<br/>
                            Progress: ${d.progress}%<br/>
                            Start: ${timeFormat(d.startDate)}<br/>
                            End: ${timeFormat(d.endDate)}<br/>
                            Tasks: ${d.tasks_completed}/${d.tasks_total}
                        `)
                            .style('left', (event.pageX + 15) + 'px')
                            .style('top', (event.pageY - 28) + 'px');
                    })
                    .on('mouseout', function() {
                        d3.select(this).style('opacity', 0.8);
                        tooltip.transition().duration(200).style('opacity', 0);
                    });
                
                bars.append('rect')
                    .attr('x', d => xScale(d.startDate))
                    .attr('y', d => yScale(d.name))
                    .attr('width', d => (xScale(d.endDate) - xScale(d.startDate)) * (d.progress / 100))
                    .attr('height', yScale.bandwidth())
                    .attr('fill', '#fff')
                    .attr('rx', 6)
                    .style('opacity', 0.3);
                
                bars.append('text')
                    .attr('x', d => xScale(d.endDate) + 10)
                    .attr('y', d => yScale(d.name) + yScale.bandwidth() / 2)
                    .attr('dy', '0.35em')
                    .text(d => `${d.progress}%`)
                    .style('fill', '#9ca3af')
                    .style('font-weight', '600')
                    .style('font-size', '12px');
                
                return () => {
                    tooltip.remove();
                };
            }, [roadmapData]);
            
            if (!roadmapData) return <div className="loading">⏳ טוען ROADMAP...</div>;

                                <div className="text-sm text-gray-400 mb-2">Overall Progress</div>
                                <div className="metric-value">{roadmapData.total_progress}%</div>
                            </div>
                            <div className="metric-card text-center">

                            </div>
                            <div className="metric-card text-center">
                                <div className="text-sm text-gray-400 mb-2">Completed Tasks</div>
                                <div className="metric-value text-success">
                                    {roadmapData.phases.reduce((acc, p) => acc + p.tasks_completed, 0)}
                                </div>
                            </div>
                            <div className="metric-card text-center">
                                <div className="text-sm text-gray-400 mb-2">Total Tasks</div>
                                <div className="metric-value">
                                    {roadmapData.phases.reduce((acc, p) => acc + p.tasks_total, 0)}

                        <div className="mb-6">

                                <svg ref={ganttRef} width="100%" height="400"></svg>
                            </div>
                            <div className="flex justify-center gap-6 mt-4 text-sm">
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded" style={{background: '#10b981'}}></div>
                                    <span className="text-gray-300">Completed</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded" style={{background: '#667eea'}}></div>
                                    <span className="text-gray-300">In Progress</span>
                                </div>
                                <div className="flex items-center gap-2">

                                    <span className="text-gray-300">Planned</span>

                                                    {regimePerf.volatile.avg_rr_achieved.toFixed(2)}
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-gray-400">Outcomes</div>
                                                <div className="font-bold">
                                                    {regimePerf.volatile.total_outcomes}
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-gray-400">P&L</div>
                                                <div className={`font-bold ${regimePerf.volatile.total_pnl_usd >= 0 ? 'text-success' : 'text-error'}`}>
                                                    ${regimePerf.volatile.total_pnl_usd.toFixed(2)}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-gray-400 text-sm">No data available</div>
                                )}
                            </div>
                        </div>
                    </div>
                    
                    <div className="glass-card p-6">
                        <h3 className="text-2xl font-bold mb-4">ℹ️ Performance Metrics Explanation</h3>
                        <div className="grid md:grid-cols-2 gap-4 text-sm">
                            <div className="space-y-2">
                                <div>
                                    <span className="font-bold text-primary">Win Rate:</span>
                                    <span className="text-gray-300"> Percentage of successful predictions</span>
                                </div>
                                <div>
                                    <span className="font-bold text-primary">Avg RR:</span>
                                    <span className="text-gray-300"> Average Risk-Reward ratio achieved</span>
                                </div>
                                <div>
                                    <span className="font-bold text-primary">Total P&L:</span>
                                    <span className="text-gray-300"> Cumulative profit/loss in USD</span>
                                </div>
                                <div>
                                    <span className="font-bold text-primary">Predictions:</span>
                                    <span className="text-gray-300"> Total number of AI predictions made</span>
                                </div>
                            </div>
                            <div className="space-y-2">
                                <div>
                                    <span className="font-bold text-primary">Outcomes:</span>
                                    <span className="text-gray-300"> Number of predictions with confirmed results</span>
                                </div>
                                <div>
                                    <span className="font-bold text-primary">Consistency:</span>
                                    <span className="text-gray-300"> Standard deviation of returns (lower is better)</span>
                                </div>
                                <div>
                                    <span className="font-bold text-success">Green (>60%):</span>
                                    <span className="text-gray-300"> Excellent performance</span>
                                </div>
                                <div>
                                    <span className="font-bold text-warning">Yellow (45-60%):</span>
                                    <span className="text-gray-300"> Good performance</span>
                                </div>
                                <div>
                                    <span className="font-bold text-error">Red (<45%):</span>
                                    <span className="text-gray-300"> Needs improvement</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        
        const Tab21Agents = () => {
            const [agents, setAgents] = useState(null);
            
            useEffect(() => {
                const fetchAgents = async () => {
                    try {
                        const res = await fetch('/dashboard/agents/all');
                        const data = await res.json();
                        setAgents(data);
                    } catch (err) {
                        console.error(err);
                    }
                };
                fetchAgents();
                const interval = setInterval(fetchAgents, 10000);
                return () => clearInterval(interval);
            }, []);
            
            if (!agents) return <div className="loading">⏳ Loading Agents...</div>;
            
            return (
                <div className="space-y-6">
                    <div className="glass-card p-6">
                        <div className="flex items-center gap-4 mb-4">
                            <div className="icon-box">🤖</div>
                            <h2 className="text-3xl font-bold gradient-text">Agents & Orchestrators Control</h2>
                        </div>
                    </div>
                    
                    <div>
                        <h3 className="text-2xl font-bold mb-4">💼 System Workers ({agents.workers.length})</h3>
                        <div className="grid gap-4">
                            {agents.workers.map(worker => (
                                <div key={worker.name} className="glass-card p-5">
                                    <div className="flex justify-between items-start">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-3 mb-2">
                                                <h4 className="text-xl font-bold">{worker.name}</h4>
                                                <span className={`px-2 py-1 rounded text-xs ${worker.status === 'running' ? 'bg-success' : 'bg-error'}`}>
                                                    {worker.status}
                                                </span>
                                            </div>
                                            <p className="text-sm text-gray-400">{worker.description}</p>
                                        </div>
                                        <div className="text-left mr-4">
                                            <div className="text-sm text-gray-400">Uptime</div>
                                            <div className="font-bold">{worker.uptime}</div>
                                        </div>
                                    </div>
                                    <div className="grid md:grid-cols-3 gap-3 mt-4 text-sm">
                                        <div>
                                            <div className="text-gray-400">CPU</div>
                                            <div className="font-bold">{worker.cpu_percent}%</div>
                                        </div>
                                        <div>
                                            <div className="text-gray-400">Memory</div>
                                            <div className="font-bold">{worker.memory_mb}MB</div>
                                        </div>
                                        <div>
                                            <div className="text-gray-400">Success</div>
                                            <div className="font-bold">{worker.success_rate}%</div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <div>
                        <h3 className="text-2xl font-bold mb-4">🧠 AI Mesh ({agents.ai_agents.length})</h3>
                        <div className="grid md:grid-cols-2 gap-4">
                            {agents.ai_agents.map(ai => (
                                <div key={ai.name} className="glass-card p-4">
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <h4 className="font-bold">{ai.name}</h4>
                                            <p className="text-xs text-gray-400">{ai.provider}</p>
                                        </div>
                                        <div className="text-left">
                                            <div className="text-2xl font-bold">{ai.weight}%</div>
                                            <div className={`text-xs ${ai.status === 'active' ? 'text-success' : 'text-gray-400'}`}>{ai.status}</div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div>
                                            <div className="text-gray-400">Calls Today</div>
                                            <div>{ai.calls_today}</div>
                                        </div>
                                        <div>
                                            <div className="text-gray-400">Cost Today</div>
                                            <div>${ai.cost_today.toFixed(2)}</div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <div>
                        <h3 className="text-2xl font-bold mb-4">🎛️ Orchestrators ({agents.orchestrators.length})</h3>
                        <div className="grid gap-4">
                            {agents.orchestrators.map(orch => (
                                <div key={orch.name} className="glass-card p-5 border-2 border-purple-500">
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <h4 className="text-xl font-bold">{orch.name}</h4>
                                            <p className="text-sm text-gray-400">{orch.type}</p>
                                        </div>
                                        <span className={`px-3 py-1 rounded-full text-sm ${orch.status === 'active' ? 'bg-success' : 'bg-gray-500'}`}>
                                            {orch.status}
                                        </span>
                                    </div>
                                    <p className="text-gray-300 mb-4">{orch.description}</p>
                                    <div className="mt-4">
                                        <div className="text-sm text-gray-400 mb-2">Features:</div>
                                        <ul className="text-sm space-y-1">
                                            {orch.features.map((f, i) => (
                                                <li key={i} className="text-gray-300">• {f}</li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };
        
        const Tab22Budget = () => {
            const [budget, setBudget] = useState(null);
            
            useEffect(() => {
                const fetchBudget = async () => {
                    try {
                        const res = await fetch('/dashboard/budget/detailed');
                        const data = await res.json();
                        setBudget(data);
                    } catch (err) {
                        console.error(err);
                    }
                };
                fetchBudget();
                const interval = setInterval(fetchBudget, 30000);
                return () => clearInterval(interval);
            }, []);
            
            if (!budget) return <div className="loading">⏳ Loading Budget...</div>;
            
            return (
                <div className="space-y-6">
                    <div className="glass-card p-6">
                        <div className="flex items-center gap-4 mb-4">
                            <div className="icon-box">💰</div>
                            <h2 className="text-3xl font-bold gradient-text">Budget & Finance Control</h2>
                        </div>
                    </div>
                    
                    <div className="grid md:grid-cols-4 gap-4">
                        <div className="glass-card p-4">
                            <div className="text-sm text-gray-400">Monthly TCO</div>
                            <div className="text-3xl font-bold">${budget.monthly_tco.total}</div>
                        </div>
                        <div className="glass-card p-4">
                            <div className="text-sm text-gray-400">Daily Cost</div>
                            <div className="text-3xl font-bold">${(budget.monthly_tco.total / 30).toFixed(2)}</div>
                        </div>
                        <div className="glass-card p-4">
                            <div className="text-sm text-gray-400">Cost/Trade</div>
                            <div className="text-3xl font-bold">${budget.cost_per_trade.avg_cost_per_trade.toFixed(3)}</div>
                        </div>
                        <div className="glass-card p-4">
                            <div className="text-sm text-gray-400">ROI</div>
                            <div className="text-3xl font-bold text-success">{budget.roi_projection.roi_percent}%</div>
                        </div>
                    </div>
                    
                    <div className="glass-card p-6">
                        <h3 className="text-2xl font-bold mb-4">Monthly Budget Breakdown</h3>
                        <div className="space-y-4">
                            {budget.monthly_tco.categories.map(cat => (
                                <div key={cat.name}>
                                    <div className="flex justify-between mb-2">
                                        <span className="font-semibold">{cat.name}</span>
                                        <span className="text-gray-400">${cat.amount} ({cat.percent}%)</span>
                                    </div>
                                    <div className="w-full bg-gray-700 rounded-full h-3 mb-2">
                                        <div className="progress-fill h-3 rounded-full" style={{width: `${cat.percent}%`}}></div>
                                    </div>
                                    <div className="mr-4 space-y-1">
                                        {cat.items.map((item, i) => (
                                            <div key={i} className="flex justify-between text-sm text-gray-400">
                                                <span>• {item.item}</span>
                                                <span>${item.cost}/mo</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <div className="glass-card p-6">
                        <h3 className="text-2xl font-bold mb-4">ROI Projection</h3>
                        <div className="grid md:grid-cols-2 gap-4">
                            <div>
                                <div className="text-sm text-gray-400">Monthly Costs</div>
                                <div className="text-2xl font-bold text-error">${budget.roi_projection.monthly_costs}</div>
                            </div>
                            <div>
                                <div className="text-sm text-gray-400">Gross Revenue</div>
                                <div className="text-2xl font-bold text-success">${budget.roi_projection.monthly_gross_revenue}</div>
                            </div>
                            <div>
                                <div className="text-sm text-gray-400">Performance Fees</div>
                                <div className="text-2xl font-bold">${budget.roi_projection.performance_fee_collected}</div>
                            </div>
                            <div>
                                <div className="text-sm text-gray-400">Net Profit</div>
                                <div className="text-2xl font-bold text-success">${budget.roi_projection.net_profit}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        
        const Tab23TelegramApprovals = () => {
            const [approvals, setApprovals] = useState(null);
            const [loading, setLoading] = useState(true);
            const [message, setMessage] = useState(null);
            const [actionLoading, setActionLoading] = useState({});
            
            const fetchApprovals = async () => {
                try {
                    const res = await fetch('/dashboard/telegram/pending-approvals');
                    const data = await res.json();
                    setApprovals(data);
                    setLoading(false);
                } catch (err) {
                    console.error('Error loading approvals:', err);
                    setLoading(false);
                }
            };
            
            useEffect(() => {
                fetchApprovals();
                const interval = setInterval(fetchApprovals, 10000);
                return () => clearInterval(interval);
            }, []);
            
            const handleApprove = async (ticketId) => {
                setActionLoading(prev => ({ ...prev, [ticketId]: 'approving' }));
                setMessage(null);
                
                try {
                    const res = await fetch(`/dashboard/telegram/approve/${ticketId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    if (res.ok) {
                        setMessage({ type: 'success', text: `✅ Trade ${ticketId} approved successfully!` });
                        await fetchApprovals();
                    } else {
                        const error = await res.json();
                        setMessage({ type: 'error', text: `❌ Failed to approve: ${error.detail || 'Unknown error'}` });
                    }
                } catch (err) {
                    setMessage({ type: 'error', text: `❌ Error: ${err.message}` });
                } finally {
                    setActionLoading(prev => ({ ...prev, [ticketId]: null }));
                    setTimeout(() => setMessage(null), 5000);
                }
            };
            
            const handleReject = async (ticketId) => {
                setActionLoading(prev => ({ ...prev, [ticketId]: 'rejecting' }));
                setMessage(null);
                
                try {
                    const res = await fetch(`/dashboard/telegram/reject/${ticketId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    if (res.ok) {
                        setMessage({ type: 'success', text: `✅ Trade ${ticketId} rejected successfully!` });
                        await fetchApprovals();
                    } else {
                        const error = await res.json();
                        setMessage({ type: 'error', text: `❌ Failed to reject: ${error.detail || 'Unknown error'}` });
                    }
                } catch (err) {
                    setMessage({ type: 'error', text: `❌ Error: ${err.message}` });
                } finally {
                    setActionLoading(prev => ({ ...prev, [ticketId]: null }));
                    setTimeout(() => setMessage(null), 5000);
                }
            };
            
            if (loading) return <div className="loading">⏳ Loading Telegram Approvals...</div>;
            
            return (
                <div className="space-y-6">
                    <div className="glass-card p-6">
                        <div className="flex items-center justify-between mb-6">
                            <div className="flex items-center gap-4">
                                <div className="icon-box">✅</div>
                                <div>
                                    <h2 className="text-3xl font-bold gradient-text">Telegram Trade Approvals</h2>
                                    <p className="text-sm text-gray-400 mt-1">Review and approve/reject pending trades</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-sm text-gray-400">Auto-refresh every 10s</div>
                                <div className="text-lg font-bold text-primary">
                                    {approvals?.pending_count || 0} Pending
                                </div>
                            </div>
                        </div>
                        
                        {message && (
                            <div className={`glass-card p-4 mb-6 ${message.type === 'success' ? 'border-l-4 border-success' : 'border-l-4 border-error'}`}>
                                <div className={`font-bold ${message.type === 'success' ? 'text-success' : 'text-error'}`}>
                                    {message.text}
                                </div>
                            </div>
                        )}
                        
                        {approvals && approvals.approvals && approvals.approvals.length > 0 ? (
                            <div className="space-y-4">
                                {approvals.approvals.map((approval, idx) => (
                                    <div key={approval.ticket_id} className="glass-card p-6 hover:border-primary transition-all">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="flex items-center gap-3">
                                                <div className="icon-box text-xl">
                                                    {approval.side === 'BUY' || approval.side === 'LONG' ? '📈' : '📉'}
                                                </div>
                                                <div>
                                                    <h3 className="text-2xl font-bold text-white">{approval.symbol}</h3>
                                                    <div className="flex items-center gap-3 mt-1">
                                                        <span className={`status-badge ${approval.side === 'BUY' || approval.side === 'LONG' ? 'status-active' : 'status-error'} text-xs`}>
                                                            {approval.side}
                                                        </span>
                                                        <span className="text-xs text-gray-400">ID: {approval.ticket_id}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-xs text-gray-400">Received</div>
                                                <div className="text-sm text-gray-300">{approval.timestamp || 'Just now'}</div>
                                            </div>
                                        </div>
                                        
                                        <div className="grid md:grid-cols-3 gap-4 mb-4">
                                            <div className="metric-card text-center">
                                                <div className="text-xs text-gray-400 mb-1">Entry Price</div>
                                                <div className="text-xl font-bold text-primary">${approval.entry_price?.toFixed(4) || 'N/A'}</div>
                                            </div>
                                            <div className="metric-card text-center">
                                                <div className="text-xs text-gray-400 mb-1">Take Profit</div>
                                                <div className="text-xl font-bold text-success">${approval.tp_price?.toFixed(4) || 'N/A'}</div>
                                            </div>
                                            <div className="metric-card text-center">
                                                <div className="text-xs text-gray-400 mb-1">Stop Loss</div>
                                                <div className="text-xl font-bold text-error">${approval.sl_price?.toFixed(4) || 'N/A'}</div>
                                            </div>
                                        </div>
                                        
                                        <div className="grid md:grid-cols-3 gap-4 mb-4">
                                            <div className="flex justify-between p-3 bg-gray-800/50 rounded">
                                                <span className="text-gray-400">Quality:</span>
                                                <span className="font-bold text-info">{approval.quality?.toFixed(1) || 'N/A'}/10</span>
                                            </div>
                                            <div className="flex justify-between p-3 bg-gray-800/50 rounded">
                                                <span className="text-gray-400">Confidence:</span>
                                                <span className="font-bold text-warning">{approval.confidence?.toFixed(0) || 'N/A'}%</span>
                                            </div>
                                            <div className="flex justify-between p-3 bg-gray-800/50 rounded">
                                                <span className="text-gray-400">Risk/Reward:</span>
                                                <span className="font-bold text-success">{approval.rr?.toFixed(2) || 'N/A'}</span>
                                            </div>
                                        </div>
                                        
                                        {approval.reason && (
                                            <div className="mb-4 p-3 bg-blue-900/20 border border-blue-500/30 rounded">
                                                <div className="text-xs text-blue-300 mb-1">Trade Reason:</div>
                                                <div className="text-sm text-gray-300">{approval.reason}</div>
                                            </div>
                                        )}
                                        
                                        <div className="flex gap-3 justify-end">
                                            <button
                                                onClick={() => handleReject(approval.ticket_id)}
                                                disabled={actionLoading[approval.ticket_id]}
                                                className={`px-6 py-3 rounded-lg font-bold transition-all ${
                                                    actionLoading[approval.ticket_id]
                                                        ? 'bg-gray-600 cursor-not-allowed'
                                                        : 'bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600'
                                                } text-white shadow-lg hover:shadow-xl hover:scale-105`}
                                            >
                                                {actionLoading[approval.ticket_id] === 'rejecting' ? (
                                                    <span className="flex items-center gap-2">
                                                        <span className="pulse">⏳</span> Rejecting...
                                                    </span>
                                                ) : (
                                                    <span>❌ Reject</span>
                                                )}
                                            </button>
                                            <button
                                                onClick={() => handleApprove(approval.ticket_id)}
                                                disabled={actionLoading[approval.ticket_id]}
                                                className={`px-6 py-3 rounded-lg font-bold transition-all ${
                                                    actionLoading[approval.ticket_id]
                                                        ? 'bg-gray-600 cursor-not-allowed'
                                                        : 'bg-gradient-to-r from-green-600 to-green-700 hover:from-green-500 hover:to-green-600'
                                                } text-white shadow-lg hover:shadow-xl hover:scale-105`}
                                            >
                                                {actionLoading[approval.ticket_id] === 'approving' ? (
                                                    <span className="flex items-center gap-2">
                                                        <span className="pulse">⏳</span> Approving...
                                                    </span>
                                                ) : (
                                                    <span>✅ Approve</span>
                                                )}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="glass-card p-12 text-center">
                                <div className="text-6xl mb-4">✨</div>
                                <h3 className="text-2xl font-bold text-gray-300 mb-2">No Pending Approvals</h3>
                                <p className="text-gray-400">
                                    All trades have been reviewed. New approvals will appear here automatically.
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        ReactDOM.render(<UltimateWorkbook />, document.getElementById('root'));
    </script>
</body>
</html>
