<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בס"ד - AlgoGPT Ultimate Dynamic Workbook</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --glass-bg: rgba(31, 41, 55, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --bg-dark: #0a0a1a;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }
        
        [data-theme="ocean"] {
            --primary: #06b6d4;
            --secondary: #0891b2;
            --accent: #22d3ee;
        }
        
        [data-theme="forest"] {
            --primary: #10b981;
            --secondary: #059669;
            --accent: #34d399;
        }
        
        [data-theme="sunset"] {
            --primary: #f59e0b;
            --secondary: #d97706;
            --accent: #fb923c;
        }
        
        [data-theme="dark"] {
            --primary: #6b7280;
            --secondary: #4b5563;
            --accent: #9ca3af;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heebo', 'Rubik', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.3);
        }
        
        .tab-button {
            padding: 12px 20px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            white-space: nowrap;
        }
        
        .tab-button:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: var(--primary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }
        
        .tab-button.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(107, 114, 128, 0.3);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 999px;
            transition: width 1s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .status-active {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }
        
        .status-planned {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }
        
        .status-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }
        
        .status-waiting {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }
        
        .metric-card {
            background: rgba(17, 24, 39, 0.8);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
        }
        
        .metric-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .metric-value {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: var(--text-secondary);
        }
        
        .error {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: var(--error);
        }
        
        .icon-box {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--glass-border);
        }
        
        th {
            background: rgba(102, 126, 234, 0.1);
            font-weight: 700;
            color: var(--primary);
        }
        
        tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }
        
        .theme-picker {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }
        
        .theme-option {
            padding: 20px;
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .theme-option:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }
        
        .theme-option.active {
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.1);
        }
        
        #flow-viz {
            width: 100%;
            height: 600px;
            background: rgba(17, 24, 39, 0.5);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        
        .node {
            cursor: pointer;
        }
        
        .node circle {
            transition: all 0.3s;
        }
        
        .node:hover circle {
            r: 40;
            fill-opacity: 0.9;
        }
        
        .link {
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
            opacity: 0.6;
            transition: all 0.3s;
        }
        
        .link:hover {
            stroke-width: 4;
            opacity: 1;
        }
        
        .whats-new-card {
            background: rgba(17, 24, 39, 0.6);
            padding: 20px;
            border-radius: 12px;
            border-right: 4px solid var(--primary);
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        
        .whats-new-card:hover {
            transform: translateX(-4px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }
        
        .timeline {
            position: relative;
            padding-right: 40px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            right: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
        }
        
        .timeline-item {
            position: relative;
            padding-bottom: 24px;
        }
        
        .timeline-dot {
            position: absolute;
            right: 12px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.6);
        }
        
        .news-item {
            padding: 16px;
            background: rgba(17, 24, 39, 0.5);
            border-radius: 8px;
            border-right: 3px solid var(--info);
            margin-bottom: 12px;
        }
        
        .sentiment-bullish {
            color: var(--success);
            font-weight: 700;
        }
        
        .sentiment-bearish {
            color: var(--error);
            font-weight: 700;
        }
        
        .sentiment-neutral {
            color: var(--text-secondary);
            font-weight: 700;
        }
        
        .impact-high {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        
        .impact-medium {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        
        .impact-low {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(107, 114, 128, 0.3);
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.6);
        }
        
        .tooltip {
            position: absolute;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.5);
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const UltimateWorkbook = () => {
            const [activeTab, setActiveTab] = useState(1);
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [theme, setTheme] = useState('default');
            const [fontSize, setFontSize] = useState(16);
            const [glassEffect, setGlassEffect] = useState(0.6);
            const [rtl, setRtl] = useState(true);
            const [currentTime, setCurrentTime] = useState('');
            
            const fetchData = async () => {
                try {
                    const response = await fetch('/dashboard/ultimate-data');
                    if (!response.ok) throw new Error('Failed to fetch data');
                    const json = await response.json();
                    setData(json);
                    setLoading(false);
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };
            
            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 30000);
                return () => clearInterval(interval);
            }, []);
            
            useEffect(() => {
                document.body.style.fontSize = `${fontSize}px`;
                document.body.dir = rtl ? 'rtl' : 'ltr';
                document.body.setAttribute('data-theme', theme);
                document.documentElement.style.setProperty('--glass-bg', `rgba(31, 41, 55, ${glassEffect})`);
                
                localStorage.setItem('ultimate-workbook-prefs', JSON.stringify({
                    theme, fontSize, glassEffect, rtl
                }));
            }, [theme, fontSize, glassEffect, rtl]);
            
            useEffect(() => {
                const prefs = localStorage.getItem('ultimate-workbook-prefs');
                if (prefs) {
                    const parsed = JSON.parse(prefs);
                    setTheme(parsed.theme || 'default');
                    setFontSize(parsed.fontSize || 16);
                    setGlassEffect(parsed.glassEffect || 0.6);
                    setRtl(parsed.rtl !== undefined ? parsed.rtl : true);
                }
            }, []);
            
            useEffect(() => {
                const updateIsraelTime = () => {
                    const now = new Date();
                    const israelTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Jerusalem' }));
                    const days = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
                    const dayName = days[israelTime.getDay()];
                    const dateStr = israelTime.toLocaleDateString('he-IL', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    const timeStr = israelTime.toLocaleTimeString('he-IL', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    setCurrentTime(`יום ${dayName}, ${dateStr}, ${timeStr}`);
                };
                updateIsraelTime();
                const interval = setInterval(updateIsraelTime, 1000);
                return () => clearInterval(interval);
            }, []);
            
            useEffect(() => {
                const lastTab = localStorage.getItem('ultimate-workbook-last-tab');
                if (lastTab) {
                    setActiveTab(parseInt(lastTab));
                }
            }, []);
            
            useEffect(() => {
                localStorage.setItem('ultimate-workbook-last-tab', activeTab.toString());
            }, [activeTab]);
            
            const tabs = [
                { id: 1, name: 'Dashboard', icon: '📊' },
                { id: 2, name: 'Finance', icon: '💰' },
                { id: 3, name: 'What\'s New', icon: '📋' },
                { id: 4, name: 'Changelog', icon: '📚' },
                { id: 5, name: 'Live Flow', icon: '🔄' },
                { id: 6, name: 'Approvals', icon: '📱' },
                { id: 7, name: 'News', icon: '📰' },
                { id: 8, name: 'Strategies', icon: '🎯' },
                { id: 9, name: '8-AI Mesh', icon: '🤖' },
                { id: 10, name: 'Architecture', icon: '🏗️' },
                { id: 11, name: 'Live Metrics', icon: '📈' },
                { id: 12, name: 'ROI Analysis', icon: '💵' },
                { id: 13, name: 'System Map', icon: '🗺️' },
                { id: 14, name: 'Theme', icon: '🎨' },
                { id: 15, name: 'User Guide', icon: '📖' },
                { id: 16, name: 'ROADMAP', icon: '🗺️' },
                { id: 17, name: 'Tech Indicators', icon: '📊' },
                { id: 18, name: 'System Docs', icon: '📚' }
            ];
            
            if (loading) return (
                <div className="loading">
                    <div className="pulse">⏳ טוען נתונים...</div>
                </div>
            );
            
            if (error) return (
                <div className="error">
                    ❌ שגיאה: {error}
                    <br />
                    <button onClick={fetchData} style={{marginTop: '20px', padding: '10px 20px', cursor: 'pointer'}}>
                        נסה שוב
                    </button>
                </div>
            );
            
            if (!data) return <div className="error">❌ אין נתונים</div>;
            
            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto">
                    <div className="flex justify-center mb-4 fade-in" style={{animation: 'fadeIn 1s ease-out, pulse 3s infinite'}}>
                        <img src="algogpt-logo.svg" alt="AlgoGPT Logo" style={{height: '100px', filter: 'drop-shadow(0 0 20px rgba(102, 126, 234, 0.5))'}} />
                    </div>
                    
                    <header className="glass-card p-6 mb-6 fade-in">
                        <div className="flex items-center justify-between flex-wrap gap-4">
                            <div>
                                <h1 className="text-4xl font-bold gradient-text mb-2">
                                    בס"ד - AlgoGPT Ultimate Edition
                                </h1>
                                <p className="text-xl text-gray-300">
                                    Ultimate Dynamic Workbook - ספר עבודה דינמי מלא
                                </p>
                            </div>
                            <div className="text-left">
                                <div className="text-sm text-gray-400">🕐 Israel Time</div>
                                <div className="text-lg font-semibold text-blue-300">
                                    {currentTime}
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    <div className="glass-card p-4 mb-6 fade-in overflow-x-auto scrollbar-thin">
                        <div className="flex flex-wrap gap-2 min-w-max">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    className={`tab-button ${activeTab === tab.id ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.id)}
                                >
                                    <span>{tab.icon}</span>
                                    <span>{tab.name}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    <div className="fade-in">
                        {activeTab === 1 && <Tab1Dashboard data={data} />}
                        {activeTab === 2 && <Tab2Finance data={data.finance_orchestrator} />}
                        {activeTab === 3 && <Tab3WhatsNew data={data.whats_new} />}
                        {activeTab === 4 && <Tab4Changelog data={data.changelog} />}
                        {activeTab === 5 && <Tab5LiveFlow data={data.live_flow} />}
                        {activeTab === 6 && <Tab6Approvals data={data.pending_approvals} />}
                        {activeTab === 7 && <Tab7News data={data.news_feed} />}
                        {activeTab === 8 && <Tab8Strategies data={data.strategy_performance} />}
                        {activeTab === 9 && <Tab9AIMesh data={data.ai_mesh} />}
                        {activeTab === 10 && <Tab10Architecture data={data.architecture} />}
                        {activeTab === 11 && <Tab11LiveMetrics data={data.live_metrics} />}
                        {activeTab === 12 && <Tab12ROI data={data.roi_analysis} />}
                        {activeTab === 13 && <Tab13SystemMap data={data.system_map} />}
                        {activeTab === 14 && <Tab14Theme theme={theme} setTheme={setTheme} fontSize={fontSize} setFontSize={setFontSize} glassEffect={glassEffect} setGlassEffect={setGlassEffect} rtl={rtl} setRtl={setRtl} />}
                        {activeTab === 15 && <Tab15UserGuide />}
                        {activeTab === 16 && <Tab16Roadmap />}
                        {activeTab === 17 && <Tab17TechnicalIndicators />}
                        {activeTab === 18 && <Tab18SystemDocs />}
                    </div>
                </div>
            );
        };
        
        const Tab1Dashboard = ({ data }) => (
            <div className="space-y-6">
                <div className="glass-card p-6">
                    <div className="flex items-center gap-4 mb-6">
                        <div className="icon-box">📊</div>
                        <h2 className="text-3xl font-bold gradient-text">Dashboard Overview</h2>
                    </div>
                    
                    <div className="grid md:grid-cols-4 gap-4">
                        <div className="metric-card">
                            <div className="text-sm text-gray-400 mb-2">Total AUM</div>
                            <div className="metric-value">${data.finance_orchestrator.aum.total.toLocaleString()}</div>
                            <div className="text-xs text-success mt-1">+{data.finance_orchestrator.aum.growth_ytd}% YTD</div>
                        </div>
                        
                        <div className="metric-card">
                            <div className="text-sm text-gray-400 mb-2">Active Users</div>
                            <div className="metric-value">{data.finance_orchestrator.users.length}</div>
                            <div className="text-xs text-gray-400 mt-1">Multi-tenant ready</div>
                        </div>
                        
                        <div className="metric-card">
                            <div className="text-sm text-gray-400 mb-2">Monthly TCO</div>
                            <div className="metric-value">${data.finance_orchestrator.monthly_tco.total}</div>
                            <div className="text-xs text-gray-400 mt-1">All services included</div>
                        </div>
                        
                        <div className="metric-card">
                            <div className="text-sm text-gray-400 mb-2">Runway</div>
                            <div className="metric-value">{data.finance_orchestrator.runway_months}</div>
                            <div className="text-xs text-gray-400 mt-1">months remaining</div>
                        </div>
                    </div>
                    
                    <div className="grid md:grid-cols-2 gap-6 mt-6">
                        <div>
                            <h3 className="text-xl font-bold text-blue-300 mb-4">System Status</h3>
                            <div className="space-y-3">
                                <div className="flex justify-between items-center">
                                    <span>Auto Scanner</span>
                                    <span className="status-badge status-active">🟢 Running</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span>8-AI Mesh</span>
                                    <span className="status-badge status-active">🟢 Active</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span>Position Monitor</span>
                                    <span className="status-badge status-active">🟢 Running</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span>Telegram Bot</span>
                                    <span className="status-badge status-active">🟢 Online</span>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <h3 className="text-xl font-bold text-blue-300 mb-4">Quick Stats</h3>
                            <div className="space-y-3">
                                <div className="flex justify-between items-center">
                                    <span>Trades Today</span>
                                    <span className="font-bold text-primary">{data.live_metrics.trades.total_today}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span>Win Rate</span>
