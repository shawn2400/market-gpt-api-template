<!doctype html>
<meta charset="utf-8" />
<title>OPS Tester – יצירת טיקטים</title>
<style>
  body{font-family:system-ui,Arial;margin:2rem;max-width:760px;line-height:1.6;direction:rtl}
  button{padding:.7rem 1.1rem;border:0;border-radius:10px;cursor:pointer;margin:.25rem}
  .primary{background:#111;color:#fff}.secondary{background:#eee}
  input{padding:.5rem;border:1px solid #ddd;border-radius:8px;width:140px}
  label{display:inline-block;min-width:110px}
  code{background:#f7f7f7;padding:.2rem .4rem;border-radius:6px}
  .row{margin:.4rem 0}
</style>

<h2>בדיקת יצירת טיקטים</h2>
<p>Endpoint: <code>https://algogpt-docker.onrender.com/ops/ticket</code></p>
<p>Token: <code>Bearer TOKEN_HERE</code></p>

<div class="row"><label>סימבול</label><input id="sym" value="BTCUSDT"></div>
<div class="row"><label>כמות</label><input id="qty" value="0.002"></div>
<div class="row"><label>מינוף</label><input id="lev" value="10"></div>
<div class="row"><label>Score</label><input id="score" value="8.6"></div>
<div class="row"><label>הערה</label><input id="note" value="real-small-test"></div>

<p>
  <button class="secondary" onclick="ping()">בדיקת Telegram Ping</button>
  <button onclick="mkSmoke()">צור טיקט SMOKE (MARKET+ניהול דינמי)</button>
  <button class="primary" onclick="mkReal()">צור טיקט REAL (מחשב TP/SL מה-Mark)</button>
</p>

<pre id="out"></pre>

<script>
const EP='https://algogpt-docker.onrender.com/ops/ticket';
const PING='https://algogpt-docker.onrender.com/telegram/ping';
const TOKEN='Bearer TOKEN_HERE'; // החלף לטוקן שלך

const out=x=>document.getElementById('out').textContent=
  (typeof x==='string'?x:JSON.stringify(x,null,2));

async function ping(){
  const r=await fetch(PING);
  out(await r.text());
}

async function mkSmoke(){
  const p={
    symbol: sym.value || 'BTCUSDT',
    side: 'BUY',
    qty: +qty.value || 0.002,
    leverage: +lev.value || 10,
    score: +score.value || 8.1,
    note: 'smoke-test'
  };
  const r=await fetch(EP,{method:'POST',headers:{
    'Content-Type':'application/json','Authorization':TOKEN
  },body:JSON.stringify(p)});
  out(await r.json());
}

async function mkReal(){
  const symbol = sym.value || 'BTCUSDT';
  const qtyVal = +qty.value || 0.002;
  const levVal = +lev.value || 10;
  const scrVal = +score.value || 8.6;
  const noteVal = note.value || 'real-small-test';

  // שלוף Mark Price לחישוב TP/SL
  const markUrl=`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${encodeURIComponent(symbol)}`;
  let mark=0;
  try{
    const m=await fetch(markUrl).then(r=>r.json());
    mark=parseFloat(m.markPrice||'0')||0;
  }catch(e){}

  // אם יש מחיר, גזור TP/SL; אם לא – שלח בלי
  const p={
    ticket_id:'T_HTML_'+Date.now().toString(16).slice(-6),
    symbol, side:'BUY', qty:qtyVal, leverage:levVal, score:scrVal, note:noteVal
  };
  if(mark>0){
    p.tp1=+(mark*1.018).toFixed(2);
    p.tp2=+(mark*1.032).toFixed(2);
    p.tp3=+(mark*1.055).toFixed(2);
    p.sl =+(mark*0.988).toFixed(2);
  }

  const r=await fetch(EP,{method:'POST',headers:{
    'Content-Type':'application/json','Authorization':TOKEN
  },body:JSON.stringify(p)});
  out(await r.json());
}
</script>
