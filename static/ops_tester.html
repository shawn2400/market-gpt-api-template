<!doctype html>
<meta charset="utf-8" />
<title>OPS Ticket Tester</title>
<style>
  body{font-family:system-ui,Arial;margin:2rem;max-width:720px}
  button{padding:.7rem 1.1rem;border:0;border-radius:10px;cursor:pointer;margin:.25rem}
  .a{background:#111;color:#fff}.b{background:#eee}
  input{padding:.5rem;border:1px solid #ddd;border-radius:8px;width:120px}
</style>
<h2>OPS Ticket Tester</h2>
<p>Endpoint: <code id="ep">https://algogpt-docker.onrender.com/ops/ticket</code></p>
<p>
  Qty <input id="qty" value="0.002">
  Lev <input id="lev" value="10">
  <button class="a" onclick="mkSmoke()">Create SMOKE Ticket</button>
  <button class="b" onclick="mkReal()">Create REAL Ticket (with TP/SL)</button>
</p>
<pre id="out"></pre>
<script>
const EP='https://algogpt-docker.onrender.com/ops/ticket';
const out=x=>document.getElementById('out').textContent=JSON.stringify(x,null,2);

async function mkSmoke(){
  const p={symbol:'BTCUSDT',side:'BUY',qty:+qty.value,leverage:+lev.value,score:8.1,note:'smoke-test'};
  const r=await fetch(EP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  out(await r.json());
}

async function mkReal(){
  const mark=await fetch('https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT').then(r=>r.json()).then(j=>+j.markPrice||0);
  const tp1=+(mark*1.018).toFixed(2), tp2=+(mark*1.032).toFixed(2), tp3=+(mark*1.055).toFixed(2), sl=+(mark*0.988).toFixed(2);
  const p={ticket_id:'T_HTML_'+Date.now().toString(16).slice(-6),symbol:'BTCUSDT',side:'BUY',qty:+qty.value,leverage:+lev.value,score:8.6,tp1,tp2,tp3,sl,note:'real-small-test'};
  const r=await fetch(EP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  out(await r.json());
}
</script>
