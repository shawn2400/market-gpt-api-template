# ================================================================================
# AlgoGPT Render Deployment - Simplified Configuration
# ================================================================================
# This file defines how to deploy AlgoGPT to your $25/month Render server.
# All 10 workers run in a single web service to save costs.
# ================================================================================

services:
  # Main Web Service - Runs AlgoGPT Server + All 10 Workers
  - type: web
    name: algogpt-simple
    env: python
    region: oregon  # Change to your preferred region
    plan: starter   # $25/month plan
    branch: main
    
    # Build command - install dependencies and setup PostgreSQL
    buildCommand: |
      echo "📦 Installing Python dependencies..."
      pip install --upgrade pip
      pip install -r requirements.txt
      
      echo "🔧 Making scripts executable..."
      chmod +x start.sh setup_db.sh migrate_db.py
      
      echo "🗄️ Setting up PostgreSQL..."
      ./setup_db.sh
      
      echo "✅ Build complete!"
    
    # Start command - runs the master script
    startCommand: ./start.sh
    
    # Health check - Render will ping this endpoint
    healthCheckPath: /health
    
    # Auto-deploy when you push to GitHub
    autoDeploy: true
    
    # Environment Variables
    envVars:
      # === Server Configuration ===
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHONPATH
        value: /app
      - key: LOG_LEVEL
        value: INFO
      
      # === Gunicorn Configuration ===
      - key: WEB_CONCURRENCY
        value: 2
      - key: GUNICORN_TIMEOUT
        value: 300
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: 60
      - key: GUNICORN_MAX_REQUESTS
        value: 1000
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: 100
      
      # === Trading Modes ===
      - key: AUTO_RUN
        value: 1
      - key: EXECUTE_TRADES
        value: 1
      - key: TRADE_AUTO_SUGGEST
        value: 1
      - key: SUGGEST_FUTURES
        value: 1
      - key: SUGGEST_GRID
        value: 1
      - key: SUGGEST_INTERVAL_SEC
        value: 60
      - key: SUGGEST_CAP_PER_CYCLE
        value: 4
      
      # === Position Management ===
      - key: MANAGER_ENABLE
        value: 1
      - key: TRADE_MANAGER_ENABLE
        value: 1
      - key: ALLOW_MANAGE_OPEN_TRADES
        value: 1
      - key: MANAGER_INTERVAL_SEC
        value: 20
      
      # === Dynamic Features ===
      - key: TRAIL_ENABLE
        value: 1
      - key: BE_GUARD_ENABLE
        value: 1
      - key: AUTO_FLIP_ENABLE
        value: 1
      - key: SMART_MANAGE_ON_APPROVE
        value: 1
      
      # === Telegram & Approvals ===
      - key: TELEGRAM_SEND_ENABLE
        value: 1
      - key: APPROVAL_ENABLED
        value: 1
      - key: REQUIRE_TELEGRAM_APPROVAL
        value: 1
      - key: AUTO_OPEN_ON_APPROVE
        value: 1
      
      # === Monitoring Workers ===
      - key: ENABLE_POSITION_MONITOR
        value: 1
      - key: POSITION_REPORT_INTERVAL_SEC
        value: 1800
      - key: SENTINEL_ENABLED
        value: 1
      - key: HEALTH_CHECK_INTERVAL
        value: 30
      - key: AUTO_FIX_ENABLE
        value: 1
      - key: HEARTBEAT_INTERVAL
        value: 600
      
      # === GitHub Auto-Commit ===
      - key: GITHUB_AUTO_COMMIT_ENABLED
        value: 1
      - key: GITHUB_AUTO_COMMIT_INTERVAL
        value: 600  # 10 minutes
      - key: GITHUB_COMMIT_TELEGRAM_NOTIFY
        value: 1
      
      # === Validation & Safety (Phase 1) ===
      - key: VALIDATION_REQUIRED
        value: 1
      - key: DUAL_CONFIRM_ENABLE
        value: 1
      - key: MC_DIST_SOURCE
        value: student_t
      - key: BREAKER_DD_LIMIT_PCT
        value: 5.0
      - key: BREAKER_CONSEC_SL_MAX
        value: 4
      - key: BREAKER_VOLATILITY_THRESHOLD
        value: 50
      - key: MIN_WINRATE_PCT
        value: 46
      - key: MIN_RR
        value: 1.45
      - key: MAX_DRAWDOWN_PCT
        value: 12
      
      # === Database ===
      - key: USE_DB
        value: 1
      - key: DATABASE_URL
        value: postgresql://algogpt_user:YOUR_PASSWORD@localhost/algogpt_production
      
      # === Secrets (You need to add these manually in Render Dashboard) ===
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: OPS_SIGN_SECRET
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: PRIMARY_API_TOKEN
        sync: false
      - key: ALGOGPT_TOKENS
        sync: false
      - key: AI_MESH_SECRET
        sync: false
      - key: RENDER_API_KEY
        sync: false
