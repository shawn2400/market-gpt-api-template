<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>AlgoGPT – Grid Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f8f9fa; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
        th { background: #eee; }
        tr:nth-child(even) { background: #f2f2f2; }
        .ok { color: green; }
        .fail { color: red; }
    </style>
    <script>
        async function loadGridData() {
            try {
                const accountId = document.getElementById("accountFilter").value;
                let url = "/ui/grid/data";
                if (accountId) url += "?account_id=" + encodeURIComponent(accountId);

                const res = await fetch(url);
                const data = await res.json();

                const tbody = document.getElementById("gridTableBody");
                tbody.innerHTML = "";

                if (data.ok && data.items.length > 0) {
                    data.items.forEach(trade => {
                        const row = `<tr>
                            <td>${trade.symbol || "-"}</td>
                            <td>${trade.side || "-"}</td>
                            <td>${trade.market || "-"}</td>
                            <td>${trade.account_id || "-"}</td>
                            <td>${trade.entry || "-"}</td>
                            <td>${trade.sl || "-"}</td>
                            <td>${trade.tp || "-"}</td>
                            <td>${trade.status || "-"}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="8">אין נתונים להצגה</td></tr>`;
                }
            } catch (err) {
                console.error("loadGridData failed", err);
            }
        }

        // Auto-refresh כל 45 שניות (קליל, לא יעמיס)
        setInterval(loadGridData, 45000);
        window.onload = loadGridData;
    </script>
</head>
<body>
    <h1>📊 AlgoGPT – Grid Dashboard</h1>
    <label for="accountFilter">בחר חשבון:</label>
    <input type="text" id="accountFilter" placeholder="main / spot1" oninput="loadGridData()">

    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Side</th>
                <th>Market</th>
                <th>Account</th>
                <th>Entry</th>
                <th>SL</th>
                <th>TP</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="gridTableBody"></tbody>
    </table>
</body>
</html>
