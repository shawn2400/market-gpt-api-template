<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AlgoGPT Grid Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
        h1 { color: #333; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #333; color: white; }
        tr:nth-child(even) { background: #f2f2f2; }
        button { padding: 6px 12px; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>
    <h1>AlgoGPT – Grid Dashboard</h1>
    <p>מציג טריידים פתוחים מכל החשבונות (רענון אוטומטי כל 60 שניות)</p>

    <button onclick="loadData()">רענן עכשיו</button>

    <table id="gridTable">
        <thead>
            <tr>
                <th>Account</th>
                <th>Symbol</th>
                <th>Side</th>
                <th>Market</th>
                <th>Budget</th>
                <th>Leverage</th>
                <th>Base Price</th>
                <th>State</th>
                <th>Updated</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="9">טוען נתונים...</td></tr>
        </tbody>
    </table>

    <script>
        async function loadData() {
            try {
                const res = await fetch("/ui/grid/data");
                const data = await res.json();
                const tbody = document.querySelector("#gridTable tbody");
                tbody.innerHTML = "";

                if (!data.items || data.items.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='9'>אין טריידים פעילים כרגע</td></tr>";
                    return;
                }

                data.items.forEach(item => {
                    const row = `<tr>
                        <td>${item.account_id || '-'}</td>
                        <td>${item.symbol || '-'}</td>
                        <td>${item.side || '-'}</td>
                        <td>${item.market || '-'}</td>
                        <td>${item.budget || '-'}</td>
                        <td>${item.leverage || '-'}</td>
                        <td>${item.base_price || '-'}</td>
                        <td>${item.state || '-'}</td>
                        <td>${item.updated_at || '-'}</td>
                    </tr>`;
                    tbody.insertAdjacentHTML("beforeend", row);
                });
            } catch (err) {
                console.error("loadData error:", err);
            }
        }

        // רענון אוטומטי כל 60 שניות
        setInterval(loadData, 60000);

        // טעינה ראשונית
        loadData();
    </script>
</body>
</html>
