global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${ADMIN_CHAT_ID}"
        parse_mode: "Markdown"
        message: |
          🚨 *{{ .CommonLabels.severity | toUpper }}* – {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
          🔖 {{ .CommonLabels.alertname }}



