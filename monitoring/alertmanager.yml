# FILE: monitoring/alertmanager.yml
global:
  resolve_timeout: 5m
  # (לא חובה) הגדרות SMTP גלובליות אם תשתמשו ב-email:
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'algogpt-alerts@example.com'
  # smtp_auth_username: 'user'
  # smtp_auth_password: 'pass'
  # smtp_require_tls: true

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: 'null'              # ברירת מחדל (לא בשימוש)
  group_by: ['alertname', 'instance', 'job']
  group_wait: 20s               # זמן צבירה ראשוני
  group_interval: 3m            # כמה זמן בין משלוחי קבוצה חוזרים
  repeat_interval: 2h           # כל כמה זמן להזכיר שוב על אותה קבוצה

  routes:
    # רק ההתראות של השירות שלנו
    - matchers:
        - 'service = algogpt'
      receiver: 'slack-warnings'     # ברירת המחדל של תת-העץ (למקרה שאין התאמה)
      group_by: ['alertname', 'instance']
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 2h

      routes:
        # ── CRITICAL ──
        - matchers: ['severity = critical']
          receiver: 'fanout-critical'
          group_wait: 5s
          group_interval: 1m
          repeat_interval: 30m

        # ── WARNING ──
        - matchers: ['severity = warning']
          receiver: 'slack-warnings'
          group_wait: 30s
          group_interval: 3m
          repeat_interval: 2h

receivers:
  # Fanout לקריטיות – שולח גם לטלגרם, גם Slack וגם Email
  - name: 'fanout-critical'
    continue: true
    webhook_configs: []
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        api_url: 'https://api.telegram.org'
        parse_mode: 'MarkdownV2'
        message: '{{ template "am.title" . }}{{ template "am.body" . }}'
        disable_notifications: false
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        send_resolved: true
        title: '{{ template "am.title" . }}'
        text: '{{ template "am.body" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    email_configs:
      - to: '${ALERTS_EMAIL_TO}'
        send_resolved: true
        subject: '{{ template "am.subject" . }}'
        html: '{{ template "am.html" . }}'

  # אזהרות הולכות רק לסלאק
  - name: 'slack-warnings'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        send_resolved: true
        title: '{{ template "am.title" . }}'
        text: '{{ template "am.body" . }}'
        color: '#f2c744'

  # שק ייעודי לברירת מחדל/בדיקות
  - name: 'null'

inhibit_rules:
  # אם יש CRITICAL על אותה ישות — אל תשלח WARNING מקביל
  - source_matchers: ['severity = critical', 'service = algogpt']
    target_matchers: ['severity = warning', 'service = algogpt']
    equal: ['alertname', 'instance']

# (אופציונלי) היקף קיבוץ מתוחכם נוסף:
#  - אפשר להוסיף כאן עוד inhibit_rules לפי צורך.




