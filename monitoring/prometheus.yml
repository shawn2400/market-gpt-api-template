global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # ── Blackbox: בדיקת HTTP ל-/health של AlgoGPT (צפוי 200)
  - job_name: "algogpt-health"
    metrics_path: /probe
    params:
      module: [http_2xx]     # מוגדר ב-blackbox.yml
    static_configs:
      - targets:
          - "http://algogpt:10000/health"   # <-- תוקן ל-/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115


