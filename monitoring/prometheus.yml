global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # ───────── Prometheus self-scrape ─────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # ───────── cAdvisor ─────────
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # ───────── AlgoGPT app (Docker) – /metrics ─────────
  # נגיש בתוך הרשת של docker-compose (service name: algogpt)
  - job_name: "algogpt-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["algogpt:10000"]
        labels:
          service: "algogpt"
          env: "local"

  # ───────── בדיקת Health של ה-App דרך Blackbox ─────────
  - job_name: "algogpt-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://algogpt:10000/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ───────── Render – /metrics (צריך טוקן בקובץ) ─────────
  - job_name: "algogpt-render"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["algogpt-docker.onrender.com"]
        labels:
          site: "render"
          service: "algogpt"
          env: "prod"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/render_metrics_token

  # ───────── Render health via Blackbox ─────────
  - job_name: "algogpt-render-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://algogpt-docker.onrender.com/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115







