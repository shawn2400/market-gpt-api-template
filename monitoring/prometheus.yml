global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "algogpt-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://algogpt:10000/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: "algogpt-render"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["algogpt-docker.onrender.com"]
        labels: { site: "render" }
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/render_metrics_token

  - job_name: "algogpt-render-health"
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://algogpt-docker.onrender.com/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115






