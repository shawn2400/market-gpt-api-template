global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # cadvisor - מדדים של דוקר/קונטיינרים
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # בדיקת HTTP של /health_full עם blackbox-exporter (מצופה 2xx)
  - job_name: "algogpt-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://algogpt:${PORT:-10000}/health_full"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
