groups:
  - name: algogpt-lite-rules
    interval: 30s   # כל 30 שניות ייבדק
    rules:
      # ───────────────────────────────
      # CPU שימוש גבוה
      # ───────────────────────────────
      - alert: HighCPUUsage
        expr: 100 * (1 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[2m]))) > 85
        for: 2m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "CPU שימוש גבוה"
          description: "השימוש במעבד עלה מעל 85% במשך יותר מ־2 דקות."

      # ───────────────────────────────
      # Memory שימוש גבוה
      # ───────────────────────────────
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 2m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "Memory שימוש גבוה"
          description: "שימוש בזיכרון עבר את 80% במשך יותר מ־2 דקות."

      # ───────────────────────────────
      # API שגיאות 5xx
      # ───────────────────────────────
      - alert: HighAPIErrorRate
        expr: sum(rate(algogpt_api_requests_total{status=~"5.."}[5m])) > 0.5
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "Spike בשגיאות API 5xx"
          description: "קצב השגיאות 5xx חצה את 0.5 לשנייה (ממוצע ב־5 דקות)."
