# FILE: monitoring/alerts/algogpt-rules.yml
groups:
  # ───────────────── Recording rules (נרמול מדדי 5xx) ─────────────────
  - name: algogpt-recording
    interval: 30s
    rules:
      # קצב שגיאות 5xx בדקה
      - record: algogpt:http_requests_5xx_rate1m
        expr: |
          sum(rate(starlette_requests_total{status=~"5.."}[1m]))
          OR sum(rate(http_requests_total{status=~"5.."}[1m]))
          OR sum(rate(algogpt_api_requests_total{status=~"5.."}[1m]))

      # קצב שגיאות 5xx ב-5 דקות
      - record: algogpt:http_requests_5xx_rate5m
        expr: |
          sum(rate(starlette_requests_total{status=~"5.."}[5m]))
          OR sum(rate(http_requests_total{status=~"5.."}[5m]))
          OR sum(rate(algogpt_api_requests_total{status=~"5.."}[5m]))

  # ───────────────── Alerts ─────────────────
  - name: algogpt-core
    interval: 30s
    rules:
      # ====== CPU (מדדי תהליך מהאפליקציה) ======
      # שיעור שימוש CPU נמדד כ-seconds per second (כלומר כמה ליבות)
      # worker יחיד ⇒ 0.85 ≈ 85% מליבה אחת
      - alert: HighCPUUsageApp
        expr: rate(process_cpu_seconds_total[5m]) > 0.85
        for: 2m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "CPU גבוה באפליקציה"
          description: "rate(process_cpu_seconds_total[5m]) מעל 0.85 (~85% מליבה) במשך 2 דקות"

      - alert: CriticalCPUUsageApp
        expr: rate(process_cpu_seconds_total[1m]) > 0.95
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "CPU קריטי באפליקציה"
          description: "rate(process_cpu_seconds_total[1m]) מעל 0.95 (~95% מליבה) במשך דקה"

      # ====== Memory (Resident Set) ======
      # עדיף להתאים את הספים לגבולות הקונטיינר שלך.
      - alert: HighMemoryUsageApp
        expr: process_resident_memory_bytes > 1.2e9   # ~1.2GB
        for: 3m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "Memory גבוה באפליקציה"
          description: "process_resident_memory_bytes עבר 1.2GB במשך 3 דקות"

      - alert: CriticalMemoryUsageApp
        expr: process_resident_memory_bytes > 1.4e9   # ~1.4GB
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "Memory קריטי באפליקציה"
          description: "process_resident_memory_bytes עבר 1.4GB במשך דקה"

      # ====== Health (Blackbox) ======
      - alert: ServiceDown
        expr: probe_success{job="algogpt-health"} == 0
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "שירות נפל (פנימי)"
          description: "/health של AlgoGPT לא מגיב מתוך רשת הדוקר"

      - alert: ExternalHealthDown
        expr: probe_success{job="algogpt-render-health"} == 0
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "שירות לא נגיש מבחוץ"
          description: "/health ב־Render לא מגיב מבחוץ (URL ציבורי)"

      # ====== API Errors (5xx) ======
      - alert: High5xxRate
        expr: algogpt:http_requests_5xx_rate5m > 1
        for: 2m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "שגיאות 5xx גבוהות"
          description: "יותר מ־1 בקשות שגיאה בשנייה (ממוצע 5 דקות)"

      - alert: Critical5xxRate
        expr: algogpt:http_requests_5xx_rate1m > 5
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "שגיאות 5xx קריטיות"
          description: "יותר מ־5 שגיאות בשנייה (ממוצע דקה)"

      # ====== Trades / PnL (בהנחה שהמדדים קיימים) ======
      - alert: TradePnLNegative
        expr: algogpt_pnl_total_usdt < -50
        for: 5m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "PnL שלילי"
          description: "הפסד מצטבר גדול מ־50 USDT"

      - alert: TradePnLCritical
        expr: algogpt_pnl_total_usdt < -150
        for: 2m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "PnL שלילי חמור"
          description: "הפסד מצטבר גדול מ־150 USDT"

      - alert: TradesStuck
        expr: algogpt_trades_open_total > 0 and increase(algogpt_trades_closed_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "פוזיציות תקועות"
          description: "יש פוזיציות פתוחות כבר 30 דקות בלי סגירה"






