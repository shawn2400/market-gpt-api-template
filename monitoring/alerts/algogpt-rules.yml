groups:
  - name: algogpt-core
    interval: 30s
    rules:
      # ====== CPU ======
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "CPU גבוה בשרת"
          description: "CPU חצה 85% במשך 2 דקות"

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "CPU קריטי"
          description: "CPU חצה 95% במשך דקה"

      # ====== Memory ======
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 3m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "Memory גבוה"
          description: "שימוש בזיכרון חצה 80% במשך 3 דקות"

      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "Memory קריטי"
          description: "שימוש בזיכרון חצה 90% במשך דקה"

      # ====== Health ======
      - alert: ServiceDown
        expr: probe_success{job="algogpt-health"} == 0
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "שירות נפל"
          description: "/health של AlgoGPT לא מגיב מתוך הרשת"

      - alert: ExternalHealthDown
        expr: probe_success{job="algogpt-render-health"} == 0
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "שירות לא נגיש ציבורית"
          description: "/health של AlgoGPT לא מגיב מבחוץ (Render URL)"

      # ====== API Errors ======
      - alert: High5xxRate
        expr: sum(rate(algogpt_api_requests_total{status=~"5.."}[5m])) > 1
        for: 2m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "שגיאות 5xx גבוהות"
          description: "יותר מ־1 בקשות שגיאה בשנייה (ממוצע 5 דקות)"

      - alert: Critical5xxRate
        expr: sum(rate(algogpt_api_requests_total{status=~"5.."}[1m])) > 5
        for: 1m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "שגיאות 5xx קריטיות"
          description: "יותר מ־5 שגיאות בשנייה (ממוצע דקה)"

      # ====== Trades ======
      - alert: TradePnLNegative
        expr: algogpt_pnl_total_usdt < -50
        for: 5m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "PnL שלילי"
          description: "הפסד מצטבר גדול מ־50 USDT"

      - alert: TradePnLCritical
        expr: algogpt_pnl_total_usdt < -150
        for: 2m
        labels:
          severity: critical
          service: algogpt
        annotations:
          summary: "PnL שלילי חמור"
          description: "הפסד מצטבר גדול מ־150 USDT"

      - alert: TradesStuck
        expr: algogpt_trades_open_total > 0 and increase(algogpt_trades_closed_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
          service: algogpt
        annotations:
          summary: "פוזיציות תקועות"
          description: "יש פוזיציות פתוחות כבר 30 דקות בלי סגירה"





