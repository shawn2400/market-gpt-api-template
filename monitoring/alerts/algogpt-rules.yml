groups:
  - name: algogpt.rules
    interval: 15s
    rules:
      # CPU > 85% ליותר מ־2 דקות
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[1m]) > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU גבוה"
          description: "CPU > 85% עבור AlgoGPT"

      # Memory > 80%
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / process_virtual_memory_bytes > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Memory גבוה"
          description: "Memory > 80% עבור AlgoGPT"

      # Health Down (Blackbox probe)
      - alert: AlgoGPTHelperDown
        expr: probe_success{job="algogpt-render-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AlgoGPT Health DOWN"
          description: "ה־/health הציבורי של AlgoGPT נכשל"

      # Telegram failure ratio > 5% ב־5 דקות אחרונות
      - alert: TelegramHighFailureRate
        expr: sum(rate(algogpt_telegram_messages_failed_total[5m])) 
              / clamp_min(sum(rate(algogpt_telegram_messages_sent_total[5m])) 
              + sum(rate(algogpt_telegram_messages_failed_total[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "כשלי טלגרם גבוהים"
          description: "יותר מ־5% הודעות טלגרם נכשלו ב־5 דקות האחרונות"



