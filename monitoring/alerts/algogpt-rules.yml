groups:
- name: algogpt.rules
  interval: 15s
  rules:
  - alert: AlgoGPTHealthDown
    expr: up{job="algogpt-render-health"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "AlgoGPT Health Down"
      description: "לא עונה ב-URL הציבורי"

  - alert: HighCPU
    expr: rate(process_cpu_seconds_total[1m]) > 0.85
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "CPU > 85%"

  - alert: HighMemory
    expr: process_resident_memory_bytes / process_virtual_memory_bytes > 0.8
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Memory > 80%"

  - alert: API5xxHigh
    expr: rate(algogpt_api_requests_total{status=~"5.."}[5m]) > 0.5
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "שגיאות 5xx API"
      description: "יותר מ-0.5 לשנייה"

  - alert: PnLNegative
    expr: algogpt_pnl_total_usdt < -50
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "PnL מצטבר שלילי"
      description: "PnL ירד מתחת ל-50- USDT"





