name: CI

on:
  push:
    branches: [ "main", "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Smoke import
        run: |
          python - << 'PY'
          import sys
          try:
              import fastapi
              import pydantic
              import httpx
              print("Smoke OK")
          except Exception as e:
              print("Smoke FAIL:", repr(e))
              sys.exit(1)
          PY
