name: Deploy to Render on Push

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'
      - '!*.md'
      - '!.github/**'

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "🚀 Triggering Render deployment..."
          
          # Trigger deployment via Render API
          RESPONSE=$(curl -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            -w "\n%{http_code}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Deployment triggered successfully!"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          else
            echo "❌ Deployment failed with HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

      - name: Deployment Status
        run: |
          echo "📊 Deployment initiated from commit: ${{ github.sha }}"
          echo "🔗 Check status: https://dashboard.render.com"
          echo "⏱️  Deployment typically takes 3-5 minutes"
