name: Auto apply fixes from Issue (no shell)
on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  apply:
    if: contains(github.event.issue.labels.*.name, 'autofix')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install js-yaml

      - name: Apply edits via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const issue = context.payload.issue;

            // 1) pull fenced ```autofix block
            const body = issue.body || "";
            const m = body.match(/```autofix\s+([\s\S]*?)```/i);
            if (!m) { core.setFailed("No ```autofix ...``` block in issue body."); return; }

            // 2) parse YAML
            const yaml = require('js-yaml');
            let spec;
            try { spec = yaml.load(m[1]); }
            catch (e) { core.setFailed("Invalid YAML: " + e.message); return; }
            if (!spec || !Array.isArray(spec.edits) || spec.edits.length === 0) {
              core.setFailed("Missing 'edits:' array in autofix block."); return;
            }

            // 3) create head branch
            const baseBranch = spec.base || 'main';
            const { data: baseRef } = await github.rest.git.getRef({ owner, repo, ref: `heads/${baseBranch}` });
            const headBranch = `ops/autofix-${issue.number}-${Date.now()}`;
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${headBranch}`, sha: baseRef.object.sha });

            // helpers
            async function readFile(path) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: headBranch });
                if (!('content' in data)) throw new Error(`No content in ${path}`);
                return { sha: data.sha, text: Buffer.from(data.content, 'base64').toString('utf8') };
              } catch (e) {
                return { sha: undefined, text: '', missing: true };
              }
            }
            async function writeFile(path, oldSha, newText, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch: headBranch, message,
                content: Buffer.from(newText, 'utf8').toString('base64'),
                sha: oldSha,
              });
            }

            // 4) apply edits
            for (const e of spec.edits) {
              const { sha, text, missing } = await readFile(e.path);
              if (missing && !e.create && e.mode !== 'literal' && e.mode !== 'append') {
                core.setFailed(`File not found and 'create' not set: ${e.path}`);
                return;
              }
              let s = text;

              if (e.mode === 'regex') {
                const flags = e.flags || 'ms';
                const re = new RegExp(e.find, flags);
                if (!re.test(s) && e.required !== false) {
                  core.warning(`Pattern not found in ${e.path}: ${e.find}`);
                }
                s = s.replace(re, e.replace);
              } else if (e.mode === 'literal') {
                s = e.content || '';
              } else if (e.mode === 'append') {
                s = (s || '') + (e.content || '');
              } else {
                core.setFailed(`Unknown mode for ${e.path}: ${e.mode}`); return;
              }

              await writeFile(e.path, sha, s, e.message || `autofix: ${e.path}`);
            }

            // 5) open PR
            const prTitle = (spec.title || `AutoFix from issue #${issue.number}`).slice(0, 100);
            const prBody  = spec.body  || `Automations edits from issue #${issue.number}.`;
            await github.rest.pulls.create({
              owner, repo, title: prTitle, head: headBranch, base: baseBranch, body: prBody
            });


