version: "3.9"

services:
  algogpt:
    build: .
    container_name: algogpt
    restart: always
    ports:
      - "10000:10000"
    env_file:
      - .env
    depends_on:
      - redis
    command: >
      gunicorn -k uvicorn.workers.UvicornWorker
      -w 2
      -b 0.0.0.0:10000
      main:app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:10000/health',timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:









