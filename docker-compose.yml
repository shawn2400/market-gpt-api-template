version: "3.9"

services:
  algogpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algogpt
    env_file:
      - .env
    ports:
      - "${PORT:-10000}:10000"
    restart: unless-stopped
    init: true
    volumes:
      - ./logs:/app/logs
      - ./static/reports:/app/static/reports
      - ./static/img:/app/static/img
      - ./static/cache:/app/static/cache
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0

  redis:
    image: redis:7.2-alpine
    container_name: algogpt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]




