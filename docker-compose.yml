version: "3.9"

services:
  algogpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algogpt
    env_file:
      - .env
    ports:
      - "${PORT:-10000}:10000"
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./static/reports:/app/static/reports
      - ./static/img:/app/static/img
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G

