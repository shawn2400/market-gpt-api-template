version: "3.9"

services:
  algogpt:
    build: .
    container_name: algogpt
    restart: always
    ports:
      - "${PORT:-10000}:${PORT:-10000}"   # אפשר להסיר בפרוד ולהיחשף רק דרך Nginx:80
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command: >
      bash -lc "bash /app/prestart.sh 2>/dev/null || true &&
      gunicorn -k uvicorn.workers.UvicornWorker
      -w ${WEB_CONCURRENCY:-2}
      -b 0.0.0.0:${PORT:-10000}
      main:app
      --timeout ${GUNICORN_TIMEOUT:-120}"
    healthcheck:
      test: ["CMD-SHELL", "[ -x /app/health_full.sh ] && /app/health_full.sh || curl -fsS http://127.0.0.1:${PORT:-10000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - algodata:/app/data

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    depends_on:
      - algogpt
    ports:
      - "80:80"
      # - "443:443"  # TLS כשתרצה דומיין + תעודות
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro  # אם תנהל TLS על ה-Host
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 0 * * * *"   # כל שעה
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - ./monitoring/secrets/render_metrics_token:/etc/prometheus/secrets/render_metrics_token:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.external-url=http://prometheus:9090
      - --alertmanager.url=http://alertmanager:9093

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

  sqlite_backup:
    image: alpine:3.19
    container_name: sqlite_backup
    restart: unless-stopped
    depends_on:
      - algogpt
    volumes:
      - algodata:/app/data:ro
      - backup_data:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    command: >
      /bin/sh -c 'echo "15 3 * * * /usr/local/bin/backup.sh >/dev/null 2>&1" | crontab - && crond -f -L /dev/stdout'

volumes:
  redis_data:
  prom_data:
  grafana_data:
  algodata:
  backup_data:










