version: "3.9"

services:
  algogpt:
    build: .
    container_name: algogpt
    restart: always
    ports:
      - "10000:10000"
    env_file:
      - .env
    depends_on:
      - redis
    # אופציונלי: מגביל זיכרון/CPU
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:








