version: "3.9"

services:
  algogpt:
    build: .
    container_name: algogpt
    restart: always
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    labels:
      # לאפשר עדכון ע"י watchtower
      com.centurylinklabs.watchtower.enable: "true"
    command: >
      bash -lc "/app/prestart.sh &&
      gunicorn -k uvicorn.workers.UvicornWorker
      -w ${WEB_CONCURRENCY:-2}
      -b 0.0.0.0:${PORT:-10000}
      main:app
      --timeout ${GUNICORN_TIMEOUT:-120}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-10000}/health_full || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # עדכוני אימג'ים אוטומטיים (אופציונלי)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"           # מחיקת אימג'ים ישנים
      WATCHTOWER_LABEL_ENABLE: "true"      # עדכן רק קונטיינרים עם label מתאים
      WATCHTOWER_SCHEDULE: "0 0 * * * *"   # כל שעה (cron: second minute hour day month weekday)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # מדדים על הקונטיינרים עצמם
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # חוקר HTTP עבור /health_full (2xx) לניטור ע״י Prometheus
  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro

volumes:
  redis_data:
  prom_data:
  grafana_data:









