version: "3.9"

services:
  algogpt:
    build: .
    container_name: algogpt
    restart: always
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    # אם יש לך .env לפרטים כלליים (לא SCAN_*), אפשר להשאיר:
    env_file:
      - .env
    environment:
      # ==== סכמות/קאפ/קצב (מקור יחיד – אל תשכפל ל-.env) ====
      SCAN_MAX_SYMBOLS: "${SCAN_MAX_SYMBOLS:-120}"
      SCAN_MAX_LIMIT:    "${SCAN_MAX_LIMIT:-0}"
      SCAN_RL_LIMIT:     "${SCAN_RL_LIMIT:-120}"
      SCAN_RL_WINDOW:    "${SCAN_RL_WINDOW:-60}"
      SCAN_CONCURRENCY:  "${SCAN_CONCURRENCY:-4}"
      TOP_SYMBOLS:       "${TOP_SYMBOLS:-100}"
      SCAN_INTERVAL:     "${SCAN_INTERVAL:-60}"

      # ==== לוגיקה / אישורים ====
      APPROVAL_REQUIRE_WATCHLIST: "${APPROVAL_REQUIRE_WATCHLIST:-0}"
      APPROVAL_ENABLED: "${APPROVAL_ENABLED:-1}"
      EXECUTE_TRADES: "${EXECUTE_TRADES:-1}"
      REQUIRE_TELEGRAM_APPROVAL: "${REQUIRE_TELEGRAM_APPROVAL:-1}"

      # ==== Admin / Telegram ====
      ADMIN_CHAT_ID: "${ADMIN_CHAT_ID:-449087907}"
      TELEGRAM_ADMIN_IDS: "${TELEGRAM_ADMIN_IDS:-449087907}"
      TELEGRAM_ADMIN_ONLY: "${TELEGRAM_ADMIN_ONLY:-1}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-449087907}"
      TELEGRAM_AUTO_WEBHOOK: "${TELEGRAM_AUTO_WEBHOOK:-1}"
      TELEGRAM_PARSE_MODE: "${TELEGRAM_PARSE_MODE:-HTML}"

      # ==== Core ====
      PUBLIC_HOST: "${PUBLIC_HOST:-http://localhost:${PORT:-10000}}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      PORT: "${PORT:-10000}"

      # ==== Public routes ====
      SECURITY_PUBLIC_PATHS: "/ops/approve-link,/ops/approve,/ops/reject,/ops/approve/signed,/telegram/ping,/trade/approve,/trade/reject,/ops/manager/health,/ops/ui,/ops/ui/ticket,/ui/dashboard,/health"
      SECURITY_PUBLIC_PREFIXES: "/public,/price,/static,/risk"

      # ==== Secrets (מה-.env או מה-Environment של השרת) ====
      ALERTS_INGEST_HMAC_SECRET: "${ALERTS_INGEST_HMAC_SECRET:-}"
      ALERTS_INGEST_HMAC_KEY_IS_HEX: "${ALERTS_INGEST_HMAC_KEY_IS_HEX:-1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"

    depends_on:
      redis:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command: >
      bash -lc "bash /app/prestart.sh 2>/dev/null || true &&
      exec gunicorn main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers ${WEB_CONCURRENCY:-1}
        --bind 0.0.0.0:${PORT:-10000}
        --timeout ${GUNICORN_TIMEOUT:-120}
        --graceful-timeout 30
        --keep-alive 5"
    healthcheck:
      test: ["CMD-SHELL", "[ -x /app/health_full.sh ] && /app/health_full.sh || curl -fsS http://127.0.0.1:${PORT:-10000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - algodata:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M

  manager:
    build: .
    container_name: algogpt_manager
    restart: always
    env_file:
      - .env
    environment:
      # אם רוצים לוודא שהמנהל רואה את אותם caps:
      SCAN_MAX_SYMBOLS: "${SCAN_MAX_SYMBOLS:-120}"
      SCAN_RL_LIMIT: "${SCAN_RL_LIMIT:-120}"
      SCAN_RL_WINDOW: "${SCAN_RL_WINDOW:-60}"
      SCAN_CONCURRENCY: "${SCAN_CONCURRENCY:-4}"
      TOP_SYMBOLS: "${TOP_SYMBOLS:-100}"
      SCAN_INTERVAL: "${SCAN_INTERVAL:-60}"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:-}"
    depends_on:
      redis:
        condition: service_healthy
      algogpt:
        condition: service_healthy
    command: >
      bash -lc "python -m routes.manager"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://algogpt:${PORT:-10000}/status/all >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - algodata:/app/data

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    depends_on:
      algogpt:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 0 * * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - ./monitoring/secrets/render_metrics_token:/etc/prometheus/secrets/render_metrics_token:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.external-url=http://prometheus:9090
      - --alertmanager.url=http://alertmanager:9093

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

  sqlite_backup:
    image: alpine:3.19
    container_name: sqlite_backup
    restart: unless-stopped
    depends_on:
      algogpt:
        condition: service_healthy
    volumes:
      - algodata:/app/data:ro
      - backup_data:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    command: >
      /bin/sh -c 'echo "15 3 * * * /usr/local/bin/backup.sh >/dev/null 2>&1" | crontab - && crond -f -L /dev/stdout'

  logrotate:
    image: blacklabelops/logrotate
    container_name: logrotate
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./monitoring/logrotate.d:/etc/logrotate.d
    environment:
      LOGS_DIRECTORIES: /var/lib/docker/containers
      LOGROTATE_CRONSCHEDULE: "0 */6 * * *"
      LOGROTATE_COPIES: "5"
      LOGROTATE_SIZE: 100M

volumes:
  redis_data:
  prom_data:
  grafana_data:
  algodata:
  backup_data:











