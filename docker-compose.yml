version: "3.9"

services:
  algogpt:
    build: .
    container_name: algogpt
    restart: always
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command: >
      bash -lc "bash /app/prestart.sh 2>/dev/null || true &&
      exec gunicorn main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers ${WEB_CONCURRENCY:-1}
        --bind 0.0.0.0:${PORT:-10000}
        --timeout ${GUNICORN_TIMEOUT:-180}
        --graceful-timeout ${GUNICORN_GRACEFUL_TIMEOUT:-45}
        --keep-alive ${GUNICORN_KEEPALIVE:-30}"
    healthcheck:
      test: ["CMD-SHELL", "[ -x /app/health_full.sh ] && /app/health_full.sh || curl -fsS http://127.0.0.1:${PORT:-10000}/readyz/strict || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - algodata:/app/data
      - ./static:/app/static:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M

  manager:
    build: .
    container_name: algogpt_manager
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      algogpt:
        condition: service_healthy
    command: >
      bash -lc "python -m routes.manager"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://algogpt:${PORT:-10000}/status/all >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - algodata:/app/data

  # Sidecar: מועמדים חיים + הודעות לטלגרם (NOW/TOPK)
  live-candidates:
    image: alpine:3.20
    container_name: algogpt_live_candidates
    restart: always
    env_file:
      - .env
    depends_on:
      algogpt:
        condition: service_healthy
    entrypoint: ["/bin/sh","-lc"]
    command: |
      set -e
      apk add --no-cache curl jq
      echo "Live candidates sidecar started"
      while :; do
        # NOW
        NOW=$(curl -sS "${PUBLIC_HOST}/scan/public-now?exchange=binance_futures&k=10" | \
              jq -r '"📈 Candidates NOW:\n" + ( .items[0:10] | map("• " + .symbol + " " + (.side // "N/A") + " s=" + ((.score|tostring) // "?") ) | join("\n"))' || true)
        if [ -n "$NOW" ]; then
          curl -sS -H "Authorization: Bearer ${API_BEARER_TOKEN}" \
            --get --data-urlencode "mode=send" --data-urlencode "text=${NOW}" \
            "${PUBLIC_HOST}/meta/telegram" >/dev/null 2>&1 || true
        fi

        # TOPK (כל 5 דק')
        if [ $((`date +%s` % 300)) -lt 10 ]; then
          TOPK=$(curl -sS "${PUBLIC_HOST}/scan/public-topk?exchange=binance_futures&k=${PUBLIC_TOPK_DIGEST_K:-5}&min_score=${PUBLIC_TOPK_DIGEST_MIN_SCORE:-7}" | \
                 jq -r '"⭐ TOPK:\n" + ( .items | map("• " + .symbol + " " + (.side // "N/A") + " s=" + ((.score|tostring) // "?") ) | join("\n"))' || true)
          if [ -n "$TOPK" ]; then
            curl -sS -H "Authorization: Bearer ${API_BEARER_TOKEN}" \
              --get --data-urlencode "mode=send" --data-urlencode "text=${TOPK}" \
              "${PUBLIC_HOST}/meta/telegram" >/dev/null 2>&1 || true
          fi
        fi
        sleep 180
      done

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    depends_on:
      algogpt:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"        # תקין
      WATCHTOWER_LABEL_ENABLE: "true"   # תקין
      WATCHTOWER_SCHEDULE: "0 0 * * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - ./monitoring/secrets/render_metrics_token:/etc/prometheus/secrets/render_metrics_token:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.external-url=http://prometheus:9090
      - --alertmanager.url=http://alertmanager:9093

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}       # תקין
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin} # תקין
      GF_USERS_DEFAULT_THEME: light                              # תקין
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

  sqlite_backup:
    image: alpine:3.20
    container_name: sqlite_backup
    restart: unless-stopped
    depends_on:
      algogpt:
        condition: service_healthy
    volumes:
      - algodata:/app/data:ro
      - backup_data:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    command: >
      /bin/sh -lc 'chmod +x /usr/local/bin/backup.sh;
      echo "15 3 * * * /usr/local/bin/backup.sh >/dev/null 2>&1" | crontab - &&
      crond -f -L /dev/stdout'

  logrotate:
    image: blacklabelops/logrotate
    container_name: logrotate
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./monitoring/logrotate.d:/etc/logrotate.d
    environment:
      LOGS_DIRECTORIES: /var/lib/docker/containers   # תקין
      LOGROTATE_CRONSCHEDULE: "0 */6 * * *"          # תקין
      LOGROTATE_COPIES: "5"                          # תקין
      LOGROTATE_SIZE: "100M"                         # תקין

volumes:
  redis_data:
  prom_data:
  grafana_data:
  algodata:
  backup_data:








