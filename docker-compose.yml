version: "3.9"

services:
  algogpt:
    build: .
    container_name: algogpt
    restart: always
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: >
      bash -lc "/app/prestart.sh &&
      gunicorn -k uvicorn.workers.UvicornWorker
      -w ${WEB_CONCURRENCY:-2}
      -b 0.0.0.0:${PORT:-10000}
      main:app
      --timeout ${GUNICORN_TIMEOUT:-120}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-10000}/health_full || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis_data:









