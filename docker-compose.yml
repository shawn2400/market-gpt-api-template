version: "3.9"

services:
  algogpt:
    build: .
    container_name: algogpt
    restart: unless-stopped
    env_file:
      - .env   # כאן נשים את ה-API Keys והקונפיג
    ports:
      - "10000:10000"
    environment:
      # ברירת מחדל אם לא מוגדר ב-.env
      PORT: 10000
      WORKERS: 2
      LOG_LEVEL: INFO
    volumes:
      - ./static:/app/static        # שמירת דוחות / תמונות
      - ./logs:/app/logs            # לוגים מקומיים (אופציונלי)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/"]
      interval: 30s
      timeout: 10s
      retries: 5
